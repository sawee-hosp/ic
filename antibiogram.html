<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawee Hospital Smart Antibiogram</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦠</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        
        select, input[type="text"] { background-color: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); color: #e2e8f0; border-radius: 0.5rem; padding: 0.5rem; width: 100%; outline: none; transition: all 0.3s; }
        select option { background-color: #1e293b; color: #e2e8f0; padding: 10px; }
        
        .specimen-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem; border-radius: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(30, 41, 59, 0.4); color: #94a3b8; cursor: pointer; transition: all 0.2s; font-size: 0.75rem; white-space: nowrap; width: auto; flex: none; }
        .specimen-btn.active { background: linear-gradient(90deg, rgba(6, 182, 212, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%); border-color: #22d3ee; color: #22d3ee; box-shadow: 0 0 8px rgba(34, 211, 238, 0.1); }
        
        /* Accordion */
        .group-header { font-size: 0.8rem; font-weight: 500; color: #94a3b8; cursor: pointer; padding: 6px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.4); margin-bottom: 2px; }
        .group-header:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
        .group-header.active { color: #22d3ee; border-left: 2px solid #22d3ee; }
        .group-body { display: none; padding: 4px 8px; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        
        .custom-checkbox { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #cbd5e1; cursor: pointer; padding: 2px 0; }
        .custom-checkbox input { accent-color: #22d3ee; width: 12px; height: 12px; }

        .table-normal th { padding: 12px; font-size: 0.9rem; background: rgba(30, 41, 59, 0.95); position: sticky; top: 0; z-index: 10; }
        .table-normal td { padding: 12px 8px; font-size: 0.9rem; cursor: pointer; transition: background 0.1s; vertical-align: middle; }
        .table-normal td:hover { background: rgba(255,255,255,0.1); }
        .cell-disabled { cursor: not-allowed !important; opacity: 0.4; background: rgba(0,0,0,0.3) !important; color: transparent !important; pointer-events: none; }
        
        /* N Badge */
        .n-badge { font-size: 0.85rem; font-weight: 600; color: #f8fafc; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
        .alert-icon { color: #fbbf24; width: 14px; height: 14px; vertical-align: middle; display: inline-block; margin-left: 2px; }

        .bg-sens-high { background-color: rgba(16, 185, 129, 0.2); color: #34d399; font-weight: bold; }
        .bg-sens-med { background-color: rgba(234, 179, 8, 0.2); color: #facc15; }
        .bg-sens-low { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .bg-na { color: #64748b; }

        .fab-btn { position: fixed; bottom: 2rem; right: 2rem; width: 70px; height: 70px; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; z-index: 50; border: 2px solid #34d399; overflow: hidden; background: #0f172a; }
        .fab-btn img { width: 100%; height: 100%; object-fit: contain; }
        .fab-btn:hover { transform: scale(1.1) rotate(5deg); }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1e293b; width: 90%; max-width: 650px; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        
        .chat-bubble { max-width: 90%; padding: 12px 16px; border-radius: 16px; margin-bottom: 12px; line-height: 1.6; font-size: 0.95rem; }
        .chat-user { background: rgba(34, 211, 238, 0.15); border: 1px solid rgba(34, 211, 238, 0.3); color: #e0f2fe; margin-left: auto; border-top-right-radius: 2px; }
        .chat-ai { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #d1fae5; margin-right: auto; border-top-left-radius: 2px; }
        
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: #22d3ee; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col">
    <div class="aurora-bg"></div>

    <header class="max-w-7xl mx-auto w-full mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="p-3 bg-cyan-500/10 rounded-xl border border-cyan-500/20 relative">
                <i data-lucide="activity" class="w-8 h-8 text-cyan-400"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">SAWEE SMART IC</h1>
                <p class="text-slate-400 text-sm">Antibiogram & AI Surveillance System</p>
            </div>
        </div>
        
        <div class="flex gap-3">
            <div id="db-status" class="text-xs text-slate-500 bg-slate-900/50 px-3 py-1 rounded-full border border-slate-700 h-fit">Loading...</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
        <!-- Sidebar -->
        <aside class="lg:col-span-3 space-y-4">
            <div class="glass p-5 h-full flex flex-col">
                <div class="space-y-6 flex-grow custom-scrollbar overflow-y-auto" style="max-height: 75vh;">
                    <!-- Site -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-xs text-slate-400 font-medium">Site of Infection</label>
                            <button onclick="toggleAllSpecimens()" class="text-[10px] text-cyan-400 hover:text-cyan-300 underline">Select All</button>
                        </div>
                        <div id="specimen-container" class="flex flex-wrap gap-2 p-1 max-h-[120px] overflow-y-auto custom-scrollbar content-start">
                            <div class="text-xs text-slate-500 italic p-2">Loading...</div>
                        </div>
                    </div>

                    <!-- Time -->
                    <div>
                        <label class="text-xs text-slate-400 mb-2 block font-medium">Time Period</label>
                        <div id="quarter-radios" class="flex flex-col gap-2"></div>
                    </div>

                    <!-- Organism (Checkbox Accordion) -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-xs text-slate-400 font-medium">Organism</label>
                        </div>
                        <div id="organism-filter-container" class="space-y-1"></div>
                        
                        <div class="bg-slate-800/50 rounded-lg p-2 flex gap-2 mt-2">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="orgMode" value="total" checked class="peer hidden">
                                <div class="text-[10px] text-center py-1.5 rounded bg-transparent text-slate-400 peer-checked:bg-cyan-500/20 peer-checked:text-cyan-300 border border-transparent peer-checked:border-cyan-500/50">รวมเชื้อดื้อยา</div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="orgMode" value="resistant" class="peer hidden">
                                <div class="text-[10px] text-center py-1.5 rounded bg-transparent text-slate-400 peer-checked:bg-red-500/20 peer-checked:text-red-300 border border-transparent peer-checked:border-red-500/50">เฉพาะเชื้อดื้อยา</div>
                            </label>
                        </div>
                    </div>

                    <!-- Drug Groups -->
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-xs text-slate-400 font-medium">Antibiotic Groups</label>
                            <button onclick="toggleAllDrugs()" class="text-[10px] text-cyan-400 hover:text-cyan-300 underline">Select/Deselect All</button>
                        </div>
                        <div id="drug-groups-container" class="space-y-1"></div>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-white/5">
                    <button onclick="fetchTableData()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="search" class="w-5 h-5"></i> Update Table
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Table Area -->
        <div class="lg:col-span-9">
            <div class="glass p-1 h-full min-h-[500px] flex flex-col relative">
                <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-900/50 rounded-t-xl">
                    <h3 class="font-semibold text-cyan-100">Antibiogram Result</h3>
                    <span id="result-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded">0 Isolates</span>
                </div>
                
                <div class="overflow-auto flex-grow custom-scrollbar bg-slate-900/30 relative">
                    <table id="resultTable" class="w-full text-center border-collapse table-normal">
                        <thead><tr id="table-header"></tr></thead>
                        <tbody id="table-body">
                            <tr id="table-placeholder">
                                <td colspan="10" class="py-20 text-center text-slate-500">
                                    <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                                    กรุณาเลือกเงื่อนไขและกดค้นหา
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="search-loading" class="hidden absolute inset-0 bg-slate-900/80 z-20 flex flex-col items-center justify-center text-slate-400 top-[56px]">
                        <div class="loader mb-3"></div> Processing Data...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FAB -->
    <div class="fab-btn" onclick="openChatModal()" title="ถาม IC SW-1">
        <img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" alt="IC SW-1">
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="p-4 bg-slate-800 border-b border-white/10 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-700 overflow-hidden border border-emerald-500/50">
                        <img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-full h-full object-contain">
                    </div>
                    <div>
                        <h3 class="font-bold text-emerald-400">ถาม IC SW-1</h3>
                        <p class="text-[10px] text-slate-400">เภสัชกรสับปะรด</p>
                    </div>
                </div>
                <button onclick="closeChatModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="p-3 bg-slate-900/50 border-b border-white/5 flex gap-2 overflow-x-auto text-xs items-center">
                <span class="text-slate-500">บริบท:</span>
                <select id="chat-origin" class="bg-slate-800 border-slate-700 rounded px-2 py-1 w-auto">
                    <option value="CAI">Community (CAI)</option>
                    <option value="HAI">Hospital (HAI)</option>
                </select>
                <label class="flex items-center gap-2 bg-red-500/10 px-2 py-1 rounded border border-red-500/20 cursor-pointer">
                    <input type="checkbox" id="chat-sepsis" class="accent-red-500">
                    <span class="text-red-300">Sepsis/Shock</span>
                </label>
            </div>

            <div id="chat-container" class="flex-grow p-4 overflow-y-auto bg-slate-900/80 custom-scrollbar">
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-700 overflow-hidden flex-shrink-0">
                        <img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-full h-full object-contain">
                    </div>
                    <div class="chat-bubble chat-ai">
                        สวัสดีครับ สวีวันพร้อมให้บริการ... <br>
                        ข้อมูลล่าสุดจากหน้าจอ: <span id="ai-context-label" class="text-emerald-400 font-bold">...</span><br>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-slate-800 border-t border-white/10 relative">
                <input type="text" id="chat-input" value="สรุปตาราง antibiogram นี้ให้หน่อย" class="w-full bg-slate-900 border-slate-700 rounded-full pl-4 pr-12 py-3 text-sm focus:ring-emerald-500">
                <button onclick="sendMessage()" class="absolute right-4 top-4 p-1.5 text-emerald-400 hover:text-emerald-300"><i data-lucide="send" class="w-5 h-5"></i></button>
            </div>
        </div>
    </div>

    <!-- Trend Modal -->
    <div id="trend-modal" class="modal-overlay">
        <div class="modal-content bg-slate-900" style="max-width: 700px;">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-cyan-300" id="trend-title">Trend</h3>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="trend-badge" class="text-xs font-bold px-2 py-0.5 rounded bg-slate-700"></span>
                    </div>
                </div>
                <button onclick="document.getElementById('trend-modal').style.display='none'" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 h-[300px]"><canvas id="trendChart"></canvas></div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwZQ5bn3aLOL91zI79UzCoNfpfqlY3L6WryFeXMa5wDENl6rbbBUJVU2fW1cuKR1W1K/exec';
        let cachedData = null;
        let selectedSpecimens = new Set();
        let trendChartInstance = null;

        const DRUG_GROUPS = {
            "Penicillins": ["Ampicillin", "Penicillin", "Oxacillin", "Amoxicillin/Cla", "Ampicillin/Sulb", "Piperacillin", "Piperacillin/Ta"],
            "Cephalosporins": ["Cefazolin", "Cefotaxime", "Ceftazidime", "Ceftriaxone", "Cefepime"],
            "Carbapenems": ["Ertapenem", "Imipenem", "Meropenem"],
            "Aminoglycosides": ["Amikacin", "Gentamicin"],
            "Fluoroquinolones": ["Ciprofloxacin", "Levofloxacin"],
            "Others": ["Clindamycin", "Chloramphenicol", "Trimetho/Sulfa.", "Erythromycin", "Vancomycin", "Tetracycline", "Fosfomycin", "Nitrofurantoin", "Linezolid", "Colistin"]
        };

        window.onload = async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            initDrugSelector();
            await loadOptions();
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        };

        function initDrugSelector() {
            const container = document.getElementById('drug-groups-container');
            container.innerHTML = '';
            for (const [group, drugs] of Object.entries(DRUG_GROUPS)) {
                const html = `
                    <div>
                        <div class="group-header" onclick="toggleGroup(this)">
                            <span class="text-xs font-semibold text-slate-400">${group}</span>
                            <div class="flex gap-2">
                                <span class="group-check-btn" onclick="event.stopPropagation(); toggleGroupCheck(this, true)">All</span>
                                <i data-lucide="chevron-down" class="w-3 h-3 transition-transform"></i>
                            </div>
                        </div>
                        <div class="group-body hidden pl-2 pt-1 grid grid-cols-2 gap-1">
                            ${drugs.map(d => `
                                <label class="custom-checkbox">
                                    <input type="checkbox" value="${d}" class="drug-check accent-cyan-500" checked onchange="updateTableVisibility()">
                                    <span>${d}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>`;
                container.innerHTML += html;
            }
            lucide.createIcons();
        }

        function toggleGroup(header) {
            const body = header.nextElementSibling;
            const icon = header.querySelector('i');
            const isHidden = body.classList.contains('hidden');
            if (isHidden) {
                body.classList.remove('hidden');
                body.style.display = 'grid'; 
                icon.style.transform = 'rotate(180deg)';
                header.classList.add('text-cyan-400');
            } else {
                body.classList.add('hidden');
                body.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
                header.classList.remove('text-cyan-400');
            }
        }
        
        function toggleGroupCheck(btn, checked) {
            const body = btn.closest('.group-header').nextElementSibling;
            const checkboxes = body.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = checked);
            updateTableVisibility();
        }
        
        function toggleAllDrugs() {
             const allChecks = document.querySelectorAll('.drug-check');
             const allChecked = Array.from(allChecks).every(c => c.checked);
             allChecks.forEach(c => c.checked = !allChecked);
             updateTableVisibility();
        }

        async function loadOptions() {
            try {
                document.getElementById('db-status').innerText = 'Syncing...';
                const res = await fetch(`${GAS_URL}?action=options`);
                const json = await res.json();
                if (json.status === 'success') {
                    cachedData = json.data;
                    initSpecimenGrid(json.data.specimens);
                    initOrganismFilter(json.data.organisms);
                    initQuarterRadio(json.data.quarters);
                    document.getElementById('db-status').innerText = 'Database Ready';
                    document.getElementById('db-status').className = 'text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30 h-fit';
                }
            } catch (e) {
                document.getElementById('db-status').innerText = 'Offline Mode';
            }
        }

        function initSpecimenGrid(specimens) {
            const container = document.getElementById('specimen-container');
            container.innerHTML = '';
            specimens.forEach(spec => {
                selectedSpecimens.add(spec);
                const btn = document.createElement('button');
                btn.className = 'specimen-btn active';
                btn.dataset.value = spec;
                btn.onclick = () => toggleSpecimen(btn, spec);
                let iconName = 'activity';
                if(spec.includes('Urine')) iconName='droplets';
                if(spec.includes('Blood') || spec.includes('Hemo')) iconName='syringe';
                btn.innerHTML = `<i data-lucide="${iconName}" class="w-3 h-3"></i>${spec}`;
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function toggleSpecimen(btn, val) {
            if (selectedSpecimens.has(val)) { selectedSpecimens.delete(val); btn.classList.remove('active'); }
            else { selectedSpecimens.add(val); btn.classList.add('active'); }
        }

        function toggleAllSpecimens() {
            const btns = document.querySelectorAll('.specimen-btn');
            const allSelected = btns.length === selectedSpecimens.size;
            btns.forEach(b => {
                if (allSelected) { b.classList.remove('active'); selectedSpecimens.clear(); }
                else { b.classList.add('active'); selectedSpecimens.add(b.dataset.value); }
            });
        }

        // --- ORGANISM FILTER (Checkbox Accordion) ---
        function initOrganismFilter(orgData) {
            const container = document.getElementById('organism-filter-container');
            container.innerHTML = '';

            // Group by Gram Positive / Negative / Others first
            // Note: Data is structured Gram -> Group -> List
            for (const [gram, groups] of Object.entries(orgData)) {
                // Gram Section
                const gramHtml = document.createElement('div');
                gramHtml.className = 'mb-2';
                gramHtml.innerHTML = `<div class="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-1 pl-1">${gram}</div>`;
                
                for (const [groupName, organisms] of Object.entries(groups)) {
                    const groupId = `grp-${groupName.replace(/\s+/g, '-')}`;
                    const html = `
                    <div class="mb-1">
                        <div class="group-header" onclick="toggleGroup(this)">
                            <span class="text-xs font-semibold">${groupName}</span>
                            <div class="flex gap-2">
                                <span class="group-check-btn" onclick="event.stopPropagation(); toggleGroupCheck(this, true)">All</span>
                                <i data-lucide="chevron-down" class="w-3 h-3 transition-transform"></i>
                            </div>
                        </div>
                        <div class="group-body">
                            ${organisms.map(org => `
                                <label class="custom-checkbox w-full">
                                    <input type="radio" name="selected_org" value="${org}" class="org-check accent-cyan-500" onchange="updateTableVisibility()">
                                    <span>${org}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>`;
                    gramHtml.insertAdjacentHTML('beforeend', html);
                }
                container.appendChild(gramHtml);
            }
            
            container.innerHTML = `<div class="p-1 mb-1"><button onclick="resetOrgSelection()" class="text-[10px] text-cyan-400 hover:underline w-full text-left">Select All Organisms (Clear Selection)</button></div>` + container.innerHTML;
            lucide.createIcons();
        }
        
        function resetOrgSelection() {
            const radios = document.querySelectorAll('input[name="selected_org"]');
            radios.forEach(r => r.checked = false);
            updateTableVisibility();
        }

        function initQuarterRadio(list) {
            const container = document.getElementById('quarter-radios');
            container.innerHTML = list.map((opt, idx) => `
                <label class="flex items-center gap-2 p-2 rounded hover:bg-slate-800 cursor-pointer">
                    <input type="radio" name="quarter" value="${opt.value}" ${idx === 0 ? 'checked' : ''} class="accent-cyan-500 w-4 h-4">
                    <span class="text-xs text-slate-300">${opt.label}</span>
                </label>
            `).join('');
        }

        async function fetchTableData() {
            const tbody = document.getElementById('table-body');
            const loader = document.getElementById('search-loading');
            
            loader.classList.remove('hidden');
            if(document.getElementById('table-placeholder')) document.getElementById('table-placeholder').classList.add('hidden');

            const selectedOrgRadio = document.querySelector('input[name="selected_org"]:checked');
            const orgBase = selectedOrgRadio ? selectedOrgRadio.value : "";
            
            const orgMode = document.querySelector('input[name="orgMode"]:checked').value;
            const selectedQuarter = document.querySelector('input[name="quarter"]:checked').value;
            
            const specText = selectedSpecimens.size === cachedData.specimens.length ? "All" : Array.from(selectedSpecimens).join(', ');
            document.getElementById('ai-context-label').innerText = `Specimen: ${specText} | Org: ${orgBase||"All"}`;

            let namesToSend = [];
            if (orgBase) {
                namesToSend = [orgBase.trim()];
            }

            const allSpecimensSelected = selectedSpecimens.size === cachedData.specimens.length;
            const specimensParam = allSpecimensSelected ? "" : Array.from(selectedSpecimens).join(',');

            const params = new URLSearchParams({
                action: 'search',
                specimens: specimensParam,
                years: selectedQuarter,
                names: namesToSend.join(',')
            });

            try {
                const res = await fetch(`${GAS_URL}?${params.toString()}`);
                const json = await res.json();
                loader.classList.add('hidden');
                if (json.status === 'success') {
                    renderTable(aggregateData(json.data));
                } else {
                    alert('Error: ' + json.message);
                }
            } catch (e) { 
                loader.classList.add('hidden'); 
                alert('Connection Error'); 
            }
        }

        function aggregateData(rawData) {
            const groups = {};
            rawData.forEach(row => {
                const key = row.name; 
                if (!groups[key]) groups[key] = { name: row.name, drugData: {} };
                for (const [d, v] of Object.entries(row.drugResults)) {
                    if (!groups[key].drugData[d]) groups[key].drugData[d] = { s: 0, t: 0, isR: false };
                    const p = parseDrugValue(v);
                    if (p.r) groups[key].drugData[d].isR = true;
                    else { groups[key].drugData[d].s += p.s; groups[key].drugData[d].t += p.t; }
                }
            });
            return Object.values(groups).map(g => {
                const finalDrugs = {};
                for (const [d, c] of Object.entries(g.drugData)) {
                    finalDrugs[d] = { pct: formatDrugValue(c.s, c.t, c.isR), n: c.t, isR: c.isR };
                }
                return { name: g.name, drugResults: finalDrugs };
            });
        }

        function parseDrugValue(val) {
            if (!val || val === 'N/A' || val === '-') return { s: 0, t: 0, r: false };
            if (val.includes('R')) return { s: 0, t: 0, r: true };
            const m = val.match(/^([\d.]+)%\s*\((\d+)\)$/);
            if (m) { const t = parseInt(m[2]); return { s: Math.round((parseFloat(m[1])/100)*t), t: t, r: false }; }
            return { s: 0, t: 0, r: false };
        }
        
        function formatDrugValue(s, t, isR) {
            if (isR && t === 0) return 'R*';
            if (t === 0) return '-';
            return ((s/t)*100).toFixed(0);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-header');
            document.getElementById('result-count').innerText = `${data.length} Organisms`;
            tbody.innerHTML = ''; 

            if (data.length === 0) { 
                tbody.innerHTML = '<tr><td colspan="10" class="py-10 text-center text-slate-500">ไม่พบข้อมูล</td></tr>'; 
                return; 
            }
            
            const activeDrugs = Array.from(document.querySelectorAll('.drug-check:checked')).map(c => c.value);
            
            thead.innerHTML = `
                <th class="text-left pl-4 min-w-[180px] rounded-tl-lg sticky left-0 bg-slate-900 z-10">Organism</th>
                ${activeDrugs.map(d => `<th class="min-w-[85px] cursor-help" title="${d}">${d.substring(0,4)}</th>`).join('')}
            `;
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors border-b border-slate-800/50";
                
                let html = `
                    <td class="text-left pl-4 font-medium text-cyan-200 sticky left-0 bg-slate-900/90 z-10 border-r border-slate-700">${row.name}</td>
                `;

                activeDrugs.forEach(d => {
                    const obj = row.drugResults[d] || { pct: '-', n: 0, isR: false };
                    const v = obj.pct;
                    const num = parseFloat(v);
                    
                    let cellClass = 'bg-na text-slate-600';
                    let clickAction = '';
                    let display = v;
                    let alertIcon = '';
                    
                    if(obj.n < 30 && v !== '-' && v !== 'R*') alertIcon = `<i data-lucide="alert-circle" class="w-3 h-3 alert-icon" title="Low data (n<30)"></i>`;

                    if (obj.isR) {
                        cellClass = 'cell-disabled text-xs bg-slate-800 opacity-30 text-transparent'; 
                        display = 'R*';
                    } else if (v !== '-') {
                        const c = (num < 50) ? 'bg-sens-low' : (num >= 76 ? 'bg-sens-high' : 'bg-sens-med');
                        cellClass = `${c} hover:opacity-80`;
                        clickAction = `onclick="showTrend('${row.name}', '${d}')"`;
                        // Format: 74% (57)
                        display = `
                            <div class="flex items-center justify-center gap-1">
                                <span class="text-base font-bold">${v}%</span>
                                <span class="n-badge">(${obj.n})${alertIcon}</span>
                            </div>`;
                    }
                    
                    html += `<td class="${cellClass}" ${clickAction}>${display}</td>`;
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }
        
        function updateTableVisibility() { fetchTableData(); }

        // --- TREND CHART ---
        async function showTrend(organism, drug) {
            const modal = document.getElementById('trend-modal');
            const loading = document.getElementById('trend-loading');
            currentChartContext = { organism, drug }; 
            document.getElementById('trend-title').innerText = `${organism} vs ${drug}`;
            modal.style.display = 'flex';
            loading.classList.remove('hidden');

            const specimensParam = Array.from(selectedSpecimens).join(',');
            const params = new URLSearchParams({
                action: 'trend',
                organism: organism,
                drug: drug,
                specimens: specimensParam
            });

            try {
                const res = await fetch(`${GAS_URL}?${params.toString()}`);
                const json = await res.json();
                loading.classList.add('hidden');
                if (json.status === 'success') {
                    currentChartContext.data = json.data;
                    renderTrendChart(json.data);
                } else {
                    alert('No trend data');
                }
            } catch (e) { loading.classList.add('hidden'); }
        }

        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();

            const totalN = data.reduce((acc, d) => acc + d.total, 0);
            const weightedAvg = data.reduce((acc, d) => acc + (d.percent * d.total), 0) / totalN;
            
            const badgeColor = weightedAvg >= 76 ? 'bg-emerald-500' : (weightedAvg < 50 ? 'bg-red-500' : 'bg-yellow-500');
            document.getElementById('trend-badge').className = `text-xs font-bold px-2 py-0.5 rounded text-white ${badgeColor}`;
            document.getElementById('trend-badge').innerText = `Avg: ${weightedAvg.toFixed(0)}%`;
            document.getElementById('trend-subtitle').innerText = `Total Specimen: ${totalN}`;

            const labels = data.map(d => d.quarter);
            const values = data.map(d => d.percent);

            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(34, 211, 238, 0.4)');
            gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');

            const segmentColor = (ctx) => {
                const val = ctx.p0.parsed.y;
                if (val < 50) return '#f87171'; 
                if (val < 76) return '#facc15'; 
                return '#34d399'; 
            };

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '% S',
                        data: values,
                        backgroundColor: gradient,
                        borderColor: '#22d3ee',
                        segment: { borderColor: segmentColor },
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- CHATBOT ---
        function openChatModal() { document.getElementById('chat-modal').style.display = 'flex'; }
        function closeChatModal() { document.getElementById('chat-modal').style.display = 'none'; }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const question = input.value.trim();
            const spec = Array.from(selectedSpecimens)[0];
            const selectedOrgRadio = document.querySelector('input[name="selected_org"]:checked');
            const org = selectedOrgRadio ? selectedOrgRadio.value : "";
            const quarter = document.querySelector('input[name="quarter"]:checked').value;
            const origin = document.getElementById('chat-origin').value;
            const severity = document.getElementById('chat-sepsis').checked;

            if (!question) return;

            container.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-slate-700"><img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-full h-full object-contain"></div><div class="chat-bubble chat-user">${question}</div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="flex gap-3"><div class="ai-avatar min-w-[40px] flex-shrink-0"><img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-full h-full object-contain rounded-full"></div><div class="chat-bubble chat-ai">กำลังประมวลผล...</div></div>`;
            container.scrollTop = container.scrollHeight;

            const params = new URLSearchParams({
                action: 'chat',
                specimen: spec || "", 
                organism: org || "", 
                quarter: quarter,
                includeResistant: document.querySelector('input[name="orgMode"]:checked').value === 'total',
                origin: origin,
                severity: severity,
                question: question
            });

            try {
                const res = await fetch(`${GAS_URL}?${params.toString()}`);
                const json = await res.json();
                document.getElementById(loadingId).remove();

                if (json.status === 'success') {
                    const cleanText = json.answer.replace(/\*\*/g, '');
                    container.innerHTML += `
                        <div class="flex gap-3">
                            <div class="ai-avatar min-w-[40px] flex-shrink-0"><img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-full h-full object-contain rounded-full"></div>
                            <div class="chat-bubble chat-ai">${cleanText.replace(/\n/g, '<br>')}</div>
                        </div>`;
                } else {
                    container.innerHTML += `<div class="text-red-400 text-center text-xs">Error: ${json.message}</div>`;
                }
            } catch (e) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="text-red-400 text-center text-xs">Connection failed.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
