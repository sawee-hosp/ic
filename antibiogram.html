<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawee Hospital Smart Antibiogram</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦠</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 20% 30%, rgba(76, 29, 149, 0.4) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(15, 118, 110, 0.4) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 1) 0%, rgba(17, 24, 39, 1) 100%); }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        
        select, input[type="text"] { background-color: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); color: #e2e8f0; border-radius: 0.5rem; padding: 0.5rem; width: 100%; outline: none; }
        
        /* Infection Mode Tabs */
        .mode-tab { padding: 4px 12px; font-size: 0.8rem; cursor: pointer; border-radius: 6px; color: #94a3b8; transition: all 0.2s; }
        .mode-tab.active { background: rgba(34, 211, 238, 0.1); color: #22d3ee; font-weight: 500; }
        
        /* Specimen Buttons - Wrapped & Colored */
        .specimen-container { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; max-height: 140px; overflow-y: auto; align-content: flex-start; }
        .specimen-btn { 
            display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.6rem; 
            border-radius: 0.4rem; border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(30, 41, 59, 0.6); color: #cbd5e1; 
            cursor: pointer; transition: all 0.2s; font-size: 0.75rem; 
            white-space: nowrap; width: auto; flex: none; 
        }
        .specimen-btn:hover { background: rgba(34, 211, 238, 0.1); border-color: rgba(34, 211, 238, 0.3); }
        .specimen-btn.active { 
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%); 
            border-color: #22d3ee; color: #22d3ee; box-shadow: 0 0 8px rgba(34, 211, 238, 0.15); 
        }

        /* Organism Accordion */
        .group-header { font-size: 0.8rem; font-weight: 500; color: #94a3b8; cursor: pointer; padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.6); margin-bottom: 2px; border: 1px solid transparent; transition: all 0.2s; }
        .group-header:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
        .group-header.active { color: #22d3ee; border-color: rgba(34, 211, 238, 0.3); background: rgba(34, 211, 238, 0.05); }
        .group-body { display: none; padding: 6px 8px; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; border-left: 2px solid rgba(34, 211, 238, 0.1); margin-left: 4px; }
        .custom-checkbox { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #cbd5e1; cursor: pointer; padding: 2px 0; width: 100%; }
        .custom-checkbox input { accent-color: #22d3ee; width: 13px; height: 13px; }

        /* Full Screen */
        .is-fullscreen { position: fixed !important; inset: 0 !important; z-index: 100 !important; background: #0f172a !important; border-radius: 0 !important; padding: 1rem !important; }
        .is-fullscreen .table-container { max-height: calc(100vh - 100px) !important; }

        /* Table */
        .table-normal th { padding: 12px; font-size: 0.85rem; background: rgba(15, 23, 42, 0.95); position: sticky; top: 0; z-index: 10; font-weight: 500; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .table-normal td { padding: 8px; font-size: 0.85rem; cursor: pointer; transition: background 0.1s; vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.03); position: relative; }
        .table-normal td:hover { background: rgba(255,255,255,0.08); }
        
        .cell-content { display: flex; align-items: center; justify-content: center; gap: 2px; }
        .cell-pct { font-weight: 400; font-size: 0.9rem; }
        .cell-n-badge { font-size: 0.75rem; opacity: 0.6; margin-left: 2px; }
        .cell-disabled { cursor: not-allowed !important; background: rgba(30, 41, 59, 0.5) !important; color: transparent !important; pointer-events: none; }
        
        /* Low N Alert */
        .alert-badge { display: inline-flex; width: 16px; height: 16px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 50%; font-size: 10px; align-items: center; justify-content: center; margin-left: 4px; font-style: italic; font-family: serif; cursor: help; }

        /* Colors */
        .bg-sens-high { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .bg-sens-med { background-color: rgba(234, 179, 8, 0.15); color: #facc15; }
        .bg-sens-low { background-color: rgba(239, 68, 68, 0.15); color: #f87171; }
        .bg-na { color: #475569; }

        /* AI Mode Button (Orange) */
        .ai-mode-btn {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            background: rgba(249, 115, 22, 0.15); border: 1px solid rgba(249, 115, 22, 0.4); color: #fb923c;
            font-size: 0.65rem; padding: 2px 6px; rounded: 4px;
            opacity: 0; transition: all 0.2s; pointer-events: auto; z-index: 20;
        }
        .ai-mode-btn:hover { background: rgba(249, 115, 22, 0.3); transform: translateY(-50%) scale(1.05); }
        tr:hover .ai-mode-btn { opacity: 1; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1e293b; width: 95%; max-width: 800px; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: #22d3ee; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col">
    <div class="aurora-bg"></div>

    <header class="max-w-7xl mx-auto w-full mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="p-3 bg-cyan-500/10 rounded-xl border border-cyan-500/20">
                <i data-lucide="activity" class="w-8 h-8 text-cyan-400"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">SAWEE SMART IC</h1>
                <p class="text-slate-400 text-sm">Antibiogram & AI Surveillance System</p>
            </div>
        </div>
        <div id="db-status" class="text-xs text-slate-500 bg-slate-900/50 px-3 py-1 rounded-full border border-slate-700 h-fit">Connecting...</div>
    </header>

    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
        <!-- Sidebar -->
        <aside class="lg:col-span-3 space-y-4">
            <div class="glass p-4 h-full flex flex-col">
                <!-- 1. Infection Site -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-slate-400 font-medium uppercase tracking-wide">Site of Infection</label>
                        <div class="flex bg-slate-800 rounded p-0.5">
                            <div class="mode-tab active" onclick="setInfectionMode('syndrome', this)">Syndrome</div>
                            <div class="mode-tab" onclick="setInfectionMode('specimen', this)">Specimen</div>
                        </div>
                    </div>
                    <div id="specimen-container" class="specimen-container bg-slate-900/30 rounded-lg">
                        <div class="text-xs text-slate-500 italic p-2">Loading...</div>
                    </div>
                </div>

                <div class="border-t border-white/5 my-2"></div>

                <!-- 2. Time Period -->
                <div>
                    <label class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-2 block">Time Period</label>
                    <div id="quarter-radios" class="flex flex-col gap-1.5"></div>
                </div>

                <div class="border-t border-white/5 my-2"></div>

                <!-- 3. Organism -->
                <div class="flex-grow flex flex-col min-h-0">
                     <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-400 font-medium uppercase tracking-wide">Organism</label>
                        <button onclick="toggleAllOrganisms()" class="text-[10px] bg-slate-700 hover:bg-cyan-600 text-white px-2 py-0.5 rounded transition">ALL</button>
                    </div>
                    
                    <!-- Include/Only Resistant Buttons -->
                    <div class="flex gap-2 mb-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="orgMode" value="total" checked class="peer hidden">
                            <div class="text-[10px] text-center py-1.5 rounded border border-cyan-500/30 text-cyan-400 peer-checked:bg-cyan-500 peer-checked:text-white transition-all">รวมเชื้อดื้อยา</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="orgMode" value="resistant" class="peer hidden">
                            <div class="text-[10px] text-center py-1.5 rounded border border-red-500/30 text-red-400 peer-checked:bg-red-500 peer-checked:text-white transition-all">เฉพาะเชื้อดื้อยา</div>
                        </label>
                    </div>

                    <div id="organism-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-1 bg-slate-900/30 rounded-lg p-2"></div>
                </div>
                
                 <!-- 4. Drugs -->
                <div class="mt-2">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-400 font-medium uppercase tracking-wide">Drugs</label>
                         <button onclick="toggleAllDrugs()" class="text-[10px] bg-slate-700 hover:bg-cyan-600 text-white px-2 py-0.5 rounded transition">ALL</button>
                    </div>
                    <div id="drug-groups-container" class="max-h-[140px] overflow-y-auto custom-scrollbar space-y-1 bg-slate-900/30 rounded-lg p-1"></div>
                </div>

                <div class="mt-4">
                    <button onclick="fetchTableData()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="search" class="w-4 h-4"></i> Update Table
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Table Area -->
        <div class="lg:col-span-9">
            <div id="table-container-wrapper" class="glass p-1 h-full min-h-[500px] flex flex-col relative transition-all duration-300">
                <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-900/50 rounded-t-xl">
                    <h3 class="font-semibold text-cyan-100 flex items-center gap-2">
                        <i data-lucide="table" class="w-4 h-4 text-cyan-400"></i> Antibiogram Result
                    </h3>
                    <div class="flex items-center gap-3">
                        <label class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none hover:text-white">
                            <input type="checkbox" id="hide-empty" class="accent-cyan-500 w-3 h-3 rounded" onchange="fetchTableData()">
                            Hide Empty
                        </label>
                        <button onclick="toggleFullScreen()" class="p-1.5 rounded hover:bg-white/10 text-slate-300" title="Full Screen">
                            <i data-lucide="maximize-2" class="w-5 h-5"></i>
                        </button>
                        <span id="result-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded">0 Isolates</span>
                    </div>
                </div>
                
                <div class="overflow-auto flex-grow custom-scrollbar bg-slate-900/30 relative table-container">
                    <table id="resultTable" class="w-full text-center border-collapse table-normal">
                        <thead><tr id="table-header"></tr></thead>
                        <tbody id="table-body">
                            <tr id="table-placeholder">
                                <td colspan="10" class="py-20 text-center text-slate-500">
                                    <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                                    Select filters to view data
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="search-loading" class="hidden absolute inset-0 bg-slate-900/80 z-20 flex flex-col items-center justify-center text-slate-400 top-[50px]">
                        <div class="loader mb-3"></div> Processing...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Trend Modal -->
    <div id="trend-modal" class="modal-overlay">
        <div class="modal-content bg-slate-900">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-slate-800/50">
                <div>
                    <h3 class="font-bold text-lg text-cyan-300" id="trend-title">Trend Analysis</h3>
                    <div class="flex gap-2 mt-2">
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">Avg: <span id="trend-avg" class="font-bold"></span></span>
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">N: <span id="trend-n" class="font-bold"></span></span>
                    </div>
                </div>
                <button onclick="document.getElementById('trend-modal').style.display='none'" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-4 h-[350px] w-full relative">
                <canvas id="trendChart"></canvas>
            </div>
            <div id="trend-loading" class="absolute inset-0 flex items-center justify-center bg-slate-900/90 z-10 hidden"><div class="loader"></div></div>
        </div>
    </div>

    <!-- AI Analysis Modal (New) -->
    <div id="ai-modal" class="modal-overlay">
        <div class="modal-content bg-slate-900 border border-orange-500/30">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-orange-900/20">
                <div class="flex items-center gap-2">
                    <img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-8 h-8 object-contain">
                    <h3 class="font-bold text-lg text-orange-300">IC SW-1 Analysis</h3>
                </div>
                <button onclick="document.getElementById('ai-modal').style.display='none'" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="ai-content" class="p-6 overflow-y-auto custom-scrollbar text-sm text-slate-300 leading-relaxed whitespace-pre-wrap" style="max-height: 60vh;"></div>
            <div id="ai-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/95 z-10">
                <img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-16 h-16 object-contain animate-bounce mb-4">
                <span class="text-orange-300 animate-pulse">กำลังวิเคราะห์ข้อมูล...</span>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwZQ5bn3aLOL91zI79UzCoNfpfqlY3L6WryFeXMa5wDENl6rbbBUJVU2fW1cuKR1W1K/exec';
        let cachedData = null;
        let selectedSpecimens = new Set();
        let trendChartInstance = null;
        let infectionMode = 'syndrome';

        const SYNDROME_MAP = {
            "Pneumonia / Respiratory": ["Sputum"],
            "UTI / Urinary Tract": ["Urine"],
            "Bacteremia / Sepsis": ["Hemoculture", "Blood"],
            "SSTI / Wound / Pus": ["Pus", "Wound", "Swab", "Abscess"],
            "GI / Diarrhea": ["Stool"],
            "Reproductive / Vaginal": ["Vaginal"]
        };

        const DRUG_GROUPS = {
            "Penicillins": ["Ampicillin", "Penicillin", "Oxacillin", "Amoxicillin/Cla"],
            "Cephalosporins": ["Cefazolin", "Cefotaxime", "Ceftazidime", "Ceftriaxone", "Cefepime"],
            "Carbapenems": ["Ertapenem", "Imipenem", "Meropenem"],
            "Aminoglycosides": ["Amikacin", "Gentamicin"],
            "Fluoroquinolones": ["Ciprofloxacin", "Levofloxacin"],
            "Others": ["Clindamycin", "Vancomycin", "Colistin", "Trimetho/Sulfa."]
        };

        window.onload = async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            initDrugSelector();
            await loadOptions();
        };

        async function loadOptions() {
            try {
                const res = await fetch(`${GAS_URL}?action=options`);
                const json = await res.json();
                if (json.status === 'success') {
                    cachedData = json.data;
                    renderSpecimenSelector();
                    renderOrganismSelector(json.data.organisms);
                    renderTimeSelector(json.data.quarters);
                    document.getElementById('db-status').innerText = 'Ready';
                    document.getElementById('db-status').className = 'text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30 h-fit';
                    
                    // Default Select All Specimens
                    toggleAllSpecimens();
                }
            } catch (e) { document.getElementById('db-status').innerText = 'Offline'; }
        }

        // --- SPECIMEN ---
        function setInfectionMode(mode, el) {
            infectionMode = mode;
            document.querySelectorAll('.mode-tab').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            renderSpecimenSelector();
        }
        function renderSpecimenSelector() {
            const container = document.getElementById('specimen-container');
            container.innerHTML = '';
            const source = infectionMode === 'syndrome' ? Object.keys(SYNDROME_MAP) : cachedData.specimens;
            source.forEach(label => {
                const btn = document.createElement('button');
                btn.className = 'specimen-btn';
                btn.innerHTML = `<span>${label}</span>`;
                btn.dataset.val = label;
                btn.onclick = () => {
                    const isActive = btn.classList.toggle('active');
                    const vals = infectionMode === 'syndrome' ? SYNDROME_MAP[label] : [label];
                    vals.forEach(v => isActive ? selectedSpecimens.add(v) : selectedSpecimens.delete(v));
                };
                // Auto-select if in set
                const vals = infectionMode === 'syndrome' ? SYNDROME_MAP[label] : [label];
                if(vals && vals.some(v => selectedSpecimens.has(v))) btn.classList.add('active');
                
                container.appendChild(btn);
            });
            lucide.createIcons();
        }
        function toggleAllSpecimens() {
            const btns = document.querySelectorAll('.specimen-btn');
            const allActive = Array.from(btns).every(b => b.classList.contains('active'));
            selectedSpecimens.clear();
            if(!allActive) {
                // Select All underlying
                 cachedData.specimens.forEach(s => selectedSpecimens.add(s));
            }
            // Re-render visual state
            renderSpecimenSelector();
            if(!allActive) document.querySelectorAll('.specimen-btn').forEach(b => b.classList.add('active'));
        }

        // --- ORGANISM ---
        function renderOrganismSelector(orgData) {
            const container = document.getElementById('organism-list');
            container.innerHTML = '';
            for (const [gram, groups] of Object.entries(orgData)) {
                const gramHtml = document.createElement('div');
                gramHtml.className = 'mb-1';
                gramHtml.innerHTML = `<div class="text-[10px] font-bold text-slate-500 uppercase mt-2 mb-1 px-1">${gram}</div>`;
                
                for (const [groupName, organisms] of Object.entries(groups)) {
                    const sortedOrgs = organisms.sort(); // Alpha sort
                    const groupHtml = `
                        <div class="mb-1">
                            <div class="group-header" onclick="toggleGroup(this)">
                                <span class="text-xs font-semibold">${groupName}</span>
                                <div class="flex gap-2">
                                    <span class="text-[10px] text-cyan-500 hover:underline" onclick="event.stopPropagation(); toggleGroupCheck(this, true)">All</span>
                                    <i data-lucide="chevron-down" class="w-3 h-3 transition-transform"></i>
                                </div>
                            </div>
                            <div class="group-body">
                                ${sortedOrgs.map(org => `
                                    <label class="custom-checkbox w-full">
                                        <input type="checkbox" value="${org}" class="org-check accent-cyan-500 rounded-sm">
                                        <span class="text-xs text-slate-300 truncate" title="${org}">${org}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>`;
                    gramHtml.insertAdjacentHTML('beforeend', groupHtml);
                }
                container.appendChild(gramHtml);
            }
            lucide.createIcons();
        }
        function toggleAllOrganisms() {
            const checks = document.querySelectorAll('.org-check');
            const allChecked = Array.from(checks).every(c => c.checked);
            checks.forEach(c => c.checked = !allChecked);
        }

        // --- DRUGS ---
        function initDrugSelector() {
            const container = document.getElementById('drug-groups-container');
            container.innerHTML = '';
            for (const [group, drugs] of Object.entries(DRUG_GROUPS)) {
                const sortedDrugs = drugs.sort();
                const html = `<div><div class="group-header" onclick="toggleGroup(this)"><span class="text-xs font-semibold text-slate-400">${group}</span><div class="flex gap-2"><span class="text-[10px] text-cyan-500 hover:underline" onclick="event.stopPropagation(); toggleGroupCheck(this, true)">All</span><i data-lucide="chevron-down" class="w-3 h-3 transition-transform"></i></div></div><div class="group-body hidden pl-2 pt-1 grid grid-cols-2 gap-1">${sortedDrugs.map(d => `<label class="custom-checkbox"><input type="checkbox" value="${d}" class="drug-check accent-cyan-500" checked><span>${d}</span></label>`).join('')}</div></div>`;
                container.innerHTML += html;
            }
            lucide.createIcons();
        }
        function toggleAllDrugs() {
            const checks = document.querySelectorAll('.drug-check');
            const allChecked = Array.from(checks).every(c => c.checked);
            checks.forEach(c => c.checked = !allChecked);
        }

        // --- COMMON TOGGLES ---
        function toggleGroup(header) {
            const body = header.nextElementSibling;
            const icon = header.querySelector('svg');
            const isHidden = getComputedStyle(body).display === 'none';
            body.style.display = isHidden ? 'flex' : 'none';
            if(icon) icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
            header.classList.toggle('active', isHidden);
        }
        function toggleGroupCheck(btn, checked) {
            const body = btn.closest('.group-header').nextElementSibling;
            // Ensure group is open
            body.style.display = 'flex';
             const icon = btn.closest('.group-header').querySelector('svg');
            if(icon) icon.style.transform = 'rotate(180deg)';
            
            body.querySelectorAll('input').forEach(cb => cb.checked = checked);
        }

        function renderTimeSelector(quarters) {
            const container = document.getElementById('quarter-radios');
            container.innerHTML = quarters.map((opt, idx) => `
                <label class="flex items-center gap-2 p-1 rounded hover:bg-white/5 cursor-pointer">
                    <input type="radio" name="quarter" value="${opt.value}" ${idx === 0 ? 'checked' : ''} class="accent-cyan-500 w-3 h-3">
                    <span class="text-xs text-slate-300">${opt.label}</span>
                </label>
            `).join('');
        }

        function toggleFullScreen() {
            const wrapper = document.getElementById('table-container-wrapper');
            wrapper.classList.toggle('is-fullscreen');
        }

        // --- FETCH TABLE ---
        async function fetchTableData() {
            const loader = document.getElementById('search-loading');
            loader.classList.remove('hidden');
            if(document.getElementById('table-placeholder')) document.getElementById('table-placeholder').classList.add('hidden');

            const selectedOrgChecks = Array.from(document.querySelectorAll('.org-check:checked')).map(c => c.value);
            const selectedQuarter = document.querySelector('input[name="quarter"]:checked').value;
            const specimensParam = selectedSpecimens.size > 0 ? Array.from(selectedSpecimens).join(',') : "";

            const params = new URLSearchParams({
                action: 'search',
                specimens: specimensParam,
                years: selectedQuarter,
                names: selectedOrgChecks.join(',')
            });

            try {
                const res = await fetch(`${GAS_URL}?${params.toString()}`);
                const json = await res.json();
                loader.classList.add('hidden');
                if (json.status === 'success') {
                    renderTable(aggregateData(json.data));
                } else { alert(json.message); }
            } catch (e) { loader.classList.add('hidden'); }
        }

        function aggregateData(rawData) {
            const groups = {};
            rawData.forEach(row => {
                const key = row.name; 
                if (!groups[key]) groups[key] = { name: row.name, drugData: {} };
                for (const [d, v] of Object.entries(row.drugResults)) {
                    if (!groups[key].drugData[d]) groups[key].drugData[d] = { s: 0, t: 0, isR: false };
                    const p = parseDrugValue(v);
                    if (p.r) groups[key].drugData[d].isR = true;
                    else { groups[key].drugData[d].s += p.s; groups[key].drugData[d].t += p.t; }
                }
            });
            return Object.values(groups).map(g => {
                const finalDrugs = {};
                for (const [d, c] of Object.entries(g.drugData)) {
                    finalDrugs[d] = { pct: formatDrugValue(c.s, c.t, c.isR), n: c.t, isR: c.isR };
                }
                return { name: g.name, drugResults: finalDrugs };
            });
        }
        function parseDrugValue(val) {
            if (!val || val === 'N/A' || val === '-') return { s: 0, t: 0, r: false };
            if (val.includes('R')) return { s: 0, t: 0, r: true };
            const m = val.match(/^([\d.]+)%\s*\((\d+)\)$/);
            if (m) { const t = parseInt(m[2]); return { s: Math.round((parseFloat(m[1])/100)*t), t: t, r: false }; }
            return { s: 0, t: 0, r: false };
        }
        function formatDrugValue(s, t, isR) { if (isR && t === 0) return 'R*'; if (t === 0) return '-'; return ((s/t)*100).toFixed(0); }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-header');
            const hideEmpty = document.getElementById('hide-empty').checked;
            
            document.getElementById('result-count').innerText = `${data.length} Organisms`;
            tbody.innerHTML = ''; 

            if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="10" class="py-20 text-center text-slate-500">No Data</td></tr>'; return; }
            
            const activeDrugs = Array.from(document.querySelectorAll('.drug-check:checked')).map(c => c.value);
            
            thead.innerHTML = `<th class="text-left pl-4 min-w-[180px] rounded-tl-lg sticky left-0 bg-slate-900 z-10">Organism</th>${activeDrugs.map(d => `<th class="min-w-[70px] text-center" title="${d}">${d.substring(0,4)}</th>`).join('')}`;
            
            data.forEach(row => {
                const hasData = activeDrugs.some(d => row.drugResults[d] && row.drugResults[d].pct !== '-');
                if (hideEmpty && !hasData) return;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors border-b border-slate-800/50 group relative";
                
                // Organism Name with AI Mode Button
                let html = `
                    <td class="text-left pl-4 font-medium text-cyan-200 sticky left-0 bg-slate-900/90 z-10 border-r border-slate-700 relative">
                        ${row.name}
                        <button class="ai-mode-btn" onclick="openAIAnalysis('${row.name}')">AI Mode</button>
                    </td>`;
                
                activeDrugs.forEach(d => {
                    const obj = row.drugResults[d] || { pct: '-', n: 0, isR: false };
                    const v = obj.pct;
                    const num = parseFloat(v);
                    
                    let cellClass = 'bg-na text-slate-600';
                    let clickAction = '';
                    let display = v;
                    let alertIcon = '';
                    
                    if(obj.n < 30 && v !== '-' && v !== 'R*') alertIcon = `<span class="alert-badge" title="Low data (n<30)">i</span>`;
                    
                    if (obj.isR) { 
                        cellClass = 'cell-disabled text-[10px] bg-slate-800 opacity-20'; 
                        display = 'R*'; 
                    } else if (v !== '-') {
                        const c = (num < 50) ? 'bg-sens-low' : (num >= 76 ? 'bg-sens-high' : 'bg-sens-med');
                        cellClass = `${c} hover:opacity-80`;
                        const safeOrg = row.name.replace(/'/g, "\\'");
                        clickAction = `onclick="showTrend('${safeOrg}', '${d}')"`;
                        display = `<div class="cell-content"><span class="cell-pct">${v}%</span><span class="cell-n-badge">${obj.n}</span>${alertIcon}</div>`;
                    }
                    html += `<td class="${cellClass}" ${clickAction}>${display}</td>`;
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // --- ANALYZE ORGANISM (AI Mode) ---
        function openAIAnalysis(orgName) {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            const loading = document.getElementById('ai-loading');
            
            modal.style.display = 'flex';
            content.innerHTML = '';
            loading.classList.remove('hidden');

            const selectedQuarter = document.querySelector('input[name="quarter"]:checked').value;
            const specimensParam = selectedSpecimens.size > 0 ? Array.from(selectedSpecimens).join(',') : "";
            const includeResistant = document.querySelector('input[name="orgMode"]:checked').value === 'total';
            
            const params = new URLSearchParams({
                action: 'analyze_organism',
                organism: orgName,
                specimen: specimensParam,
                quarter: selectedQuarter,
                includeResistant: includeResistant
            });

            fetch(`${GAS_URL}?${params.toString()}`)
                .then(r => r.json())
                .then(data => {
                    loading.classList.add('hidden');
                    if(data.status === 'success') {
                        content.innerHTML = data.answer.replace(/\n/g, '<br>');
                    } else {
                        content.innerHTML = `<span class="text-red-400">Error: ${data.message}</span>`;
                    }
                })
                .catch(() => {
                    loading.classList.add('hidden');
                    content.innerHTML = `<span class="text-red-400">Connection Failed</span>`;
                });
        }

        // --- TREND CHART ---
        async function showTrend(organism, drug) {
            const modal = document.getElementById('trend-modal');
            const loading = document.getElementById('trend-loading');
            document.getElementById('trend-title').innerText = `${organism} vs ${drug}`;
            modal.style.display = 'flex';
            loading.classList.remove('hidden');

            const specimensParam = selectedSpecimens.size > 0 ? Array.from(selectedSpecimens).join(',') : "";
            
            try {
                const res = await fetch(`${GAS_URL}?action=trend&organism=${organism}&drug=${drug}&specimens=${specimensParam}`);
                const json = await res.json();
                loading.classList.add('hidden');
                if (json.status === 'success') {
                    renderTrendChart(json.data);
                } else { alert('No trend data'); }
            } catch (e) { loading.classList.add('hidden'); }
        }

        function calculateRegression(data) {
            const n = data.length;
            if (n < 2) return null;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            data.forEach((d, i) => { sumX += i; sumY += d.percent; sumXY += i * d.percent; sumXX += i * i; });
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return { slope, intercept, nextIdx: n };
        }

        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            
            const totalN = data.reduce((acc, d) => acc + d.total, 0);
            const wAvg = data.reduce((acc, d) => acc + (d.percent * d.total), 0) / totalN;
            
            let color = '#facc15'; if(wAvg >= 76) color = '#34d399'; if(wAvg < 50) color = '#f87171';
            
            document.getElementById('trend-avg').innerText = `${wAvg.toFixed(0)}%`;
            document.getElementById('trend-avg').className = `font-bold ml-1 ${wAvg>=76?'text-emerald-400':(wAvg<50?'text-red-400':'text-yellow-400')}`;
            document.getElementById('trend-n').innerText = totalN;

            const labels = data.map(d => d.quarter);
            const values = data.map(d => d.percent);
            
            const reg = calculateRegression(data);
            const forecastData = new Array(data.length).fill(null);
            
            if(reg) {
                const p1 = reg.slope * reg.nextIdx + reg.intercept;
                const p2 = reg.slope * (reg.nextIdx + 1) + reg.intercept;
                labels.push('Forecast Q1', 'Forecast Q2');
                forecastData[data.length-1] = values[values.length-1];
                forecastData.push(Math.min(100, Math.max(0, p1)));
                forecastData.push(Math.min(100, Math.max(0, p2)));
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, color + '66'); 
            gradient.addColorStop(1, color + '00');

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Actual %S', data: values, borderColor: color, backgroundColor: gradient, borderWidth: 3, tension: 0.2, fill: true },
                        { label: 'Forecast', data: forecastData, borderColor: '#94a3b8', borderDash: [5, 5], borderWidth: 2, pointRadius: 4, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { grid: { display: false } }
                    },
                    plugins: { 
                       legend: { display: true, labels: { color: '#94a3b8' } }
                    }
                }
            });
        }
    </script>
