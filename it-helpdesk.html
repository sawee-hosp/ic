<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawee IT Service & Helpdesk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18",
                "react-dom/client": "https://esm.sh/react-dom@18/client",
                "lucide-react": "https://esm.sh/lucide-react@0.344.0"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { margin: 0; padding: 0; }
        
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { position: absolute; left: 0; top: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Monitor, LayoutDashboard, Settings, Server, PlusCircle, 
            List, QrCode, Trash2, CheckCircle, XCircle, Wrench,
            Search, Filter, AppWindow, Loader2, RefreshCw, Save,
            Sparkles, Bot, Wifi, MessageSquare, Send, AlertTriangle, 
            Clock, FileText, BarChart3, Database, Users, HardDrive, 
            Layout, Zap, X, ChevronRight, Activity, Printer, Package, 
            Edit, UserPlus, ArrowLeft, CheckSquare, ShieldCheck, Image as ImageIcon, Camera, ScanLine, LayoutList, Calendar, Menu,
            BookOpen, PhoneCall, BrainCircuit
        } from 'lucide-react';

        // !! นำ URL ของ Web App ที่ Deploy ใหม่มาใส่ตรงนี้ !!
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhmXHiFWbKcIbrQyNh800vbvoEcckcatqpywN1et4L14I7kXXT1Hel-U5kSLZaAS9_/exec';

        const defaultBrands = ["HP", "Dell", "Lenovo", "Asus", "Acer", "Apple", "Cisco", "TP-Link", "Epson", "Canon", "Brother", "APC", "Syndome", "Logitech", "Other"];
        const defaultCPUs = ["Intel Core i3", "Intel Core i5", "Intel Core i7", "Intel Core i9", "AMD Ryzen 3", "AMD Ryzen 5", "AMD Ryzen 7", "AMD Ryzen 9", "Apple M1", "Apple M2", "Other"];
        const defaultOS = ["Windows 7", "Windows 10 Pro", "Windows 11 Pro", "Windows 10 Home", "Windows 11 Home", "Winserver", "Windows Server 2019", "Windows Server 2022", "macOS", "Linux Ubuntu"];
        const defaultSoftware = ["HOSxP", "Word", "Excel", "PowerPoint", "LINE"];
        const colorPalette = ["bg-blue-500", "bg-purple-500", "bg-emerald-500", "bg-orange-500", "bg-pink-500", "bg-indigo-500", "bg-rose-500", "bg-cyan-500"];

        const generate5DigitId = (currentList, idKey) => {
            if (!Array.isArray(currentList) || currentList.length === 0) return "00001";
            const maxId = Math.max(...currentList.map(item => parseInt(item[idKey], 10) || 0));
            return String(maxId + 1).padStart(5, '0');
        };

        const generateTicketId = (tickets = []) => {
            const year = new Date().getFullYear() + 543;
            const yearStr = year.toString();
            const count = tickets.filter(t => t.Ticket_ID && String(t.Ticket_ID).endsWith(`/${yearStr}`)).length + 1;
            return `${count}/${yearStr}`;
        };

        const getTypePrefix = (typeName) => {
            if(!typeName) return "EQP";
            const lower = typeName.toLowerCase();
            if(lower.includes("ชุดเครื่องคอมพิวเตอร์") || lower.includes("set")) return "SET";
            if(lower.includes("คอมพิวเตอร์แม่ข่าย") || lower.includes("server")) return "SERV";
            if(lower.includes("จอภาพ") || lower.includes("monitor")) return "MT";
            if(lower.includes("คอม") || lower.includes("com")) return "COM";
            if(lower.includes("ปริ้น") || lower.includes("prn")) return "PRN";
            if(lower.includes("เน็ต") || lower.includes("สวิตซ์") || lower.includes("net")) return "NET";
            return typeName.substring(0, 3).toUpperCase();
        };

        const generateEquipmentId = (typeName, currentEquipments) => {
            const prefix = getTypePrefix(typeName);
            const count = currentEquipments.filter(e => e.Id && e.Id.startsWith(prefix)).length + 1;
            return `${prefix}-${String(count).padStart(4, '0')}`;
        };

        const safeJsonParse = (str, fallback) => {
            if (!str || str === "-") return fallback;
            try {
                return JSON.parse(str);
            } catch (e) {
                if (typeof str === 'string' && str.startsWith('{') && str.endsWith('}')) {
                    try {
                        let cleanStr = str.replace(/[{}]/g, '').split(',').map(pair => {
                            let [k, v] = pair.split('=');
                            return `"${k.trim()}":"${v ? v.trim() : ''}"`;
                        }).join(',');
                        return [JSON.parse(`{${cleanStr}}`)];
                    } catch(err) {}
                }
                return fallback;
            }
        };

        const QRScannerModal = ({ onScan, onClose }) => {
            useEffect(() => {
                const html5QrCode = new window.Html5Qrcode("qr-reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                    (decodedText) => {
                        html5QrCode.stop().then(() => {
                            onScan(decodedText);
                        }).catch(console.error);
                    },
                    (errorMessage) => {}
                ).catch((err) => {
                    console.log("Camera start error", err);
                    alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตใช้งานกล้องของเบราว์เซอร์");
                });

                return () => {
                    if (html5QrCode.isScanning) {
                        html5QrCode.stop().catch(console.error);
                    }
                };
            }, [onScan]);

            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] backdrop-blur-sm p-4">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl flex flex-col w-full max-w-md">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold flex items-center gap-2"><ScanLine className="text-blue-600"/> สแกน QR Code</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-100 text-gray-500 hover:bg-gray-200 rounded-lg transition"><X size={20}/></button>
                        </div>
                        <div id="qr-reader" className="w-full rounded-xl overflow-hidden border-2 border-slate-200 bg-black"></div>
                        <p className="text-xs text-center text-gray-500 mt-3">กรุณานำกล้องส่องไปที่ QR Code บนอุปกรณ์</p>
                        <button onClick={onClose} className="mt-4 px-4 py-3 bg-gray-200 text-gray-800 rounded-xl hover:bg-gray-300 w-full font-bold transition">ยกเลิกการสแกน</button>
                    </div>
                </div>
            );
        };

        // ส่ง prop role (general หรือ admin) เพื่อให้ Backend เช็คตัวแปร Password ได้ถูกจุด
        const PinLogin = ({ role, onLogin, onCancel }) => {
            const [pin, setPin] = useState(['', '', '', '', '']);
            const [error, setError] = useState(false);
            const [loading, setLoading] = useState(false);
            const inputRefs = useRef([]);

            useEffect(() => {
                const storageKey = role === 'admin' ? 'sawee_admin_pin' : 'sawee_general_pin';
                const savedPin = localStorage.getItem(storageKey);
                if (savedPin && savedPin.length === 5) {
                    verifyPin(savedPin, true);
                } else {
                    if (inputRefs.current[0]) {
                        inputRefs.current[0].focus();
                    }
                }
            }, [role]);

            const handleChange = (index, value) => {
                if (!/^[0-9]*$/.test(value)) return;
                const newPin = [...pin];
                newPin[index] = value;
                setPin(newPin);
                setError(false);

                if (value !== '' && index < 4) {
                    inputRefs.current[index + 1].focus();
                }

                if (newPin.every(p => p !== '')) {
                    verifyPin(newPin.join(''), false);
                }
            };

            const handleKeyDown = (index, e) => {
                if (e.key === 'Backspace' && !pin[index] && index > 0) {
                    inputRefs.current[index - 1].focus();
                }
            };

            const verifyPin = async (fullPin, isAutoLogin = false) => {
                setLoading(true);
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'verifyPin', payload: { pin: fullPin, role: role } })
                    });
                    const result = await response.json();
                    
                    const storageKey = role === 'admin' ? 'sawee_admin_pin' : 'sawee_general_pin';
                    if (result.status === 'success') {
                        localStorage.setItem(storageKey, fullPin);
                        onLogin();
                    } else {
                        localStorage.removeItem(storageKey);
                        if (!isAutoLogin) {
                            setError(true);
                            setPin(['', '', '', '', '']);
                            if (inputRefs.current[0]) inputRefs.current[0].focus();
                        }
                    }
                } catch (err) {
                    if (!isAutoLogin) alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className={`flex h-screen w-full items-center justify-center flex-col ${role==='admin' ? 'bg-black/60 fixed inset-0 z-[200] backdrop-blur-sm' : 'bg-gray-50'}`}>
                    <div className="bg-white p-8 rounded-3xl shadow-lg flex flex-col items-center max-w-sm w-full mx-4 border border-gray-100 relative">
                        {role === 'admin' && onCancel && (
                            <button onClick={onCancel} className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 p-1.5 rounded-full"><X size={18}/></button>
                        )}
                        <div className={`p-4 rounded-full mb-5 ${role === 'admin' ? 'bg-indigo-100 text-indigo-600' : 'bg-blue-100 text-blue-600'}`}>
                            {role === 'admin' ? <Settings size={36} /> : <ShieldCheck size={36} />}
                        </div>
                        <h2 className="text-xl font-bold text-gray-800 mb-2">
                            {role === 'admin' ? 'โหมดผู้ดูแลระบบ (Admin)' : 'ระบบ Helpdesk & IT'}
                        </h2>
                        <p className="text-sm text-gray-500 mb-8 text-center font-medium">
                            {role === 'admin' ? 'กรุณาใส่รหัสสำหรับ Admin 5 หลัก' : 'กรุณาพิมพ์รหัสรพ. 5 ตัว เพื่อเข้าใช้งาน'}
                        </p>
                        
                        <div className="flex gap-3 mb-6">
                            {pin.map((digit, idx) => (
                                <input
                                    key={idx}
                                    ref={el => inputRefs.current[idx] = el}
                                    type="text"
                                    inputMode="numeric"
                                    maxLength={1}
                                    value={digit}
                                    onChange={(e) => handleChange(idx, e.target.value)}
                                    onKeyDown={(e) => handleKeyDown(idx, e)}
                                    className={`w-12 h-14 text-center text-2xl font-bold rounded-xl border-2 outline-none transition-all ${error ? 'border-red-500 bg-red-50 text-red-600' : 'border-gray-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white'}`}
                                    disabled={loading}
                                />
                            ))}
                        </div>
                        
                        {error && <p className="text-red-500 text-sm font-bold animate-bounce flex items-center bg-red-50 px-4 py-1.5 rounded-full"><XCircle size={16} className="mr-1"/> รหัสผิด! กรุณาลองใหม่</p>}
                        {loading && <p className="text-blue-500 text-sm flex items-center font-bold"><Loader2 size={16} className="animate-spin mr-2"/> กำลังตรวจสอบ...</p>}
                    </div>
                </div>
            );
        };

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const isUrlAdmin = urlParams.get('action') === 'admin';

            // ระดับสิทธิ์: 'none', 'general', 'admin'
            const [authLevel, setAuthLevel] = useState('none');
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            
            const isAdmin = authLevel === 'admin';

            const [activeTab, setActiveTab] = useState('repair'); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [showNotification, setShowNotification] = useState(false);
            const [notificationMsg, setNotificationMsg] = useState("");

            const [departments, setDepartments] = useState([]);
            const [types, setTypes] = useState([]);
            const [equipments, setEquipments] = useState([]);
            const [softwares, setSoftwares] = useState([]);
            const [tickets, setTickets] = useState([]); 
            const [staffList, setStaffList] = useState([]); 

            const [qrModal, setQrModal] = useState({ isOpen: false, data: null });
            const [isLoading, setIsLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);
            const [apiError, setApiError] = useState(null);
            
            const [prefillAsset, setPrefillAsset] = useState(null);
            const [prefillSoftwareAsset, setPrefillSoftwareAsset] = useState(null);

            // หากผ่าน URL ?action=admin ให้โชว์หน้าล็อกอินแอดมินรอเลยเมื่อเข้าระบบทั่วไปสำเร็จ
            useEffect(() => {
                if (authLevel === 'general' && isUrlAdmin) {
                    setShowAdminLogin(true);
                }
            }, [authLevel, isUrlAdmin]);

            // เมื่อเป็น Admin แล้วให้ตั้งค่าหน้า Default เป็น Equipments
            useEffect(() => {
                if (authLevel === 'admin') setActiveTab('equipments');
            }, [authLevel]);

            const handleNotify = (msg) => {
                setNotificationMsg(msg);
                setShowNotification(true);
                setTimeout(() => setShowNotification(false), 3000);
            };

            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setIsSidebarOpen(false); 
            };

            const fetchAllData = async () => {
                setIsLoading(true);
                setApiError(null);
                try {
                    const getOptions = { method: 'GET', redirect: 'follow' };
                    const [eqRes, swRes, depRes, typeRes, ticketsRes, staffRes] = await Promise.all([
                        fetch(`${SCRIPT_URL}?sheet=Equipments`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Softwares`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Departments`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Types`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Tickets`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Staff`, getOptions).then(r => r.json())
                    ]);

                    setEquipments(Array.isArray(eqRes) ? eqRes.map(e => ({...e, Storage: typeof e.Storage === 'string' ? safeJsonParse(e.Storage, []) : (e.Storage || [])})) : []);
                    setSoftwares(Array.isArray(swRes) ? swRes.map(s => ({...s, programs: typeof s.programs === 'string' ? safeJsonParse(s.programs, []) : (s.programs || [])})) : []);
                    setDepartments(Array.isArray(depRes) ? depRes : []);
                    setTypes(Array.isArray(typeRes) ? typeRes : []);
                    setTickets(Array.isArray(ticketsRes) ? ticketsRes : []);
                    setStaffList(Array.isArray(staffRes) ? staffRes : []);

                } catch (error) {
                    console.error("Error fetching data:", error);
                    setApiError("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้ โปรดลองใหม่อีกครั้ง");
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { 
                if (authLevel !== 'none') {
                    fetchAllData(); 
                }
            }, [authLevel]);

            const apiCall = async (sheetName, action, payload) => {
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        redirect: 'follow', 
                        body: JSON.stringify({ sheetName, action, payload }) 
                    });
                    const result = await response.json();
                    
                    if (result.status !== 'success') {
                        throw new Error(result.message || "เกิดข้อผิดพลาดในการบันทึกข้อมูล");
                    }
                    return result;
                } catch (error) {
                    console.error("API Error:", error);
                    alert("ข้อผิดพลาดระบบ\n\n" + error.message);
                    throw error; 
                } finally {
                    setIsSyncing(false);
                }
            };

            const printSticker = (item) => {
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${item.Id}&margin=0`; 
                
                const printWindow = window.open('', '_blank', 'width=400,height=300');
                if (!printWindow) {
                    alert('เบราว์เซอร์บล็อกหน้าต่าง Pop-up กรุณาอนุญาตเพื่อสั่งพิมพ์สติกเกอร์');
                    return;
                }
                printWindow.document.write(`
                    <html>
                    <head>
                        <title>Print Sticker</title>
                        <style>
                            @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
                            @page { margin: 0; size: 6cm 2.5cm; }
                            body { 
                                margin: 0; padding: 0; 
                                width: 6cm; height: 2.5cm; 
                                font-family: 'Sarabun', sans-serif;
                                display: flex;
                                background: white;
                            }
                            .sticker-container {
                                width: 100%; height: 100%;
                                display: flex;
                                box-sizing: border-box;
                                padding: 2px 4px;
                                gap: 6px;
                                border: 1px dashed #ccc; 
                            }
                            .qr-section {
                                width: 1.8cm;
                                display: flex;
                                flex-direction: column;
                                justify-content: center;
                                align-items: center;
                            }
                            .qr-img {
                                width: 1.6cm;
                                height: 1.6cm;
                            }
                            .qr-code-text {
                                font-size: 7.5px;
                                font-weight: bold;
                                margin-top: 1px;
                                text-align: center;
                            }
                            .detail-section {
                                flex: 1;
                                display: flex;
                                flex-direction: column;
                                justify-content: center;
                                line-height: 1.3;
                                overflow: hidden;
                            }
                            .eq-name {
                                font-size: 13px; 
                                font-weight: bold;
                                color: #000;
                                white-space: nowrap;
                                overflow: hidden;
                                text-overflow: ellipsis;
                                margin-bottom: 2px;
                            }
                            .eq-dept, .eq-date {
                                font-size: 8.5px;
                                color: #333;
                                white-space: nowrap;
                                overflow: hidden;
                                text-overflow: ellipsis;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="sticker-container">
                            <div class="qr-section">
                                <img src="${qrUrl}" class="qr-img" />
                                <div class="qr-code-text">${item.Id}</div>
                            </div>
                            <div class="detail-section">
                                <div class="eq-name">${item.name || item.Type}</div>
                                <div class="eq-dept">หน่วยงาน: ${item.department || '-'}</div>
                                <div class="eq-date">วันที่: ${item.Date || '-'}</div>
                            </div>
                        </div>
                        <script>
                            window.onload = function() {
                                setTimeout(function() {
                                    window.print();
                                    window.close();
                                }, 500);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            };

            // แสดงหน้า Login ผู้ใช้ทั่วไป
            if (authLevel === 'none') {
                return <PinLogin role="general" onLogin={() => setAuthLevel('general')} />;
            }

            if (isLoading) {
                return (
                <div className="flex h-screen w-full items-center justify-center bg-gray-50 flex-col">
                    <Loader2 className="w-12 h-12 text-blue-600 animate-spin mb-4" />
                    <h2 className="text-xl font-semibold text-gray-700">กำลังโหลดข้อมูลระบบ...</h2>
                </div>
                );
            }

            return (
                <div className="flex h-screen bg-gray-100 font-sans relative overflow-hidden">
                
                {/* แสดงหน้า Login Admin (ทับแบบ Modal หากกดขอเข้าแอดมิน) */}
                {showAdminLogin && (
                    <PinLogin role="admin" onLogin={() => { setAuthLevel('admin'); setShowAdminLogin(false); }} onCancel={() => setShowAdminLogin(false)} />
                )}

                {isSyncing && (
                    <div className="absolute inset-0 z-50 bg-white/60 backdrop-blur-sm flex items-center justify-center">
                    <div className="bg-white p-4 rounded-xl shadow-lg flex items-center space-x-3 border border-blue-100">
                        <RefreshCw className="w-6 h-6 text-blue-600 animate-spin" />
                        <span className="font-medium text-gray-700">กำลังอัปเดตข้อมูลระบบ...</span>
                    </div>
                    </div>
                )}

                {/* Mobile Backdrop Overlay */}
                <div 
                    className={`fixed inset-0 bg-black/50 z-20 md:hidden transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} 
                    onClick={() => setIsSidebarOpen(false)}>
                </div>

                {/* Animated Sidebar */}
                <div className={`fixed md:relative z-30 h-full bg-slate-800 text-white shadow-xl flex-shrink-0 transition-all duration-300 ease-in-out overflow-hidden ${isSidebarOpen ? 'w-64' : 'w-0'}`}>
                    <div className="w-64 h-full flex flex-col">
                        <div className="p-5 flex items-center justify-between border-b border-slate-700">
                            <div className="flex items-center space-x-3">
                                <Server className="w-8 h-8 text-blue-400 shrink-0" />
                                <h1 className="text-lg font-bold tracking-wide truncate">IT Service Center</h1>
                            </div>
                            <button className="md:hidden text-gray-400 hover:text-white" onClick={() => setIsSidebarOpen(false)}>
                                <X size={20} />
                            </button>
                        </div>
                        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto custom-scrollbar">
                            
                            {isAdmin && (
                                <>
                                    <SidebarItem icon={<Monitor size={20} />} label="จัดการครุภัณฑ์ & ภาพรวม" active={activeTab === 'equipments'} onClick={() => handleTabChange('equipments')} />
                                    <SidebarItem icon={<AppWindow size={20} />} label="จัดการซอฟต์แวร์" active={activeTab === 'softwares'} onClick={() => handleTabChange('softwares')} />
                                    
                                    <div className="my-4 border-t border-slate-700"></div>
                                    <div className="px-4 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Helpdesk Service</div>
                                </>
                            )}

                                        <button onClick={() => onGoToSoftware(equipment.Id)} className="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-bold transition flex items-center">

                                        )}

                                </div>

        const EquipmentManager = ({ equipments, setEquipments, departments, types, tickets, softwares, apiCall, onPrintSticker, onShowQR, notify, goToRepair, goToSoftware }) => {
            const [view, setView] = useState('list'); 
            const [editingItem, setEditingItem] = useState(null);
            const [selectedEquipmentDetail, setSelectedEquipmentDetail] = useState(null);

            const stats = {
                total: equipments.length,
                ready: equipments.filter(e => e.Status === 'พร้อมใช้งาน').length,
                repair: equipments.filter(e => e.Status === 'ส่งซ่อม').length,
                broken: equipments.filter(e => e.Status === 'แทงชำรุด').length,
            };

            const handleSave = async (data) => {
                if (editingItem) {
                    const success = await apiCall('Equipments', 'update', data);
                    if (success) {
                        setEquipments(equipments.map(e => e.Id === data.Id ? data : e));
                        notify("อัปเดตข้อมูลครุภัณฑ์สำเร็จ");
                        setView('list');
                        setEditingItem(null);
                    }
                } else {
                    const success = await apiCall('Equipments', 'append', data);
                    if (success) {
                        setEquipments([...equipments, data]);
                        notify("บันทึกข้อมูลครุภัณฑ์สำเร็จ");
                        setView('list');
                    }
                }
            };

            const handleEdit = (item) => {
                setEditingItem(item);
                setView('form');
            };

            const handleDelete = async (id) => {
                if(confirm('ยืนยันการลบข้อมูลครุภัณฑ์นี้?')) {
                    const success = await apiCall('Equipments', 'delete', { Id: id });
                    if (success) {
                        setEquipments(equipments.filter(e => e.Id !== id));
                        notify("ลบข้อมูลครุภัณฑ์สำเร็จ");
                    }
                }
            };

            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    
                    {/* Dashboard Stats */}
                    {view === 'list' && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-blue-100 flex items-center justify-between relative overflow-hidden">
                                <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-blue-500"></div>
                                <div><p className="text-xs text-gray-500 font-bold mb-1 uppercase tracking-wider">ครุภัณฑ์ทั้งหมด</p><p className="text-3xl font-black text-gray-800">{stats.total}</p></div>
                                <Monitor className="text-blue-100 w-12 h-12" />
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-green-100 flex items-center justify-between relative overflow-hidden">
                                <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-green-500"></div>
                                <div><p className="text-xs text-gray-500 font-bold mb-1 uppercase tracking-wider">พร้อมใช้งาน</p><p className="text-3xl font-black text-green-600">{stats.ready}</p></div>
                                <CheckCircle className="text-green-100 w-12 h-12" />
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 flex items-center justify-between relative overflow-hidden">
                                <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-orange-500"></div>
                                <div><p className="text-xs text-gray-500 font-bold mb-1 uppercase tracking-wider">ส่งซ่อม</p><p className="text-3xl font-black text-orange-500">{stats.repair}</p></div>
                                <Wrench className="text-orange-100 w-12 h-12" />
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-red-100 flex items-center justify-between relative overflow-hidden">
                                <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-red-500"></div>
                                <div><p className="text-xs text-gray-500 font-bold mb-1 uppercase tracking-wider">แทงชำรุด</p><p className="text-3xl font-black text-red-600">{stats.broken}</p></div>
                                <XCircle className="text-red-100 w-12 h-12" />
                            </div>
                        </div>
                    )}

                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-4">
                            <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                <LayoutDashboard className="text-blue-600"/> {view === 'list' ? 'ตารางจัดการครุภัณฑ์' : (editingItem ? 'แก้ไขข้อมูลครุภัณฑ์' : 'ฟอร์มลงทะเบียนครุภัณฑ์')}
                            </h3>
                            {view === 'list' ? (
                                <button onClick={() => { setEditingItem(null); setView('form'); }} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-blue-700 flex items-center justify-center gap-2 transition hover:-translate-y-0.5">
                                    <PlusCircle size={18} /> ลงทะเบียนเครื่องใหม่
                                </button>

                        {view === 'list' ? (

                    {selectedEquipmentDetail && (

        const EquipmentForm = ({ initialData, departments, types, onSave, currentEquipments, apiCall, notify }) => {
            const today = new Date().toISOString().split('T')[0];

            const [formData, setFormData] = useState(initialData || {
                Id: '', 
                department: '',
                name: '',
                Status: 'พร้อมใช้งาน',
                Type: '',
                Id_equipment: '', 
                Model: '',
                Computer_Name: '',
                Brand: '',
                CPU: '',
                RAM: '',
                OS: '',
                Storage: [{ type: 'SSD', capacity: '' }],
                Port: '',
                Location: '',
                Date: today,
                Images: ''
            });

            useEffect(() => {
                if (initialData) setFormData(initialData);
            }, [initialData]);

            const [imagePreview, setImagePreview] = useState(null);
            const [isUploading, setIsUploading] = useState(false);

            const isComputerGroup = ["ชุดเครื่องคอมพิวเตอร์", "คอมพิวเตอร์แม่ข่าย", "เครื่องคอมพิวเตอร์", "เครื่องคอมพิวเตอร์พกพา"].some(t => formData.Type.includes(t));
            const isNetworkGroup = ["switch", "router", "hub", "เครือข่าย"].some(t => formData.Type.toLowerCase().includes(t));

            const handleChange = (e) => {
                const { name, value } = e.target;
                let updates = { [name]: value };
                
                if (name === 'Type' && value !== '') {
                    if (!initialData) {
                        updates.Id = generateEquipmentId(value, currentEquipments);
                    }
                    if (!formData.name || formData.name === formData.Type) {
                        updates.name = value; 
                    }
                }

                setFormData(prev => ({ ...prev, ...updates }));
            };
            
            const handleStorageChange = (index, field, value) => {
                const newStorage = [...formData.Storage];
                newStorage[index][field] = value;
                setFormData({ ...formData, Storage: newStorage });
            };

            const addStorage = () => setFormData({ ...formData, Storage: [...formData.Storage, { type: 'SSD', capacity: '' }] });
            const removeStorage = (index) => setFormData({ ...formData, Storage: formData.Storage.filter((_, i) => i !== index) });

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if(!file) return;

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        setImagePreview(compressedBase64);
                        
                        uploadToDrive(compressedBase64, file.name);
                    }
                }
            };

            const uploadToDrive = async (base64String, filename) => {
                setIsUploading(true);
                try {
                    const res = await apiCall('Equipments', 'uploadImage', {
                        base64: base64String,
                        filename: `EQ_${Date.now()}_${filename}`
                    });
                    if(res && res.url) {
                        setFormData(prev => ({ ...prev, Images: res.url }));
                        notify("อัปโหลดรูปภาพสำเร็จ");
                    }
                } catch(e) {
                    alert("อัปโหลดรูปล้มเหลว: " + e.message);
                } finally {
                    setIsUploading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (departments.length === 0 || types.length === 0) {
                    alert("กรุณาตั้งค่า 'หน่วยงาน' และ 'ชนิดอุปกรณ์' ในเมนูตั้งค่าก่อนบันทึก");
                    return;
                }
                if(isUploading) {
                    alert("กรุณารอรูปภาพอัปโหลดเสร็จสิ้นก่อนบันทึก");
                    return;
                }
                onSave(formData);
            };

            return (
                <div className="max-w-4xl bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                    <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center"><Monitor className="mr-2" size={20}/> ข้อมูลหลักครุภัณฑ์</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">ชนิดอุปกรณ์ <span className="text-red-500">*</span></label><select name="Type" value={formData.Type} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white focus:ring-2 focus:ring-blue-500"><option value="">-- เลือกชนิด --</option>{types.map(t => <option key={t.Type_id} value={t.Type_name}>{t.Type_name}</option>)}</select></div>

                        <div><label className="block text-sm font-medium text-gray-700 mb-1">รหัสระบบ (Auto ID / ปรับแก้ได้)</label><input type="text" name="Id" value={formData.Id} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg text-blue-700 font-bold font-mono outline-none focus:border-blue-500" placeholder="เลือกชนิดเพื่อ Gen หรือพิมพ์เอง" required /></div>
                        
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">ชื่ออุปกรณ์ (Name) <span className="text-red-500">*</span></label><input type="text" name="name" value={formData.name} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none" placeholder="เช่น คอมพิวเตอร์ส่วนบุคคล, จอภาพ" /></div>
                        
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">เลขครุภัณฑ์ รพ. (Manual Input) <span className="text-red-500">*</span></label><input type="text" name="Id_equipment" value={formData.Id_equipment} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white font-mono text-blue-700" placeholder="ระบุเลขทะเบียนรพ. 7440-xxx..." /></div>

                        <div><label className="block text-sm font-medium text-gray-700 mb-1">รุ่น (Model)</label><input type="text" name="Model" value={formData.Model || ''} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white" placeholder="ระบุรุ่นอุปกรณ์ (ถ้ามี)" /></div>

                        <div><label className="block text-sm font-medium text-gray-700 mb-1">หน่วยงาน <span className="text-red-500">*</span></label><select name="department" value={formData.department} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white"><option value="">-- เลือกหน่วยงาน --</option>{departments.map(d => <option key={d.dep_Id} value={d.dep_name}>{d.dep_name}</option>)}</select></div>
                        
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">จุดติดตั้ง / สถานที่ (Location)</label><input type="text" name="Location" value={formData.Location || ''} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white" placeholder="เช่น ห้องตรวจ 1, เคาน์เตอร์พยาบาล" /></div>

                        <div><label className="block text-sm font-medium text-gray-700 mb-1">สถานะ <span className="text-red-500">*</span></label><select name="Status" value={formData.Status} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white"><option value="พร้อมใช้งาน">พร้อมใช้งาน</option><option value="ส่งซ่อม">ส่งซ่อม</option><option value="แทงชำรุด">แทงชำรุด</option></select></div>
                        
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">วันที่ลงทะเบียน <span className="text-red-500">*</span></label><input type="date" name="Date" value={formData.Date} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none" /></div>

                        {/* Image Upload Section */}
                        <div className="md:col-span-2 mt-4 p-5 bg-slate-50 border border-slate-200 rounded-xl flex flex-col sm:flex-row gap-6 items-start">
                            <div className="flex-1 w-full">
                                <label className="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2"><Camera size={16}/> ภาพถ่ายอุปกรณ์</label>
                                <input type="file" accept="image/*" capture="environment" onChange={handleImageChange} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 outline-none" />
                                <p className="text-xs text-gray-400 mt-2">รองรับการถ่ายรูปจากมือถือ หรืออัปโหลดไฟล์ ระบบจะย่อขนาดให้อัตโนมัติและเก็บบนคลาวด์</p>
                                {isUploading && <p className="text-sm font-bold text-orange-500 mt-2 flex items-center"><Loader2 size={14} className="animate-spin mr-1"/> กำลังอัปโหลด...</p>}
                                {!isUploading && formData.Images && <p className="text-sm font-bold text-emerald-600 mt-2 flex items-center"><CheckCircle size={14} className="mr-1"/> รูปภาพพร้อมบันทึก</p>}
                            </div>
                            {(imagePreview || formData.Images) && (
                                <div className="w-32 h-32 rounded-lg border border-gray-300 overflow-hidden shadow-sm flex-shrink-0 bg-white">
                                    <img src={imagePreview || formData.Images} alt="Preview" className="w-full h-full object-cover" />
                                </div>
                            )}
                        </div>

                    </div>
                    </div>

                    {formData.Type && (
                    <div className="animate-in fade-in duration-300">
                        <h3 className="text-lg font-bold text-gray-800 mt-8 mb-4 border-b pb-2 flex items-center"><Save className="mr-2" size={20}/> รายละเอียดทางเทคนิค (ถ้ามี)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-100">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">แบรนด์ / ยี่ห้อ <span className="text-red-500">*</span></label>
                            <input list="brand-options" name="Brand" value={formData.Brand} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white" placeholder="เลือกหรือพิมพ์ชื่อแบรนด์" />
                            <datalist id="brand-options">{defaultBrands.map(b => <option key={b} value={b} />)}</datalist>
                        </div>

                        {isComputerGroup && (
                            <>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">ชื่อเครื่อง (Computer Name)</label><input type="text" name="Computer_Name" value={formData.Computer_Name} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg outline-none" placeholder="เช่น IT-PC-01" /></div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">ซีพียู (CPU)</label>
                                <input list="cpu-options" name="CPU" value={formData.CPU} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white" placeholder="เลือกหรือพิมพ์ CPU" />
                                <datalist id="cpu-options">{defaultCPUs.map(c => <option key={c} value={c} />)}</datalist>
                            </div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">หน่วยความจำ (RAM) - GB</label><input type="number" name="RAM" value={formData.RAM} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg" placeholder="เช่น 8, 16" /></div>
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">ระบบปฏิบัติการ (OS)</label>
                                <input list="os-options" name="OS" value={formData.OS} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg outline-none bg-white" placeholder="เลือกหรือพิมพ์ OS" />
                                <datalist id="os-options">{defaultOS.map(o => <option key={o} value={o} />)}</datalist>
                            </div>
                            <div className="md:col-span-2 mt-2">
                                <label className="block text-sm font-medium text-gray-700 mb-2">พื้นที่จัดเก็บข้อมูล (Storage)</label>
                                <div className="space-y-2">
                                {formData.Storage.map((st, index) => (
                                    <div key={index} className="flex space-x-2 items-center">
                                    <select value={st.type} onChange={(e) => handleStorageChange(index, 'type', e.target.value)} className="w-1/3 p-2.5 border border-gray-300 rounded-lg bg-white"><option value="SSD">SSD</option><option value="HDD">HDD</option></select>
                                    <input type="number" value={st.capacity} onChange={(e) => handleStorageChange(index, 'capacity', e.target.value)} placeholder="ความจุ (GB)" className="flex-1 p-2.5 border border-gray-300 rounded-lg" />
                                    {index > 0 && (<button type="button" onClick={() => removeStorage(index)} className="p-2.5 text-red-500 hover:bg-red-50 rounded-lg"><Trash2 size={20}/></button>)}
                                    </div>
                                ))}
                                </div>
                                <button type="button" onClick={addStorage} className="text-sm text-blue-600 font-medium mt-2 flex items-center"><PlusCircle size={16} className="mr-1"/> เพิ่ม Storage</button>
                            </div>
                            </>
                        )}

                        {isNetworkGroup && (<div><label className="block text-sm font-medium text-gray-700 mb-1">จำนวน Port</label><input type="number" name="Port" value={formData.Port} onChange={handleChange} className="w-full p-2.5 border border-gray-300 rounded-lg" placeholder="เช่น 8, 16, 24" /></div>)}
                        </div>
                    </div>
                    )}

                    <div className="pt-6 mt-4 border-t flex justify-end">
                        <button type="submit" disabled={isUploading} className="w-full md:w-auto bg-blue-600 text-white px-8 py-3 rounded-xl font-medium hover:bg-blue-700 shadow-md flex items-center justify-center disabled:opacity-50">
                            <Save className="w-5 h-5 mr-2" /> 
                            {initialData ? "อัปเดตข้อมูล" : "บันทึกข้อมูล"}
                        </button>
                    </div>
                </form>
                </div>
            );
        };

        const EquipmentList = ({ equipments, onEdit, onDelete, onShowQR, onPrintSticker, departments, types, onViewDetail }) => {
            const [filterDept, setFilterDept] = useState('');
            const [filterType, setFilterType] = useState('');
            const [filterStatus, setFilterStatus] = useState('');

            const filteredData = equipments.filter(e => {
                return (filterDept === '' || e.department === filterDept) && (filterType === '' || e.Type === filterType) && (filterStatus === '' || e.Status === filterStatus);
            });

            const getStatusBadge = (status) => {
                switch(status) {
                case 'พร้อมใช้งาน': return <span className="px-2.5 py-1 bg-green-100 text-green-700 rounded-full text-[10px] font-bold flex items-center w-max"><CheckCircle size={12} className="mr-1"/> พร้อมใช้งาน</span>;
                case 'ส่งซ่อม': return <span className="px-2.5 py-1 bg-orange-100 text-orange-700 rounded-full text-[10px] font-bold flex items-center w-max"><Wrench size={12} className="mr-1"/> ส่งซ่อม</span>;
                case 'แทงชำรุด': return <span className="px-2.5 py-1 bg-red-100 text-red-700 rounded-full text-[10px] font-bold flex items-center w-max"><XCircle size={12} className="mr-1"/> แทงชำรุด</span>;
                default: return <span className="px-2.5 py-1 bg-gray-100 text-gray-700 rounded-full text-[10px] font-bold">{status}</span>;
                }
            };

            return (
                <div>
                <div className="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div className="flex items-center text-gray-600 font-medium mr-2"><Filter size={18} className="mr-2"/> กรองข้อมูล:</div>
                    <select value={filterDept} onChange={e => setFilterDept(e.target.value)} className="p-2 border border-gray-300 rounded-lg text-sm bg-white outline-none"><option value="">ทุกหน่วยงาน</option>{departments.map(d => <option key={d.dep_Id} value={d.dep_name}>{d.dep_name}</option>)}</select>
                    <select value={filterType} onChange={e => setFilterType(e.target.value)} className="p-2 border border-gray-300 rounded-lg text-sm bg-white outline-none"><option value="">ทุกชนิดอุปกรณ์</option>{types.map(t => <option key={t.Type_id} value={t.Type_name}>{t.Type_name}</option>)}</select>
                    <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="p-2 border border-gray-300 rounded-lg text-sm bg-white outline-none"><option value="">ทุกสถานะ</option><option value="พร้อมใช้งาน">พร้อมใช้งาน</option><option value="ส่งซ่อม">ส่งซ่อม</option><option value="แทงชำรุด">แทงชำรุด</option></select>
                </div>

                <div className="overflow-x-auto rounded-xl border border-gray-200">
                    <table className="w-full text-left border-collapse min-w-[800px]">
                    <thead className="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                        <tr><th className="p-4 font-semibold w-16">รูป</th><th className="p-4 font-semibold">รหัสระบบ</th><th className="p-4 font-semibold">ชื่อ / ชนิด / เลขรพ.</th><th className="p-4 font-semibold">หน่วยงาน (สถานที่)</th><th className="p-4 font-semibold">สถานะ</th><th className="p-4 font-semibold text-center">จัดการ</th></tr>
                    </thead>
                    <tbody className="text-sm">
                        {filteredData.length === 0 ? (<tr><td colSpan="6" className="p-12 text-center text-gray-500 bg-white">ยังไม่มีข้อมูลในระบบ</td></tr>) : filteredData.slice().reverse().map(eq => (
                        <tr key={eq.Id} onClick={() => onViewDetail(eq)} className="hover:bg-blue-50/50 border-b border-gray-100 bg-white transition cursor-pointer group">
                            <td className="p-4">
                                {eq.Images ? (
                                    <div className="w-12 h-12 rounded-lg border overflow-hidden shadow-sm"><img src={eq.Images} alt="eq" className="w-full h-full object-cover" /></div>
                                ) : (
                                    <div className="w-12 h-12 rounded-lg bg-gray-100 border border-dashed border-gray-300 flex items-center justify-center text-gray-400"><ImageIcon size={20} /></div>
                                )}
                            </td>
                            <td className="p-4 font-bold text-blue-600 font-mono group-hover:underline">{eq.Id}</td>
                            <td className="p-4">
                                <div className="font-bold text-gray-800">{eq.name || '-'}</div>
                                <div className="text-xs text-gray-500 mt-1">{eq.Type} • {eq.Id_equipment}</div>
                            </td>
                            <td className="p-4">
                                <div className="text-gray-700 font-medium">{eq.department}</div>
                                <div className="text-xs text-gray-400 mt-1">{eq.Location || '-'}</div>
                            </td>
                            <td className="p-4">{getStatusBadge(eq.Status)}</td>
                            <td className="p-4 text-right" onClick={(e) => e.stopPropagation()}>
                            <div className="flex justify-end space-x-2">
                                <button onClick={() => onEdit(eq)} className="p-2 bg-yellow-50 text-yellow-600 rounded-lg hover:bg-yellow-100 shadow-sm" title="แก้ไขข้อมูล"><Edit size={16}/></button>
                                <button onClick={() => onShowQR(eq)} className="p-2 bg-pink-50 text-pink-600 rounded-lg hover:bg-pink-100 shadow-sm" title="ดู QR Code"><QrCode size={16}/></button>
                                <button onClick={() => onPrintSticker(eq)} className="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 shadow-sm" title="พิมพ์สติกเกอร์"><Printer size={16}/></button>
                                <button onClick={() => onDelete(eq.Id)} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 shadow-sm" title="ลบข้อมูล"><Trash2 size={16}/></button>
                            </div>
                            </td>
                        </tr>
                        ))}
                    </tbody>
                    </table>
                </div>
                </div>
            );
        };

        const SoftwareManager = ({ softwares, setSoftwares, equipments, apiCall, notify, prefillAsset, setPrefillAsset }) => {
            const [view, setView] = useState('list');
            const [editingItem, setEditingItem] = useState(null);

            useEffect(() => {
                if(prefillAsset) {
                    const existing = softwares.find(sw => sw.Computer_Name === prefillAsset);
                    if(existing) {
                        setEditingItem(existing);
                    } else {
                        setEditingItem({ id: generate5DigitId(softwares, 'id'), Computer_Name: prefillAsset, programs: [], customProgram: '' });
                    }
                    setView('form');
                    setPrefillAsset(null);
                }
            }, [prefillAsset, softwares, setPrefillAsset]);

            const handleSave = async (data) => {
                if (softwares.find(sw => sw.id === data.id)) {
                    const success = await apiCall('Softwares', 'update', data);
                    if (success) {
                        setSoftwares(softwares.map(s => s.id === data.id ? data : s));
                        notify("อัปเดตข้อมูลซอฟต์แวร์สำเร็จ");
                        setView('list');
                        setEditingItem(null);
                    }
                } else {
                    const success = await apiCall('Softwares', 'append', data);
                    if (success) {
                        setSoftwares([...softwares, data]);
                        notify("บันทึกข้อมูลซอฟต์แวร์สำเร็จ");
                        setView('list');
                        setEditingItem(null);
                    }
                }
            };

            const handleEdit = (item) => {
                setEditingItem(item);
                setView('form');
            }

            const handleDelete = async (id) => {
                if(confirm('ยืนยันการลบข้อมูลนี้?')) {
                    const success = await apiCall('Softwares', 'delete', { id: id });
                    if (success) {
                        setSoftwares(softwares.filter(s => s.id !== id));
                        notify("ลบข้อมูลสำเร็จ");
                    }
                }
            };

            return (
                <div className="space-y-4 animate-in fade-in duration-300">
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-2">
                        <h3 className="text-lg font-bold text-gray-800">
                            {view === 'list' ? 'รายการซอฟต์แวร์ประจำเครื่อง' : (editingItem && editingItem.Computer_Name ? `จัดการซอฟต์แวร์: ${editingItem.Computer_Name}` : 'แบบฟอร์มลงทะเบียนซอฟต์แวร์')}
                        </h3>
                        {view === 'list' ? (
                            <button onClick={() => { setEditingItem(null); setView('form'); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700 flex items-center justify-center gap-2 transition">
                                <PlusCircle size={16} /> ลงทะเบียนซอฟต์แวร์ใหม่
                            </button>
                        ) : (
                            <button onClick={() => { setView('list'); setEditingItem(null); }} className="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-gray-50 flex items-center justify-center gap-2 transition">
                                <ArrowLeft size={16} /> กลับหน้ารายการ
                            </button>
                        )}
                    </div>
                    {view === 'list' ? (
                        <SoftwareList softwares={softwares} onEdit={handleEdit} onDelete={handleDelete} />
                    ) : (
                        <SoftwareForm initialData={editingItem} equipments={equipments} onSave={handleSave} currentSoftwares={softwares} />
                    )}
                </div>
            );
        };

        const SoftwareForm = ({ initialData, equipments, onSave, currentSoftwares }) => {
            const pcList = equipments.filter(eq => ["ชุดเครื่องคอมพิวเตอร์", "คอมพิวเตอร์แม่ข่าย", "เครื่องคอมพิวเตอร์", "เครื่องคอมพิวเตอร์พกพา"].some(t=>eq.Type.includes(t)));
            
            const [formData, setFormData] = useState(initialData || { id: generate5DigitId(currentSoftwares, 'id'), Computer_Name: '', programs: [], customProgram: '' });

            useEffect(() => {
                if (initialData) setFormData(initialData);
            }, [initialData]);

            const handleCheck = (prog) => {
                let newProgs = [...formData.programs];
                if (newProgs.includes(prog)) newProgs = newProgs.filter(p => p !== prog); else newProgs.push(prog);
                setFormData({ ...formData, programs: newProgs });
            };

            const addCustomProgram = () => {
                if (formData.customProgram.trim() && !formData.programs.includes(formData.customProgram.trim())) {
                    setFormData({ ...formData, programs: [...formData.programs, formData.customProgram.trim()], customProgram: '' });
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!formData.Computer_Name) return alert('กรุณาเลือกเครื่องคอมพิวเตอร์');
                onSave({ id: formData.id, Computer_Name: formData.Computer_Name, programs: formData.programs });
            };

            return (
                <div className="max-w-3xl bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">เลือกเครื่องคอมพิวเตอร์ <span className="text-red-500">*</span></label>
                    <select value={formData.Computer_Name} onChange={(e) => setFormData({...formData, Computer_Name: e.target.value})} className="w-full p-3 border border-gray-300 rounded-xl outline-none bg-white" required disabled={initialData && initialData.Computer_Name !== ''}>
                        <option value="">-- เลือกจากฐานข้อมูลครุภัณฑ์ --</option>
                        {pcList.map(pc => <option key={pc.Id} value={pc.Id}>{pc.Id} - {pc.name || pc.Type} ({pc.department})</option>)}
                    </select>
                    {pcList.length === 0 && <p className="text-sm text-red-500 mt-2 flex items-center"><XCircle size={14} className="mr-1"/> ไม่มีข้อมูลคอมพิวเตอร์ในระบบ กรุณาลงทะเบียนครุภัณฑ์ก่อน</p>}
                    </div>

                    <div>
                    <label className="block text-sm font-medium text-gray-700 mb-3">โปรแกรมหลัก (Checklist)</label>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 bg-slate-50 p-5 rounded-xl border border-slate-100">
                        {defaultSoftware.map(prog => (
                        <label key={prog} className="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-slate-100">
                            <input type="checkbox" checked={formData.programs.includes(prog)} onChange={() => handleCheck(prog)} className="w-5 h-5 text-blue-600 rounded border-gray-300" />
                            <span className="text-gray-700 font-medium">{prog}</span>
                        </label>
                        ))}
                    </div>
                    </div>

                    <div>

        function RepairForm({ notify, apiCall, tickets, setTickets, departments, equipments = [], prefillAsset, setPrefillAsset }) {
            const [description, setDescription] = useState('');
            const [aiAdviceModal, setAiAdviceModal] = useState({ isOpen: false, text: '', isError: false });
            const [aiAdviceInlineError, setAiAdviceInlineError] = useState(null);
            const [isAnalyzingAdvice, setIsAnalyzingAdvice] = useState(false);

            const [urgency, setUrgency] = useState("ทั่วไป");
            const [urgencyReason, setUrgencyReason] = useState("");
            const [isAnalyzingUrgency, setIsAnalyzingUrgency] = useState(false);
            
            const [selectedDevice, setSelectedDevice] = useState('Hardware');
            const [assetId, setAssetId] = useState('');
            const [filteredEqs, setFilteredEqs] = useState([]);
            const [showEqSuggestions, setShowEqSuggestions] = useState(false);
            const [showScanner, setShowScanner] = useState(false);

            useEffect(() => {
                if(prefillAsset) {
                    setAssetId(prefillAsset);
                    setPrefillAsset(null); 
                }
            }, [prefillAsset, setPrefillAsset]);

            const handleAssetIdChange = (e) => {
                const val = e.target.value;
                setAssetId(val);
                if (val.trim() === '') {
                    setShowEqSuggestions(false);
                } else {
                    const matches = equipments.filter(eq => 
                        (eq.Id_equipment && eq.Id_equipment.toLowerCase().includes(val.toLowerCase())) ||
                        (eq.name && eq.name.toLowerCase().includes(val.toLowerCase())) ||
                        (eq.Id && eq.Id.toLowerCase().includes(val.toLowerCase()))
                    ).slice(0, 5); 
                    setFilteredEqs(matches);
                    setShowEqSuggestions(true);
                }
            };

            const selectEquipment = (eq) => {
                setAssetId(eq.Id_equipment || eq.Id);
                setShowEqSuggestions(false);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const form = e.target;
                const ticketData = {
                    Ticket_ID: generateTicketId(tickets),
                    Type: "แจ้งซ่อม",
                    Requester: form.requester.value,
                    Department: form.department.value,
                    Asset_ID: assetId || "-",
                    Device_Type: selectedDevice,
                    Description: description,
                    Urgency: urgency,
                    Status: "Pending",
                    Assignee: "-",
                    Device_Status: "-",
                    Repair: "-",
                    Reason: "-",
                    Buy: "[]",
                    Cost: 0,
                    Estimate: "-",
                    Created_At: new Date().toLocaleString('th-TH'),
                    Finished_At: "-"
                };

                const success = await apiCall('Tickets', 'append', ticketData);
                if(success) {
                    setTickets([...tickets, ticketData]);
                    notify(`ส่งเรื่องแจ้งซ่อมสำเร็จ (Ticket ID: ${ticketData.Ticket_ID})`);
                    form.reset();
                    setDescription('');
                    setAssetId('');
                    setUrgency('ทั่วไป');
                    setUrgencyReason('');
                }
            };

            const handleScanQR = (scannedText) => {
                setAssetId(scannedText);
                setShowScanner(false);
                setShowEqSuggestions(false);
            };

            const handleGetAdvice = async () => {
                if (!description.trim()) return alert("กรุณาระบุรายละเอียดปัญหาก่อนขอคำแนะนำ");
                setIsAnalyzingAdvice(true); 
                setAiAdviceInlineError(null);
                
                try {
                    const response = await apiCall('Tickets', 'getAIAdvice', {
                        description: description,
                        deviceType: selectedDevice
                    });
                    
                    if (response && response.text) {
                        if(response.text.includes("ขัดข้อง") || response.text.includes("กำลังปรับปรุง") || response.text.includes("Error")) {
                            setAiAdviceInlineError(response.text);
                        } else {
                            setAiAdviceModal({ isOpen: true, text: response.text, isError: false });
                        }
                    } else {
                        setAiAdviceInlineError("ไม่สามารถเชื่อมต่อ AI ได้ในขณะนี้ แนะนำให้กดส่งเรื่องแจ้งซ่อมเพื่อให้ช่างตรวจสอบครับ");
                    }
                } catch (error) {
                    setAiAdviceInlineError("ระบบ AI เกิดข้อผิดพลาดในการเชื่อมต่อ แนะนำให้ส่งเรื่องแจ้งซ่อมได้เลยครับ");
                } finally {
                    setIsAnalyzingAdvice(false);
                }
            };

            const handleGetUrgencyAI = async () => {
                if (!description.trim()) return alert("กรุณาระบุรายละเอียดปัญหาก่อนให้ AI ประเมินความเร่งด่วน");
                setIsAnalyzingUrgency(true);
                setUrgencyReason("");
                
                try {
                    const response = await apiCall('Tickets', 'getAIUrgency', { description: description });
                    
                    if (response && response.data && response.status === 'success') {
                        let level = response.data.level;
                        if(level.includes("วิกฤต")) setUrgency("วิกฤต");
                        else if(level.includes("เร่งด่วน")) setUrgency("เร่งด่วน");
                        else setUrgency("ทั่วไป");

                        setUrgencyReason(response.data.reason);
                    } else {
                        setUrgencyReason("AI ไม่สามารถประเมินได้ในขณะนี้ กรุณาเลือกด้วยตนเอง");
                    }
                } catch (error) {
                    setUrgencyReason("เกิดข้อผิดพลาดในการเชื่อมต่อ AI");
                } finally {
                    setIsAnalyzingUrgency(false);
                }
            };

            return (
                <div className="max-w-3xl bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-in fade-in duration-300">
                <div className="bg-blue-600 px-4 md:px-8 py-5 text-white flex items-center gap-3 -mx-4 -mt-4 md:-mx-8 md:-mt-8 mb-6"><Wrench className="w-6 h-6 text-blue-200" /><h2 className="text-xl font-bold">แจ้งปัญหา / ส่งซ่อม IT</h2></div>
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-1.5"><label className="text-sm font-bold text-slate-700">ชื่อผู้แจ้ง <span className="text-red-500">*</span></label><input type="text" name="requester" className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500" required /></div>
                    <div className="space-y-1.5">
                        <label className="text-sm font-bold text-slate-700">หน่วยงาน <span className="text-red-500">*</span></label>
                        <select name="department" className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm outline-none bg-white" required>
                            <option value="">-- เลือกหน่วยงาน --</option>
                            {departments.map(d => <option key={d.dep_Id} value={d.dep_name}>{d.dep_name}</option>)}
                        </select>
                    </div>

            const form = e.target;
            const ticketData = {
                Ticket_ID: generateTicketId(tickets),
                Type: "ขอข้อมูล/รายงาน",
                Requester: form.requester.value,
                Department: form.department.value,

                Urgency: "ทั่วไป",
                Status: "Pending",
                Assignee: "-",
                Device_Status: "-", Repair: "-", Reason: "-", Buy: "[]", Cost: 0, Estimate: "-", Finished_At: "-",
                Created_At: new Date().toLocaleString('th-TH')
            };

            const success = await apiCall('Tickets', 'append', ticketData);

    const TicketUpdateModal = ({ ticket, onClose, onSave }) => {
        const [status, setStatus] = useState(ticket.Status || 'Pending');
        const [deviceStatus, setDeviceStatus] = useState((ticket.Device_Status && ticket.Device_Status !== "-") ? ticket.Device_Status : "พร้อมใช้งาน");
        const [repair, setRepair] = useState((ticket.Repair && ticket.Repair !== "-") ? ticket.Repair : "");
        const [reason, setReason] = useState((ticket.Reason && ticket.Reason !== "-") ? ticket.Reason : "");
        const [estimate, setEstimate] = useState((ticket.Estimate && ticket.Estimate !== "-") ? ticket.Estimate : "");
        
        let initialBuyItems = [];
        if (typeof ticket.Buy === 'string') {
            initialBuyItems = safeJsonParse(ticket.Buy, []);
        } else if (Array.isArray(ticket.Buy)) {
            initialBuyItems = ticket.Buy;
        }
        const [buyItems, setBuyItems] = useState(initialBuyItems);

        const handleAddBuyItem = () => setBuyItems([...buyItems, { item: '', price: 0 }]);
        const handleBuyChange = (index, field, value) => {
            const newItems = [...buyItems];
            newItems[index][field] = value;
            setBuyItems(newItems);
        };
        const handleRemoveBuyItem = (index) => setBuyItems(buyItems.filter((_, i) => i !== index));

        const totalCost = buyItems.reduce((sum, current) => sum + Number(current.price || 0), 0);

        const handleSave = () => {
            const updatedTicket = {
                ...ticket,
                Status: status,
                Device_Status: deviceStatus,
                Repair: repair || "-",
                Reason: reason || "-",
                Buy: JSON.stringify(buyItems),
                Cost: totalCost,
                Estimate: estimate || "-",
                Finished_At: status === "Completed" ? new Date().toLocaleString('th-TH') : ticket.Finished_At
            };
            onSave(updatedTicket);
        };

        return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] backdrop-blur-sm p-4">
                <div className="bg-white rounded-2xl shadow-2xl flex flex-col w-full max-w-2xl max-h-[90vh]">
                    <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                        <div>
                            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Edit className="text-blue-600"/> อัปเดตใบงาน {ticket.Ticket_ID}</h3>
                            <p className="text-sm text-slate-500 mt-1">{(ticket.Description || '').split('\n')[0]}</p>
                        </div>
