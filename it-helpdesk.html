<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawee IT Service & Helpdesk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18",
                "react-dom/client": "https://esm.sh/react-dom@18/client",
                "lucide-react": "https://esm.sh/lucide-react@0.344.0"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { margin: 0; padding: 0; }
        
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { position: absolute; left: 0; top: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Monitor, LayoutDashboard, Settings, Server, PlusCircle, 
            List, QrCode, Trash2, CheckCircle, XCircle, Wrench,
            Search, Filter, AppWindow, Loader2, RefreshCw, Save,
            Sparkles, Bot, Wifi, MessageSquare, Send, AlertTriangle, 
            Clock, FileText, BarChart3, Database, Users, HardDrive, 
            Layout, Zap, X, ChevronRight, Activity, Printer, Package, 
            Edit, UserPlus, ArrowLeft, CheckSquare, ShieldCheck, Image as ImageIcon, Camera, ScanLine, LayoutList, Calendar
        } from 'lucide-react';

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhmXHiFWbKcIbrQyNh800vbvoEcckcatqpywN1et4L14I7kXXT1Hel-U5kSLZaAS9_/exec';

        const defaultBrands = ["HP", "Dell", "Lenovo", "Asus", "Acer", "Apple", "Cisco", "TP-Link", "Epson", "Canon", "Brother", "APC", "Syndome", "Logitech", "Other"];
        const defaultCPUs = ["Intel Core i3", "Intel Core i5", "Intel Core i7", "Intel Core i9", "AMD Ryzen 3", "AMD Ryzen 5", "AMD Ryzen 7", "AMD Ryzen 9", "Apple M1", "Apple M2", "Other"];
        const defaultOS = ["Windows 10 Pro", "Windows 11 Pro", "Windows 10 Home", "Windows 11 Home", "macOS", "Linux Ubuntu", "Windows Server 2019", "Windows Server 2022"];
        const defaultSoftware = ["HOSxP", "Word", "Excel", "PowerPoint", "LINE"];
        const colorPalette = ["bg-blue-500", "bg-purple-500", "bg-emerald-500", "bg-orange-500", "bg-pink-500", "bg-indigo-500", "bg-rose-500", "bg-cyan-500"];

        const generate5DigitId = (currentList, idKey) => {
            if (!Array.isArray(currentList) || currentList.length === 0) return "00001";
            const maxId = Math.max(...currentList.map(item => parseInt(item[idKey], 10) || 0));
            return String(maxId + 1).padStart(5, '0');
        };

        const generateTicketId = () => `TK-${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}-${Math.floor(Math.random() * 10000).toString().padStart(4,'0')}`;

        const getTypePrefix = (typeName) => {
            if(!typeName) return "EQP";
            if(typeName.includes("คอม") || typeName.toUpperCase().includes("COM")) return "COM";
            if(typeName.includes("ปริ้น") || typeName.toUpperCase().includes("PRN")) return "PRN";
            if(typeName.includes("เน็ต") || typeName.includes("สวิตซ์") || typeName.toUpperCase().includes("NET")) return "NET";
            if(typeName.includes("เซิร์ฟ") || typeName.toUpperCase().includes("SRV")) return "SRV";
            const engMatch = typeName.match(/[A-Za-z]{3}/);
            if(engMatch) return engMatch[0].toUpperCase();
            return typeName.substring(0, 3).toUpperCase();
        };

        const generateEquipmentId = (typeName, currentEquipments) => {
            const prefix = getTypePrefix(typeName);
            const count = currentEquipments.filter(e => e.Id && e.Id.startsWith(prefix)).length + 1;
            return `${prefix}-${String(count).padStart(4, '0')}`;
        };

        const safeJsonParse = (str, fallback) => {
            if (!str) return fallback;
            try {
                return JSON.parse(str);
            } catch (e) {
                console.warn("Failed to parse JSON:", str, e);
                return fallback;
            }
        };

        // Component สำหรับ Scanner QR Code
        const QRScannerModal = ({ onScan, onClose }) => {
            useEffect(() => {
                const scanner = new window.Html5QrcodeScanner(
                    "qr-reader",
                    { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 },
                    /* verbose= */ false
                );
                scanner.render(
                    (decodedText) => {
                        onScan(decodedText);
                        scanner.clear();
                    },
                    (error) => {}
                );
                return () => {
                    scanner.clear().catch(error => console.error("Failed to clear scanner", error));
                };
            }, [onScan]);

            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] backdrop-blur-sm p-4">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl flex flex-col w-full max-w-md">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold flex items-center gap-2"><ScanLine className="text-blue-600"/> สแกน QR Code ครุภัณฑ์</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-100 text-gray-500 hover:bg-gray-200 rounded-lg transition"><X size={20}/></button>
                        </div>
                        <div id="qr-reader" className="w-full rounded-xl overflow-hidden border-2 border-dashed border-gray-300"></div>
                        <button onClick={onClose} className="mt-6 px-4 py-3 bg-gray-200 text-gray-800 rounded-xl hover:bg-gray-300 w-full font-bold transition">ยกเลิกการสแกน</button>
                    </div>
                </div>
            );
        };

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get('action') === 'admin';

            const [activeTab, setActiveTab] = useState(isAdmin ? 'dashboard' : 'repair');
            const [showNotification, setShowNotification] = useState(false);
            const [notificationMsg, setNotificationMsg] = useState("");

            const [departments, setDepartments] = useState([]);
            const [types, setTypes] = useState([]);
            const [equipments, setEquipments] = useState([]);
            const [softwares, setSoftwares] = useState([]);
            const [tickets, setTickets] = useState([]); 
            const [staffList, setStaffList] = useState([]); 

            const [qrModal, setQrModal] = useState({ isOpen: false, data: null });
            const [aiModal, setAiModal] = useState({ isOpen: false, data: null, result: '', loading: false });
            const [isLoading, setIsLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);
            const [apiError, setApiError] = useState(null);

            const handleNotify = (msg) => {
                setNotificationMsg(msg);
                setShowNotification(true);
                setTimeout(() => setShowNotification(false), 3000);
            };

            const fetchAllData = async () => {
                setIsLoading(true);
                setApiError(null);
                try {
                    const getOptions = { method: 'GET', redirect: 'follow' };
                    const [eqRes, swRes, depRes, typeRes, ticketsRes, staffRes] = await Promise.all([
                        fetch(`${SCRIPT_URL}?sheet=Equipments`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Softwares`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Departments`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Types`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Tickets`, getOptions).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?sheet=Staff`, getOptions).then(r => r.json())
                    ]);

                    setEquipments(Array.isArray(eqRes) ? eqRes.map(e => ({...e, Storage: typeof e.Storage === 'string' ? safeJsonParse(e.Storage, []) : (e.Storage || [])})) : []);
                    setSoftwares(Array.isArray(swRes) ? swRes.map(s => ({...s, programs: typeof s.programs === 'string' ? safeJsonParse(s.programs, []) : (s.programs || [])})) : []);
                    setDepartments(Array.isArray(depRes) ? depRes : []);
                    setTypes(Array.isArray(typeRes) ? typeRes : []);
                    setTickets(Array.isArray(ticketsRes) ? ticketsRes : []);
                    setStaffList(Array.isArray(staffRes) ? staffRes : []);

                } catch (error) {
                    console.error("Error fetching data:", error);
                    setApiError("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้ โปรดลองใหม่อีกครั้ง");
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { fetchAllData(); }, []);

            const apiCall = async (sheetName, action, payload) => {
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        redirect: 'follow', 
                        body: JSON.stringify({ sheetName, action, payload }) 
                    });
                    const result = await response.json();
                    
                    if (result.status !== 'success') {
                        throw new Error(result.message || "เกิดข้อผิดพลาดในการบันทึกข้อมูล");
                    }
                    return result;
                } catch (error) {
                    console.error("API Error:", error);
                    alert("ข้อผิดพลาดระบบ\n\n" + error.message);
                    throw error; 
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleAIAnalysis = async (equipment) => {
                setAiModal({ isOpen: true, data: equipment, result: '', loading: true });
                setTimeout(() => {
                    setAiModal(prev => ({ 
                        ...prev, 
                        result: "AI จำเป็นต้องใช้ API Key ของ Google Gemini เพื่อวิเคราะห์ข้อมูลจริง\n(จำลอง) อุปกรณ์นี้สเปคยังเพียงพอสำหรับการทำงานออฟฟิศทั่วไป แนะนำให้อัปเกรด RAM เป็น 16GB หากต้องเปิดหลายหน้าต่าง", 
                        loading: false 
                    }));
                }, 1500);
            };

            const printSticker = (item) => {
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${item.Id}&margin=0`; // QR สร้างจากระบบ Auto ID (COM-XXXX)
                
                const printWindow = window.open('', '_blank', 'width=400,height=300');
                printWindow.document.write(`
                    <html>
                    <head>
                        <title>Print Sticker</title>
                        <style>
                            @page { margin: 0; size: 6cm 2.5cm; }
                            body { 
                                margin: 0; padding: 0; 
                                width: 6cm; height: 2.5cm; 
                                font-family: 'Sarabun', sans-serif;
                                display: flex;
                                background: white;
                            }
                            .sticker-container {
                                width: 100%; height: 100%;
                                display: flex;
                                box-sizing: border-box;
                                padding: 2px 4px;
                                gap: 6px;
                                border: 1px dashed #ccc; 
                            }
                            .qr-section {
                                width: 1.8cm;
                                display: flex;
                                flex-direction: column;
                                justify-content: center;
                                align-items: center;
                            }
                            .qr-img {
                                width: 1.6cm;
                                height: 1.6cm;
                            }
                            .qr-code-text {
                                font-size: 7.5px;
                                font-weight: bold;
                                margin-top: 1px;
                                text-align: center;
                            }
                            .detail-section {
                                flex: 1;
                                display: flex;
                                flex-direction: column;
                                justify-content: center;
                                line-height: 1.3;
                                overflow: hidden;
                            }
                            .eq-name {
                                font-size: 13px; 
                                font-weight: bold;
                                color: #000;
                                white-space: nowrap;
                                overflow: hidden;
                                text-overflow: ellipsis;
                                margin-bottom: 2px;
                            }
                            .eq-dept, .eq-date {
                                font-size: 8.5px;
                                color: #333;
                                white-space: nowrap;
                                overflow: hidden;
                                text-overflow: ellipsis;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="sticker-container">
                            <div class="qr-section">
                                <img src="${qrUrl}" class="qr-img" />
                                <div class="qr-code-text">${item.Id}</div>
                            </div>
                            <div class="detail-section">
                                <div class="eq-name">${item.name || item.Type}</div>
                                <div class="eq-dept">หน่วยงาน: ${item.department || '-'}</div>
                                <div class="eq-date">วันที่: ${item.Date || '-'}</div>
                            </div>
                        </div>
                        <script>
                            window.onload = function() {
                                setTimeout(function() {
                                    window.print();
                                    window.close();
                                }, 500);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            };

            if (isLoading) {
                return (
                <div className="flex h-screen w-full items-center justify-center bg-gray-50 flex-col">
                    <Loader2 className="w-12 h-12 text-blue-600 animate-spin mb-4" />
                    <h2 className="text-xl font-semibold text-gray-700">กำลังโหลดข้อมูลระบบ...</h2>
                </div>
                );
            }

            return (
                <div className="flex h-screen bg-gray-100 font-sans relative">
                
                {isSyncing && (
                    <div className="absolute inset-0 z-50 bg-white/60 backdrop-blur-sm flex items-center justify-center">
                    <div className="bg-white p-4 rounded-xl shadow-lg flex items-center space-x-3 border border-blue-100">
                        <RefreshCw className="w-6 h-6 text-blue-600 animate-spin" />
                        <span className="font-medium text-gray-700">กำลังอัปเดตข้อมูลระบบ...</span>
                    </div>
                    </div>
                )}

                {/* Sidebar */}
                <div className="w-64 bg-slate-800 text-white flex flex-col shadow-xl z-10 flex-shrink-0">
                    <div className="p-5 flex items-center justify-between border-b border-slate-700">
                        <div className="flex items-center space-x-3">
                            <Server className="w-8 h-8 text-blue-400" />
                            <h1 className="text-lg font-bold tracking-wide">IT Service Center</h1>
                        </div>
                    </div>
                    <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto custom-scrollbar">
                        
                        {isAdmin && (
                            <>
                                <SidebarItem icon={<LayoutDashboard size={20} />} label="Dashboard" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                                <SidebarItem icon={<Monitor size={20} />} label="จัดการครุภัณฑ์" active={activeTab === 'equipments'} onClick={() => setActiveTab('equipments')} />
                                <SidebarItem icon={<AppWindow size={20} />} label="จัดการซอฟต์แวร์" active={activeTab === 'softwares'} onClick={() => setActiveTab('softwares')} />
                                
                                <div className="my-4 border-t border-slate-700"></div>
                                <div className="px-4 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Helpdesk Service</div>
                            </>
                        )}

                        <SidebarItem icon={<Wrench size={20} />} label="แจ้งซ่อม IT" active={activeTab === 'repair'} onClick={() => setActiveTab('repair')} />
                        <SidebarItem icon={<Database size={20} />} label="ขอข้อมูล / รายงาน" active={activeTab === 'data_request'} onClick={() => setActiveTab('data_request')} />
                        <SidebarItem icon={<LayoutList size={20} />} label="ติดตามสถานะงาน" active={activeTab === 'ticket_tracking'} onClick={() => setActiveTab('ticket_tracking')} />
                        
                        {isAdmin && (
                            <>
                                <SidebarItem icon={<Users size={20} />} label="Admin Workload" active={activeTab === 'admin_workload'} onClick={() => setActiveTab('admin_workload')} />
                                <div className="my-4 border-t border-slate-700"></div>
                                <SidebarItem icon={<Settings size={20} />} label="ตั้งค่าระบบ / พนักงาน" active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
                            </>
                        )}
                    </nav>
                    
                    {!isAdmin && (
                        <div className="p-4 border-t border-slate-700 text-center">
                            <p className="text-xs text-slate-400">ระบบบริการผู้ใช้งาน</p>
                        </div>
                    )}
                </div>

                {/* Main Content */}
                <div className="flex-1 flex flex-col overflow-hidden">
                    <header className="bg-white shadow-sm h-16 flex items-center px-8 justify-between z-0 relative flex-shrink-0">
                        <h2 className="text-xl font-semibold text-gray-800">
                            {activeTab === 'dashboard' && 'ภาพรวมระบบ (Dashboard)'}
                            {activeTab === 'equipments' && 'จัดการครุภัณฑ์คอมพิวเตอร์ (ทะเบียน/เพิ่มข้อมูล)'}
                            {activeTab === 'softwares' && 'จัดการระบบซอฟต์แวร์'}
                            {activeTab === 'repair' && 'แบบฟอร์มแจ้งปัญหา / ส่งซ่อม'}
                            {activeTab === 'data_request' && 'แบบฟอร์มขอข้อมูล / รายงาน'}
                            {activeTab === 'ticket_tracking' && 'ติดตามสถานะงานแจ้งซ่อม / ขอข้อมูล'}
                            {activeTab === 'admin_workload' && 'กระดานบริหารงานทีม IT'}
                            {activeTab === 'settings' && 'ตั้งค่าข้อมูลพื้นฐาน และ พนักงาน IT'}
                        </h2>
                        <button onClick={fetchAllData} className="flex items-center text-sm text-gray-500 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
                            <RefreshCw size={16} className="mr-2" /> รีเฟรชข้อมูล
                        </button>
                    </header>
                    
                    {apiError && (
                        <div className="bg-red-50 border-l-4 border-red-500 p-4 mx-8 mt-6 rounded-lg shadow-sm flex-shrink-0">
                            <h3 className="text-red-800 font-bold flex items-center"><XCircle size={18} className="mr-2"/> การเชื่อมต่อขัดข้อง</h3>
                            <p className="text-red-700 text-sm mt-2">{apiError}</p>
                        </div>
                    )}

                    <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8 custom-scrollbar">
                        {activeTab === 'dashboard' && isAdmin && <DashboardView equipments={equipments} />}
                        
                        {activeTab === 'equipments' && isAdmin && <EquipmentManager 
                            equipments={equipments} setEquipments={setEquipments}
                            departments={departments} types={types} apiCall={apiCall}
                            onPrintSticker={printSticker}
                            onShowQR={(data) => setQrModal({ isOpen: true, data })}
                            onAIAnalyze={handleAIAnalysis} notify={handleNotify}
                        />}
                        
                        {activeTab === 'softwares' && isAdmin && <SoftwareManager 
                            softwares={softwares} setSoftwares={setSoftwares}
                            equipments={equipments} apiCall={apiCall} notify={handleNotify}
                        />}
                        
                        {activeTab === 'repair' && <RepairForm notify={handleNotify} apiCall={apiCall} tickets={tickets} setTickets={setTickets} departments={departments} />}
                        {activeTab === 'data_request' && <DataQueryForm notify={handleNotify} apiCall={apiCall} tickets={tickets} setTickets={setTickets} departments={departments} />}
                        {activeTab === 'ticket_tracking' && <TicketTracker tickets={tickets} departments={departments} />}
                        
                        {activeTab === 'admin_workload' && isAdmin && <StaffWorkload notify={handleNotify} apiCall={apiCall} tickets={tickets} setTickets={setTickets} staffList={staffList} equipments={equipments} />}
                        {activeTab === 'settings' && isAdmin && <SettingsView departments={departments} setDepartments={setDepartments} types={types} setTypes={setTypes} staffList={staffList} setStaffList={setStaffList} apiCall={apiCall} notify={handleNotify} />}
                    </main>
                </div>

                {/* QR Code Modal (for printing) */}
                {qrModal.isOpen && (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 backdrop-blur-sm">
                        <div className="bg-white p-8 rounded-xl shadow-2xl flex flex-col items-center max-w-sm w-full">
                            <h3 className="text-lg font-bold mb-4">QR Code สำหรับพิมพ์</h3>
                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrModal.data?.Id}`} alt="QR Code" className="mb-4 border p-2 rounded" />
                            <p className="font-semibold text-gray-700 text-lg">{qrModal.data?.Id}</p>
                            <p className="text-sm text-gray-500 mb-6">{qrModal.data?.Type} - {qrModal.data?.Computer_Name || qrModal.data?.Brand}</p>
                            <button onClick={() => setQrModal({ isOpen: false, data: null })} className="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 w-full font-medium transition-colors">ปิดหน้าต่าง</button>
                        </div>
                    </div>
                )}

                {/* AI Modal */}
                {aiModal.isOpen && (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 backdrop-blur-sm p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl flex flex-col max-w-lg w-full max-h-[90vh]">
                            <div className="flex items-center space-x-3 mb-6 border-b pb-4 border-gray-100">
                            <div className="bg-purple-100 p-3 rounded-full text-purple-600 shadow-sm"><Sparkles size={24} /></div>
                            <div>
                                <h3 className="text-xl font-bold text-gray-800">✨ AI วิเคราะห์สเปคอุปกรณ์</h3>
                                <p className="text-sm text-gray-500 font-medium mt-0.5">{aiModal.data?.Computer_Name || aiModal.data?.Brand}</p>
                            </div>
                            </div>
                            <div className="flex-1 overflow-y-auto mb-6 pr-2 custom-scrollbar">
                                {aiModal.loading ? (
                                    <div className="flex flex-col items-center justify-center py-12"><Loader2 className="w-12 h-12 text-purple-400 animate-spin" /><p className="mt-4 text-gray-600 font-medium animate-pulse">กำลังวิเคราะห์...</p></div>
                                ) : (
                                    <div className="text-sm text-gray-700 bg-gradient-to-br from-purple-50 to-fuchsia-50 p-6 rounded-xl border border-purple-100 whitespace-pre-line shadow-inner">{aiModal.result}</div>
                                )}
                            </div>
                            <button onClick={() => setAiModal({ isOpen: false, data: null, result: '', loading: false })} className="px-4 py-3 bg-gray-100 text-gray-800 rounded-xl hover:bg-gray-200 w-full font-semibold transition-colors">ปิดหน้าต่าง</button>
                        </div>
                    </div>
                )}

                {/* Notification */}
                {showNotification && (

                    const img = new Image();
                    img.src = event.target.result;

                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

                        uploadToDrive(compressedBase64, file.name);

                                <p className="text-xs text-gray-400 mt-2">รองรับการถ่ายรูปจากมือถือ หรืออัปโหลดไฟล์ ระบบจะย่อขนาดให้อัตโนมัติและเก็บบนคลาวด์</p>

                if (formData.customProgram.trim() && !formData.programs.includes(formData.customProgram.trim())) {

            const pending = filteredTickets.filter(t => t.Status === 'Pending');
            const inProgress = filteredTickets.filter(t => t.Status === 'In Progress');
            const completed = filteredTickets.filter(t => t.Status === 'Completed');

            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><LayoutList className="text-blue-600"/> กระดานติดตามสถานะงาน</h2>
                        <select value={filterDept} onChange={e => setFilterDept(e.target.value)} className="p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-500 w-full sm:w-64 bg-slate-50 cursor-pointer">
                            <option value="">-- ดูทุกหน่วยงาน --</option>
                            {departments.map(d => <option key={d.dep_Id} value={d.dep_name}>{d.dep_name}</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <TicketColumn title="รอดำเนินการ (Pending)" tickets={pending} bgColor="bg-orange-50" borderColor="border-orange-200" titleColor="text-orange-800" icon={<AlertTriangle size={18}/>} />
                        <TicketColumn title="กำลังดำเนินการ (In Progress)" tickets={inProgress} bgColor="bg-blue-50" borderColor="border-blue-200" titleColor="text-blue-800" icon={<RefreshCw size={18} className="animate-spin-slow"/>} />
                        <TicketColumn title="เสร็จสิ้น (Completed)" tickets={completed} bgColor="bg-emerald-50" borderColor="border-emerald-200" titleColor="text-emerald-800" icon={<CheckCircle size={18}/>} />
                    </div>
                </div>
            );
        }

        function TicketColumn({ title, tickets, bgColor, borderColor, titleColor, icon }) {
            return (
                <div className={`rounded-2xl border ${borderColor} flex flex-col h-full overflow-hidden bg-white shadow-sm`}>
                    <div className={`p-4 ${bgColor} border-b ${borderColor} flex justify-between items-center`}>
                        <h3 className={`font-bold flex items-center gap-2 ${titleColor}`}>{icon} {title}</h3>
                        <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold bg-white shadow-sm ${titleColor}`}>{tickets.length}</span>
                    </div>
                    <div className="p-4 flex-1 overflow-y-auto space-y-3 bg-slate-50/50 max-h-[600px] custom-scrollbar">
                        {tickets.length === 0 ? (
                            <div className="text-center text-slate-400 py-8 text-sm">ไม่มีข้อมูล</div>
                        ) : (
                            tickets.slice().reverse().map(t => (
                                <div key={t.Ticket_ID} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition relative">
                                    <div className="flex justify-between items-start mb-2">
                                        <span className="text-[10px] font-mono text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">{t.Ticket_ID}</span>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${t.Urgency === 'วิกฤต' ? 'bg-rose-100 text-rose-600' : t.Urgency === 'เร่งด่วน' ? 'bg-orange-100 text-orange-600' : 'bg-slate-100 text-slate-600'}`}>{t.Urgency}</span>
                                    </div>
                                    <h4 className="font-bold text-sm text-slate-800 mb-1">{t.Type}</h4>
                                    <p className="text-xs text-slate-600 line-clamp-2 mb-3">{t.Description.split('\n')[0]}</p>
                                    <div className="flex justify-between items-end border-t border-slate-100 pt-2 mt-2">
                                        <div>
                                            <p className="text-[10px] text-slate-500 font-medium">{t.Requester}</p>
                                            <p className="text-[10px] text-slate-400 truncate w-32">{t.Department}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[10px] text-slate-400 flex items-center gap-1 justify-end"><Clock size={10}/> {t.Created_At.split(' ')[0]}</p>
                                            <p className="text-[10px] font-bold text-indigo-600 mt-0.5 whitespace-nowrap">ช่าง: {t.Assignee !== '-' ? t.Assignee : 'รอรับงาน'}</p>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        function StaffWorkload({ notify, apiCall, tickets, setTickets, staffList, equipments }) {
            const unassignedTickets = tickets.filter(t => t.Assignee === "-" || !t.Assignee);
            const activeTickets = tickets.filter(t => t.Assignee !== "-" && t.Status !== "Completed");
            const completedTickets = tickets.filter(t => t.Status === "Completed");

            const [selectedTicketForUpdate, setSelectedTicketForUpdate] = useState(null);

            const staffWorkloads = staffList.map(staff => {
                const myActive = tickets.filter(t => t.Assignee === staff.Name && t.Status === "In Progress").length;
                const myQueue = tickets.filter(t => t.Assignee === staff.Name && t.Status === "Pending").length;
                const myCompleted = tickets.filter(t => t.Assignee === staff.Name && t.Status === "Completed").length;
                return {
                    ...staff,
                    activeJobs: myActive,
                    queue: myQueue,
                    completed: myCompleted,
                    status: (myActive + myQueue) > 0 ? "Busy" : "Available"
                };
            });

            const handleAssign = async (staffName, ticket) => {
                const updatedTicket = { ...ticket, Assignee: staffName, Status: "Pending" };
                const success = await apiCall('Tickets', 'update', updatedTicket);
                if(success) {
                    setTickets(tickets.map(t => t.Ticket_ID === ticket.Ticket_ID ? updatedTicket : t));
                    notify(`มอบหมายงาน ${ticket.Ticket_ID} ให้คุณ ${staffName} เรียบร้อย`);
                }
            };

            const handleSaveUpdate = async (updatedTicket) => {
                const success = await apiCall('Tickets', 'update', updatedTicket);
                if(success) {
                    setTickets(tickets.map(t => t.Ticket_ID === updatedTicket.Ticket_ID ? updatedTicket : t));
                    notify(`อัปเดตใบงาน ${updatedTicket.Ticket_ID} เรียบร้อย`);
                    
                    // หากมีการอัปเดต Device_Status ให้ไปอัปเดตในตาราง Equipments ด้วยแบบเนียนๆ
                    if (updatedTicket.Asset_ID && updatedTicket.Asset_ID !== "-") {
                        const eqToUpdate = equipments.find(e => e.Id === updatedTicket.Asset_ID || e.Id_equipment === updatedTicket.Asset_ID);
                        if (eqToUpdate && eqToUpdate.Status !== updatedTicket.Device_Status) {
                            await apiCall('Equipments', 'update', { ...eqToUpdate, Status: updatedTicket.Device_Status });
                            // แจ้งเตือนเงียบๆ ใน console ก็พอเพื่อไม่ให้ UI รก
                        }
                    }
                    setSelectedTicketForUpdate(null);
                }
            };

            if(staffList.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center h-64 bg-white rounded-2xl shadow-sm border border-slate-200">
                        <Users className="w-12 h-12 text-slate-300 mb-4" />
                        <h3 className="text-lg font-bold text-slate-700">ยังไม่มีรายชื่อพนักงานในระบบ</h3>
                        <p className="text-slate-500 text-sm mt-2">โปรดไปที่เมนู "ตั้งค่า" เพื่อเพิ่มรายชื่อทีม IT ก่อนใช้งานกระดานรับงานครับ</p>
                    </div>
                );
            }

            return (
                <div className="space-y-8 max-w-5xl">
                <div className="flex items-center gap-3"><Users className="text-blue-600 w-7 h-7" /><h2 className="text-2xl font-bold text-slate-800">Admin Dashboard: IT Team Workload</h2></div>
                
                {/* 1. Unassigned Tickets */}
                <div className="bg-white rounded-2xl shadow-sm border border-orange-200 overflow-hidden">
                    <div className="px-6 py-4 bg-orange-50 border-b border-orange-100 flex justify-between items-center"><div className="flex items-center gap-3"><AlertTriangle className="text-orange-600" /><h3 className="font-bold text-orange-800">งานใหม่รอจ่าย (Unassigned)</h3></div><span className="bg-white px-3 py-1 rounded-full text-xs font-bold text-orange-600 border border-orange-200">{unassignedTickets.length} Waiting</span></div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left"><thead className="bg-white text-slate-500 border-b border-orange-100"><tr><th className="px-6 py-3">ID / เรื่อง</th><th className="px-6 py-3">อุปกรณ์ที่แจ้ง / อาการ</th><th className="px-6 py-3">ผู้แจ้ง</th><th className="px-6 py-3 text-right">จ่ายงานให้ (Assign)</th></tr></thead>
                        <tbody className="divide-y divide-orange-50">
                            {unassignedTickets.length === 0 ? (<tr><td colSpan="4" className="text-center py-6 text-gray-500">ไม่มีงานใหม่รอจ่าย</td></tr>) : unassignedTickets.map(ticket => (
                            <tr key={ticket.Ticket_ID} className="hover:bg-orange-50/50">
                            <td className="px-6 py-4">
                                <div className="font-mono text-slate-500 text-xs mb-1">{ticket.Ticket_ID}</div>
                                <div className="font-bold text-slate-800">{ticket.Type}</div>
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded mt-1 inline-block ${ticket.Urgency === 'วิกฤต' ? 'bg-rose-100 text-rose-600' : ticket.Urgency === 'เร่งด่วน' ? 'bg-orange-100 text-orange-600' : 'bg-slate-100 text-slate-600'}`}>{ticket.Urgency}</span>
                            </td>
                            <td className="px-6 py-4"><div className="font-bold text-blue-700 font-mono text-xs">{ticket.Asset_ID}</div><div className="text-xs text-slate-600 line-clamp-2 mt-1">{ticket.Description}</div></td>
                            <td className="px-6 py-4"><span className="text-slate-800 font-medium">{ticket.Requester}</span><div className="text-xs text-gray-500">{ticket.Department}</div></td>
                            <td className="px-6 py-4 text-right">
                                <div className="flex justify-end gap-1 flex-wrap w-48 ml-auto">
                                    {staffWorkloads.map(s => (
                                        <button key={s.Staff_ID} title={`จ่ายให้ ${s.Name}`} onClick={()=>handleAssign(s.Name, ticket)} className={`w-8 h-8 rounded-full flex items-center justify-center text-white text-xs shadow-sm hover:scale-110 transition ${s.Avatar_Color}`}>
                                            {s.Name.charAt(0)}
                                        </button>
                                    ))}
                                </div>
                            </td>
                            </tr>
                        ))}</tbody></table>
                    </div>
                </div>

                {/* 2. Staff Workload Summary */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {staffWorkloads.map(staff => (
                    <div key={staff.Staff_ID} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 relative overflow-hidden">
                        <div className="flex items-center gap-4 mb-4 z-10 relative">
                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-sm ${staff.Avatar_Color}`}>{staff.Name.charAt(0)}</div>
                            <div><h3 className="font-bold text-slate-800">{staff.Name}</h3><p className="text-xs text-slate-500">{staff.Role}</p></div>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 z-10 relative">
                            <div className="flex justify-between text-sm mb-2"><span className="text-slate-600">กำลังทำ: <b className="text-blue-600">{staff.activeJobs}</b></span><span className="text-slate-600">รอดำเนินการ: <b className="text-orange-500">{staff.queue}</b></span></div>
                            <div className="w-full bg-slate-200 rounded-full h-2 mb-3"><div className="bg-blue-500 h-full rounded-full transition-all duration-500" style={{width: `${Math.min((staff.activeJobs+staff.queue)*20, 100)}%`}}></div></div>
                            <div className="pt-2 border-t border-slate-200 flex items-center justify-between text-xs font-semibold text-emerald-600"><span className="flex items-center gap-1"><CheckSquare size={14}/> งานที่ทำเสร็จแล้ว</span><span>{staff.completed} งาน</span></div>
                        </div>
                    </div>
                    ))}
                </div>

                {/* 3. Active Jobs */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center"><h3 className="font-bold text-slate-800">งานที่กำลังดำเนินการ (Active Jobs)</h3></div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left"><thead className="bg-white text-slate-500 border-b border-slate-200"><tr><th className="px-6 py-3">ID / สถานะปัจจุบัน</th><th className="px-6 py-3">เรื่อง / อุปกรณ์</th><th className="px-6 py-3">ผู้รับผิดชอบ</th><th className="px-6 py-3 text-center">อัปเดตใบงาน</th></tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {activeTickets.length === 0 ? (<tr><td colSpan="4" className="text-center py-6 text-gray-500">ไม่มีงานที่กำลังดำเนินการ</td></tr>) : activeTickets.map(ticket => (
                            <tr key={ticket.Ticket_ID} className="hover:bg-slate-50">
                            <td className="px-6 py-4">
                                <div className="font-mono text-slate-500 text-xs mb-1">{ticket.Ticket_ID}</div>
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${ticket.Status === 'Pending' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{ticket.Status}</span>
                            </td>
                            <td className="px-6 py-4"><div className="font-bold text-slate-800">{ticket.Type} <span className="text-blue-600 font-mono text-xs ml-1">[{ticket.Asset_ID}]</span></div><div className="text-xs text-slate-500 mt-1">{ticket.Requester} ({ticket.Department})</div></td>
                            <td className="px-6 py-4 text-slate-800 font-medium flex items-center gap-2"><div className={`w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] ${staffList.find(s => s.Name === ticket.Assignee)?.Avatar_Color || 'bg-gray-400'}`}>{ticket.Assignee.charAt(0)}</div>{ticket.Assignee}</td>
                            <td className="px-6 py-4 text-center">
                                <button onClick={() => setSelectedTicketForUpdate(ticket)} className="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-50 shadow-sm transition flex items-center justify-center gap-1.5 w-full mx-auto"><Edit size={14}/> จัดการงาน</button>
                            </td>
                            </tr>
                        ))}</tbody></table>
                    </div>
                </div>

                {/* 4. Completed Jobs */}
                <div className="bg-white rounded-2xl shadow-sm border border-emerald-200 overflow-hidden opacity-80 hover:opacity-100 transition-opacity">
                    <div className="px-6 py-4 bg-emerald-50 border-b border-emerald-100 flex items-center gap-2"><ShieldCheck className="text-emerald-600 w-5 h-5"/><h3 className="font-bold text-emerald-800">ประวัติงานที่เสร็จสิ้นแล้ว (Completed Jobs)</h3></div>
                    <div className="overflow-x-auto max-h-64 overflow-y-auto custom-scrollbar">
                        <table className="w-full text-sm text-left"><thead className="bg-white text-slate-500 border-b border-emerald-100 sticky top-0 shadow-sm"><tr><th className="px-6 py-3">ID</th><th className="px-6 py-3">เรื่อง</th><th className="px-6 py-3">ผู้รับผิดชอบ</th><th className="px-6 py-3">การซ่อมแซม</th></tr></thead>
                        <tbody className="divide-y divide-emerald-50">
                            {completedTickets.length === 0 ? (<tr><td colSpan="4" className="text-center py-6 text-gray-500">ยังไม่มีประวัติงานที่เสร็จสิ้น</td></tr>) : completedTickets.slice().reverse().map(ticket => (
                            <tr key={ticket.Ticket_ID} className="hover:bg-emerald-50/50">
                            <td className="px-6 py-3 font-mono text-slate-500 text-xs">{ticket.Ticket_ID}</td>
                            <td className="px-6 py-3"><div className="font-bold text-slate-700">{ticket.Type}</div><div className="text-xs text-slate-400">{ticket.Requester}</div></td>
                            <td className="px-6 py-3 text-slate-600 text-sm">{ticket.Assignee}</td>
                            <td className="px-6 py-3"><div className="text-xs font-bold text-emerald-700 mb-0.5">{ticket.Repair}</div><div className="text-[10px] text-slate-400">ปิดงาน: {ticket.Finished_At}</div></td>
                            </tr>
                        ))}</tbody></table>
                    </div>
                </div>

                {/* Modal สำหรับการอัปเดตงาน */}
                {selectedTicketForUpdate && <TicketUpdateModal ticket={selectedTicketForUpdate} onClose={() => setSelectedTicketForUpdate(null)} onSave={handleSaveUpdate} />}

                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
