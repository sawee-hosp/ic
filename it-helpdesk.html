                    </div>

                    <div className="p-6 overflow-y-auto space-y-6 flex-1 custom-scrollbar">
                        <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-1.5">
                                <label className="text-sm font-bold text-slate-700">สถานะงาน (Job Status)</label>
                                <select value={status} onChange={e=>setStatus(e.target.value)} className="w-full border rounded-lg p-2.5 outline-none bg-white">
                                    <option value="Pending">รอรับเรื่อง (Pending)</option>
                                    <option value="In Progress">กำลังดำเนินการ (In Progress)</option>
                                    <option value="Completed">เสร็จสิ้น (Completed)</option>
                                </select>
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-sm font-bold text-slate-700">สถานะอุปกรณ์ปัจจุบัน</label>
                                <select value={deviceStatus} onChange={e=>setDeviceStatus(e.target.value)} className="w-full border rounded-lg p-2.5 outline-none bg-white">
                                    <option value="พร้อมใช้งาน">พร้อมใช้งาน</option>
                                    <option value="ส่งซ่อม">ส่งซ่อม</option>
                                    <option value="แทงชำรุด">แทงชำรุด</option>
                                </select>
                            </div>
                        </div>

                        <div className="space-y-1.5 border-t pt-4">
                            <label className="text-sm font-bold text-slate-700">การดำเนินการของช่าง (Repair Detail)</label>
                            <select value={repair} onChange={e=>setRepair(e.target.value)} className="w-full border rounded-lg p-2.5 outline-none bg-white">
                                <option value="">-- เลือกการดำเนินการ --</option>
                                <option value="ซ่อมได้ไม่เสียค่าใช้จ่าย">ซ่อมได้ไม่เสียค่าใช้จ่าย</option>
                                <option value="ซ่อมไม่ได้แจ้งชำรุด">ซ่อมไม่ได้แจ้งชำรุด</option>
                                <option value="ซ่อมได้/ใช้งบวัสดุซื้อดังนี้">ซ่อมได้ / ใช้งบวัสดุซื้อ</option>
                                <option value="เห็นควรจ้างซ่อม/จัดทำเนื่องจาก">เห็นควรจ้างซ่อม / จัดทำเนื่องจาก</option>
                                <option value="กรณีส่งซ่อมแล้วแจ้งบริษัท/ร้าน">กรณีส่งซ่อมแล้วแจ้งบริษัท/ร้าน</option>
                            </select>
                        </div>

                        {repair === 'เห็นควรจ้างซ่อม/จัดทำเนื่องจาก' && (
                            <div className="space-y-1.5 animate-in fade-in">
                                <label className="text-sm font-bold text-slate-700">เหตุผลที่เห็นควรจ้างซ่อม</label>
                                <textarea value={reason} onChange={e=>setReason(e.target.value)} className="w-full border rounded-lg p-2.5 outline-none resize-none" rows="3"></textarea>
                            </div>
                        )}

                        {repair === 'กรณีส่งซ่อมแล้วแจ้งบริษัท/ร้าน' && (
                            <div className="space-y-1.5 animate-in fade-in">
                                <label className="text-sm font-bold text-slate-700">วันที่แจ้งบริษัท / คาดการณ์แล้วเสร็จ</label>
                                <input type="date" value={estimate} onChange={e=>setEstimate(e.target.value)} className="w-full border rounded-lg p-2.5 outline-none" />
                            </div>
                        )}

                        {repair === 'ซ่อมได้/ใช้งบวัสดุซื้อดังนี้' && (
                            <div className="space-y-3 animate-in fade-in bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <label className="text-sm font-bold text-slate-700 flex justify-between items-center">
                                    รายการขอซื้ออะไหล่/วัสดุ
                                    <span className="text-xs text-blue-600 bg-blue-100 px-2 py-1 rounded">รวม: {totalCost} ฿</span>
                                </label>
                                {buyItems.map((b, i) => (
                                    <div key={i} className="flex gap-2 items-center">
                                        <input type="text" placeholder="ชื่ออุปกรณ์" value={b.item} onChange={e=>handleBuyChange(i, 'item', e.target.value)} className="flex-1 border rounded p-2 text-sm" />
                                        <input type="number" placeholder="ราคา" value={b.price} onChange={e=>handleBuyChange(i, 'price', e.target.value)} className="w-24 border rounded p-2 text-sm" />
                                        <button onClick={()=>handleRemoveBuyItem(i)} className="p-2 text-red-500 hover:bg-red-50 rounded"><Trash2 size={16}/></button>
                                    </div>
                                ))}
                                <button onClick={handleAddBuyItem} className="text-xs text-blue-600 font-bold flex items-center mt-2"><PlusCircle size={14} className="mr-1"/> เพิ่มรายการอะไหล่</button>
                            </div>
                        )}
                    </div>

                    <div className="p-6 border-t border-slate-100 flex gap-3 bg-slate-50 rounded-b-2xl">
                        <button onClick={onClose} className="px-6 py-2.5 border bg-white rounded-xl font-bold text-slate-600 hover:bg-slate-100 transition">ยกเลิก</button>
                        <button onClick={handleSave} className="flex-1 px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 flex items-center justify-center shadow-sm transition"><Save size={18} className="mr-2"/> บันทึกการอัปเดต</button>
                    </div>
                </div>
            </div>
        )
    }

    function StaffWorkload({ notify, apiCall, tickets, setTickets, staffList, equipments }) {
        const unassignedTickets = tickets.filter(t => t.Assignee === "-" || !t.Assignee);
        const activeTickets = tickets.filter(t => t.Assignee !== "-" && t.Status !== "Completed");
        const completedTickets = tickets.filter(t => t.Status === "Completed");

        const [selectedTicketForUpdate, setSelectedTicketForUpdate] = useState(null);

        const staffWorkloads = staffList.map(staff => {
            const myActive = tickets.filter(t => t.Assignee === staff.Name && t.Status === "In Progress").length;
            const myQueue = tickets.filter(t => t.Assignee === staff.Name && t.Status === "Pending").length;
            const myCompleted = tickets.filter(t => t.Assignee === staff.Name && t.Status === "Completed").length;
            return {
                ...staff,
                activeJobs: myActive,
                queue: myQueue,
                completed: myCompleted,
                status: (myActive + myQueue) > 0 ? "Busy" : "Available"
            };
        });

        const handleAssign = async (staffName, ticket) => {
            const newStatus = ticket.Assignee === "-" ? "Pending" : ticket.Status;
            const updatedTicket = { ...ticket, Assignee: staffName, Status: newStatus };
            const success = await apiCall('Tickets', 'update', updatedTicket);
            if(success) {
                setTickets(tickets.map(t => t.Ticket_ID === ticket.Ticket_ID ? updatedTicket : t));
                notify(`มอบหมายงาน ${ticket.Ticket_ID} ให้คุณ ${staffName} เรียบร้อย`);
            }
        };

        const handleSaveUpdate = async (updatedTicket) => {
            const success = await apiCall('Tickets', 'update', updatedTicket);
            if(success) {
                setTickets(tickets.map(t => t.Ticket_ID === updatedTicket.Ticket_ID ? updatedTicket : t));
                notify(`อัปเดตใบงาน ${updatedTicket.Ticket_ID} เรียบร้อย`);
                
                if (updatedTicket.Asset_ID && updatedTicket.Asset_ID !== "-") {
                    const eqToUpdate = equipments.find(e => e.Id === updatedTicket.Asset_ID || e.Id_equipment === updatedTicket.Asset_ID);
                    if (eqToUpdate && eqToUpdate.Status !== updatedTicket.Device_Status) {
                        await apiCall('Equipments', 'update', { ...eqToUpdate, Status: updatedTicket.Device_Status });
                    }
                }
                setSelectedTicketForUpdate(null);
            }
        };

        const generateRepairDoc = (ticket) => {
            const eq = equipments.find(e => e.Id === ticket.Asset_ID || e.Id_equipment === ticket.Asset_ID) || {};
            
            const pastTickets = tickets.filter(t => 
                (t.Asset_ID === ticket.Asset_ID) && 
                (t.Ticket_ID !== ticket.Ticket_ID) && 
                (t.Status === 'Completed') &&
                t.Created_At && ticket.Created_At &&
                (new Date(t.Created_At.split(' ')[0].split('/').reverse().join('-')) < new Date(ticket.Created_At.split(' ')[0].split('/').reverse().join('-')))
            ).sort((a,b) => new Date(b.Created_At.split(' ')[0].split('/').reverse().join('-')) - new Date(a.Created_At.split(' ')[0].split('/').reverse().join('-')));
            
            const lastTicket = pastTickets.length > 0 ? pastTickets[0] : null;
            const lastDate = lastTicket && lastTicket.Finished_At && lastTicket.Finished_At !== '-' ? lastTicket.Finished_At.split(' ')[0] : '-';
            const lastReason = lastTicket ? (lastTicket.Description || '-') : '-';

            let buyItemsStr = "-";
            if(ticket.Buy && ticket.Buy !== "-" && ticket.Buy !== "[]") {
                try {
                    const parsed = JSON.parse(ticket.Buy);
                    if(Array.isArray(parsed) && parsed.length > 0) {
                        buyItemsStr = parsed.map(item => `${item.item} (${item.price} บ.)`).join(', ');
                    }
                } catch(e){}
            }

            const printWindow = window.open('', '_blank');
            if(!printWindow) {
                alert("เบราว์เซอร์ของคุณบล็อกหน้าต่าง Pop-up กรุณาอนุญาต Pop-up เพื่อพิมพ์เอกสารครับ");
                return;
            }

            const repairText = ticket.Repair && ticket.Repair !== '-' ? ticket.Repair : '';
            const reasonText = ticket.Reason && ticket.Reason !== '-' ? ticket.Reason : '';
            const estimateText = ticket.Estimate && ticket.Estimate !== '-' ? ticket.Estimate : '';
            const assigneeText = ticket.Assignee && ticket.Assignee !== '-' ? ticket.Assignee : '...................................................';
            const finishedAtText = ticket.Finished_At && ticket.Finished_At !== '-' ? ticket.Finished_At.split(' ')[0] : '......./......./.......';

            printWindow.document.write(`
                <html>
                <head>
                    <title>ใบส่งซ่อมบำรุงพัสดุ/ครุภัณฑ์ - ${ticket.Ticket_ID}</title>
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
                        @page { size: A4; margin: 1.5cm 2cm; }

                        .container { max-width: 100%; margin: auto; }
                        .header { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 10px; }
                        .right-align { text-align: right; }
                        .mt-2 { margin-top: 0.5rem; }
                        .mt-4 { margin-top: 1rem; }
                        .mt-8 { margin-top: 2rem; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; font-size: 10pt; }
                        th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; vertical-align: top; }
                        th { text-align: center; font-weight: bold; background: #f0f0f0; }
                        .signature-box { display: flex; justify-content: space-between; margin-top: 20px; font-size: 10pt; }
                        .sig-col { width: 48%; }
                        .indent { padding-left: 2rem; }
                        .bold { font-weight: bold; }
                        .underline { text-decoration: underline; }
                        .text-center { text-align: center; }
                        .border-none { border: none; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <div class="header">ใบส่งซ่อมบำรุงพัสดุ/ครุภัณฑ์</div>
                        <div class="right-align">เลขที่ <span class="bold">${ticket.Ticket_ID}</span></div>
                        <div class="right-align">วันที่ <span class="bold">${ticket.Created_At?.split(' ')[0] || '......./......./.......'}</span></div>
                        
                        <div class="mt-2"><span class="bold">ฝ่าย/กลุ่มงาน:</span> &nbsp;&nbsp;${ticket.Department}</div>
                        <div><span class="bold">เรื่อง:</span> &nbsp;&nbsp;ขออนุมัติซ่อมบำรุงครุภัณฑ์</div>
                        <div><span class="bold">เรียน:</span> &nbsp;&nbsp;ผู้อำนวยการโรงพยาบาลสวี</div>
                        
                        <div class="mt-4 indent">เนื่องด้วยฝ่าย/กลุ่มงาน <span class="bold">${ticket.Department}</span> มีความประสงค์ที่จะส่งซ่อมบำรุงดังนี้</div>
                        
                        <table>
                            <tr>
                                <th width="20%">รายการ</th>
                                <th width="40%">เนื่องจาก</th>
                                <th width="20%">หมายเลขครุภัณฑ์</th>
                                <th width="20%">สถานที่ตั้ง</th>
                            </tr>
                            <tr>
                                <td>${ticket.Device_Type}</td>
                                <td>${(ticket.Description || '').split('\n')[0]}</td>
                                <td>${ticket.Asset_ID}</td>
                                <td>${eq.Location || '-'}</td>
                            </tr>
                        </table>
                        
                        <div class="indent">จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติและดำเนินการต่อไป</div>
                        
                        <div class="right-align mt-4" style="padding-right: 2rem;">
                            ลงชื่อ ........................................................... ผู้ส่งซ่อม<br>
                            ( ${ticket.Requester} )<br>
                            ${ticket.Created_At?.split(' ')[0] || '......./......./.......'}
                        </div>

                        <table style="margin-top: 20px;">
                            <tr>
                                <td colspan="2" class="bold" style="background: #f0f0f0;">บันทึกงานซ่อมบำรุง (สำหรับเจ้าหน้าที่)</td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <div style="min-height: 80px;">
                                        <div><span class="bold">การดำเนินการ:</span> &nbsp;&nbsp;${repairText}</div>
                                        ${ticket.Repair === 'เห็นควรจ้างซ่อม/จัดทำเนื่องจาก' ? `<div><span class="bold">เหตุผล:</span> &nbsp;&nbsp;${reasonText}</div>` : ''}
                                        ${ticket.Repair === 'ซ่อมได้/ใช้งบวัสดุซื้อดังนี้' ? `
                                            <div><span class="bold">รายการวัสดุ/อะไหล่:</span> &nbsp;&nbsp;${buyItemsStr}</div>
                                            <div><span class="bold">รวมเป็นเงิน:</span> &nbsp;&nbsp;<span class="bold">${ticket.Cost}</span> บาท</div>
                                        ` : ''}
                                        <div class="mt-2"><span class="bold">เวลาที่คาดว่าจะซ่อมเสร็จ:</span> &nbsp;&nbsp;${estimateText}</div>
                                        <div class="mt-4 right-align" style="padding-right: 2rem;">
                                            ลงชื่อ ........................................................... ช่างผู้ดำเนินการ<br>
                                            ( ${assigneeText} )<br>
                                            ${finishedAtText}
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td width="50%" style="vertical-align: top; text-align: center; padding: 20px 10px; border-right: 1px solid #000;">
                                    เรียน ผู้อำนวยการโรงพยาบาลสวี<br>เพื่อโปรดพิจารณา<br>
                                    (&nbsp;&nbsp;) ควรอนุมัติ/จัดซื้อวัสดุมาซ่อม/จัดทำอื่นๆ<br>
                                    ...................................................<br><br><br>
                                    ลงชื่อ...................................................<br>
                                    หัวหน้ากลุ่มงานบริหารทั่วไป<br>
                                    ......./......./.......
                                </td>
                                <td width="50%" style="vertical-align: top; text-align: center; padding: 20px 10px;">
                                    <span class="bold">ความเห็น ผู้อำนวยการโรงพยาบาลสวี</span><br>
                                    (&nbsp;&nbsp;) ทราบ<br>
                                    (&nbsp;&nbsp;) อนุมัติให้ดำเนินการตามเสนอ<br>
                                    (&nbsp;&nbsp;) อื่นๆ..........................................<br><br><br>
                                    ลงชื่อ...................................................<br>
                                    ผู้อำนวยการโรงพยาบาลสวี<br>
                                    ......./......./.......
                                </td>
                            </tr>
                        </table>

                        <table style="margin-top: 20px;">
                            <tr>
                                <td class="bold" style="background: #f0f0f0;">บันทึกประวัติการซ่อมครุภัณฑ์</td>
                            </tr>
                            <tr>
                                <td>
                                    <div style="min-height: 40px;">
                                        <div><span class="bold">ครั้งสุดท้ายเมื่อ:</span> &nbsp;&nbsp;${lastDate}</div>
                                        <div><span class="bold">เนื่องจาก:</span> &nbsp;&nbsp;${lastReason}</div>
                                    </div>
                                    <div class="mt-2 right-align" style="padding-right: 2rem;">
                                        ลงชื่อ ........................................................... <br>
                                        ( ${assigneeText} )<br>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                window.print();
                            }, 800);
                        };
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        };

        if(staffList.length === 0) {
            return (
                <div className="flex flex-col items-center justify-center h-64 bg-white rounded-2xl shadow-sm border border-slate-200">
                    <Users className="w-12 h-12 text-slate-300 mb-4" />
                    <h3 className="text-lg font-bold text-slate-700">ยังไม่มีรายชื่อพนักงานในระบบ</h3>
                    <p className="text-slate-500 text-sm mt-2">โปรดไปที่เมนู "ตั้งค่า" เพื่อเพิ่มรายชื่อทีม IT ก่อนใช้งานกระดานรับงานครับ</p>
                </div>
            );
        }

        return (
            <div className="space-y-8 max-w-5xl">
            <div className="flex items-center gap-3"><Users className="text-blue-600 w-7 h-7" /><h2 className="text-2xl font-bold text-slate-800">Admin Dashboard: IT Team Workload</h2></div>
            
            <div className="bg-white rounded-2xl shadow-sm border border-orange-200 overflow-hidden">
                <div className="px-6 py-4 bg-orange-50 border-b border-orange-100 flex justify-between items-center"><div className="flex items-center gap-3"><AlertTriangle className="text-orange-600" /><h3 className="font-bold text-orange-800">งานใหม่รอจ่าย (Unassigned)</h3></div><span className="bg-white px-3 py-1 rounded-full text-xs font-bold text-orange-600 border border-orange-200">{unassignedTickets.length} Waiting</span></div>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left"><thead className="bg-white text-slate-500 border-b border-orange-100"><tr><th className="px-6 py-3">ID / เรื่อง</th><th className="px-6 py-3">อุปกรณ์ที่แจ้ง / อาการ</th><th className="px-6 py-3">ผู้แจ้ง</th><th className="px-6 py-3 text-right">การจัดการ</th></tr></thead>
                    <tbody className="divide-y divide-orange-50">
                        {unassignedTickets.length === 0 ? (<tr><td colSpan="4" className="text-center py-6 text-gray-500">ไม่มีงานใหม่รอจ่าย</td></tr>) : unassignedTickets.map(ticket => (
                        <tr key={ticket.Ticket_ID} className="hover:bg-orange-50/50">
                        <td className="px-6 py-4">
                            <div className="font-mono text-slate-500 text-xs mb-1">{ticket.Ticket_ID}</div>
                            <div className="font-bold text-slate-800">{ticket.Device_Type === 'Data' ? 'ขอข้อมูล/รายงาน' : 'แจ้งซ่อม'}</div>
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded mt-1 inline-block ${ticket.Urgency === 'วิกฤต' ? 'bg-rose-100 text-rose-600' : ticket.Urgency === 'เร่งด่วน' ? 'bg-orange-100 text-orange-600' : 'bg-slate-100 text-slate-600'}`}>{ticket.Urgency}</span>
                        </td>
                        <td className="px-6 py-4"><div className="font-bold text-blue-700 font-mono text-xs">{ticket.Asset_ID}</div><div className="text-xs text-slate-600 line-clamp-2 mt-1">{(ticket.Description || '').split('\n')[0]}</div></td>
                        <td className="px-6 py-4"><span className="text-slate-800 font-medium">{ticket.Requester}</span><div className="text-xs text-gray-500">{ticket.Department}</div></td>
                        <td className="px-6 py-4 text-right">
                            <div className="flex justify-end gap-2 flex-wrap w-48 ml-auto">
                                {ticket.Device_Type !== "Data" && (
                                    <button onClick={() => generateRepairDoc(ticket)} className="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-100 shadow-sm transition" title="พิมพ์ใบส่งซ่อม"><FileText size={14}/></button>
                                )}
                                {staffWorkloads.map(s => (
                                    <button key={s.Staff_ID} title={`จ่ายให้ ${s.Name}`} onClick={()=>handleAssign(s.Name, ticket)} className={`w-8 h-8 rounded-full flex items-center justify-center text-white text-xs shadow-sm hover:scale-110 transition ${s.Avatar_Color}`}>
                                        {s.Name.charAt(0)}
                                    </button>
                                ))}
                            </div>
                        </td>
                        </tr>
                    ))}</tbody></table>
                </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {staffWorkloads.map(staff => (
                <div key={staff.Staff_ID} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 relative overflow-hidden">
                    <div className="flex items-center gap-4 mb-4 z-10 relative">
                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-sm ${staff.Avatar_Color}`}>{staff.Name.charAt(0)}</div>
                        <div><h3 className="font-bold text-slate-800">{staff.Name}</h3><p className="text-xs text-slate-500">{staff.Role}</p></div>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 z-10 relative">
                        <div className="flex justify-between text-sm mb-2"><span className="text-slate-600">กำลังทำ: <b className="text-blue-600">{staff.activeJobs}</b></span><span className="text-slate-600">รอดำเนินการ: <b className="text-orange-500">{staff.queue}</b></span></div>
                        <div className="w-full bg-slate-200 rounded-full h-2 mb-3"><div className="bg-blue-500 h-full rounded-full transition-all duration-500" style={{width: `${Math.min((staff.activeJobs+staff.queue)*20, 100)}%`}}></div></div>
                        <div className="pt-2 border-t border-slate-200 flex items-center justify-between text-xs font-semibold text-emerald-600"><span className="flex items-center gap-1"><CheckSquare size={14}/> งานที่ทำเสร็จแล้ว</span><span>{staff.completed} งาน</span></div>
                    </div>
                </div>
                ))}
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center"><h3 className="font-bold text-slate-800">งานที่กำลังดำเนินการ (Active Jobs)</h3></div>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left"><thead className="bg-white text-slate-500 border-b border-slate-200"><tr><th className="px-6 py-3">ID / สถานะปัจจุบัน</th><th className="px-6 py-3">เรื่อง / อุปกรณ์</th><th className="px-6 py-3">ผู้รับผิดชอบ</th><th className="px-6 py-3 text-center">การจัดการ</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                        {activeTickets.length === 0 ? (<tr><td colSpan="4" className="text-center py-6 text-gray-500">ไม่มีงานที่กำลังดำเนินการ</td></tr>) : activeTickets.map(ticket => (
                        <tr key={ticket.Ticket_ID} className="hover:bg-slate-50">
                        <td className="px-6 py-4">
                            <div className="font-mono text-slate-500 text-xs mb-1">{ticket.Ticket_ID}</div>
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${ticket.Status === 'Pending' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{ticket.Status}</span>
                        </td>
                        <td className="px-6 py-4"><div className="font-bold text-slate-800">{ticket.Device_Type === 'Data' ? 'ขอข้อมูล/รายงาน' : 'แจ้งซ่อม'} <span className="text-blue-600 font-mono text-xs ml-1">[{ticket.Asset_ID}]</span></div><div className="text-xs text-slate-500 mt-1">{ticket.Requester} ({ticket.Department})</div></td>
                        <td className="px-6 py-4 text-slate-800 font-medium flex items-center gap-2"><div className={`w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] ${staffList.find(s => s.Name === ticket.Assignee)?.Avatar_Color || 'bg-gray-400'}`}>{ticket.Assignee.charAt(0)}</div>{ticket.Assignee}</td>
                        <td className="px-6 py-4">
                            <div className="flex flex-col items-center gap-2">
                                <div className="flex justify-center gap-2">
                                    <button onClick={() => setSelectedTicketForUpdate(ticket)} className="bg-white border border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-50 shadow-sm transition flex items-center gap-1.5"><Edit size={14}/> จัดการงาน</button>
                                    {ticket.Device_Type !== "Data" && (
                                        <button onClick={() => generateRepairDoc(ticket)} className="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-100 shadow-sm transition flex items-center gap-1" title="พิมพ์ใบส่งซ่อม"><FileText size={14}/> พิมพ์</button>
                                    )}
                                </div>
                                <div className="flex items-center gap-1 mt-1 bg-slate-100 px-2 py-1 rounded-full">
                                    <span className="text-[10px] text-slate-500 mr-1">ส่งต่อให้:</span>
                                    {staffWorkloads.filter(s => s.Name !== ticket.Assignee).map(s => (
                                        <button key={s.Staff_ID} title={`เปลี่ยนเป็น ${s.Name}`} onClick={()=>handleAssign(s.Name, ticket)} className={`w-5 h-5 rounded-full flex items-center justify-center text-white text-[9px] shadow-sm hover:scale-110 transition ${s.Avatar_Color}`}>
                                            {s.Name.charAt(0)}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </td>
                        </tr>
                    ))}</tbody></table>
                </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-emerald-200 overflow-hidden opacity-80 hover:opacity-100 transition-opacity">
                <div className="px-6 py-4 bg-emerald-50 border-b border-emerald-100 flex items-center gap-2"><ShieldCheck className="text-emerald-600 w-5 h-5"/><h3 className="font-bold text-emerald-800">ประวัติงานที่เสร็จสิ้นแล้ว (Completed Jobs)</h3></div>
                <div className="overflow-x-auto max-h-64 overflow-y-auto custom-scrollbar">
                    <table className="w-full text-sm text-left"><thead className="bg-white text-slate-500 border-b border-emerald-100 sticky top-0 shadow-sm"><tr><th className="px-6 py-3">ID</th><th className="px-6 py-3">เรื่อง</th><th className="px-6 py-3">ผู้รับผิดชอบ</th><th className="px-6 py-3">การจัดการ</th></tr></thead>
                    <tbody className="divide-y divide-emerald-50">
                        {completedTickets.length === 0 ? (<tr><td colSpan="4" className="text-center py-6 text-gray-500">ยังไม่มีประวัติงานที่เสร็จสิ้น</td></tr>) : completedTickets.slice().reverse().map(ticket => (
                        <tr key={ticket.Ticket_ID} className="hover:bg-emerald-50/50">
                        <td className="px-6 py-3 font-mono text-slate-500 text-xs">{ticket.Ticket_ID}</td>
                        <td className="px-6 py-3"><div className="font-bold text-slate-700">{ticket.Device_Type === 'Data' ? 'ขอข้อมูล/รายงาน' : 'แจ้งซ่อม'}</div><div className="text-xs text-slate-400">{ticket.Requester}</div></td>
                        <td className="px-6 py-3 text-slate-600 text-sm">{ticket.Assignee}</td>
                        <td className="px-6 py-3 flex gap-2 items-center">
                            <div><div className="text-xs font-bold text-emerald-700 mb-0.5">{ticket.Repair}</div><div className="text-[10px] text-slate-400">ปิดงาน: {ticket.Finished_At?.split(' ')[0] || '-'}</div></div>
                            {ticket.Device_Type !== "Data" && (
                                <button onClick={() => generateRepairDoc(ticket)} className="p-2 ml-auto bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 shadow-sm" title="สร้างเอกสารใบส่งซ่อม"><FileText size={16}/></button>
                            )}
                        </td>
                        </tr>
                    ))}</tbody></table>
                </div>
            </div>

            {/* Modal สำหรับการอัปเดตงาน */}
            {selectedTicketForUpdate && <TicketUpdateModal ticket={selectedTicketForUpdate} onClose={() => setSelectedTicketForUpdate(null)} onSave={handleSaveUpdate} />}

            </div>
        );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
