                                <div className="text-red-400 font-bold mb-1">กรุณาระบุข้อมูลให้ครบ:</div>
                                <div className="text-white text-sm">{missing.join(', ')}</div>
                            </div>
                        )}

                        <div className="space-y-3 mb-6">
                            <div className={`p-4 rounded-xl border ${!data.location ? 'bg-red-900/20 border-red-500/50' : 'bg-slate-800 border-slate-700'}`}>
                                <div className="text-xs text-slate-400 mb-1">สถานที่</div>
                                <div className={`text-lg font-bold ${!data.location ? 'text-red-400':'text-indigo-400'}`}>
                                    {data.location ? getLocationLabel(data.location) : 'ไม่ระบุ'}
                                </div>
                            </div>
                            <div className={`p-4 rounded-xl border ${!data.hcw ? 'bg-red-900/20 border-red-500/50' : 'bg-slate-800 border-slate-700'}`}>
                                <div className="text-xs text-slate-400 mb-1">ผู้ถูกสังเกต</div>
                                <div className={`text-lg font-bold ${!data.hcw ? 'text-red-400':'text-pink-400'}`}>
                                    {data.hcw ? getHcwLabel(data.hcw) : 'ไม่ระบุ'}
                                </div>
                            </div>
                            <div className={`p-4 rounded-xl border ${!data.moment ? 'bg-red-900/20 border-red-500/50' : 'bg-slate-800 border-slate-700'}`}>
                                <div className="text-xs text-slate-400 mb-1">Moment</div>
                                <div className={`text-lg font-bold ${!data.moment ? 'text-red-400':'text-blue-400'} flex items-center gap-2`}>
                                    {data.moment ? (
                                        <><span className="text-2xl">{data.moment}</span><span>{getMomentLabel(data.moment)}</span></>
                                    ) : 'ไม่ระบุ'}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                    <div className="text-xs text-slate-400 mb-1">วิธีการ</div>
                                    <div className={`text-lg font-bold ${data.method===0 ? 'text-red-400':'text-emerald-400'}`}>
                                        {getMethodLabel(data.method)}
                                    </div>
                                </div>
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                    <div className="text-xs text-slate-400 mb-1">ขั้นตอน</div>
                                    <div className="text-lg font-bold text-slate-200">
                                        {Object.values(data.steps).filter(v=>v).length} / 7
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button onClick={onRetry} className="flex-1 py-3 rounded-xl bg-slate-700 text-slate-300 font-bold hover:bg-slate-600 transition-colors">
                                พูดใหม่
                            </button>
                            <button 
                                onClick={onConfirm} 
                                disabled={missing.length > 0}
                                className={`flex-1 py-3 rounded-xl text-white font-bold transition-colors shadow-lg ${missing.length > 0 ? 'bg-slate-600 cursor-not-allowed opacity-50' : 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-900/50'}`}
                            >
                                ยืนยันบันทึก
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [meta, setMeta] = useState({ locations: [], hcws: [], totalCount: 0 });
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showSuccess, setShowSuccess] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // Voice State
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [showVoiceModal, setShowVoiceModal] = useState(false);
            const [reviewData, setReviewData] = useState(null);
            
            const recognitionRef = useRef(null);
            const silenceTimerRef = useRef(null);

            // Form
            const [location, setLocation] = useState('');
            const [hcw, setHcw] = useState('');
            const [moment, setMoment] = useState('');
            const [method, setMethod] = useState('');
            const [steps, setSteps] = useState({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

            useEffect(() => {
                const init = async () => {
                    const cachedMeta = localStorage.getItem('hh_meta');
                    const lastLoc = localStorage.getItem('hh_last_loc');
                    
                    if (cachedMeta) setMeta(JSON.parse(cachedMeta));
                    if (lastLoc) setLocation(lastLoc);

                    if (window.liff) {
                        try {
                            await window.liff.init({ liffId: LIFF_ID });
                            
                            if (!window.liff.isLoggedIn()) {
                                window.liff.login({ redirectUri: window.location.href });
                                return;
                            }
                            
                            const profile = await window.liff.getProfile();
                            
                            const cachedUser = localStorage.getItem('hh_user_' + profile.userId);
                            if(cachedUser) {
                                setUser(JSON.parse(cachedUser));
                            } else {
                                setUser({
                                    userId: profile.userId,
                                    name: profile.displayName,
                                    picture: profile.pictureUrl
                                });
                            }

                            fetch(GAS_URL, {
                                method: 'POST',
                                redirect: 'follow', 
                                body: JSON.stringify({ action: 'getUserProfile', userId: profile.userId })
                            }).then(r => r.json()).then(res => {
                                if (res.found) {
                                    const userData = { 
                                        ...res, 
                                        name: res.name || profile.displayName,
                                        picture: profile.pictureUrl 
                                    };
                                    setUser(userData);
                                    localStorage.setItem('hh_user_' + profile.userId, JSON.stringify(userData));
                                } else if (!cachedUser) {
                                    alert("ไม่พบข้อมูลผู้ใช้งาน กรุณาลงทะเบียนก่อน");
                                    window.location.href = REG_URL;
                                }
                            }).catch(e => console.error("User fetch error", e));

                            fetch(GAS_URL, { 
                                method: 'POST', 
                                redirect: 'follow', 
                                body: JSON.stringify({ action: 'getMetaData' }) 
                            })
                            .then(r => r.json())
                            .then(data => {
                                if (data && data.locations) {
                                    setMeta(data);
                                    localStorage.setItem('hh_meta', JSON.stringify(data));
                                }
                                setLoading(false);
                            }).catch(e => {
                                console.error("Meta fetch error:", e);
                                setLoading(false);
                            });

                        } catch (e) { 
                            console.error("LIFF Init Error:", e);
                            setErrorMsg("LIFF Error: " + e.message);
                            setLoading(false); 
                        }
                    } else {
                        setLoading(false);
                    }
                };
                init();
            }, []);

            const toggleStep = (num) => {
                setSteps(prev => ({ ...prev, [num]: !prev[num] }));
            };
            
            const handleHardRefresh = () => {
                if(confirm("ต้องการโหลดข้อมูลใหม่ทั้งหมดใช่หรือไม่?")) {
                    localStorage.removeItem('hh_meta');
                    window.location.reload();
                }
            };

            // Voice Recognition Logic
            const startListening = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert("เบราว์เซอร์ของคุณไม่รองรับการสั่งงานด้วยเสียง (แนะนำ Chrome หรือ Safari)");
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognitionRef.current = recognition;
                
                recognition.lang = 'th-TH';
                recognition.continuous = true; // IMPORTANT: Keep listening to allow pauses
                recognition.interimResults = true;

                setIsListening(true);
                setShowVoiceModal(true);
                setTranscript('');
                setReviewData(null);

                recognition.onresult = (event) => {
                    // Reset 5s timer on every new result
                    if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
                    silenceTimerRef.current = setTimeout(() => {
                        stopAndProcess();
                    }, 5000);

                    let finalTranscript = '';
                    let interimTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    // Combine previous final results if needed, or just use current session
                    // For continuous = true, resultIndex increments.
                    // We need to accumulate full text.
                    let fullText = '';
                    for (let i = 0; i < event.results.length; ++i) {
                        fullText += event.results[i][0].transcript;
                    }
                    setTranscript(fullText);
                };

                recognition.onend = () => {
                    // If stopped manually or by error, we might be done.
                    // But if continuous=true, it shouldn't stop unless we tell it or lengthy silence.
                    // We handle the "end" via the timer mostly.
                    if (isListening) {
                        // Unexpected end (e.g. mobile OS cut it off), process what we have
                        // setIsListening(false);
                        // processVoiceCommand(transcript);
                    }
                };
                
                recognition.onerror = (event) => {
                    console.error(event.error);
                    if (event.error === 'no-speech') return; // Ignore
                    setIsListening(false);
                    setShowVoiceModal(false);
                };

                recognition.start();
            };

            const stopAndProcess = () => {
                if (recognitionRef.current) {
                    recognitionRef.current.stop();
                }
                if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
                setIsListening(false);
                
                // Need to use the latest transcript state. 
                // Since this runs in a timeout, closure might be stale.
                // React state inside timeout is tricky.
                // Best to use a ref for transcript or rely on the fact that setState triggers re-render 
                // but here we are calling processVoiceCommand which needs the text.
                // Let's pass the text from state?
                // Actually, the timeout callback will capture the `transcript` variable from render scope if defined there? No.
                // We'll use a functional state update or just trust the latest `transcript` if we use a Ref for it.
                // Let's rely on `transcript` state being up to date enough or pass it differently.
                // HACK: Use the DOM element or a ref to store transcript for valid access in timeout.
            };
            
            // Ref to access latest transcript in timeout
            const transcriptRef = useRef('');
            useEffect(() => { transcriptRef.current = transcript; }, [transcript]);

            const stopAndProcessManual = () => {
                if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
                if (recognitionRef.current) recognitionRef.current.stop();
                setIsListening(false);
                processVoiceCommand(transcriptRef.current);
            };

            // Enhance: use the ref in the timeout
            useEffect(() => {
                // Override the timeout logic in startListening to use the ref function
                // Actually, logic is embedded in onresult.
            }, []);
            
            // Re-implement onresult logic to use transcriptRef correctly
            // (See updated startListening below in render if needed, but since we use refs...)
            // Let's fix the `stopAndProcess` called by timeout to use `transcriptRef.current`
            
            const processVoiceCommand = (text) => {
                // Helper to search in DB
                const findMatch = (category, text) => {
                    const list = SEARCH_DB[category];
                    // Sort keys by length desc to match longest phrase first
                    // We check if input text *includes* any of the keys
                    let bestMatch = null;
                    let maxKeyLen = 0;

                    list.forEach(item => {
                        item.keys.forEach(key => {
                            if (text.includes(key)) {
                                if (key.length > maxKeyLen) {
                                    maxKeyLen = key.length;
                                    bestMatch = item.code;
                                }
                            }
                        });
                    });
                    return bestMatch;
                };

                const foundLoc = findMatch('Location', text);
                const foundHcw = findMatch('HCW', text);
                const foundMoment = findMatch('Moment', text); // Returns code (int or string)
                
                let foundMethod = findMatch('Method', text);
                // Default Method Logic: If not found, and didn't say "No wash", default to Soap (1)
                // If "No wash" (code 0) is found, use it.
                // "No wash" keys: ไม่ได้ทำความสะอาด, ไม่ล้าง
                if (foundMethod === null) {
                    foundMethod = 1; // Default Soap
                }

                // Steps Logic
                let foundSteps = { 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true };
                if (foundMethod === 0) {
                    foundSteps = {}; // Clear steps if no wash
                } else {
                    // Check for negations: "ไม่/ลืม/ข้าม" + Step Keyword
                    SEARCH_DB.Steps.forEach(step => {
                        step.keys.forEach(key => {
                            // Regex look for negation followed closely by key
                            // e.g. "ไม่ได้...ฝ่ามือ"
                            const regex = new RegExp(`(ไม่|ลืม|ข้าม)[^\\s]*\\s*${key}`, 'i');
                            if (regex.test(text)) {
                                foundSteps[step.id] = false;
                            }
                        });
                    });
                }

                setReviewData({
                    location: foundLoc,
                    hcw: foundHcw,
                    moment: foundMoment,
                    method: foundMethod,
                    steps: foundSteps
                });
                setShowVoiceModal(false);
            };

            // Fix the timeout to use correct ref
            const onSpeechResult = (event) => {
                if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
                
                let fullText = '';
                for (let i = 0; i < event.results.length; ++i) {
                    fullText += event.results[i][0].transcript;
                }
                setTranscript(fullText);
                
                silenceTimerRef.current = setTimeout(() => {
                    if (recognitionRef.current) recognitionRef.current.stop();
                    setIsListening(false);
                    processVoiceCommand(fullText);
                }, 5000);
            };

            const confirmVoiceData = () => {
                if (!reviewData) return;
                
                // Update Main State
                setLocation(reviewData.location);
                setHcw(reviewData.hcw);
                setMoment(reviewData.moment);
                setMethod(reviewData.method);
                setSteps(reviewData.steps);

                // Perform Submit Logic
                const payload = {
                    location: reviewData.location,
                    hcw: reviewData.hcw,
                    moment: reviewData.moment,
                    method: reviewData.method,
                    ...reviewData.steps,
                    observer: user?.name || 'Unknown'
                };
                
                localStorage.setItem('hh_last_loc', reviewData.location);
                setMeta(prev => ({...prev, totalCount: (prev.totalCount || 0) + 1}));
                
                setReviewData(null);
                setShowSuccess(true);

                fetch(GAS_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'saveRecord', payload })
                }).catch(e => console.error("Save Error", e));

                // Reset Form
                setMoment('');
                setMethod('');
                setSteps({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });
            };

            const handleSubmit = async () => {
                if (!location || !hcw || !moment || method==='') {
                    alert("กรุณาเลือกข้อมูลให้ครบ");
                    return;
                }

                const payload = {
                    location, hcw, moment, method,
                    ...steps,
                    observer: user?.name || 'Unknown'
                };

                localStorage.setItem('hh_last_loc', location);
                setShowSuccess(true);
                setMeta(prev => ({...prev, totalCount: (prev.totalCount || 0) + 1}));
                
                setMoment('');
                setMethod('');
                setSteps({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

                fetch(GAS_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'saveRecord', payload })
                }).catch(e => console.error("Save Error", e));
            };

            // Override startListening to use new logic
            const startListeningNew = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert("แนะนำใช้ Chrome หรือ Safari");
                    return;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognitionRef.current = recognition;
                
                recognition.lang = 'th-TH';
                recognition.continuous = true; 
                recognition.interimResults = true;

                setIsListening(true);
                setShowVoiceModal(true);
                setTranscript('');
                setReviewData(null);

                recognition.onresult = onSpeechResult;
                recognition.onend = () => { setIsListening(false); };
                recognition.onerror = (e) => { setIsListening(false); setShowVoiceModal(false); };
                recognition.start();
            };

            if (loading && meta.locations.length === 0) return (
                <div className="flex h-screen items-center justify-center text-slate-400 bg-[#0f172a] flex-col gap-2">
                    <div className="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-emerald-500"></div>
                    <div>{errorMsg || "กำลังโหลด..."}</div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Header */}
                    <div className="glass-nav px-3 py-1.5 flex items-center justify-between sticky top-0 z-50 shadow-md">
                        <div className="flex items-center gap-2">
                            <HandIcon />
                            <div>
                                <div className="text-lg font-bold text-white leading-none">SW Hand Hygiene</div>
                                <div className="text-[10px] text-slate-400">Infection Control</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 text-right">
                             <button onClick={handleHardRefresh} className="p-1.5 rounded-full bg-slate-800 text-slate-300 hover:text-white"><LucideIcon name="refresh-cw" className="w-3.5 h-3.5"/></button>
                             <div className="flex flex-col items-end">
                                <div className="text-xs font-bold text-white truncate max-w-[90px]">{user?.name || '...'}</div>
                                <div className="text-[9px] text-slate-400 truncate max-w-[90px]">{user?.dept || ''}</div>
                            </div>
                            <div className="w-8 h-8 rounded-full bg-slate-700 overflow-hidden border-2 border-slate-600 shadow-sm flex-shrink-0">
                                {user?.picture ? <img src={user.picture} className="w-full h-full object-cover"/> : <div className="flex items-center justify-center h-full"><LucideIcon name="user" className="w-4 h-4"/></div>}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-md mx-auto w-full p-1.5 flex-1 flex flex-col gap-1">
                        {/* Progress */}
                        <div className="glass-panel px-3 py-1 rounded-lg flex justify-between items-center">
                            <span className="text-[10px] text-slate-400 font-bold uppercase">เป้าหมายเดือนนี้</span>
                            <div className="flex items-center gap-2">
                                 <div className="w-20 bg-slate-700 rounded-full h-1.5 overflow-hidden">
                                    <div className="bg-emerald-500 h-1.5 rounded-full shadow-[0_0_5px_rgba(52,211,153,0.5)]" style={{ width: `${Math.min(((meta.totalCount||0)/100)*100, 100)}%` }}></div>
                                </div>
                                <span className="text-xs font-bold text-emerald-400">{meta.totalCount || 0}<span className="text-slate-500 text-[9px]">/100</span></span>
                            </div>
                        </div>

                        {/* 1. Location */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">สถานที่</div>
                            <div className="flex flex-col flex-wrap h-[68px] overflow-x-auto no-scrollbar content-start items-start gap-1 pb-1"> 
                                {meta.locations.map(l => (
                                    <button key={l.code} onClick={() => setLocation(l.code)}
                                        className={`item-btn px-2.5 py-1 rounded-md text-[10px] font-bold border whitespace-nowrap w-fit shrink-0 relative leading-none ${location === l.code ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {l.label}
                                        {l.count > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[14px] h-[14px] px-0.5 bg-indigo-500 rounded-full flex items-center justify-center text-[8px] text-white ring-2 ring-[#0f172a] z-10">{l.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 2. HCW */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">ผู้ถูกสังเกต</div>
                            <div className="flex flex-col flex-wrap h-[68px] overflow-x-auto no-scrollbar content-start items-start gap-1 pb-1">
                                {meta.hcws.map(h => (
                                    <button key={h.code} onClick={() => setHcw(h.code)}
                                        className={`item-btn px-2.5 py-1 rounded-md text-[10px] font-bold border whitespace-nowrap w-fit shrink-0 relative leading-none ${hcw === h.code ? 'bg-pink-600 text-white border-pink-500 shadow-lg' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {h.label}
                                        {h.count > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[14px] h-[14px] px-0.5 bg-pink-500 rounded-full flex items-center justify-center text-[8px] text-white ring-2 ring-[#0f172a] z-10">{h.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 3. Moments */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">Moments</div>
                            <div className="grid grid-cols-5 gap-1">
                                {[
                                    { id: 1, label: 'ก่อนสัมผัสผู้ป่วย' },
                                    { id: 2, label: 'ก่อนทำหัตถการ' },
                                    { id: 3, label: 'หลังสัมผัสสารคัดหลั่ง' },
                                    { id: 4, label: 'หลังสัมผัสผู้ป่วย' },
                                    { id: 5, label: 'หลังสัมผัสสิ่งแวดล้อม' }
                                ].map(m => (
                                    <button key={m.id} onClick={() => setMoment(m.id)} 
                                        className={`item-btn h-14 rounded-lg border flex flex-col items-center justify-center p-0.5 transition-all ${moment === m.id ? 'bg-blue-600 border-blue-500 text-white shadow' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                        <span className="text-2xl font-extrabold leading-none mb-0.5">{m.id}</span>
                                        <span className="text-[8px] font-semibold leading-tight text-center line-clamp-2 w-full px-0.5">{m.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 4. Method */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">วิธีการ</div>
                            <div className="flex gap-1">
                                <button onClick={() => setMethod(1)} className={`item-btn flex-1 py-2.5 rounded-lg border flex items-center justify-center gap-1 ${method === 1 ? 'bg-emerald-600 border-emerald-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="droplets" className="w-4 h-4"/> <span className="text-xs font-bold">สบู่</span>
                                </button>
                                <button onClick={() => setMethod(2)} className={`item-btn flex-1 py-2.5 rounded-lg border flex items-center justify-center gap-1 ${method === 2 ? 'bg-cyan-600 border-cyan-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="spray-can" className="w-4 h-4"/> <span className="text-xs font-bold">Alcohol</span>
                                </button>
                                <button onClick={() => { setMethod(0); setSteps({}); }} className={`item-btn flex-1 py-2.5 rounded-lg border flex items-center justify-center gap-1 ${method === 0 ? 'bg-red-600 border-red-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="x-circle" className="w-4 h-4"/> <span className="text-xs font-bold">ไม่ล้าง</span>
                                </button>
                            </div>
                        </div>

                        {/* 5. Steps (Updated Style: Fatter, Bolder) */}
                        {method !== 0 && method !== '' && (
                            <div className="animate-fade-in pb-1">
                                <div className="text-[10px] text-slate-500 ml-1 flex justify-between font-bold">
                                    <span>7 ขั้นตอน (แตะอันที่ไม่ได้ทำออก)</span>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5">
                                    {[
                                        'ฝ่ามือถูฝ่ามือ',
                                        'ถูหลังมือ',
                                        'ถูซอกนิ้ว',
                                        'หลังนิ้ว',
                                        'หัวแม่มือ',
                                        'ปลายนิ้ว',
                                        'รอบข้อมือ'
                                    ].map((t, i) => {
                                        const id = i + 1;
                                        return (
                                            <button key={id} onClick={() => toggleStep(id)} 
                                                className={`item-btn px-0.5 py-1.5 rounded-xl text-[10px] font-extrabold border flex flex-col items-center justify-center leading-none min-h-[55px] shadow-sm ${steps[id] ? 'bg-slate-800 border-emerald-500/30 text-emerald-100' : 'bg-red-900/30 border-red-500/50 text-red-400 opacity-80'} ${id > 4 ? 'col-span-1.33' : ''}`}> 
                                                <style>{`.grid-cols-4 > button:nth-child(n+5) { grid-column: span 1.33; }`}</style>
                                                {steps[id] ? <LucideIcon name="check" className="w-5 h-5 text-emerald-500 mb-1"/> : <LucideIcon name="x" className="w-5 h-5 text-red-500 mb-1"/>}
                                                {t}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="mt-1 pb-4">
                            <button onClick={handleSubmit} disabled={!location || !hcw || !moment || method===''} 
                                className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-base shadow-lg shadow-emerald-900/50 active:scale-95 transition-all disabled:opacity-50 disabled:grayscale flex items-center justify-center gap-2">
                                <LucideIcon name="save" className="w-5 h-5"/> บันทึกข้อมูล
                            </button>
                        </div>
                    </div>

                    {/* Fixed Bottom Voice Area */}
                    <div className="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 p-4 pb-8 z-40 rounded-t-2xl shadow-2xl">
                        <div className="max-w-md mx-auto relative flex flex-col items-center">
                            {/* Pill Shaped Voice Button */}
                            <button onClick={startListeningNew} className="w-full bg-red-600 hover:bg-red-500 text-white py-3 px-6 rounded-full shadow-[0_4px_15px_rgba(239,68,68,0.4)] flex items-center justify-center gap-2 transition-transform active:scale-95">
                                <LucideIcon name="mic" className="w-5 h-5" />
                                <span className="font-bold text-sm">บันทึกล้างมือด้วยเสียง</span>
                            </button>
                        </div>
                    </div>

                    {showVoiceModal && <VoiceModal isListening={isListening} transcript={transcript} onEnd={stopAndProcessManual} onClose={() => { if(recognitionRef.current) recognitionRef.current.stop(); setShowVoiceModal(false); setIsListening(false); }} />}
                    {reviewData && <ReviewModal data={reviewData} transcript={transcript} meta={meta} onConfirm={confirmVoiceData} onRetry={() => { setReviewData(null); startListeningNew(); }} onClose={() => setReviewData(null)} />}
                    {showSuccess && <SuccessModal onClose={() => setShowSuccess(false)} onSpeakAgain={() => { setShowSuccess(false); startListeningNew(); }} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
