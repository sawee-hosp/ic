<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SW-Hand Hygiene</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .item-btn { transition: all 0.1s; }
        .item-btn:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glowing Hand Animation */
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 2px #4ade80); }
            50% { filter: drop-shadow(0 0 10px #22c55e); }
        }
        .animate-glow { animation: glow 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyX0pC3eLOod07tKyR3loiCecqps6er8EDcGhbtHVm885s2R2Zri6HSr94tKw3GosMI/exec";
        const LIFF_ID = "2008690634-UG4TJcVB";
        const REGISTER_URL = "https://sawee-hosp.github.io/ic/index.html";

        // Simple SVG Icons
        const HandIcon = () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 text-emerald-400 animate-glow">
                <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
                <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
            </svg>
        );

        const LucideIcon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    window.lucide.createIcons({
                        root: ref.current.parentNode,
                        nameAttr: 'data-lucide',
                        attrs: { class: className }
                    });
                }
            }, [name]);
            return <i data-lucide={name} ref={ref} className={className}></i>;
        };

        const SuccessModal = ({ onClose }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm cursor-pointer" onClick={onClose}>
                <div className="text-center p-8 pointer-events-none">
                    <div className="flex justify-center mb-4">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="w-24 h-24 animate-glow">
                            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
                            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                        </svg>
                    </div>
                    <h2 className="text-2xl font-bold text-white mb-2">บันทึกล้างมือสำเร็จ!</h2>
                    <p className="text-slate-400 text-sm">แตะที่หน้าจอเพื่อเริ่มใหม่</p>
                </div>
            </div>
        );

        const App = () => {
            const [meta, setMeta] = useState({ locations: [], hcws: [], totalCount: 0 });
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showSuccess, setShowSuccess] = useState(false);

            // Form State
            const [location, setLocation] = useState('');
            const [hcw, setHcw] = useState('');
            const [moment, setMoment] = useState('');
            const [method, setMethod] = useState('');
            const [steps, setSteps] = useState({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

            useEffect(() => {
                const init = async () => {
                    const cachedMeta = localStorage.getItem('hh_meta');
                    if (cachedMeta) setMeta(JSON.parse(cachedMeta));
                    
                    const lastLoc = localStorage.getItem('hh_last_loc');
                    if(lastLoc) setLocation(lastLoc);

                    if (window.liff) {
                        try {
                            await window.liff.init({ liffId: LIFF_ID });
                            if (!window.liff.isLoggedIn()) {
                                window.liff.login({ redirectUri: window.location.href });
                                return;
                            }
                            
                            const profile = await window.liff.getProfile();
                            
                            // Check User with Retry
                            let userData = null;
                            try {
                                const res = await fetch(GAS_URL, {
                                    method: 'POST',
                                    body: JSON.stringify({ action: 'getUserProfile', userId: profile.userId })
                                }).then(r => r.json());

                                if (res.found) {
                                    userData = { ...res, picture: profile.pictureUrl };
                                    setUser(userData);
                                    localStorage.setItem('hh_user', JSON.stringify(userData));
                                } else {
                                    alert("ไม่พบข้อมูลผู้ใช้งาน กรุณาลงทะเบียนก่อน");
                                    window.location.href = REGISTER_URL;
                                    return;
                                }
                            } catch (err) {
                                console.error("Fetch User Error", err);
                                // Fallback to cache if offline/error
                                const cached = localStorage.getItem('hh_user');
                                if(cached) setUser(JSON.parse(cached));
                            }

                            // Fetch Meta
                            fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getMetaData' }) })
                                .then(r => r.json())
                                .then(data => {
                                    if (data.locations) {
                                        setMeta(data);
                                        localStorage.setItem('hh_meta', JSON.stringify(data));
                                    }
                                    setLoading(false);
                                }).catch(() => setLoading(false));

                        } catch (e) { 
                            console.error("LIFF/Init Error", e); 
                            setLoading(false); 
                        }
                    } else {
                        setLoading(false); // Fallback for dev without LIFF
                    }
                };
                init();
            }, []);

            const toggleStep = (num) => {
                setSteps(prev => ({ ...prev, [num]: !prev[num] }));
            };

            const handleSubmit = async () => {
                if (!location || !hcw || !moment || method==='') {
                    alert("กรุณาเลือกข้อมูลให้ครบ");
                    return;
                }

                const payload = {
                    location, hcw, moment, method,
                    ...steps,
                    observer: user?.name || 'Unknown'
                };

                localStorage.setItem('hh_last_loc', location);
                
                // Show Success Modal & Reset UI
                setShowSuccess(true);
                setMeta(prev => ({...prev, totalCount: (prev.totalCount || 0) + 1}));
                setMoment('');
                setMethod('');
                setSteps({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

                // Fire & Forget to Server
                fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveRecord', payload })
                }).catch(e => console.error("Save Error", e));
            };

            if (loading && meta.locations.length === 0) return (
                <div className="flex h-screen items-center justify-center text-slate-400 bg-[#0f172a]">Loading...</div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-4 p-2 flex flex-col text-sm">
                    {/* Header */}
                    <div className="glass-panel px-3 py-2 rounded-xl mb-1 flex items-center justify-between border-l-4 border-l-emerald-500">
                        <div className="flex items-center gap-2">
                            <HandIcon />
                            <div>
                                <div className="text-lg font-bold text-white leading-none">SW-Hand</div>
                                <div className="text-[10px] text-slate-400">Hygiene App</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 text-right">
                             <div>
                                <div className="text-xs font-bold text-white truncate max-w-[80px]">{user?.name || 'Guest'}</div>
                                <div className="text-[9px] text-slate-400">{user?.dept || '-'}</div>
                            </div>
                            <div className="w-8 h-8 rounded-full bg-slate-700 overflow-hidden border border-slate-600">
                                {user?.picture ? <img src={user.picture} className="w-full h-full object-cover"/> : <div className="flex items-center justify-center h-full text-[10px]">USER</div>}
                            </div>
                        </div>
                    </div>

                    {/* Progress */}
                    <div className="glass-panel px-3 py-1.5 rounded-xl mb-2 flex justify-between items-center">
                        <span className="text-[10px] text-slate-400 font-bold uppercase">เป้าหมายเดือนนี้</span>
                        <div className="flex items-center gap-2">
                             <div className="w-24 bg-slate-700 rounded-full h-1.5 overflow-hidden">
                                <div className="bg-emerald-500 h-1.5 rounded-full shadow-[0_0_5px_rgba(52,211,153,0.5)]" style={{ width: `${Math.min(((meta.totalCount||0)/100)*100, 100)}%` }}></div>
                            </div>
                            <span className="text-xs font-bold text-emerald-400">{meta.totalCount || 0}<span className="text-slate-500 text-[9px]">/100</span></span>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto pr-1 space-y-2">
                        {/* 1. Location */}
                        <div>
                            <div className="text-[10px] text-slate-500 mb-0.5 ml-1">สถานที่</div>
                            <div className="grid grid-rows-2 grid-flow-col gap-1 overflow-x-auto no-scrollbar pb-1">
                                {meta.locations.map(l => (
                                    <button key={l.code} onClick={() => setLocation(l.code)}
                                        className={`item-btn px-2 py-1 rounded text-[10px] font-bold border truncate max-w-[80px] ${location === l.code ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {l.label}
                                        {l.count > 0 && <span className="ml-1 text-[8px] bg-indigo-500 text-white px-1 rounded-full">{l.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 2. HCW */}
                        <div>
                            <div className="text-[10px] text-slate-500 mb-0.5 ml-1">ผู้ถูกสังเกต</div>
                            <div className="grid grid-rows-2 grid-flow-col gap-1 overflow-x-auto no-scrollbar pb-1">
                                {meta.hcws.map(h => (
                                    <button key={h.code} onClick={() => setHcw(h.code)}
                                        className={`item-btn px-2 py-1 rounded text-[10px] font-bold border truncate max-w-[80px] ${hcw === h.code ? 'bg-pink-600 text-white border-pink-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {h.label}
                                        {h.count > 0 && <span className="ml-1 text-[8px] bg-pink-500 text-white px-1 rounded-full">{h.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 3. Moments (1 Row) */}
                        <div>
                            <div className="text-[10px] text-slate-500 mb-0.5 ml-1">Moments</div>
                            <div className="grid grid-cols-5 gap-1">
                                {[1,2,3,4,5].map(m => (
                                    <button key={m} onClick={() => setMoment(m)} 
                                        className={`item-btn h-10 rounded-lg border flex items-center justify-center text-xl font-bold ${moment === m ? 'bg-blue-600 border-blue-500 text-white shadow' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                        {m}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 4. Method */}
                        <div>
                            <div className="text-[10px] text-slate-500 mb-0.5 ml-1">วิธีการ</div>
                            <div className="flex gap-1">
                                <button onClick={() => setMethod(1)} className={`item-btn flex-1 py-1.5 rounded-lg border flex items-center justify-center gap-1 ${method === 1 ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="droplets" className="w-3 h-3"/> <span className="text-[10px]">สบู่</span>
                                </button>
                                <button onClick={() => setMethod(2)} className={`item-btn flex-1 py-1.5 rounded-lg border flex items-center justify-center gap-1 ${method === 2 ? 'bg-cyan-600 border-cyan-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="spray-can" className="w-3 h-3"/> <span className="text-[10px]">Alcohol</span>
                                </button>
                                <button onClick={() => { setMethod(0); setSteps({}); }} className={`item-btn flex-1 py-1.5 rounded-lg border flex items-center justify-center gap-1 ${method === 0 ? 'bg-red-600 border-red-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="x-circle" className="w-3 h-3"/> <span className="text-[10px]">ไม่ล้าง</span>
                                </button>
                            </div>
                        </div>

                        {/* 5. Steps */}
                        {method !== 0 && method !== '' && (
                            <div className="animate-fade-in">
                                <div className="text-[10px] text-slate-500 mb-0.5 ml-1 flex justify-between">
                                    <span>ล้างมือ 7 ขั้นตอน</span>
                                    <span className="opacity-70">*คลิกข้อที่ไม่ได้ทำออก</span>
                                </div>
                                <div className="grid grid-cols-4 gap-1">
                                    {[
                                        'ฝ่ามือถูฝ่ามือ',
                                        'ฝ่ามือถูหลังมือ',
                                        'ถูซอกนิ้ว',
                                        'หลังนิ้วถูฝ่ามือ',
                                        'ถูหัวแม่มือ',
                                        'ปลายนิ้วถู',
                                        'ถูรอบข้อมือ'
                                    ].map((t, i) => {
                                        const id = i + 1;
                                        return (
                                            <button key={id} onClick={() => toggleStep(id)} 
                                                className={`item-btn p-1 rounded-lg border text-[9px] min-h-[35px] flex flex-col items-center justify-center text-center leading-tight ${steps[id] ? 'bg-slate-800 border-emerald-500/30 text-slate-300' : 'bg-red-900/30 border-red-500/50 text-red-300'}`}>
                                                {steps[id] ? <LucideIcon name="check" className="w-3 h-3 text-emerald-500 mb-0.5"/> : <LucideIcon name="x" className="w-3 h-3 text-red-500 mb-0.5"/>}
                                                {t}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="mt-4">
                        <button onClick={handleSubmit} disabled={!location || !hcw || !moment || method===''} 
                            className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold shadow-lg active:scale-95 transition-all disabled:opacity-50 disabled:grayscale text-sm flex items-center justify-center gap-2">
                            <LucideIcon name="save" className="w-4 h-4"/> บันทึกข้อมูล
                        </button>
                    </div>

                    {showSuccess && <SuccessModal onClose={() => setShowSuccess(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
