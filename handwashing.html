<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SW Hand Hygiene</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%234ade80%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0%22/><path d=%22M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2%22/><path d=%22M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8%22/><path d=%22M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15%22/></svg>">

    <!-- Fonts: Google Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { 
            font-family: 'Google Sans', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            touch-action: manipulation;
            font-size: 14px;
            margin: 0;
            padding: 0;
        }
        button, input, select, textarea { font-family: 'Google Sans', sans-serif; }

        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .item-btn { transition: all 0.1s; }
        .item-btn:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px #4ade80); }
            50% { filter: drop-shadow(0 0 15px #22c55e); }
        }
        .animate-glow { animation: glow 1.5s infinite ease-in-out; }

        @keyframes float-score {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; text-shadow: 0 0 30px #4ade80; }
            80% { opacity: 1; }
            100% { transform: translate(40vw, -45vh) scale(0.5); opacity: 0; }
        }
        .animate-float-score { animation: float-score 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyX0pC3eLOod07tKyR3loiCecqps6er8EDcGhbtHVm885s2R2Zri6HSr94tKw3GosMI/exec";
        const LIFF_ID = "2008690634-UG4TJcVB";
        const REG_URL = "https://sawee-hosp.github.io/ic/index.html";

        // SVG Icons
        const HandIcon = () => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-7 h-7 text-emerald-400 animate-glow">
                <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
                <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
            </svg>
        );

        const LucideIcon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    window.lucide.createIcons({
                        root: ref.current.parentNode,
                        nameAttr: 'data-lucide',
                        attrs: { class: className }
                    });
                }
            }, [name]);
            return <i data-lucide={name} ref={ref} className={className}></i>;
        };

        const SuccessModal = ({ onClose }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-xl cursor-pointer select-none" onClick={onClose}>
                <div className="fixed top-1/2 left-1/2 text-[120px] font-black text-emerald-400 animate-float-score pointer-events-none z-50 italic leading-none" style={{ textShadow: '0 0 50px rgba(74, 222, 128, 0.6)' }}>
                    +1
                </div>
                <div className="text-center p-6 pointer-events-none relative z-10">
                    <div className="flex justify-center mb-6">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="w-32 h-32 animate-glow">
                            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
                            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                        </svg>
                    </div>
                    <h2 className="text-2xl font-bold text-white mb-6 drop-shadow-lg">บันทึกสำเร็จ!</h2>
                    <div className="inline-block px-6 py-3 rounded-full bg-slate-800/80 border border-emerald-500/50 animate-pulse shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                        <p className="text-lg font-bold text-emerald-300">แตะเพื่อบันทึกอีก</p>
                    </div>
                </div>
            </div>
        );

        // Voice Recording Modal
        const VoiceModal = ({ isListening, transcript, onClose }) => (
            <div className="fixed inset-0 z-[100] flex items-end justify-center bg-black/80 backdrop-blur-sm pb-10 animate-fade-in">
                <div className="bg-slate-900 border border-slate-700 w-[90%] max-w-md rounded-2xl p-6 flex flex-col items-center relative shadow-2xl">
                    <button onClick={onClose} className="absolute top-3 right-3 text-slate-400 hover:text-white">
                        <LucideIcon name="x" className="w-5 h-5" />
                    </button>
                    
                    <div className="w-20 h-20 rounded-full bg-red-500/20 flex items-center justify-center mb-4 relative">
                         {isListening && <div className="absolute inset-0 rounded-full border-4 border-red-500 animate-pulse-ring"></div>}
                         <LucideIcon name="mic" className={`w-8 h-8 ${isListening ? 'text-red-500' : 'text-slate-400'}`} />
                    </div>
                    
                    <h3 className="text-lg font-bold text-white mb-2">{isListening ? 'กำลังฟัง...' : 'ประมวลผลเสร็จสิ้น'}</h3>
                    <p className="text-sm text-slate-300 text-center min-h-[60px] w-full bg-slate-800/50 p-3 rounded-lg border border-slate-700/50 italic">
                        "{transcript || 'พูดประโยค เช่น "พยาบาล ที่ไอซียู ล้างด้วยแอลกอฮอล์ ก่อนสัมผัสผู้ป่วย" ...'}"
                    </p>
                    
                    {isListening && <button onClick={onClose} className="mt-4 px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-full text-white text-sm font-bold">หยุด</button>}
                </div>
            </div>
        );

        const App = () => {
            const [meta, setMeta] = useState({ locations: [], hcws: [], totalCount: 0 });
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showSuccess, setShowSuccess] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // Voice State
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [showVoiceModal, setShowVoiceModal] = useState(false);

            // Form
            const [location, setLocation] = useState('');
            const [hcw, setHcw] = useState('');
            const [moment, setMoment] = useState('');
            const [method, setMethod] = useState('');
            const [steps, setSteps] = useState({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

            useEffect(() => {
                const init = async () => {
                    const cachedMeta = localStorage.getItem('hh_meta');
                    const lastLoc = localStorage.getItem('hh_last_loc');
                    
                    if (cachedMeta) setMeta(JSON.parse(cachedMeta));
                    if (lastLoc) setLocation(lastLoc);

                    if (window.liff) {
                        try {
                            await window.liff.init({ liffId: LIFF_ID });
                            
                            if (!window.liff.isLoggedIn()) {
                                window.liff.login({ redirectUri: window.location.href });
                                return;
                            }
                            
                            const profile = await window.liff.getProfile();
                            
                            const cachedUser = localStorage.getItem('hh_user_' + profile.userId);
                            if(cachedUser) {
                                setUser(JSON.parse(cachedUser));
                            } else {
                                setUser({
                                    userId: profile.userId,
                                    name: profile.displayName,
                                    picture: profile.pictureUrl
                                });
                            }

                            fetch(GAS_URL, {
                                method: 'POST',
                                redirect: 'follow', 
                                body: JSON.stringify({ action: 'getUserProfile', userId: profile.userId })
                            }).then(r => r.json()).then(res => {
                                if (res.found) {
                                    const userData = { 
                                        ...res, 
                                        name: res.name || profile.displayName,
                                        picture: profile.pictureUrl 
                                    };
                                    setUser(userData);
                                    localStorage.setItem('hh_user_' + profile.userId, JSON.stringify(userData));
                                } else if (!cachedUser) {
                                    alert("ไม่พบข้อมูลผู้ใช้งาน กรุณาลงทะเบียนก่อน");
                                    window.location.href = REG_URL;
                                }
                            }).catch(e => console.error("User fetch error", e));

                            fetch(GAS_URL, { 
                                method: 'POST', 
                                redirect: 'follow', 
                                body: JSON.stringify({ action: 'getMetaData' }) 
                            })
                            .then(r => r.json())
                            .then(data => {
                                if (data && data.locations) {
                                    setMeta(data);
                                    localStorage.setItem('hh_meta', JSON.stringify(data));
                                }
                                setLoading(false);
                            }).catch(e => {
                                console.error("Meta fetch error:", e);
                                setLoading(false);
                            });

                        } catch (e) { 
                            console.error("LIFF Init Error:", e);
                            setErrorMsg("LIFF Error: " + e.message);
                            setLoading(false); 
                        }
                    } else {
                        setLoading(false);
                    }
                };
                init();
            }, []);

            const toggleStep = (num) => {
                setSteps(prev => ({ ...prev, [num]: !prev[num] }));
            };
            
            const handleHardRefresh = () => {
                if(confirm("ต้องการโหลดข้อมูลใหม่ทั้งหมดใช่หรือไม่?")) {
                    localStorage.removeItem('hh_meta');
                    window.location.reload();
                }
            };

            // Voice Recognition Logic
            const startListening = () => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert("เบราว์เซอร์ของคุณไม่รองรับการสั่งงานด้วยเสียง (แนะนำ Chrome หรือ Safari)");
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.lang = 'th-TH';
                recognition.continuous = false;
                recognition.interimResults = true;

                setIsListening(true);
                setShowVoiceModal(true);
                setTranscript('');

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            // Interim
                            setTranscript(event.results[i][0].transcript);
                        }
                    }
                    if (finalTranscript) {
                        setTranscript(finalTranscript);
                        processVoiceCommand(finalTranscript);
                    }
                };

                recognition.onend = () => {
                    setIsListening(false);
                    setTimeout(() => setShowVoiceModal(false), 2000);
                };
                
                recognition.onerror = (event) => {
                    console.error(event.error);
                    setIsListening(false);
                    setShowVoiceModal(false);
                };

                recognition.start();
            };

            const processVoiceCommand = (text) => {
                // 1. Analyze Location
                let bestLoc = '';
                let maxLenLoc = 0;
                meta.locations.forEach(l => {
                    if (text.includes(l.label) && l.label.length > maxLenLoc) {
                        bestLoc = l.code;
                        maxLenLoc = l.label.length;
                    }
                });
                if (bestLoc) setLocation(bestLoc);

                // 2. Analyze HCW
                let bestHcw = '';
                let maxLenHcw = 0;
                meta.hcws.forEach(h => {
                    if (text.includes(h.label) && h.label.length > maxLenHcw) {
                        bestHcw = h.code;
                        maxLenHcw = h.label.length;
                    }
                });
                if (bestHcw) setHcw(bestHcw);

                // 3. Analyze Moment
                // Match keywords to Moment ID
                if (text.match(/ก่อนสัมผัสผู้ป่วย|ข้อ 1|moment 1|โมเมนต์ 1/i)) setMoment(1);
                else if (text.match(/ก่อนทำหัตถการ|ข้อ 2|moment 2|โมเมนต์ 2/i)) setMoment(2);
                else if (text.match(/หลังสัมผัสสารคัดหลั่ง|ข้อ 3|moment 3|โมเมนต์ 3/i)) setMoment(3);
                else if (text.match(/หลังสัมผัสผู้ป่วย|ข้อ 4|moment 4|โมเมนต์ 4/i)) setMoment(4);
                else if (text.match(/หลังสัมผัสสิ่งแวดล้อม|ข้อ 5|moment 5|โมเมนต์ 5/i)) setMoment(5);

                // 4. Analyze Method
                if (text.match(/ไม่ล้าง|ไม่ได้ล้าง/i)) {
                    setMethod(0);
                    setSteps({}); // Reset steps
                } else if (text.match(/แอลกอฮอล์|เจล/i)) {
                    setMethod(2);
                } else if (text.match(/สบู่/i)) {
                    setMethod(1);
                } else {
                    // Default logic: If method not mentioned but also not "no wash", assume Soap (1) or keep current?
                    // User requirement: "ถ้าแยกไม่ออกให้ถือว่าล้างสบู่"
                    if (method === '' || method === 0) setMethod(1);
                }

                // 5. Analyze Steps (Only if method is not 'No Wash')
                if (!text.match(/ไม่ล้าง|ไม่ได้ล้าง/i)) {
                    const newSteps = { ...steps }; // Default all true from initial state or keep current
                    
                    // Reset all to true first if it's a new command? 
                    // Better to assume "Perfect" then subtract based on user speech.
                    // User said: "ถ้าไม่บอกก็ถือว่าล้างครบ ถ้ามีบอก ก็ให้ดูว่าผิดขั้นตอนไหน"
                    [1, 2, 3, 4, 5, 6, 7].forEach(s => newSteps[s] = true);

                    // Logic: Search for negative context + step keywords
                    // Step 1: ฝ่ามือ
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}ฝ่ามือ/i)) newSteps[1] = false;
                    // Step 2: หลังมือ
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}หลังมือ/i)) newSteps[2] = false;
                    // Step 3: ซอกนิ้ว
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}ซอกนิ้ว/i)) newSteps[3] = false;
                    // Step 4: หลังนิ้ว
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}หลังนิ้ว/i)) newSteps[4] = false;
                    // Step 5: หัวแม่มือ
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}หัวแม่มือ/i)) newSteps[5] = false;
                    // Step 6: ปลายนิ้ว
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}ปลายนิ้ว/i)) newSteps[6] = false;
                    // Step 7: รอบข้อมือ
                    if (text.match(/(ไม่|ลืม|ข้าม).{0,10}ข้อมือ/i)) newSteps[7] = false;

                    setSteps(newSteps);
                }
            };

            const handleSubmit = async () => {
                if (!location || !hcw || !moment || method==='') {
                    alert("กรุณาเลือกข้อมูลให้ครบ");
                    return;
                }

                const payload = {
                    location, hcw, moment, method,
                    ...steps,
                    observer: user?.name || 'Unknown'
                };

                localStorage.setItem('hh_last_loc', location);
                setShowSuccess(true);
                setMeta(prev => ({...prev, totalCount: (prev.totalCount || 0) + 1}));
                
                setMoment('');
                setMethod('');
                setSteps({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

                fetch(GAS_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'saveRecord', payload })
                }).catch(e => console.error("Save Error", e));
            };

            if (loading && meta.locations.length === 0) return (
                <div className="flex h-screen items-center justify-center text-slate-400 bg-[#0f172a] flex-col gap-2">
                    <div className="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-emerald-500"></div>
                    <div>{errorMsg || "กำลังโหลด..."}</div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Header: Compact */}
                    <div className="glass-nav px-3 py-1.5 flex items-center justify-between sticky top-0 z-50 shadow-md">
                        <div className="flex items-center gap-2">
                            <HandIcon />
                            <div>
                                <div className="text-lg font-bold text-white leading-none">SW Hand Hygiene</div>
                                <div className="text-[10px] text-slate-400">Infection Control</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 text-right">
                             <button onClick={handleHardRefresh} className="p-1.5 rounded-full bg-slate-800 text-slate-300 hover:text-white"><LucideIcon name="refresh-cw" className="w-3.5 h-3.5"/></button>
                             <div className="flex flex-col items-end">
                                <div className="text-xs font-bold text-white truncate max-w-[90px]">{user?.name || '...'}</div>
                                <div className="text-[9px] text-slate-400 truncate max-w-[90px]">{user?.dept || ''}</div>
                            </div>
                            <div className="w-8 h-8 rounded-full bg-slate-700 overflow-hidden border-2 border-slate-600 shadow-sm flex-shrink-0">
                                {user?.picture ? <img src={user.picture} className="w-full h-full object-cover"/> : <div className="flex items-center justify-center h-full"><LucideIcon name="user" className="w-4 h-4"/></div>}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-md mx-auto w-full p-1.5 flex-1 flex flex-col gap-1 pb-20">
                        {/* Progress: Compact */}
                        <div className="glass-panel px-3 py-1 rounded-lg flex justify-between items-center">
                            <span className="text-[10px] text-slate-400 font-bold uppercase">เป้าหมายเดือนนี้</span>
                            <div className="flex items-center gap-2">
                                 <div className="w-20 bg-slate-700 rounded-full h-1.5 overflow-hidden">
                                    <div className="bg-emerald-500 h-1.5 rounded-full shadow-[0_0_5px_rgba(52,211,153,0.5)]" style={{ width: `${Math.min(((meta.totalCount||0)/100)*100, 100)}%` }}></div>
                                </div>
                                <span className="text-xs font-bold text-emerald-400">{meta.totalCount || 0}<span className="text-slate-500 text-[9px]">/100</span></span>
                            </div>
                        </div>

                        {/* 1. Location (Fixed: w-fit, items-start, tight spacing) */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">สถานที่</div>
                            <div className="flex flex-col flex-wrap h-[68px] overflow-x-auto no-scrollbar content-start items-start gap-1 pb-1"> 
                                {meta.locations.map(l => (
                                    <button key={l.code} onClick={() => setLocation(l.code)}
                                        className={`item-btn px-2.5 py-1 rounded-md text-[10px] font-bold border whitespace-nowrap w-fit shrink-0 relative leading-none ${location === l.code ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {l.label}
                                        {l.count > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[14px] h-[14px] px-0.5 bg-indigo-500 rounded-full flex items-center justify-center text-[8px] text-white ring-2 ring-[#0f172a] z-10">{l.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 2. HCW (Fixed: w-fit, items-start, tight spacing) */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">ผู้ถูกสังเกต</div>
                            <div className="flex flex-col flex-wrap h-[68px] overflow-x-auto no-scrollbar content-start items-start gap-1 pb-1">
                                {meta.hcws.map(h => (
                                    <button key={h.code} onClick={() => setHcw(h.code)}
                                        className={`item-btn px-2.5 py-1 rounded-md text-[10px] font-bold border whitespace-nowrap w-fit shrink-0 relative leading-none ${hcw === h.code ? 'bg-pink-600 text-white border-pink-500 shadow-lg' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {h.label}
                                        {h.count > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[14px] h-[14px] px-0.5 bg-pink-500 rounded-full flex items-center justify-center text-[8px] text-white ring-2 ring-[#0f172a] z-10">{h.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 3. Moments (Reduced height & gaps) */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">Moments</div>
                            <div className="grid grid-cols-5 gap-1">
                                {[
                                    { id: 1, label: 'ก่อนสัมผัสผู้ป่วย' },
                                    { id: 2, label: 'ก่อนทำหัตถการ' },
                                    { id: 3, label: 'หลังสัมผัสสารคัดหลั่ง' },
                                    { id: 4, label: 'หลังสัมผัสผู้ป่วย' },
                                    { id: 5, label: 'หลังสัมผัสสิ่งแวดล้อม' }
                                ].map(m => (
                                    <button key={m.id} onClick={() => setMoment(m.id)} 
                                        className={`item-btn h-14 rounded-lg border flex flex-col items-center justify-center p-0.5 transition-all ${moment === m.id ? 'bg-blue-600 border-blue-500 text-white shadow' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                        <span className="text-2xl font-extrabold leading-none mb-0.5">{m.id}</span>
                                        <span className="text-[8px] font-semibold leading-tight text-center line-clamp-2 w-full px-0.5">{m.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 4. Method (Compact) */}
                        <div>
                            <div className="text-[10px] text-slate-500 ml-1 font-bold">วิธีการ</div>
                            <div className="flex gap-1">
                                <button onClick={() => setMethod(1)} className={`item-btn flex-1 py-2.5 rounded-lg border flex items-center justify-center gap-1 ${method === 1 ? 'bg-emerald-600 border-emerald-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="droplets" className="w-4 h-4"/> <span className="text-xs font-bold">สบู่</span>
                                </button>
                                <button onClick={() => setMethod(2)} className={`item-btn flex-1 py-2.5 rounded-lg border flex items-center justify-center gap-1 ${method === 2 ? 'bg-cyan-600 border-cyan-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="spray-can" className="w-4 h-4"/> <span className="text-xs font-bold">Alcohol</span>
                                </button>
                                <button onClick={() => { setMethod(0); setSteps({}); }} className={`item-btn flex-1 py-2.5 rounded-lg border flex items-center justify-center gap-1 ${method === 0 ? 'bg-red-600 border-red-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="x-circle" className="w-4 h-4"/> <span className="text-xs font-bold">ไม่ล้าง</span>
                                </button>
                            </div>
                        </div>

                        {/* 5. Steps (Compact) */}
                        {method !== 0 && method !== '' && (
                            <div className="animate-fade-in pb-1">
                                <div className="text-[10px] text-slate-500 ml-1 flex justify-between font-bold">
                                    <span>7 ขั้นตอน (แตะอันที่ไม่ได้ทำออก)</span>
                                </div>
                                <div className="grid grid-cols-4 gap-1">
                                    {[
                                        'ฝ่ามือถูฝ่ามือ',
                                        'ถูหลังมือ',
                                        'ถูซอกนิ้ว',
                                        'หลังนิ้ว',
                                        'หัวแม่มือ',
                                        'ปลายนิ้ว',
                                        'รอบข้อมือ'
                                    ].map((t, i) => {
                                        const id = i + 1;
                                        return (
                                            <button key={id} onClick={() => toggleStep(id)} 
                                                className={`item-btn px-0.5 py-1 rounded-md text-[9px] font-bold border flex flex-col items-center justify-center leading-none min-h-[40px] ${steps[id] ? 'bg-slate-800 border-emerald-500/30 text-slate-300' : 'bg-red-900/30 border-red-500/50 text-red-400 opacity-80'} ${id > 4 ? 'col-span-1.33' : ''}`}> 
                                                <style>{`.grid-cols-4 > button:nth-child(n+5) { grid-column: span 1.33; }`}</style>
                                                {steps[id] ? <LucideIcon name="check" className="w-3.5 h-3.5 text-emerald-500 mb-0.5"/> : <LucideIcon name="x" className="w-3.5 h-3.5 text-red-500 mb-0.5"/>}
                                                {t}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="mt-1 pb-4">
                            <button onClick={handleSubmit} disabled={!location || !hcw || !moment || method===''} 
                                className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-base shadow-lg shadow-emerald-900/50 active:scale-95 transition-all disabled:opacity-50 disabled:grayscale flex items-center justify-center gap-2">
                                <LucideIcon name="save" className="w-5 h-5"/> บันทึกข้อมูล
                            </button>
                        </div>
                    </div>

                    {/* Voice FAB */}
                    <button onClick={startListening} className="fixed bottom-6 right-6 w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 text-white shadow-[0_4px_20px_rgba(239,68,68,0.5)] flex items-center justify-center z-40 transition-transform active:scale-90 animate-bounce-in">
                        <LucideIcon name="mic" className="w-8 h-8" />
                    </button>

                    {showVoiceModal && <VoiceModal isListening={isListening} transcript={transcript} onClose={() => setShowVoiceModal(false)} />}
                    {showSuccess && <SuccessModal onClose={() => setShowSuccess(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
