<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SW-Hand Hygiene</title>
    
    <!-- Favicon (Hand Icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234ade80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0'/><path d='M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2'/><path d='M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8'/><path d='M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15'/></svg>">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .item-btn { transition: all 0.1s; }
        .item-btn:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glowing Hand Animation */
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px #4ade80); transform: scale(1); }
            50% { filter: drop-shadow(0 0 20px #22c55e); transform: scale(1.1); }
        }
        .animate-glow { animation: glow 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyX0pC3eLOod07tKyR3loiCecqps6er8EDcGhbtHVm885s2R2Zri6HSr94tKw3GosMI/exec";
        const LIFF_ID = "2008690634-UG4TJcVB";
        const REGISTER_URL = "https://sawee-hosp.github.io/ic/index.html";

        // Icon Helper
        const LucideIcon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    window.lucide.createIcons({
                        root: ref.current.parentNode,
                        nameAttr: 'data-lucide',
                        attrs: { class: className }
                    });
                }
            }, [name]);
            return <i data-lucide={name} ref={ref} className={className}></i>;
        };

        const SuccessModal = ({ onClose }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm cursor-pointer" onClick={onClose}>
                <div className="text-center p-8 pointer-events-none">
                    <div className="text-emerald-400 mb-6 animate-glow inline-block">
                        <LucideIcon name="hand-metal" className="w-32 h-32"/>
                    </div>
                    <h2 className="text-3xl font-bold text-white mb-2">บันทึกสำเร็จ!</h2>
                    <p className="text-slate-400 text-lg">แตะที่หน้าจอเพื่อเริ่มใหม่</p>
                </div>
            </div>
        );

        const App = () => {
            const [meta, setMeta] = useState({ locations: [], hcws: [], totalCount: 0 });
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showSuccess, setShowSuccess] = useState(false);

            // Form
            const [location, setLocation] = useState('');
            const [hcw, setHcw] = useState('');
            const [moment, setMoment] = useState('');
            const [method, setMethod] = useState('');
            const [steps, setSteps] = useState({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

            useEffect(() => {
                const init = async () => {
                    const cachedMeta = localStorage.getItem('hh_meta');
                    if (cachedMeta) setMeta(JSON.parse(cachedMeta));

                    if (window.liff) {
                        try {
                            await window.liff.init({ liffId: LIFF_ID });
                            if (!window.liff.isLoggedIn()) {
                                window.liff.login({ redirectUri: window.location.href });
                                return;
                            }
                            const profile = await window.liff.getProfile();
                            
                            // Check User in Sheet
                            const res = await fetch(GAS_URL, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'getUserProfile', userId: profile.userId })
                            }).then(r => r.json());

                            if (res.found) {
                                const userData = { ...res, picture: profile.pictureUrl };
                                setUser(userData);
                                localStorage.setItem('hh_user', JSON.stringify(userData));
                            } else {
                                alert("ไม่พบข้อมูลผู้ใช้งาน กรุณาลงทะเบียนก่อน");
                                window.location.href = REGISTER_URL; // Redirect to Register
                                return;
                            }
                        } catch (e) { console.error(e); }
                    }

                    // Load Meta
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getMetaData' }) })
                        .then(r => r.json())
                        .then(data => {
                            if (data.locations) {
                                setMeta(data);
                                localStorage.setItem('hh_meta', JSON.stringify(data));
                            }
                            setLoading(false);
                        });
                        
                    const lastLoc = localStorage.getItem('hh_last_loc');
                    if(lastLoc) setLocation(lastLoc);
                };
                init();
            }, []);

            const toggleStep = (num) => {
                setSteps(prev => ({ ...prev, [num]: !prev[num] }));
            };

            const handleSubmit = async () => {
                if (!location || !hcw || !moment || !method) {
                    alert("กรุณาเลือกข้อมูลให้ครบถ้วน");
                    return;
                }

                const payload = {
                    location, hcw, moment, method,
                    ...steps,
                    observer: user?.name || 'Unknown'
                };

                localStorage.setItem('hh_last_loc', location);
                
                setShowSuccess(true);
                setMeta(prev => ({...prev, totalCount: (prev.totalCount || 0) + 1}));

                setMoment('');
                setMethod('');
                setSteps({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveRecord', payload })
                });
            };

            if (loading && meta.locations.length === 0) return (
                <div className="flex h-screen items-center justify-center text-slate-400 font-bold">กำลังโหลด...</div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-20 p-2 flex flex-col">
                    {/* Header */}
                    <div className="glass-panel p-3 rounded-xl mb-3 flex items-center justify-between bg-gradient-to-r from-slate-800 to-slate-900 border-l-4 border-l-emerald-500">
                        <div className="flex items-center gap-3">
                            <div className="text-3xl animate-bounce">✋</div>
                            <div>
                                <div className="text-xl font-bold text-white leading-none tracking-tight">SW-Hand Hygiene</div>
                                <div className="text-[10px] text-slate-400">บันทึกการล้างมือ</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 text-right">
                             <div>
                                <div className="text-sm font-bold text-white truncate max-w-[100px]">{user?.name || 'Loading...'}</div>
                                <div className="text-[10px] text-slate-400 truncate max-w-[100px]">{user?.dept || ''}</div>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-slate-700 overflow-hidden border-2 border-slate-600 shadow-sm flex-shrink-0">
                                {user?.picture ? <img src={user.picture} className="w-full h-full object-cover"/> : <div className="flex items-center justify-center h-full"><LucideIcon name="user" className="w-5 h-5"/></div>}
                            </div>
                        </div>
                    </div>

                    {/* Progress */}
                    <div className="glass-panel px-3 py-2 rounded-xl mb-2 flex justify-between items-center">
                        <span className="text-xs text-slate-400 font-bold uppercase">เป้าหมายเดือนนี้</span>
                        <div className="flex items-center gap-2">
                             <div className="w-32 bg-slate-700 rounded-full h-2 overflow-hidden">
                                <div className="bg-emerald-500 h-2 rounded-full shadow-[0_0_10px_rgba(52,211,153,0.5)]" style={{ width: `${Math.min(((meta.totalCount||0)/100)*100, 100)}%` }}></div>
                            </div>
                            <span className="text-sm font-bold text-emerald-400">{meta.totalCount || 0}<span className="text-slate-500 text-[10px]">/100</span></span>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-4 pr-1">
                        {/* 1. Location */}
                        <div>
                            <label className="text-sm font-bold text-slate-300 ml-1 mb-1 block uppercase">1. สถานที่สังเกต (Location)</label>
                            <div className="grid grid-rows-2 grid-flow-col gap-2 overflow-x-auto no-scrollbar pb-1">
                                {meta.locations.map(l => (
                                    <button key={l.code} 
                                        onClick={() => setLocation(l.code)}
                                        className={`item-btn whitespace-nowrap px-3 py-2.5 rounded-lg text-xs font-bold border relative min-w-[120px] text-left transition-all ${location === l.code ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg scale-105' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {l.label}
                                        {l.count > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-indigo-500 rounded-full flex items-center justify-center text-[9px] text-white ring-2 ring-[#0f172a] shadow-sm">{l.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 2. HCW */}
                        <div>
                            <label className="text-sm font-bold text-slate-300 ml-1 mb-1 block uppercase">2. ผู้ถูกสังเกต (HCW)</label>
                            <div className="grid grid-rows-2 grid-flow-col gap-2 overflow-x-auto no-scrollbar pb-1">
                                {meta.hcws.map(h => (
                                    <button key={h.code} 
                                        onClick={() => setHcw(h.code)}
                                        className={`item-btn whitespace-nowrap px-3 py-2.5 rounded-lg text-xs font-bold border relative min-w-[120px] text-left transition-all ${hcw === h.code ? 'bg-pink-600 text-white border-pink-500 shadow-lg scale-105' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                        {h.label}
                                        {h.count > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-pink-500 rounded-full flex items-center justify-center text-[9px] text-white ring-2 ring-[#0f172a] shadow-sm">{h.count}</span>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 3. Moments (Vertical Stack) */}
                        <div>
                            <label className="text-sm font-bold text-slate-300 ml-1 mb-2 block uppercase">3. ข้อบ่งชี้ (Moments)</label>
                            <div className="flex flex-col gap-2">
                                {[
                                    { id: 1, label: 'ก่อนสัมผัสผู้ป่วย' },
                                    { id: 2, label: 'ก่อนทำหัตถการสะอาด/Aseptic' },
                                    { id: 3, label: 'หลังสัมผัสสารคัดหลั่ง' },
                                    { id: 4, label: 'หลังสัมผัสผู้ป่วย' },
                                    { id: 5, label: 'หลังสัมผัสสิ่งแวดล้อมรอบตัวผู้ป่วย' }
                                ].map(m => (
                                    <button key={m.id} onClick={() => setMoment(m.id)} 
                                        className={`w-full text-left p-3 rounded-xl border flex items-center gap-4 transition-all ${moment === m.id ? 'bg-blue-600 border-blue-500 text-white shadow-md transform scale-[1.02]' : 'bg-slate-800/80 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-xl font-black shadow-inner ${moment === m.id ? 'bg-white text-blue-600' : 'bg-slate-900 text-slate-600'}`}>
                                            {m.id}
                                        </div>
                                        <div className="text-sm font-medium">{m.label}</div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 4. Method */}
                        <div>
                            <label className="text-sm font-bold text-slate-300 ml-1 mb-2 block uppercase">4. วิธีการ (Method)</label>
                            <div className="grid grid-cols-3 gap-3">
                                <button onClick={() => setMethod(1)} className={`item-btn flex flex-col items-center justify-center py-4 rounded-xl border gap-2 transition-all ${method === 1 ? 'bg-emerald-600 border-emerald-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="droplets" className="w-8 h-8"/>
                                    <span className="text-sm font-bold">สบู่</span>
                                </button>
                                <button onClick={() => setMethod(2)} className={`item-btn flex flex-col items-center justify-center py-4 rounded-xl border gap-2 transition-all ${method === 2 ? 'bg-cyan-600 border-cyan-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="spray-can" className="w-8 h-8"/>
                                    <span className="text-sm font-bold">Alcohol</span>
                                </button>
                                <button onClick={() => { setMethod(0); setSteps({ 1: false, 2: false, 3: false, 4: false, 5: false, 6: false, 7: false }); }} className={`item-btn flex flex-col items-center justify-center py-4 rounded-xl border gap-2 transition-all ${method === 0 ? 'bg-red-600 border-red-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <LucideIcon name="x-circle" className="w-8 h-8"/>
                                    <span className="text-sm font-bold">ไม่ล้าง</span>
                                </button>
                            </div>
                        </div>

                        {/* 5. Steps (Grid 4 cols) */}
                        {method !== 0 && method !== '' && (
                            <div className="animate-fade-in pb-4">
                                <label className="text-sm font-bold text-slate-300 ml-1 mb-2 block uppercase flex justify-between items-end">
                                    <span>5. 7 Steps</span>
                                    <span className="text-xs text-slate-500 font-normal">*คลิกข้อที่ไม่ได้ทำออก</span>
                                </label>
                                <div className="grid grid-cols-4 gap-2">
                                    {[
                                        {id:1, t:'ฝ่ามือถูฝ่ามือ'},
                                        {id:2, t:'ฝ่ามือถูหลังมือ'},
                                        {id:3, t:'ถูซอกนิ้ว'},
                                        {id:4, t:'หลังนิ้วถูฝ่ามือ'},
                                        {id:5, t:'ถูหัวแม่มือ'},
                                        {id:6, t:'ปลายนิ้วถู'},
                                        {id:7, t:'ถูรอบข้อมือ'}
                                    ].map(s => (
                                        <button key={s.id} onClick={() => toggleStep(s.id)} 
                                            className={`item-btn px-1 py-3 rounded-xl text-[10px] font-bold border flex flex-col items-center justify-center gap-1 min-h-[80px] text-center leading-tight transition-all ${steps[s.id] ? 'bg-slate-800 border-emerald-500/50 text-emerald-400 shadow-sm' : 'bg-red-900/20 border-red-500/50 text-red-400 opacity-80'}`}>
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1 ${steps[s.id] ? 'bg-emerald-500/20' : 'bg-red-500/20'}`}>
                                                {steps[s.id] ? <LucideIcon name="check" className="w-5 h-5"/> : <LucideIcon name="x" className="w-5 h-5"/>}
                                            </div>
                                            <span>{s.t}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-[#0f172a]/95 backdrop-blur border-t border-slate-800 z-50">
                        <button onClick={handleSubmit} disabled={!location || !hcw || !moment || method===''} 
                            className="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-lg font-bold shadow-lg shadow-emerald-900/50 active:scale-95 transition-all disabled:opacity-50 disabled:grayscale flex items-center justify-center gap-3">
                            <LucideIcon name="save" className="w-6 h-6"/> บันทึกข้อมูล
                        </button>
                    </div>

                    {showSuccess && <SuccessModal onClose={() => setShowSuccess(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
