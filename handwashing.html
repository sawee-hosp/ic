<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Hygiene</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Google Sans', 'Sarabun', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            touch-action: manipulation; /* Faster touch response */
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .item-btn {
            transition: all 0.1s;
        }
        .item-btn:active {
            transform: scale(0.95);
        }
        /* Custom Scrollbar for horizontal lists */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyX0pC3eLOod07tKyR3loiCecqps6er8EDcGhbtHVm885s2R2Zri6HSr94tKw3GosMI/exec";
        const LIFF_ID = "2008690634-UG4TJcVB"; // Updated LIFF ID

        // Icon Helper
        const LucideIcon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    window.lucide.createIcons({
                        root: ref.current.parentNode,
                        nameAttr: 'data-lucide',
                        attrs: { class: className }
                    });
                }
            }, [name]);
            return <i data-lucide={name} ref={ref} className={className}></i>;
        };

        const App = () => {
            // Data State
            const [meta, setMeta] = useState({ locations: [], hcws: [] });
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            // Form State
            const [location, setLocation] = useState('');
            const [hcw, setHcw] = useState('');
            const [moment, setMoment] = useState('');
            const [method, setMethod] = useState('');
            const [steps, setSteps] = useState({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true });

            // Initialize
            useEffect(() => {
                const init = async () => {
                    // 1. Load cached meta if available
                    const cachedMeta = localStorage.getItem('hh_meta');
                    if (cachedMeta) setMeta(JSON.parse(cachedMeta));

                    // 2. LIFF & User
                    if (window.liff) {
                        try {
                            await window.liff.init({ liffId: LIFF_ID });
                            if (!window.liff.isLoggedIn()) {
                                window.liff.login({ redirectUri: window.location.href });
                                return;
                            }
                            const profile = await window.liff.getProfile();
                            
                            // Check Local Storage for User Profile first (Super Fast)
                            const cachedUser = localStorage.getItem('hh_user_' + profile.userId);
                            if (cachedUser) {
                                setUser(JSON.parse(cachedUser));
                            } else {
                                // Fetch from Sheet if not cached
                                fetch(GAS_URL, {
                                    method: 'POST',
                                    body: JSON.stringify({ action: 'getUserProfile', userId: profile.userId })
                                }).then(r => r.json()).then(res => {
                                    if (res.found) {
                                        const userData = { ...res, picture: profile.pictureUrl };
                                        setUser(userData);
                                        localStorage.setItem('hh_user_' + profile.userId, JSON.stringify(userData));
                                    } else {
                                        setUser({ name: profile.displayName, picture: profile.pictureUrl, dept: 'Guest' });
                                    }
                                });
                            }
                        } catch (e) { console.error(e); }
                    }

                    // 3. Background Fetch Meta (Update Cache)
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getMetaData' }) })
                        .then(r => r.json())
                        .then(data => {
                            if (data.locations) {
                                setMeta(data);
                                localStorage.setItem('hh_meta', JSON.stringify(data));
                            }
                            setLoading(false);
                        });
                        
                    // Restore previous selection (Location is usually static for one observer)
                    const lastLoc = localStorage.getItem('hh_last_loc');
                    if(lastLoc) setLocation(lastLoc);
                };
                init();
            }, []);

            const toggleStep = (num) => {
                setSteps(prev => ({ ...prev, [num]: !prev[num] }));
            };

            const handleSubmit = async () => {
                if (!location || !hcw || !moment || !method) {
                    alert("กรุณาเลือกข้อมูลให้ครบ (สถานที่, ผู้ถูกสังเกต, Moment, วิธีการ)");
                    return;
                }

                // Optimistic UI: Reset form immediately for next input
                const payload = {
                    location, hcw, moment, method,
                    ...steps,
                    observer: user?.name || 'Unknown'
                };

                // Save Location preference
                localStorage.setItem('hh_last_loc', location);

                // Reset specific fields for next person
                setMoment('');
                setMethod('');
                setSteps({ 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true }); // Reset steps to all true default
                
                // Show toast or subtle feedback
                const toast = document.createElement('div');
                toast.className = "fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-2 rounded-full shadow-lg z-50 animate-bounce";
                toast.innerText = "บันทึกสำเร็จ!";
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1500);

                // Send to background
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveRecord', payload })
                });
            };

            if (loading && meta.locations.length === 0) return (
                <div className="flex h-screen items-center justify-center text-slate-400">Loading...</div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-10 p-2">
                    {/* Header */}
                    <div className="glass-panel p-3 rounded-xl mb-3 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-slate-700 overflow-hidden border border-indigo-500/50">
                                {user?.picture ? <img src={user.picture} className="w-full h-full object-cover"/> : <div className="flex items-center justify-center h-full"><LucideIcon name="user" className="w-5 h-5"/></div>}
                            </div>
                            <div>
                                <div className="text-sm font-bold text-white">{user?.name || 'Guest'}</div>
                                <div className="text-[10px] text-slate-400">{user?.dept || '-'}</div>
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="text-xs text-indigo-300 font-bold">Hand Hygiene</div>
                            <div className="text-[10px] text-slate-500">Observation</div>
                        </div>
                    </div>

                    {/* 1. Location */}
                    <div className="mb-2">
                        <label className="text-xs text-slate-400 ml-1 mb-1 block">สถานที่ (Location)</label>
                        <div className="flex overflow-x-auto gap-2 no-scrollbar pb-1">
                            {meta.locations.map(l => (
                                <button key={l.code} 
                                    onClick={() => setLocation(l.code)}
                                    className={`item-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-bold border ${location === l.code ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                    {l.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 2. HCW */}
                    <div className="mb-2">
                        <label className="text-xs text-slate-400 ml-1 mb-1 block">ผู้ถูกสังเกต (HCW)</label>
                        <div className="flex overflow-x-auto gap-2 no-scrollbar pb-1">
                            {meta.hcws.map(h => (
                                <button key={h.code} 
                                    onClick={() => setHcw(h.code)}
                                    className={`item-btn whitespace-nowrap px-3 py-2 rounded-lg text-xs font-bold border ${hcw === h.code ? 'bg-pink-600 text-white border-pink-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                    {h.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 3. Moments (Grid) */}
                    <div className="mb-3">
                        <label className="text-xs text-slate-400 ml-1 mb-1 block">5 Moments</label>
                        <div className="grid grid-cols-5 gap-1.5">
                            {[1,2,3,4,5].map(m => (
                                <button key={m} onClick={() => setMoment(m)} className={`item-btn flex flex-col items-center justify-center p-2 rounded-xl border aspect-square ${moment === m ? 'bg-blue-500 border-blue-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                    <span className="text-xl font-black mb-1">{m}</span>
                                    <span className="text-[8px] leading-none text-center">Moment</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 4. Method */}
                    <div className="mb-3">
                        <label className="text-xs text-slate-400 ml-1 mb-1 block">วิธีการ (Method)</label>
                        <div className="grid grid-cols-3 gap-2">
                            <button onClick={() => setMethod(1)} className={`item-btn p-3 rounded-xl border text-center ${method === 1 ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <LucideIcon name="droplets" className="w-5 h-5 mx-auto mb-1"/>
                                <span className="text-xs">สบู่</span>
                            </button>
                            <button onClick={() => setMethod(2)} className={`item-btn p-3 rounded-xl border text-center ${method === 2 ? 'bg-cyan-600 border-cyan-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <LucideIcon name="spray-can" className="w-5 h-5 mx-auto mb-1"/>
                                <span className="text-xs">แอลกอฮอล์</span>
                            </button>
                            <button onClick={() => { setMethod(0); setSteps({ 1: false, 2: false, 3: false, 4: false, 5: false, 6: false, 7: false }); }} className={`item-btn p-3 rounded-xl border text-center ${method === 0 ? 'bg-red-600 border-red-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <LucideIcon name="x-circle" className="w-5 h-5 mx-auto mb-1"/>
                                <span className="text-xs">ไม่ล้าง</span>
                            </button>
                        </div>
                    </div>

                    {/* 5. Steps (Show only if washed) */}
                    {method !== 0 && method !== '' && (
                        <div className="mb-6">
                            <label className="text-xs text-slate-400 ml-1 mb-1 block">ขั้นตอน (แตะเพื่อเอาออก)</label>
                            <div className="grid grid-cols-4 gap-2">
                                {[
                                    {id:1, t:'ฝ่ามือ'}, {id:2, t:'หลังมือ'}, {id:3, t:'ซอกนิ้ว'}, 
                                    {id:4, t:'กำปั้น'}, {id:5, t:'หัวแม่มือ'}, {id:6, t:'ปลายนิ้ว'}, {id:7, t:'ข้อมือ'}
                                ].map(s => (
                                    <button key={s.id} onClick={() => toggleStep(s.id)} 
                                        className={`item-btn p-2 rounded-lg text-xs font-bold border transition-all ${steps[s.id] ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-slate-800/50 border-slate-700 text-slate-600 line-through decoration-slate-500'}`}>
                                        {s.id}. {s.t}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    <button onClick={handleSubmit} disabled={!location || !hcw || !moment || method===''} 
                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold shadow-lg active:scale-95 transition-transform disabled:opacity-50 disabled:grayscale">
                        บันทึกผลการสังเกต
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
