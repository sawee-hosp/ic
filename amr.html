<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW-1 Smart IC Dashboard</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Theme: Deep Space Purple/Slate */
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.2);
        }
        
        .neon-text { text-shadow: 0 0 10px currentColor; }
        .icon-glow { filter: drop-shadow(0 0 8px currentColor); }
        .germ-glow { filter: drop-shadow(0 0 5px currentColor); }

        .pineapple-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .pineapple-btn:hover { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.4)); background: rgba(234, 179, 8, 0.2); }

        /* Ticker Animation */
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-wrap { overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: ticker 40s linear infinite; }
        .ticker-wrap:hover .ticker-content { animation-play-state: paused; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        .bed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: #22d3ee; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        
        /* Debug Panel */
        .debug-panel { position: fixed; bottom: 80px; right: 20px; width: 400px; max-height: 500px; background: rgba(0,0,0,0.9); border: 1px solid #334155; color: #00ff00; font-family: monospace; font-size: 10px; z-index: 9999; overflow: auto; padding: 10px; border-radius: 8px; display: none; }
        .debug-panel.open { display: block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            ComposedChart, Line, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine 
        } = window.Recharts || {};

        // *** CONFIGURATION ***
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQRd_pMI2YCDkCZEJgj0GYkLSSgjK-DWDGleIksljsf13SIToe6MkgpzKnL9lk7TkkWQ/exec';
        
        const ORGANISM_GROUPS = [
            { base: 'Acinetobacter baumannii', keywords: ['baumannii'] },
            { base: 'Escherichia coli', keywords: ['coli'] },
            { base: 'Klebsiella pneumoniae', keywords: ['pneumoniae'] },
            { base: 'Staphylococcus aureus', keywords: ['aureus'] },
            { base: 'Enterococcus faecium', keywords: ['faecium'] },
            { base: 'Enterococcus faecalis', keywords: ['faecalis'] },
            { base: 'Pseudomonas aeruginosa', keywords: ['aeruginosa'] }
        ];

        // Mapped dddIcode to real ICODES from your CSV
        const KPI_CONFIG = [
            { id: 'crab', title: 'CRAB Trend', subtitle: 'A. baumannii vs Imipenem', organism: 'Acinetobacter baumannii', drugs: ['Imipenem', 'Meropenem', 'Doripenem'], color: '#f472b6', dddIcode: '1530156', dddName: 'Meropenem' },
            { id: 'cre-ec', title: 'CRE (E. coli)', subtitle: 'E. coli vs Meropenem', organism: 'Escherichia coli', drugs: ['Meropenem', 'Imipenem', 'Ertapenem'], color: '#c084fc', dddIcode: '1530156', dddName: 'Meropenem' },
            { id: 'cre-kp', title: 'CRE (K. pneumo)', subtitle: 'K. pneumoniae vs Meropenem', organism: 'Klebsiella pneumoniae', drugs: ['Meropenem', 'Imipenem', 'Ertapenem'], color: '#818cf8', dddIcode: '1530156', dddName: 'Meropenem' },
            { id: 'mrsa', title: 'MRSA Trend', subtitle: 'S. aureus vs Oxacillin', organism: 'Staphylococcus aureus', drugs: ['Oxacillin', 'Cefoxitin'], color: '#fbbf24', dddIcode: '1000106', dddName: 'Cloxacillin' }, 
            { id: '3gcr', title: '3GC-R (ESBL Proxy)', subtitle: 'E. coli vs Ceftriaxone', organism: 'Escherichia coli', drugs: ['Ceftriaxone', 'Cefotaxime', 'Ceftazidime'], color: '#34d399', dddIcode: '1000776', dddName: 'Ceftriaxone' },
            { id: 'vre', title: 'VRE Trend', subtitle: 'Enterococcus vs Vancomycin', organism: 'Enterococcus faecium', drugs: ['Vancomycin'], color: '#22d3ee', dddIcode: '1540012', dddName: 'Vancomycin' },
        ];

        // --- COMPONENTS ---
        const GermIcon = ({ color, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`germ-glow ${className}`} style={{ color: color }}>
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" fill={color} fillOpacity="0.2" />
                <path d="M8.5 8.5a2.5 2.5 0 1 0 2.5 2.5" />
                <path d="M13 13a3 3 0 1 0 3-3" />
                <path d="M9 16a4 4 0 1 0 4-4" />
                <circle cx="15" cy="9" r="1" fill={color} />
                <circle cx="9" cy="15" r="1" fill={color} />
            </svg>
        );

        const AlertTicker = () => (
             <div className="w-full bg-red-950/40 border-y border-red-500/20 text-red-100 py-2 relative overflow-hidden flex items-center backdrop-blur-sm z-20">
                <div className="bg-red-600 text-white text-xs font-bold px-3 py-1 ml-4 rounded z-10 shadow-[0_0_10px_rgba(220,38,38,0.5)] absolute left-0 flex items-center gap-1"><i data-lucide="siren" className="w-3 h-3 animate-pulse"></i> CRITICAL</div>
                <div className="ticker-wrap w-full">
                    <div className="ticker-content pl-24 text-sm font-light flex items-center">
                        <span className="mr-12 inline-flex items-center gap-2">System Status: Online</span>
                        <span className="mr-12 inline-flex items-center gap-2">Monitoring: Active</span>
                    </div>
                </div>
            </div>
        );

        const NumberCard = ({ title, value, unit, trend, trendVal, color, glowColor }) => (
            <div className="glass-panel p-5 rounded-2xl flex flex-col justify-between h-32 relative overflow-hidden group hover:border-white/20 transition-all">
                <div className="z-10">
                    <p className="text-slate-400 text-[10px] uppercase tracking-wider font-medium">{title}</p>
                    <div className="flex items-baseline gap-2 mt-2">
                        <span className={`text-4xl font-bold ${color} neon-text`} style={{color: glowColor}}>{value}</span>
                        <span className="text-xs text-slate-500 font-medium">{unit}</span>
                    </div>
                </div>
                <div className="z-10 flex items-center gap-1 text-[10px] mt-1 bg-slate-900/30 w-fit px-2 py-0.5 rounded-lg border border-white/5">
                    {trend === 'up' ? <i data-lucide="trending-up" className="text-red-400 w-3 h-3"></i> : <i data-lucide="trending-down" className="text-emerald-400 w-3 h-3"></i>}
                    <span className={trend === 'up' ? 'text-red-400' : 'text-emerald-400'}>{trendVal} from yesterday</span>
                </div>
                <div className="absolute -right-6 -bottom-6 w-24 h-24 rounded-full opacity-20 blur-2xl transition-all group-hover:opacity-30" style={{backgroundColor: glowColor}}></div>
            </div>
        );

        const AnalyzeModal = ({ isOpen, onClose, data, config }) => {
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (isOpen && data && config) {
                    analyzeData();
                } else {
                    setAnalysis(null);
                }
            }, [isOpen]);

            const analyzeData = async () => {
                setLoading(true);
                setAnalysis(null);
                try {
                    const trendData = data.map(d => ({ 
                        year: d.year, 
                        resistance: d.resistance, 
                        n: d.n,
                        ddd: d.ddd || 0 
                    }));
                    
                    const res = await fetch(GAS_API_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: 'analyze_trend',
                            organism: config.organism,
                            drug: config.drugs[0],
                            trendData: trendData
                        })
                    });
                    
                    const json = await res.json();
                    if(json.status === 'success') {
                        setAnalysis(json.answer);
                    } else {
                        setAnalysis("Error: " + (json.message || "Unknown error"));
                    }
                } catch (e) {
                    setAnalysis("Connection Error. Please check your internet.");
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="glass-panel w-full max-w-lg rounded-2xl overflow-hidden modal-enter border border-slate-600 shadow-2xl shadow-purple-900/20" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                            <div className="flex items-center gap-3">
                                <img src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" className="w-8 h-8 object-contain" />
                                <h3 className="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-amber-400">IC SW-1 Analysis</h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-6 h-6"></i></button>
                        </div>
                        <div className="p-6 min-h-[200px] max-h-[70vh] overflow-y-auto bg-slate-900/90">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-full py-8">
                                    <div className="loader mb-4"></div>
                                    <p className="text-slate-300 animate-pulse text-sm">กำลังวิเคราะห์ข้อมูล {config.title}...</p>
                                </div>
                            ) : (
                                <div className="prose prose-invert prose-sm max-w-none">
                                    <h4 className="text-emerald-400 mb-3 font-bold text-base flex items-center gap-2">
                                        <i data-lucide="activity" className="w-4 h-4"></i>
                                        {config.organism} vs {config.drugs[0]}
                                    </h4>
                                    <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 text-slate-200 leading-relaxed whitespace-pre-wrap font-light" dangerouslySetInnerHTML={{__html: analysis}}></div>
                                </div>
                            )}
                        </div>
                        <div className="p-3 border-t border-slate-700 bg-slate-900/50 text-center flex justify-between items-center px-6">
                            <span className="text-[10px] text-slate-500">Powered by Gemini 2.5 Flash</span>
                            <button onClick={onClose} className="text-xs text-slate-400 hover:text-white">Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AmrChartWidget = ({ config, data, onAnalyze }) => {
            const hasData = data && data.length > 0;
            const lastPoint = hasData ? data[data.length - 1] : null;
            const isLowN = lastPoint && lastPoint.n < 30;
            
            let trendIcon = <i data-lucide="minus" className="w-4 h-4 text-slate-500"></i>;
            let trendText = "Stable";
            if (data.length >= 2) {
                const diff = data[data.length - 1].resistance - data[data.length - 2].resistance;
                if (diff > 5) { trendIcon = <i data-lucide="trending-up" className="w-4 h-4 text-red-400"></i>; trendText = "Worsening"; }
                else if (diff < -5) { trendIcon = <i data-lucide="trending-down" className="w-4 h-4 text-emerald-400"></i>; trendText = "Improving"; }
            }

            return (
                <div className="glass-panel rounded-2xl p-5 flex flex-col h-[350px] relative overflow-hidden group transition-all hover:border-slate-500/30">
                    <div className="flex justify-between items-start mb-4 z-10">
                        <div className="flex items-center gap-3">
                            <div className="p-2 rounded-lg bg-slate-800/50 border border-slate-700">
                                <GermIcon color={config.color} className="w-8 h-8" />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-100 leading-tight">{config.title}</h3>
                                <p className="text-xs text-slate-400 flex items-center gap-1">
                                    {config.subtitle} 
                                    {lastPoint && lastPoint.drugUsed && <span className="text-[9px] bg-slate-700 px-1 rounded text-slate-300">({lastPoint.drugUsed})</span>}
                                </p>
                            </div>
                        </div>
                        
                        <div className="flex flex-col items-end">
                             {hasData ? (
                                <>
                                    <div className="flex items-center gap-3">
                                        <div className="text-3xl font-bold neon-text leading-none" style={{color: config.color}}>
                                            {lastPoint.resistance}% <span className="text-xs font-normal text-slate-500">R</span>
                                        </div>
                                        <button 
                                            onClick={() => onAnalyze(config, data)}
                                            className="pineapple-btn bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/30 px-2 py-1 rounded-full text-yellow-300 flex items-center gap-1.5 transition-all shadow-lg"
                                            title="Ask AI Analysis"
                                        >
                                            <img src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" className="w-4 h-4 object-contain" />
                                            <span className="text-[10px] font-medium whitespace-nowrap">วิเคราะห์ AI</span>
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-2 mt-2">
                                        {isLowN && (
                                            <span className="flex items-center gap-1 text-[10px] text-orange-300 bg-orange-900/30 px-1.5 py-0.5 rounded border border-orange-500/30" title="Sample size < 30">
                                                <i data-lucide="alert-triangle" className="w-3 h-3"></i> Low n ({lastPoint.n})
                                            </span>
                                        )}
                                        <span className="flex items-center gap-1 text-[10px] text-slate-400 bg-slate-800/50 px-1.5 py-0.5 rounded">
                                            {trendIcon} {trendText}
                                        </span>
                                    </div>
                                </>
                             ) : <span className="text-xs text-slate-500 mt-2">No Data</span>}
                        </div>
                    </div>

                    <div className="flex-grow w-full relative z-10">
                        {hasData ? (
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="year" stroke="#94a3b8" fontSize={10} tickLine={false} axisLine={false} dy={10} />
                                    
                                    <YAxis yAxisId="left" stroke="#94a3b8" fontSize={10} tickLine={false} axisLine={false} domain={[0, 100]} />
                                    
                                    {/* Auto-scaling right axis for DDD visibility */}
                                    <YAxis yAxisId="right" orientation="right" stroke="#ffffff" fontSize={10} tickLine={false} axisLine={false} domain={['auto', 'auto']} />
                                    
                                    <Tooltip 
                                        contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: config.color, color: '#fff', borderRadius: '8px' }}
                                        itemStyle={{ color: config.color }}
                                        labelStyle={{ color: '#cbd5e1', marginBottom: '4px' }}
                                    />
                                    <Legend verticalAlign="top" height={36} iconSize={8} wrapperStyle={{ fontSize: '10px' }}/>
                                    <ReferenceLine yAxisId="left" y={50} stroke="#ef4444" strokeDasharray="3 3" opacity={0.3} label={{ value: '50% R', fill: '#ef4444', fontSize: 9, opacity: 0.5 }} />
                                    
                                    <Line yAxisId="left" type="monotone" dataKey="resistance" name="% Resistance" stroke={config.color} strokeWidth={3} dot={{ fill: '#0f172a', stroke: config.color, strokeWidth: 2, r: 4 }} activeDot={{ r: 6, fill: '#fff', stroke: config.color }} animationDuration={1500} />
                                    <Line yAxisId="right" type="monotone" dataKey="ddd" name="DDD Use" stroke="#ffffff" strokeWidth={2} dot={false} strokeDasharray="4 4" opacity={0.8} />
                                </ComposedChart>
                            </ResponsiveContainer>
                        ) : (
                            <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-600 text-sm italic p-4 text-center">
                                <i data-lucide="search-x" className="w-8 h-8 mb-2 opacity-50"></i>
                                No data found for {config.organism}
                                <div className="text-[10px] mt-1 opacity-50">Checked: {config.drugs.join(', ')}</div>
                            </div>
                        )}
                    </div>
                    <div className="absolute -bottom-10 -right-10 w-40 h-40 rounded-full blur-3xl opacity-10 pointer-events-none" style={{backgroundColor: config.color}}></div>
                </div>
            );
        };

        const TotalDddChart = ({ data, drugKeys }) => {
            const hasData = data && data.length > 0;
            
            // Vibrant colors for drugs
            const colors = [
                '#f472b6', '#c084fc', '#818cf8', '#22d3ee', '#34d399', '#a3e635', 
                '#facc15', '#fb923c', '#f87171', '#94a3b8', '#64748b', '#ec4899'
            ];

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-blue-500/50 relative overflow-hidden">
                    <h3 className="text-white font-bold mb-4 flex items-center gap-2 text-lg">
                        <i data-lucide="bar-chart" className="w-5 h-5 text-blue-400 icon-glow"></i> Total Antibiotic Consumption (DDD/100 bed-days)
                    </h3>
                    <div className="h-[500px] relative z-10">
                        {hasData ? (
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={data} margin={{ top: 20, right: 30, left: 10, bottom: 50 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis 
                                        dataKey="name" 
                                        stroke="#94a3b8" 
                                        fontSize={12} 
                                        tickLine={false} 
                                        axisLine={false} 
                                        angle={-45} 
                                        textAnchor="end"
                                        dy={10}
                                    />
                                    <YAxis stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} label={{ value: 'DDD/100 bed-days', angle: -90, position: 'insideLeft', fill: '#94a3b8', fontSize: 10, dy: 50 }} />
                                    <Tooltip 
                                        contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: '#60a5fa', color: '#fff', borderRadius: '8px' }}
                                        labelStyle={{ color: '#cbd5e1' }}
                                    />
                                    <Legend 
                                        wrapperStyle={{ fontSize: '11px', paddingTop: '20px' }} 
                                        layout="horizontal" 
                                        verticalAlign="bottom" 
                                        align="center"
                                    />
                                    
                                    {/* Lines for each drug (All drugs > 0) */}
                                    {drugKeys.map((drug, index) => (
                                        <Line 
                                            key={drug} 
                                            type="monotone" 
                                            dataKey={drug} 
                                            name={drug} 
                                            stroke={colors[index % colors.length]} 
                                            strokeWidth={1.5} 
                                            dot={false}
                                            activeDot={{r: 4}}
                                            opacity={0.6}
                                        />
                                    ))}

                                    {/* Thick White Line for Total */}
                                    <Line 
                                        type="monotone" 
                                        dataKey="Total" 
                                        name="TOTAL (All Abx)" 
                                        stroke="#ffffff" 
                                        strokeWidth={4} 
                                        dot={{r:5, fill:'#fff', stroke:'none'}} 
                                        activeDot={{r:7, stroke:'rgba(255,255,255,0.5)', strokeWidth:4}} 
                                        shadow="0 0 15px white"
                                        style={{ filter: "drop-shadow(0px 0px 5px rgba(255, 255, 255, 0.5))" }}
                                    />
                                </ComposedChart>
                            </ResponsiveContainer>
                        ) : (
                            <div className="flex items-center justify-center h-full text-slate-500 text-sm">No Antibiotic Usage Data</div>
                        )}
                    </div>
                </div>
            );
        };

        const DebugView = ({ logs, visible }) => {
            if (!visible) return null;
            return (
                <div className="debug-panel open">
                    <h3 className="font-bold border-b border-green-500 mb-2 pb-1">Debug Log</h3>
                    {logs.map((log, i) => (
                        <div key={i} className="mb-1 whitespace-pre-wrap">{log}</div>
                    ))}
                </div>
            );
        };

        const App = () => {
            const [rawData, setRawData] = useState([]);
            const [dddRawData, setDddRawData] = useState([]);
            const [quarterlyChartData, setQuarterlyChartData] = useState({ data: [], keys: [] });
            const [headers, setHeaders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            // Debug State
            const [debugLogs, setDebugLogs] = useState([]);
            const [showDebug, setShowDebug] = useState(false);
            
            // Filter States
            const [selectedSpecimen, setSelectedSpecimen] = useState('All');
            const [selectedTime, setSelectedTime] = useState('All');
            const [specimenList, setSpecimenList] = useState([]);
            const [timeList, setTimeList] = useState([]);

            // Modal State
            const [modalOpen, setModalOpen] = useState(false);
            const [modalConfig, setModalConfig] = useState(null);
            const [modalData, setModalData] = useState(null);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); fetchData(); }, []);
            
            const addLog = (msg, obj = null) => {
                const txt = obj ? `${msg} ${JSON.stringify(obj)}` : msg;
                setDebugLogs(prev => [...prev, txt]);
                console.log(msg, obj);
            };

            const parseNum = (val) => {
                if (typeof val === 'number') return val;
                if (!val) return 0;
                // Remove commas and parse
                const clean = String(val).replace(/,/g, '').trim();
                return parseFloat(clean) || 0;
            };

            const fetchData = async () => {
                try {
                    addLog("Fetching data from GAS...");
                    const response = await fetch(`${GAS_API_URL}?action=api_data`);
                    const json = await response.json();
                    
                    if (json.status === 'success') {
                        addLog("Fetch Success. AMR rows:", json.amr.data.length);
                        addLog("DDD rows:", json.ddd ? json.ddd.length : 0);
                        if (json.ddd && json.ddd.length > 0) {
                            addLog("Sample DDD Row 0:", json.ddd[0]);
                        }

                        setRawData(json.amr.data);
                        setHeaders(json.amr.headers);
                        
                        // Clean numeric fields in DDD data AND Date Parsing
                        const cleanedDdd = (json.ddd || []).map(d => ({
                            ...d,
                            qty_ipd: parseNum(d.qty_ipd),
                            strength_mg: parseNum(d.strength_mg),
                            standard_ddd_mg: parseNum(d.standard_ddd_mg),
                            total_patient_days: parseNum(d.total_patient_days),
                            // Keep original month for debugging, but we'll parse it in process function
                        }));
                        setDddRawData(cleanedDdd);
                        
                        const specs = [...new Set(json.amr.data.map(r => r['Specimen']).filter(Boolean))].sort();
                        const times = [...new Set(json.amr.data.map(r => r['ปีที่ตรวจ']).filter(Boolean))].sort().reverse();
                        setSpecimenList(specs);
                        setTimeList(times);

                        // Process Quarterly DDD
                        addLog("Starting processQuarterlyDdd...");
                        const qResult = processQuarterlyDdd(cleanedDdd);
                        addLog("Processed Chart Data:", qResult.data.length);
                        if(qResult.data.length > 0) addLog("First Chart Point:", qResult.data[0]);
                        
                        setQuarterlyChartData({ data: qResult.data, keys: qResult.drugKeys });

                    } else { 
                        addLog("Fetch Error API:", json.message);
                        setError(json.message); 
                    }
                } catch (e) { 
                    addLog("Fetch Exception:", e.toString());
                    setError("Connection Failed."); 
                } finally { setLoading(false); }
            };

            // Robust Date Parser
            const parseMonthYear = (val) => {
                if (!val) return null;
                const str = String(val).trim();
                
                // Try "MM/YYYY" or "M/YYYY" with strict regex first
                const strictMatch = str.match(/^(\d{1,2})\/(\d{4})$/);
                if (strictMatch) {
                    return { m: parseInt(strictMatch[1]), y: parseInt(strictMatch[2]) };
                }
                
                // Try Javascript Date
                const d = new Date(str);
                if (!isNaN(d.getTime())) {
                    return { m: d.getMonth() + 1, y: d.getFullYear() };
                }
                
                return null;
            };

            const processQuarterlyDdd = (dddData) => {
                const quarterlyStats = {}; 
                const monthPatientDays = {}; // Use Map to deduplicate patient days by exact month string

                let rowsProcessed = 0;
                let rowsWithValidDate = 0;

                dddData.forEach((r, idx) => {
                    if (!r.month) return;
                    rowsProcessed++;

                    const dateObj = parseMonthYear(r.month);
                    if (!dateObj) {
                        if (idx < 5) addLog(`Row ${idx} Invalid Date:`, r.month);
                        return;
                    }
                    rowsWithValidDate++;

                    const { m, y } = dateObj;
                    const q = Math.ceil(m / 3);
                    const qKey = `Q${q}-${y}`;
                    const mKey = `${m}-${y}`; // Unique key for this month

                    // 1. Map Month -> Patient Days
                    // Assuming patient_days is consistent for the whole month file, take the max found
                    if (r.total_patient_days > 0) {
                        // Store using mKey to handle duplicates
                        if (!monthPatientDays[mKey] || r.total_patient_days > monthPatientDays[mKey]) {
                            monthPatientDays[mKey] = r.total_patient_days;
                        }
                    }

                    // 2. Sum DDD Units
                    if (r.drug_name && r.standard_ddd_mg > 0 && r.qty_ipd > 0) {
                        if (!quarterlyStats[qKey]) quarterlyStats[qKey] = {};
                        
                        let drugName = r.drug_name.replace(/\[.*?\]/g, '').replace(/^\*/, '').trim();
                        
                        const units = (r.qty_ipd * r.strength_mg) / r.standard_ddd_mg;
                        quarterlyStats[qKey][drugName] = (quarterlyStats[qKey][drugName] || 0) + units;
                    }
                });

                addLog(`Date Parsing Stats: ${rowsWithValidDate}/${rowsProcessed} rows valid.`);

                // 3. Aggregate Patient Days per Quarter
                const quarterPatientDays = {};
                Object.keys(monthPatientDays).forEach(mKey => {
                    const [m, y] = mKey.split('-').map(Number);
                    const q = Math.ceil(m/3);
                    const qKey = `Q${q}-${y}`;
                    quarterPatientDays[qKey] = (quarterPatientDays[qKey] || 0) + monthPatientDays[mKey];
                });

                // 4. Calculate Final Rates
                const finalChartData = [];
                const allDrugs = new Set();

                // Get all unique quarter keys from both sources
                const allQKeys = new Set([...Object.keys(quarterPatientDays), ...Object.keys(quarterlyStats)]);

                allQKeys.forEach(qKey => {
                    const pDays = quarterPatientDays[qKey] || 0;
                    // Log warning if no patient days but we have drug data
                    if (pDays === 0) return;

                    const dataObj = { name: qKey, Total: 0 };
                    const drugs = quarterlyStats[qKey] || {};
                    let totalUnitsInQuarter = 0;

                    Object.keys(drugs).forEach(drug => {
                        const units = drugs[drug];
                        if (units > 0) {
                            const rate = parseFloat(((units * 100) / pDays).toFixed(2));
                            if (rate > 0) {
                                dataObj[drug] = rate;
                                allDrugs.add(drug);
                                totalUnitsInQuarter += units;
                            }
                        }
                    });

                    dataObj.Total = parseFloat(((totalUnitsInQuarter * 100) / pDays).toFixed(2));
                    finalChartData.push(dataObj);
                });

                // Sort by Date
                finalChartData.sort((a, b) => {
                    const [qA, yA] = a.name.replace('Q', '').split('-');
                    const [qB, yB] = b.name.replace('Q', '').split('-');
                    if (yA !== yB) return yA - yB;
                    return qA - qB;
                });

                return { data: finalChartData, drugKeys: Array.from(allDrugs).sort() };
            };

            const getProcessedData = (kpiConfig) => {
                const chartData = [];
                let timePoints = [...new Set(rawData.map(r => r['ปีที่ตรวจ']).filter(Boolean))].sort();
                
                if (selectedTime !== 'All') {
                    timePoints = timePoints.filter(t => t === selectedTime);
                }

                timePoints.forEach(time => {
                    let totalS = 0;
                    let totalN = 0;
                    let drugUsed = "";
                    let sKey, tKey;
                    
                    for (const drug of kpiConfig.drugs) {
                        sKey = headers.find(h => h.includes(drug) && (h.includes('(ไว)') || h.includes('(S)')));
                        tKey = headers.find(h => h.includes(drug) && (h.includes('(ทั้งหมด)') || h.includes('(Total)')));
                        if (sKey && tKey) { drugUsed = drug; break; }
                    }

                    if (sKey && tKey) {
                        const relevantRows = rawData.filter(row => {
                            if (row['ปีที่ตรวจ'] !== time) return false;
                            if (selectedSpecimen !== 'All' && row['Specimen'] !== selectedSpecimen) return false;
                            return true;
                        });

                        relevantRows.forEach(row => {
                            const rawOrgName = row['ชื่อเชื้อ'];
                            if (!rawOrgName) return;
                            const orgGroup = ORGANISM_GROUPS.find(g => g.base === kpiConfig.organism);
                            if (orgGroup && orgGroup.keywords.some(kw => rawOrgName.toLowerCase().includes(kw))) {
                                totalS += parseNum(row[sKey]);
                                totalN += parseNum(row[tKey]);
                            }
                        });
                    }

                    // DDD Calculation for KPI (Yearly)
                    let dddVal = 0;
                    if (kpiConfig.dddIcode) {
                        const tYear = parseInt(time);
                        // Filter dddRawData for matching year and icode
                        let yearUnits = 0;
                        let yearDaysMap = {}; // Deduplicate days by month

                        dddRawData.forEach(d => {
                            if (!d.month || String(d.icode) !== String(kpiConfig.dddIcode)) return;
                            const dateObj = parseMonthYear(d.month);
                            if (!dateObj) return;
                            
                            // Check Year Match (Direct or BE)
                            if (dateObj.y === tYear || Math.abs(dateObj.y - tYear) === 543) {
                                // Add Units
                                if (d.standard_ddd_mg > 0 && d.qty_ipd > 0) {
                                    yearUnits += (d.qty_ipd * d.strength_mg) / d.standard_ddd_mg;
                                }
                                // Track days
                                const mKey = `${dateObj.m}-${dateObj.y}`;
                                if (d.total_patient_days > 0) {
                                     if (!yearDaysMap[mKey] || d.total_patient_days > yearDaysMap[mKey]) {
                                         yearDaysMap[mKey] = d.total_patient_days;
                                     }
                                }
                            }
                        });

                        const totalYearDays = Object.values(yearDaysMap).reduce((a,b)=>a+b, 0);
                        if (totalYearDays > 0) {
                            dddVal = parseFloat(((yearUnits * 100) / totalYearDays).toFixed(2));
                        }
                    }

                    if (totalN > 0 || dddVal > 0) {
                        const pctR = totalN > 0 ? (100 - ((totalS / totalN) * 100)) : null;
                        chartData.push({ 
                            year: time, 
                            resistance: pctR !== null ? parseFloat(pctR.toFixed(1)) : null, 
                            n: totalN, 
                            drugUsed: drugUsed,
                            ddd: dddVal 
                        });
                    }
                });
                return chartData;
            };

            const handleAnalyze = (config, data) => {
                setModalConfig(config);
                setModalData(data);
                setModalOpen(true);
            };

            if (loading) return <div className="min-h-screen flex flex-col items-center justify-center bg-[#0f172a]"><div className="loader mb-4"></div><p className="text-cyan-400 animate-pulse">Loading...</p></div>;
            if (error) return <div className="min-h-screen flex items-center justify-center bg-[#0f172a] text-red-400"><p>{error}</p></div>;

            return (
                <div className="min-h-screen pb-10 relative">
                    {/* Fixed Background Logo */}
                    <div className="fixed inset-0 z-[-1] flex items-center justify-center overflow-hidden bg-[#0f172a]">
                         <img 
                            src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" 
                            className="w-full h-full object-cover opacity-10 pointer-events-none"
                            alt="Background"
                         />
                    </div>
                    
                    {/* Debug Button */}
                    <button onClick={() => setShowDebug(!showDebug)} className="fixed bottom-4 right-4 z-50 bg-slate-800 p-2 rounded-full border border-slate-600 text-slate-400 hover:text-green-400 transition-colors" title="Toggle Debug Log">
                        <i data-lucide="bug" className="w-5 h-5"></i>
                    </button>
                    <DebugView logs={debugLogs} visible={showDebug} />

                    {/* Header */}
                    <header className="glass-panel sticky top-0 z-50 border-b-0 backdrop-blur-xl bg-slate-900/80 relative">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="relative">
                                    <img src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" className="h-10 w-auto drop-shadow-[0_0_10px_rgba(99,102,241,0.6)]" />
                                    <div className="absolute inset-0 bg-indigo-500/20 blur-xl rounded-full"></div>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300" style={{textShadow: '0 0 20px rgba(167,139,250,0.3)'}}>SW-1 Smart IC</h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-[0.2em]">Hospital Infection Control</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden md:block">
                                    <div className="text-xs text-indigo-300 font-mono">{new Date().toLocaleDateString('th-TH', { dateStyle: 'long' })}</div>
                                    <div className="text-[10px] text-slate-500 flex items-center justify-end gap-1">
                                        <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div> System Online
                                    </div>
                                </div>
                                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-[0_0_15px_rgba(99,102,241,0.4)] border border-white/10">S</div>
                            </div>
                        </div>
                    </header>

                    {/* Alert Ticker (Demo) */}
                    <AlertTicker />

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-6 relative z-10">
                        
                        {/* Zone 1: Real-time (Demo Data) */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            <div className="lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                                <NumberCard title="Active HAI Cases" value="12" unit="Cases" trend="up" trendVal="+2" color="text-red-400" glowColor="#f87171" />
                                <NumberCard title="VAP Cases" value="5" unit="Cases" trend="down" trendVal="-1" color="text-yellow-400" glowColor="#facc15" />
                                <NumberCard title="Isolations" value="8" unit="Rooms" trend="up" trendVal="+1" color="text-orange-400" glowColor="#fb923c" />
                            </div>
                            <div className="lg:col-span-4 h-full">
                                <WardMap />
                            </div>
                        </div>

                        {/* Zone 2: Surveillance (Real AMR Data) */}
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            {/* Filter Column */}
                            <div className="lg:col-span-1 space-y-4">
                                <div className="glass-panel p-5 rounded-2xl border-l-4 border-indigo-500">
                                    <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><i data-lucide="filter" className="w-4 h-4 text-indigo-400"></i> Filters</h3>
                                    
                                    <div className="mb-4">
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Specimen</label>
                                        <div className="relative">
                                            <select value={selectedSpecimen} onChange={(e) => setSelectedSpecimen(e.target.value)} className="w-full bg-slate-900 text-white border border-slate-700 rounded-lg py-2 pl-3 pr-8 appearance-none focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                                                <option value="All">All Specimens</option>
                                                {specimenList.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                            <i data-lucide="chevron-down" className="absolute right-3 top-2.5 w-4 h-4 text-slate-500 pointer-events-none"></i>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Time Period</label>
                                        <div className="relative">
                                            <select value={selectedTime} onChange={(e) => setSelectedTime(e.target.value)} className="w-full bg-slate-900 text-white border border-slate-700 rounded-lg py-2 pl-3 pr-8 appearance-none focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                                                <option value="All">All History</option>
                                                {timeList.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                            <i data-lucide="calendar" className="absolute right-3 top-2.5 w-4 h-4 text-slate-500 pointer-events-none"></i>
                                        </div>
                                    </div>
                                </div>
                                <div className="glass-panel p-4 rounded-xl flex items-center justify-between border-t-2 border-t-blue-500/30">
                                    <div><p className="text-slate-400 text-xs uppercase tracking-wider">Total Isolates</p><h4 className="text-2xl font-bold mt-1 text-white">{rawData.length}</h4></div>
                                    <i data-lucide="database" className="w-6 h-6 text-blue-400 opacity-50"></i>
                                </div>
                            </div>

                            {/* Charts Grid */}
                            <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                                {KPI_CONFIG.map(config => (
                                    <AmrChartWidget 
                                        key={config.id} 
                                        config={config} 
                                        data={getProcessedData(config)} 
                                        onAnalyze={handleAnalyze}
                                    />
                                ))}
                            </div>
                        </div>

                        {/* Zone 3: Total DDD & AI */}
                        <div className="grid grid-cols-1 gap-6">
                            <TotalDddChart data={quarterlyChartData.data} drugKeys={quarterlyChartData.keys} />
                        </div>

                    </main>

                    <AnalyzeModal 
                        isOpen={modalOpen} 
                        onClose={() => setModalOpen(false)} 
                        config={modalConfig} 
                        data={modalData} 
                    />
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
