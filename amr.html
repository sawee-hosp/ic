<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW-1 Smart IC Dashboard</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="https://i.ibb.co/vCWyf6b4/ic-foamboard-60x75cm-500-x-500-px-1.gif" type="image/gif">

    <style>
        /* Theme: Deep Space Purple/Slate */
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        /* Ambient Gradient at bottom-right of cards */
        .card-gradient::after {
            content: '';
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        
        .neon-text { text-shadow: 0 0 10px currentColor; }
        .icon-glow { filter: drop-shadow(0 0 8px currentColor); }
        .germ-glow { filter: drop-shadow(0 0 5px currentColor); }
        
        @keyframes handPulse { 0%, 100% { filter: drop-shadow(0 0 5px #4ade80); } 50% { filter: drop-shadow(0 0 15px #22c55e); transform: scale(1.05); } }
        .hand-glow { animation: handPulse 3s infinite ease-in-out; color: #4ade80; }

        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ticker-wrap { overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: ticker 40s linear infinite; }
        .ticker-wrap:hover .ticker-content { animation-play-state: paused; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        
        /* Compact Bed Grid */
        .bed-grid-container { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px; }
        .bed-box {
            font-size: 7px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            border-radius: 2px; cursor: pointer; border: 1px solid rgba(71, 85, 105, 0.5); 
            background: rgba(30, 41, 59, 0.8); color: #64748b; height: 18px; /* Reduced Size */
            white-space: nowrap; overflow: hidden; transition: all 0.2s;
        }
        .bed-box:hover { z-index: 10; transform: scale(1.5); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* Bed States */
        .bed-active { color: white; border: none !important; }
        .bed-CAUTI { background: #fbbf24; color: #451a03; }
        .bed-VAP { background: #3b82f6; }
        .bed-PVC { background: #ef4444; }
        .bed-SSI { background: #10b981; }
        .bed-MDR { background: #a855f7; }
        .bed-hai-alert { box-shadow: 0 0 0 1px #ef4444, 0 0 6px #ef4444 !important; animation: pulse-red 1s infinite; z-index: 20; }
        
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: #22d3ee; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        
        .pineapple-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .pineapple-btn:hover { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.4)); background: rgba(234, 179, 8, 0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            ComposedChart, Line, Bar, BarChart, AreaChart, Area, PieChart, Pie, Cell, 
            XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, Label 
        } = window.Recharts || {};

        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQRd_pMI2YCDkCZEJgj0GYkLSSgjK-DWDGleIksljsf13SIToe6MkgpzKnL9lk7TkkWQ/exec';
        
        const ORGANISM_GROUPS = [
            { base: 'Acinetobacter baumannii', keywords: ['baumannii'] },
            { base: 'Escherichia coli', keywords: ['coli'] },
            { base: 'Klebsiella pneumoniae', keywords: ['pneumoniae'] },
            { base: 'Staphylococcus aureus', keywords: ['aureus'] },
            { base: 'Enterococcus faecium', keywords: ['faecium'] },
            { base: 'Enterococcus faecalis', keywords: ['faecalis'] },
            { base: 'Pseudomonas aeruginosa', keywords: ['aeruginosa'] }
        ];

        const KPI_CONFIG = [
            { id: 'crab', title: 'CRAB Trend', subtitle: 'A. baumannii vs Imipenem', organism: 'Acinetobacter baumannii', drugs: ['Imipenem', 'Meropenem', 'Doripenem'], color: '#f472b6', dddIcode: '1530156', dddName: 'Meropenem' },
            { id: 'cre-ec', title: 'CRE (E. coli)', subtitle: 'E. coli vs Meropenem', organism: 'Escherichia coli', drugs: ['Meropenem', 'Imipenem', 'Ertapenem'], color: '#c084fc', dddIcode: '1530156', dddName: 'Meropenem' },
            { id: 'cre-kp', title: 'CRE (K. pneumo)', subtitle: 'K. pneumoniae vs Meropenem', organism: 'Klebsiella pneumoniae', drugs: ['Meropenem', 'Imipenem', 'Ertapenem'], color: '#818cf8', dddIcode: '1530156', dddName: 'Meropenem' },
            { id: 'mrsa', title: 'MRSA Trend', subtitle: 'S. aureus vs Oxacillin', organism: 'Staphylococcus aureus', drugs: ['Oxacillin', 'Cefoxitin'], color: '#fbbf24', dddIcode: '1000106', dddName: 'Cloxacillin' },
            { id: '3gcr', title: '3GC-R (ESBL Proxy)', subtitle: 'E. coli vs Ceftriaxone', organism: 'Escherichia coli', drugs: ['Ceftriaxone', 'Cefotaxime', 'Ceftazidime'], color: '#34d399', dddIcode: '1000776', dddName: 'Ceftriaxone' },
            { id: 'vre', title: 'VRE Trend', subtitle: 'Enterococcus vs Vancomycin', organism: 'Enterococcus faecium', drugs: ['Vancomycin'], color: '#22d3ee', dddIcode: '1540012', dddName: 'Vancomycin' },
        ];

        // --- COMPONENTS ---
        const GermIcon = ({ color, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`germ-glow ${className}`} style={{ color: color }}><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" fill={color} fillOpacity="0.2" /><path d="M8.5 8.5a2.5 2.5 0 1 0 2.5 2.5" /><path d="M13 13a3 3 0 1 0 3-3" /><path d="M9 16a4 4 0 1 0 4-4" /><circle cx="15" cy="9" r="1" fill={color} /><circle cx="9" cy="15" r="1" fill={color} /></svg>
        );

        const GlowingHandIcon = () => (
            <div className="relative flex items-center justify-center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8 hand-glow relative z-10"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><div className="absolute w-full h-full bg-green-500/20 rounded-full blur-xl animate-pulse"></div></div>
        );

        const AlertTicker = ({ alerts }) => {
            if (!alerts || alerts.length === 0) return null;
            return (
                <div className="w-full bg-red-950/40 border-y border-red-500/20 text-red-100 py-2 relative overflow-hidden flex items-center backdrop-blur-sm z-20">
                    <div className="bg-red-600 text-white text-xs font-bold px-3 py-1 ml-4 rounded z-10 shadow-[0_0_10px_rgba(220,38,38,0.5)] absolute left-0 flex items-center gap-1"><i data-lucide="siren" className="w-3 h-3 animate-pulse"></i> CRITICAL</div>
                    <div className="ticker-wrap w-full">
                        <div className="ticker-content pl-24 text-sm font-light flex items-center">
                            {alerts.map((alert, idx) => (
                                <span key={idx} className="mr-12 inline-flex items-center gap-2">
                                    <span className="bg-red-500/10 px-2 py-0.5 rounded border border-red-500/30 text-xs font-mono text-red-300">{new Date(alert.date).toLocaleDateString()}</span>
                                    <span className="font-semibold text-red-200">{alert.ward}</span> 
                                    <span className="text-slate-400">|</span>
                                    <span>Bed {alert.bed}</span>
                                    <i data-lucide="arrow-right" className="w-3 h-3 text-red-500"></i>
                                    <b className="text-red-100 underline decoration-red-500/50 decoration-dotted">{alert.haiType}</b>
                                </span>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const BedHistoryModal = ({ bedId, history, onClose }) => {
            if (!bedId) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="glass-panel w-full max-w-md rounded-2xl overflow-hidden modal-enter border border-slate-600" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-slate-700 bg-slate-900/50 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-white">Bed History: {bedId}</h3>
                            <button onClick={onClose}><i data-lucide="x" className="w-5 h-5 text-slate-400 hover:text-white"></i></button>
                        </div>
                        <div className="p-4 max-h-[60vh] overflow-y-auto bg-slate-900/80">
                            {history.length === 0 ? <p className="text-slate-500 text-center">No history found.</p> : (
                                <ul className="space-y-3">
                                    {history.map((rec, idx) => (
                                        <li key={idx} className={`p-3 rounded-lg border ${rec.status === 'Active' ? 'bg-emerald-900/20 border-emerald-500/30' : 'bg-slate-800/50 border-slate-700'}`}>
                                            <div className="flex justify-between mb-1">
                                                <span className="font-bold text-sm text-slate-200">HN: {rec.hn}</span>
                                                <span className={`text-[10px] px-2 rounded-full ${rec.status === 'Active' ? 'bg-emerald-500 text-black' : 'bg-slate-600 text-slate-300'}`}>{rec.status}</span>
                                            </div>
                                            <div className="text-xs text-slate-400">Bundle: <span className="text-white">{rec.bundle || '-'}</span></div>
                                            <div className="text-xs text-slate-400">Date: {rec.date ? new Date(rec.date).toLocaleDateString() : '-'} {rec.endDate ? ` - ${rec.endDate}` : ''}</div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const BundleHaiSurveillance = ({ activeCases, haiCases }) => {
            const [selectedBed, setSelectedBed] = useState(null);
            
            // Reduced size bed IDs
            const maleBeds = [...Array.from({length:25},(_,i)=>`M${i+1}`), ...Array.from({length:6},(_,i)=>`P${i+7}`), ...Array.from({length:10},(_,i)=>`SM${i+1}`)];
            const femaleBeds = [...Array.from({length:25},(_,i)=>`F${i+1}`), ...Array.from({length:6},(_,i)=>`P${i+1}`), ...Array.from({length:10},(_,i)=>`SF${i+1}`)];
            const lrBeds = Array.from({length:5},(_,i)=>`LR${i+1}`);
            const erBeds = Array.from({length:5},(_,i)=>`ER${i+1}`);

            const getBedStatus = (bedId) => {
                const active = activeCases.find(c => c.bed === bedId && c.status === 'Active');
                const hai = haiCases.find(h => h.bed === bedId && h.status === 'แจ้ง ICN');
                let classes = "bed-box";
                if (active) {
                    classes += " bed-active";
                    if (active.bundle.includes('CAUTI')) classes += " bed-CAUTI";
                    else if (active.bundle.includes('VAP')) classes += " bed-VAP";
                    else if (active.bundle.includes('PVC')) classes += " bed-PVC";
                    else if (active.bundle.includes('SSI')) classes += " bed-SSI";
                    else if (active.bundle.includes('MDR')) classes += " bed-MDR";
                    else classes += " bg-indigo-500";
                }
                if (hai) classes += " bed-hai-alert";
                return { classes };
            };

            const getBedHistory = (bedId) => activeCases.filter(c => c.bed === bedId).sort((a,b) => new Date(b.date) - new Date(a.date));

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-purple-500/50 h-full flex flex-col card-gradient">
                    <div className="flex justify-between items-center mb-4 z-10 relative">
                        <h3 className="text-sm font-bold text-white flex items-center gap-2">
                            <i data-lucide="activity" className="w-5 h-5 text-purple-400 icon-glow"></i> Bundle & HAI Surveillance
                        </h3>
                        <div className="text-[9px] text-slate-400 flex gap-2">
                             <span className="flex items-center gap-1"><div className="w-1.5 h-1.5 bg-yellow-500 rounded-full"></div>CAUTI</span>
                             <span className="flex items-center gap-1"><div className="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>VAP</span>
                             <span className="flex items-center gap-1"><div className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse shadow-[0_0_5px_red]"></div>HAI</span>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto pr-1 z-10 relative">
                         <div className="mb-1"><span className="text-[9px] text-slate-500 uppercase font-bold">Male Ward</span></div>
                         <div className="bed-grid-container mb-3">{maleBeds.map(id => <div key={id} className={getBedStatus(id).classes} onClick={() => setSelectedBed(id)}>{id}</div>)}</div>
                         
                         <div className="mb-1"><span className="text-[9px] text-slate-500 uppercase font-bold">Female Ward</span></div>
                         <div className="bed-grid-container mb-3">{femaleBeds.map(id => <div key={id} className={getBedStatus(id).classes} onClick={() => setSelectedBed(id)}>{id}</div>)}</div>
                         
                         <div className="grid grid-cols-2 gap-4">
                             <div><div className="mb-1"><span className="text-[9px] text-slate-500 uppercase font-bold">LR</span></div><div className="grid grid-cols-5 gap-1">{lrBeds.map(id => <div key={id} className={getBedStatus(id).classes} onClick={() => setSelectedBed(id)}>{id}</div>)}</div></div>
                             <div><div className="mb-1"><span className="text-[9px] text-slate-500 uppercase font-bold">ER</span></div><div className="grid grid-cols-5 gap-1">{erBeds.map(id => <div key={id} className={getBedStatus(id).classes} onClick={() => setSelectedBed(id)}>{id}</div>)}</div></div>
                         </div>
                    </div>
                    {selectedBed && <BedHistoryModal bedId={selectedBed} history={getBedHistory(selectedBed)} onClose={() => setSelectedBed(null)} />}
                </div>
            );
        };

        const HandHygieneSection = ({ data }) => {
            if (!data) return <div className="glass-panel p-6 text-center text-slate-500 card-gradient">Loading Hand Hygiene...</div>;

            const now = new Date();
            const currentMonthName = now.toLocaleString('en-US', { month: 'short', year: 'numeric' });
            
            const currentMonthData = data.records.filter(r => {
                const d = new Date(r.ts);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });

            const totalCurr = currentMonthData.length;
            const validCurr = currentMonthData.filter(r => r.method !== 0).length;
            const missedCurr = totalCurr - validCurr;
            
            const pieData = [
                { name: 'Compliant', value: validCurr },
                { name: 'Missed', value: missedCurr }
            ];
            const COLORS = ['#10b981', '#ef4444'];

            const trendStats = {};
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            
            for(let i=5; i>=0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const key = `${months[d.getMonth()]} ${d.getFullYear().toString().substr(-2)}`;
                trendStats[key] = { name: key, correct: 0, missed: 0, order: d.getTime() };
            }

            data.records.forEach(r => {
                const d = new Date(r.ts);
                const key = `${months[d.getMonth()]} ${d.getFullYear().toString().substr(-2)}`;
                if(trendStats[key]) {
                    if(r.method !== 0) trendStats[key].correct++;
                    else trendStats[key].missed++;
                }
            });
            const trendData = Object.values(trendStats).sort((a,b) => a.order - b.order);

            const validRecords = data.records.filter(r => r.method !== 0);
            
            const stepCounts = Array(7).fill(0);
            validRecords.forEach(r => {
                r.steps.forEach((s, idx) => { if(s === 1) stepCounts[idx]++; });
            });
            const stepData = stepCounts.map((val, idx) => ({ name: `S${idx+1}`, value: val }));

            const momentCounts = {};
            validRecords.forEach(r => {
                if(r.moment) momentCounts[r.moment] = (momentCounts[r.moment] || 0) + 1;
            });
            const momentData = [1,2,3,4,5].map(m => ({ name: `M${m}`, value: momentCounts[m] || 0 }));

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-emerald-500/50 card-gradient h-full">
                    <div className="flex items-center gap-3 mb-4">
                         <div className="p-2 bg-emerald-900/30 rounded-lg border border-emerald-500/30"><GlowingHandIcon /></div>
                         <div>
                            <h3 className="text-lg font-bold text-white leading-tight">Hand Hygiene</h3>
                            <p className="text-xs text-slate-400">Compliance & Quality</p>
                         </div>
                    </div>

                    <div className="grid grid-cols-12 gap-4">
                        {/* KPI Section */}
                        <div className="col-span-4 flex flex-col items-center justify-center border-r border-slate-700/50 pr-2">
                             <div className="text-xs text-slate-400 mb-1">{currentMonthName} (Current)</div>
                             <div className="text-4xl font-bold text-emerald-400 neon-text">{validCurr}</div>
                             <div className="text-[10px] text-slate-500 mb-2">Clean Hands</div>
                             <div className="w-24 h-24 relative">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={pieData} innerRadius={25} outerRadius={35} paddingAngle={5} dataKey="value" stroke="none">
                                            {pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index]} />)}
                                        </Pie>
                                    </PieChart>
                                </ResponsiveContainer>
                                <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white">
                                    {totalCurr > 0 ? Math.round((validCurr/totalCurr)*100) : 0}%
                                </div>
                             </div>
                        </div>

                        {/* Trend & Analysis Section */}
                        <div className="col-span-8 flex flex-col gap-3">
                            <div className="h-24">
                                <div className="text-[10px] text-slate-400 mb-1 flex justify-between"><span>6-Month Trend</span><span className="flex gap-2"><span className="text-emerald-500">Correct</span><span className="text-red-500">Missed</span></span></div>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={trendData} margin={{top:0, bottom:0}}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" opacity={0.5} />
                                        <XAxis dataKey="name" stroke="#64748b" fontSize={9} tickLine={false} axisLine={false} interval={0} />
                                        <Tooltip contentStyle={{backgroundColor:'#1e293b', borderColor:'#475569', fontSize:'10px'}} />
                                        <Bar dataKey="correct" stackId="a" fill="#10b981" radius={[0,0,2,2]} />
                                        <Bar dataKey="missed" stackId="a" fill="#ef4444" radius={[2,2,0,0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="grid grid-cols-2 gap-2 h-20">
                                <div>
                                    <div className="text-[9px] text-slate-500 mb-1">Top Steps (1-7)</div>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={stepData}>
                                            <Bar dataKey="value" fill="#3b82f6" radius={[2,2,0,0]} />
                                            <XAxis dataKey="name" stroke="#64748b" fontSize={8} tickLine={false} axisLine={false} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <div>
                                    <div className="text-[9px] text-slate-500 mb-1">Top Moments (1-5)</div>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={momentData}>
                                            <Bar dataKey="value" fill="#f59e0b" radius={[2,2,0,0]} />
                                            <XAxis dataKey="name" stroke="#64748b" fontSize={8} tickLine={false} axisLine={false} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LabCultureWidget = ({ data }) => {
            const processedData = useMemo(() => {
                if(!data || data.length === 0) return [];
                const counts = {};
                data.forEach(r => {
                    const spec = r['Specimen'];
                    if(spec) counts[spec] = (counts[spec] || 0) + 1;
                });
                return Object.keys(counts).map(k => ({ name: k, value: counts[k] }))
                             .sort((a,b) => b.value - a.value).slice(0, 5); // Top 5
            }, [data]);

            const COLORS = ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981', '#f59e0b'];

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-indigo-500/50 card-gradient h-full">
                    <h3 className="text-white font-bold mb-4 flex items-center gap-2 text-sm">
                        <i data-lucide="flask-conical" className="w-4 h-4 text-indigo-400 icon-glow"></i> Lab Culture (Top Specimens)
                    </h3>
                    <div className="h-48 relative">
                        <ResponsiveContainer width="100%" height="100%">
                            <PieChart>
                                <Pie data={processedData} cx="50%" cy="50%" innerRadius={40} outerRadius={60} paddingAngle={5} dataKey="value" stroke="none">
                                    {processedData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                </Pie>
                                <Tooltip contentStyle={{backgroundColor:'#1e293b', borderColor:'#6366f1', color:'#fff', fontSize:'12px'}} />
                                <Legend layout="vertical" verticalAlign="middle" align="right" wrapperStyle={{fontSize:'10px', color:'#cbd5e1'}} />
                            </PieChart>
                        </ResponsiveContainer>
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <span className="text-xs text-indigo-300 font-bold opacity-80">1 Year</span>
                        </div>
                    </div>
                </div>
            );
        };

        const AmrStackedTrendWidget = ({ rawData }) => {
            const processedData = useMemo(() => {
                if (!rawData || rawData.length === 0) return [];

                const quarters = {};
                rawData.forEach(r => {
                    const year = r['ปีที่ตรวจ'];
                    const timeKey = year; // Use Year as key
                    const organism = r['ชื่อเชื้อ'] || "";
                    
                    if (!quarters[timeKey]) quarters[timeKey] = { name: timeKey, MDR: 0, Normal: 0, order: parseInt(timeKey) || 0 };
                    
                    if (organism.includes('(') && organism.includes(')')) {
                        quarters[timeKey].MDR++;
                    } else {
                        quarters[timeKey].Normal++;
                    }
                });

                return Object.values(quarters).sort((a,b) => a.order - b.order).slice(-6);
            }, [rawData]);

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-pink-500/50 card-gradient">
                    <h3 className="text-white font-bold mb-4 flex items-center gap-2 text-sm">
                        <i data-lucide="bar-chart-2" className="w-4 h-4 text-pink-400 icon-glow"></i> MDR vs Normal Ratio
                    </h3>
                    <div className="h-48">
                        <ResponsiveContainer width="100%" height="100%">
                            <BarChart data={processedData} margin={{top:10, right:10, left:-20, bottom:0}}>
                                <defs>
                                    <linearGradient id="gradMDR" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#ec4899" stopOpacity={1}/>
                                        <stop offset="100%" stopColor="#be185d" stopOpacity={0.8}/>
                                    </linearGradient>
                                    <linearGradient id="gradNormal" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#3b82f6" stopOpacity={1}/>
                                        <stop offset="100%" stopColor="#1d4ed8" stopOpacity={0.8}/>
                                    </linearGradient>
                                </defs>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" />
                                <XAxis dataKey="name" stroke="#94a3b8" fontSize={10} tickLine={false} axisLine={false} />
                                <YAxis stroke="#94a3b8" fontSize={10} tickLine={false} axisLine={false} />
                                <Tooltip cursor={{fill: 'rgba(255,255,255,0.05)'}} contentStyle={{backgroundColor:'#1e293b', borderColor:'#ec4899', color:'#fff', fontSize:'12px'}} />
                                <Legend iconType="circle" wrapperStyle={{fontSize:'10px', paddingTop:'10px'}} />
                                <Bar dataKey="MDR" stackId="a" fill="url(#gradMDR)" name="Resistant (MDR)" radius={[4,4,0,0]} />
                                <Bar dataKey="Normal" stackId="a" fill="url(#gradNormal)" name="Susceptible" radius={[0,0,4,4]} />
                            </BarChart>
                        </ResponsiveContainer>
                    </div>
                </div>
            );
        };

        const TotalDddChart = ({ data, drugKeys }) => {
            const hasData = data && data.length > 0;
            const colors = [ '#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#60a5fa', '#f87171', '#c084fc', '#818cf8', '#2dd4bf', '#fb923c', '#a3e635', '#22d3ee' ];
            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-blue-500/50 card-gradient h-full">
                    <h3 className="text-white font-bold mb-4 flex items-center gap-2 text-lg"><i data-lucide="bar-chart" className="w-5 h-5 text-blue-400 icon-glow"></i> Total Antibiotic Consumption (Quarterly)</h3>
                    <div className="h-64 relative z-10">
                        {hasData ? (
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={data} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} />
                                    <YAxis stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} label={{ value: 'DDD/100 bed-days', angle: -90, position: 'insideLeft', fill: '#94a3b8', fontSize: 10 }} />
                                    <Tooltip contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: '#60a5fa', color: '#fff', borderRadius: '8px' }} />
                                    <Legend wrapperStyle={{ fontSize: '10px', paddingTop: '10px' }} iconType="circle" />
                                    {drugKeys.map((drug, index) => (
                                        <Line key={drug} type="monotone" dataKey={drug} name={drug} stroke={colors[index % colors.length]} strokeWidth={1.5} dot={false} activeDot={{r: 4}} opacity={0.7} />
                                    ))}
                                    <Line type="monotone" dataKey="Total" name="TOTAL Usage" stroke="#ffffff" strokeWidth={4} dot={{r:4, fill:'#fff'}} activeDot={{r:6}} shadow="0 0 10px white" />
                                </ComposedChart>
                            </ResponsiveContainer>
                        ) : (
                            <div className="flex items-center justify-center h-full text-slate-500 text-sm">No Antibiotic Usage Data</div>
                        )}
                    </div>
                </div>
            );
        };

        const AnalyzeModal = ({ isOpen, onClose, data, config }) => {
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (isOpen && data && config) analyzeData();
                else setAnalysis(null);
            }, [isOpen]);

            const analyzeData = async () => {
                setLoading(true);
                setAnalysis(null);
                try {
                    const trendData = data.map(d => ({ year: d.year, resistance: d.resistance, n: d.n, ddd: d.ddd || 0 }));
                    const res = await fetch(GAS_API_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: 'analyze_trend', organism: config.organism, drug: config.drugs[0], trendData: trendData })
                    });
                    const json = await res.json();
                    if(json.status === 'success') setAnalysis(json.answer);
                    else setAnalysis("Error: " + (json.message || "Unknown error"));
                } catch (e) { setAnalysis("Connection Error."); } finally { setLoading(false); }
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="glass-panel w-full max-w-lg rounded-2xl overflow-hidden modal-enter border border-slate-600 shadow-2xl shadow-purple-900/20" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                            <div className="flex items-center gap-3"><h3 className="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-amber-400">IC SW-1 Analysis</h3></div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-6 h-6"></i></button>
                        </div>
                        <div className="p-6 min-h-[200px] max-h-[70vh] overflow-y-auto bg-slate-900/90">
                            {loading ? <div className="flex flex-col items-center justify-center h-full py-8"><div className="loader mb-4"></div><p className="text-slate-300 animate-pulse text-sm">กำลังวิเคราะห์ข้อมูล...</p></div> : <div className="prose prose-invert prose-sm max-w-none"><div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 text-slate-200 leading-relaxed whitespace-pre-wrap font-light" dangerouslySetInnerHTML={{__html: analysis}}></div></div>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [rawData, setRawData] = useState([]);
            const [dddRawData, setDddRawData] = useState([]);
            const [hhRawData, setHhRawData] = useState(null); 
            const [haiRawData, setHaiRawData] = useState({ active_cases: [], hai_cases: [] });
            const [quarterlyChartData, setQuarterlyChartData] = useState({ data: [], keys: [] });
            const [headers, setHeaders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const [selectedSpecimen, setSelectedSpecimen] = useState('All');
            const [selectedTime, setSelectedTime] = useState('All');
            const [specimenList, setSpecimenList] = useState([]);
            const [timeList, setTimeList] = useState([]);
            const [modalOpen, setModalOpen] = useState(false);
            const [modalConfig, setModalConfig] = useState(null);
            const [modalData, setModalData] = useState(null);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); fetchData(); }, []);

            const fetchData = async () => {
                try {
                    const response = await fetch(`${GAS_API_URL}?action=api_data`);
                    const json = await response.json();
                    if (json.status === 'success') {
                        setRawData(json.amr.data);
                        setHeaders(json.amr.headers);
                        setDddRawData(json.ddd);
                        setHhRawData(json.hh);
                        setHaiRawData(json.hai);

                        const specs = [...new Set(json.amr.data.map(r => r['Specimen']).filter(Boolean))].sort();
                        const times = [...new Set(json.amr.data.map(r => r['ปีที่ตรวจ']).filter(Boolean))].sort().reverse();
                        setSpecimenList(specs);
                        setTimeList(times);

                        const qResult = processQuarterlyDdd(json.ddd);
                        setQuarterlyChartData({ data: qResult.data, keys: qResult.drugKeys });
                    } else { setError(json.message); }
                } catch (e) { setError("Connection Failed. " + e.message); } finally { setLoading(false); }
            };

            const processQuarterlyDdd = (dddData) => {
                const monthlyData = {};
                dddData.forEach(r => {
                    if (!r.month) return;
                    if (!monthlyData[r.month]) monthlyData[r.month] = { patientDays: r.total_patient_days || 0, drugs: {} };
                    if (r.standard_ddd_mg > 0 && r.qty_ipd > 0) {
                        const units = (r.qty_ipd * r.strength_mg) / r.standard_ddd_mg;
                        const drugName = r.drug_name.replace(/\*|\[.*?\]/g, '').trim();
                        monthlyData[r.month].drugs[drugName] = (monthlyData[r.month].drugs[drugName] || 0) + units;
                    }
                });
                const qData = {};
                Object.keys(monthlyData).forEach(mStr => {
                    const [m, y] = mStr.split('/');
                    if(m && y) {
                        const q = Math.ceil(parseInt(m)/3);
                        const qKey = `Q${q}-${y}`;
                        if (!qData[qKey]) qData[qKey] = { patientDays: 0, drugs: {} };
                        qData[qKey].patientDays += monthlyData[mStr].patientDays;
                        Object.keys(monthlyData[mStr].drugs).forEach(drug => {
                            qData[qKey].drugs[drug] = (qData[qKey].drugs[drug] || 0) + monthlyData[mStr].drugs[drug];
                        });
                    }
                });
                const finalChartData = Object.keys(qData).map(qKey => {
                    const d = qData[qKey];
                    if (d.patientDays === 0) return null;
                    const item = { name: qKey, Total: 0 };
                    Object.keys(d.drugs).forEach(drug => {
                        const val = (d.drugs[drug] * 100) / d.patientDays;
                        if (val > 0) { item[drug] = parseFloat(val.toFixed(2)); item.Total += item[drug]; }
                    });
                    item.Total = parseFloat(item.Total.toFixed(2));
                    return item;
                }).filter(x => x && x.Total > 0).sort((a, b) => {
                    const [qA, yA] = a.name.split('-'); const [qB, yB] = b.name.split('-');
                    if (yA !== yB) return yA - yB; return qA.localeCompare(qB);
                });
                const allDrugs = new Set();
                finalChartData.forEach(d => Object.keys(d).forEach(k => { if (k !== 'name' && k !== 'Total') allDrugs.add(k); }));
                return { data: finalChartData, drugKeys: Array.from(allDrugs).sort() };
            };

            const getProcessedData = (kpiConfig) => {
                const chartData = [];
                let timePoints = [...new Set(rawData.map(r => r['ปีที่ตรวจ']).filter(Boolean))].sort();
                if (selectedTime !== 'All') timePoints = timePoints.filter(t => t === selectedTime);
                timePoints.forEach(time => {
                    let totalS = 0; let totalN = 0; let drugUsed = ""; let sKey, tKey;
                    for (const drug of kpiConfig.drugs) {
                        sKey = headers.find(h => h.includes(drug) && (h.includes('(ไว)') || h.includes('(S)')));
                        tKey = headers.find(h => h.includes(drug) && (h.includes('(ทั้งหมด)') || h.includes('(Total)')));
                        if (sKey && tKey) { drugUsed = drug; break; }
                    }
                    if (sKey && tKey) {
                        const relevantRows = rawData.filter(row => {
                            if (row['ปีที่ตรวจ'] !== time) return false;
                            if (selectedSpecimen !== 'All' && row['Specimen'] !== selectedSpecimen) return false;
                            return true;
                        });
                        relevantRows.forEach(row => {
                            const rawOrgName = row['ชื่อเชื้อ'];
                            if (!rawOrgName) return;
                            const orgGroup = ORGANISM_GROUPS.find(g => g.base === kpiConfig.organism);
                            if (orgGroup && orgGroup.keywords.some(kw => rawOrgName.toLowerCase().includes(kw))) {
                                const parseVal = (v) => { if(!v) return 0; const str = String(v).replace(/,/g, '').trim(); if(['R','S','I','-','No growth'].includes(str)) return 0; return parseFloat(str) || 0; };
                                totalS += parseVal(row[sKey]);
                                totalN += parseVal(row[tKey]);
                            }
                        });
                    }
                    let dddVal = 0;
                    if (kpiConfig.dddIcode && dddRawData.length > 0) {
                        const tYear = parseInt(time);
                        const matchingRows = dddRawData.filter(d => {
                            if (!d.month || String(d.icode).trim() !== String(kpiConfig.dddIcode).trim()) return false;
                            const [m, yStr] = d.month.split('/');
                            const dYear = parseInt(yStr);
                            return (dYear === tYear) || (Math.abs(dYear - tYear) === 543);
                        });
                        if (matchingRows.length > 0) {
                            const monthStats = {};
                            matchingRows.forEach(r => {
                                if (!monthStats[r.month]) monthStats[r.month] = { pDay: r.total_patient_days, unit: 0 };
                                if (r.standard_ddd_mg > 0) monthStats[r.month].unit += (r.qty_ipd * r.strength_mg) / r.standard_ddd_mg;
                            });
                            let sumUnits = 0; let sumDays = 0;
                            Object.values(monthStats).forEach(s => { sumUnits += s.unit; sumDays += s.pDay; });
                            if (sumDays > 0) dddVal = parseFloat(((sumUnits * 100) / sumDays).toFixed(2));
                        }
                    }
                    if (totalN > 0 || dddVal > 0) {
                        const pctR = totalN > 0 ? (100 - ((totalS / totalN) * 100)) : null;
                        chartData.push({ year: time, resistance: pctR !== null ? parseFloat(pctR.toFixed(1)) : null, n: totalN, drugUsed: drugUsed, ddd: dddVal });
                    }
                });
                return chartData;
            };

            const handleAnalyze = (config, data) => { setModalConfig(config); setModalData(data); setModalOpen(true); };

            if (loading) return <div className="min-h-screen flex flex-col items-center justify-center bg-[#0f172a]"><div className="loader mb-4"></div><p className="text-cyan-400 animate-pulse">Loading...</p></div>;
            if (error) return <div className="min-h-screen flex items-center justify-center bg-[#0f172a] text-red-400"><p>{error}</p></div>;

            return (
                <div className="min-h-screen pb-10 relative">
                    <div className="fixed inset-0 z-[-1] flex items-center justify-center overflow-hidden bg-[#0f172a]"><img src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" className="w-full h-full object-cover opacity-10 pointer-events-none" /></div>
                    <header className="glass-panel sticky top-0 z-50 border-b-0 backdrop-blur-xl bg-slate-900/80 relative">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">SW-1 Smart IC</h1>
                            </div>
                            <div className="flex items-center gap-4"><div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div> Live</div>
                        </div>
                    </header>
                    <AlertTicker alerts={haiRawData.hai_cases.filter(h => h.status === 'แจ้ง ICN')} />
                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-6 relative z-10">
                        {/* Top Row: Hand Hygiene & Bundle & Lab */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <HandHygieneSection data={hhRawData} meta={hhRawData ? hhRawData.locations : {}} />
                            <BundleHaiSurveillance activeCases={haiRawData.active_cases} haiCases={haiRawData.hai_cases} />
                            <div className="grid grid-rows-2 gap-6">
                                <LabCultureWidget data={rawData} />
                                <AmrStackedTrendWidget rawData={rawData} />
                            </div>
                        </div>

                        {/* Middle Row: Total DDD */}
                        <div className="grid grid-cols-1 gap-6"><TotalDddChart data={quarterlyChartData.data} drugKeys={quarterlyChartData.keys} /></div>

                        {/* Bottom Row: AMR Charts */}
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            <div className="lg:col-span-1 space-y-4">
                                <div className="glass-panel p-5 rounded-2xl border-l-4 border-indigo-500">
                                    <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><i data-lucide="filter" className="w-4 h-4 text-indigo-400"></i> Filters</h3>
                                    <div className="mb-4">
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Specimen</label>
                                        <div className="relative"><select value={selectedSpecimen} onChange={(e) => setSelectedSpecimen(e.target.value)} className="w-full bg-slate-900 text-white border border-slate-700 rounded-lg py-2 pl-3 pr-8 appearance-none focus:outline-none focus:border-indigo-500 text-sm"><option value="All">All Specimens</option>{specimenList.map(s => <option key={s} value={s}>{s}</option>)}</select><i data-lucide="chevron-down" className="absolute right-3 top-2.5 w-4 h-4 text-slate-500 pointer-events-none"></i></div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Time Period</label>
                                        <div className="relative"><select value={selectedTime} onChange={(e) => setSelectedTime(e.target.value)} className="w-full bg-slate-900 text-white border border-slate-700 rounded-lg py-2 pl-3 pr-8 appearance-none focus:outline-none focus:border-indigo-500 text-sm"><option value="All">All History</option>{timeList.map(t => <option key={t} value={t}>{t}</option>)}</select><i data-lucide="calendar" className="absolute right-3 top-2.5 w-4 h-4 text-slate-500 pointer-events-none"></i></div>
                                    </div>
                                </div>
                            </div>
                            <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                                {KPI_CONFIG.map(config => <AmrChartWidget key={config.id} config={config} data={getProcessedData(config)} onAnalyze={handleAnalyze} />)}
                            </div>
                        </div>
                    </main>
                    <AnalyzeModal isOpen={modalOpen} onClose={() => setModalOpen(false)} config={modalConfig} data={modalData} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
