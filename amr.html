<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW-1 Smart IC Dashboard</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Theme: Deep Space Purple/Slate */
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.2);
        }
        
        .neon-text { text-shadow: 0 0 10px currentColor; }
        .icon-glow { filter: drop-shadow(0 0 8px currentColor); }
        .germ-glow { filter: drop-shadow(0 0 5px currentColor); }

        .pineapple-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .pineapple-btn:hover { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.4)); background: rgba(234, 179, 8, 0.2); }

        /* Bed Grid System */
        .bed-grid-container {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr)); 
            gap: 3px;
        }
        
        .bed-box {
            font-size: 9px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(148, 163, 184, 0.2); 
            background: rgba(30, 41, 59, 0.6);
            color: #94a3b8;
            height: 24px; 
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.2s;
        }
        .bed-box:hover { transform: scale(1.2); z-index: 10; border-color: rgba(255,255,255,0.8); }

        /* Bundle Colors */
        .bed-active { color: white; border: none !important; box-shadow: 0 1px 2px rgba(0,0,0,0.5); text-shadow: 0 1px 1px rgba(0,0,0,0.8); }
        .bed-CAUTI { background: #fbbf24; color: #451a03; }
        .bed-VAP { background: #3b82f6; }
        .bed-PVC { background: #ef4444; }
        .bed-SSI { background: #10b981; }
        .bed-MDR { background: #a855f7; }
        .bed-Unknown { background: #64748b; }

        /* HAI Alert Animation */
        .bed-hai-alert { 
            box-shadow: 0 0 0 2px #ef4444, 0 0 8px #ef4444 !important;
            animation: pulse-red 1.5s infinite; 
            z-index: 20;
        }
        @keyframes pulse-red { 
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px #ef4444, 0 0 8px #ef4444; } 
            50% { transform: scale(1.1); box-shadow: 0 0 0 4px #ef4444, 0 0 15px #ef4444; } 
        }

        /* Hand Glow Animation */
        .hand-glow-green {
            filter: drop-shadow(0 0 10px #34d399);
            animation: hand-pulse 2s infinite ease-in-out;
        }
        @keyframes hand-pulse {
            0%, 100% { filter: drop-shadow(0 0 8px #34d399); opacity: 0.9; }
            50% { filter: drop-shadow(0 0 15px #34d399); opacity: 1; transform: scale(1.05); }
        }

        /* Ticker */
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ticker-wrap { overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: ticker 40s linear infinite; }
        .ticker-wrap:hover .ticker-content { animation-play-state: paused; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: #22d3ee; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            ComposedChart, Line, Bar, BarChart, AreaChart, Area, PieChart, Pie, Cell,
            XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine 
        } = window.Recharts || {};

        // *** CONFIGURATION ***
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQRd_pMI2YCDkCZEJgj0GYkLSSgjK-DWDGleIksljsf13SIToe6MkgpzKnL9lk7TkkWQ/exec';

        const ORGANISM_GROUPS = [
            { base: 'Acinetobacter baumannii', keywords: ['baumannii'] },
            { base: 'Escherichia coli', keywords: ['coli'] },
            { base: 'Klebsiella pneumoniae', keywords: ['pneumoniae'] },
            { base: 'Staphylococcus aureus', keywords: ['aureus'] },
            { base: 'Enterococcus faecium', keywords: ['faecium'] },
            { base: 'Enterococcus faecalis', keywords: ['faecalis'] },
            { base: 'Pseudomonas aeruginosa', keywords: ['aeruginosa'] }
        ];

        const KPI_CONFIG = [
            { id: 'crab', title: 'CRAB Trend', subtitle: 'A. baumannii vs Imipenem', organism: 'Acinetobacter baumannii', drugs: ['Imipenem', 'Meropenem', 'Doripenem'], color: '#f472b6', dddIcode: '1530156', dddName: 'Meropenem Use' },
            { id: 'cre-ec', title: 'CRE (E. coli)', subtitle: 'E. coli vs Meropenem', organism: 'Escherichia coli', drugs: ['Meropenem', 'Imipenem', 'Ertapenem'], color: '#c084fc', dddIcode: '1530156', dddName: 'Meropenem Use' },
            { id: 'cre-kp', title: 'CRE (K. pneumo)', subtitle: 'K. pneumoniae vs Meropenem', organism: 'Klebsiella pneumoniae', drugs: ['Meropenem', 'Imipenem', 'Ertapenem'], color: '#818cf8', dddIcode: '1530156', dddName: 'Meropenem Use' },
            { id: 'mrsa', title: 'MRSA Trend', subtitle: 'S. aureus vs Oxacillin', organism: 'Staphylococcus aureus', drugs: ['Oxacillin', 'Cefoxitin'], color: '#fbbf24', dddIcode: '1000106', dddName: 'Cloxacillin Use' },
            { id: '3gcr', title: '3GC-R (ESBL Proxy)', subtitle: 'E. coli vs Ceftriaxone', organism: 'Escherichia coli', drugs: ['Ceftriaxone', 'Cefotaxime', 'Ceftazidime'], color: '#34d399', dddIcode: '1000776', dddName: 'Ceftriaxone Use' },
            { id: 'vre', title: 'VRE Trend', subtitle: 'Enterococcus vs Vancomycin', organism: 'Enterococcus faecium', drugs: ['Vancomycin'], color: '#22d3ee', dddIcode: '1540012', dddName: 'Vancomycin Use' },
        ];

        // --- COMPONENTS ---

        const GermIcon = ({ color, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`germ-glow ${className}`} style={{ color: color }}>
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" fill={color} fillOpacity="0.2" />
                <path d="M8.5 8.5a2.5 2.5 0 1 0 2.5 2.5" />
                <path d="M13 13a3 3 0 1 0 3-3" />
                <path d="M9 16a4 4 0 1 0 4-4" />
                <circle cx="15" cy="9" r="1" fill={color} />
                <circle cx="9" cy="15" r="1" fill={color} />
            </svg>
        );

        const AlertTicker = ({ alerts }) => (
            <div className="w-full bg-red-950/40 border-y border-red-500/20 text-red-100 py-2 relative overflow-hidden flex items-center backdrop-blur-sm z-20">
                <div className="bg-red-600 text-white text-xs font-bold px-3 py-1 ml-4 rounded z-10 shadow-[0_0_10px_rgba(220,38,38,0.5)] absolute left-0 flex items-center gap-1">
                    <i data-lucide="siren" className="w-3 h-3 animate-pulse"></i> ACTIVE HAI
                </div>
                <div className="ticker-wrap w-full">
                    <div className="ticker-content pl-28 text-sm font-light flex items-center">
                        {alerts && alerts.length > 0 ? alerts.map((alert, idx) => (
                            <span key={idx} className="mr-12 inline-flex items-center gap-2">
                                <span className="font-semibold text-red-200">{alert.ward}</span> 
                                <span className="text-slate-400">|</span>
                                <span className="font-mono bg-red-500/20 px-1 rounded">{alert.bed}</span>
                                <i data-lucide="arrow-right" className="w-3 h-3 text-red-500"></i>
                                <b className="text-red-100 underline decoration-red-500/50 decoration-dotted">{alert.type}</b>
                            </span>
                        )) : <span className="ml-4 text-emerald-400 flex items-center gap-2"><i data-lucide="check-circle" className="w-4 h-4"></i> No Active HAI Cases Reported</span>}
                    </div>
                </div>
            </div>
        );

        const BedModal = ({ isOpen, onClose, data, loading }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="glass-panel w-full max-w-2xl rounded-2xl overflow-hidden modal-enter border border-slate-600 shadow-2xl" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                            <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                <i data-lucide="bed-double" className="w-5 h-5 text-indigo-400"></i>
                                {data?.title || 'Bed History'}
                            </h3>
                            <button onClick={onClose}><i data-lucide="x" className="w-6 h-6 text-slate-400"></i></button>
                        </div>
                        <div className="p-6 max-h-[60vh] overflow-y-auto bg-slate-900/90">
                            {loading ? (
                                <div className="text-center py-8 text-indigo-300 animate-pulse">Loading History...</div>
                            ) : (
                                <table className="w-full text-sm text-left text-slate-300">
                                    <thead className="text-xs text-slate-400 uppercase bg-slate-800">
                                        <tr>
                                            <th className="px-4 py-2">Start Date</th>
                                            <th className="px-4 py-2">HN</th>
                                            <th className="px-4 py-2">Bundle</th>
                                            <th className="px-4 py-2">Outcome</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data?.history?.map((row, i) => (
                                            <tr key={i} className="border-b border-slate-800 hover:bg-slate-800/50">
                                                <td className="px-4 py-2 font-mono text-indigo-300">{row.startDate}</td>
                                                <td className="px-4 py-2">{row.hn}</td>
                                                <td className="px-4 py-2">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] ${row.bundle === 'CAUTI' ? 'bg-yellow-900/50 text-yellow-200' : 'bg-blue-900/50 text-blue-200'}`}>
                                                        {row.bundle}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-2 text-slate-400">{row.status === 'Active' ? <span className="text-emerald-400">Admitted</span> : row.outcome}</td>
                                            </tr>
                                        ))}
                                        {(!data?.history || data.history.length === 0) && (
                                            <tr><td colSpan="4" className="text-center py-4 text-slate-500">No history found</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const BedGrid = ({ bedData, onBedClick }) => {
            const genBeds = (prefix, start, end) => Array.from({length: end-start+1}, (_, i) => `${prefix}${start+i}`);
            const wards = [
                { name: "Ward Male", beds: [...genBeds('M',1,25), ...genBeds('P',7,12), ...genBeds('SM',1,10)] },
                { name: "Ward Female", beds: [...genBeds('F',1,25), ...genBeds('P',1,6), ...genBeds('SF',1,10)] },
                { name: "Critical", beds: [...genBeds('LR',1,5), ...genBeds('ER',1,5)] }
            ];

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-indigo-500/50 h-full">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-white font-bold flex items-center gap-2">
                            <i data-lucide="layout-grid" className="w-5 h-5 text-indigo-400"></i> Bed Management
                        </h3>
                        <div className="flex gap-2 text-[10px] flex-wrap justify-end">
                            <span className="px-1.5 py-0.5 rounded bg-[#fbbf24] text-[#451a03]">CAUTI</span>
                            <span className="px-1.5 py-0.5 rounded bg-[#3b82f6] text-white">VAP</span>
                            <span className="px-1.5 py-0.5 rounded bg-[#ef4444] text-white">PVC</span>
                            <span className="px-1.5 py-0.5 rounded bg-[#10b981] text-white">SSI</span>
                            <span className="px-1.5 py-0.5 rounded bg-[#a855f7] text-white">MDR</span>
                        </div>
                    </div>

                    <div className="space-y-4">
                        {wards.map((ward, idx) => (
                            <div key={idx}>
                                <div className="text-xs text-slate-400 mb-1 font-medium ml-1">{ward.name}</div>
                                <div className="bed-grid-container">
                                    {ward.beds.map(bedId => {
                                        // Match bed ID loosely
                                        const key = Object.keys(bedData?.bedMap || {}).find(k => k.endsWith(`-${bedId}`));
                                        const status = key ? bedData.bedMap[key] : null;
                                        
                                        const isActive = status?.status === 'Active';
                                        const bundleClass = isActive ? `bed-active bed-${status.bundle}` : '';
                                        const alertClass = status?.isHai ? 'bed-hai-alert' : '';

                                        return (
                                            <div 
                                                key={bedId}
                                                className={`bed-box ${bundleClass} ${alertClass}`}
                                                onClick={() => onBedClick(bedId, status?.ward || ward.name)}
                                                title={isActive ? `HN: ... | ${status.bundle}` : 'Empty'}
                                            >
                                                {bedId}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const HandHygieneWidget = ({ data }) => {
            if (!data) return <div className="glass-panel h-64 flex items-center justify-center text-slate-500">No Hand Hygiene Data</div>;

            return (
                <div className="glass-panel p-5 rounded-2xl border-t-4 border-emerald-500 relative overflow-hidden group">
                    <div className="flex justify-between items-start z-10 relative">
                        <div>
                            <h3 className="text-emerald-400 font-bold text-lg flex items-center gap-2">
                                <i data-lucide="hand-metal" className="w-5 h-5"></i> Hand Hygiene
                            </h3>
                            <div className="mt-2">
                                <div className="text-4xl font-bold text-white neon-text">{data.kpi.compliance}%</div>
                                <div className="text-xs text-emerald-300">Compliance Rate</div>
                            </div>
                            <div className="mt-2 text-[10px] text-slate-400">Total Obs: {data.kpi.total}</div>
                        </div>
                        <div className="bg-emerald-900/20 p-3 rounded-full border border-emerald-500/30">
                            <i data-lucide="hand" className="w-8 h-8 text-emerald-400 hand-glow-green"></i>
                        </div>
                    </div>

                    <div className="mt-4 grid grid-cols-2 gap-2 h-32">
                        <div className="bg-slate-900/50 rounded-lg p-2">
                            <div className="text-[9px] text-slate-400 mb-1 text-center">Trend (6 Mo)</div>
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={data.trend}>
                                    <Area type="monotone" dataKey="compliance" stroke="#34d399" fill="rgba(52, 211, 153, 0.2)" strokeWidth={2} />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                        <div className="bg-slate-900/50 rounded-lg p-2">
                             <div className="text-[9px] text-slate-400 mb-1 text-center">Missed Moments</div>
                             <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={data.analysis.moment} layout="vertical">
                                    <XAxis type="number" hide />
                                    <YAxis dataKey="name" type="category" width={20} tick={{fontSize: 8, fill: '#94a3b8'}} />
                                    <Bar dataKey="value" fill="#fb7185" radius={[0,4,4,0]} barSize={10} />
                                </BarChart>
                             </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            );
        };

        const MdrStatsWidget = ({ summary, mdrStats }) => (
            <div className="glass-panel p-5 rounded-2xl">
                 <div className="flex items-center gap-2 text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-4">
                    <i data-lucide="shield-alert" className="w-5 h-5 text-purple-400"></i>
                    Executive MDR Summary
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Specimen */}
                    <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                        <h4 className="text-blue-300 font-bold mb-2 text-xs">Top Pathogens by Specimen</h4>
                        <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                            {summary && summary.map((spec, i) => (
                                <div key={i} className="bg-slate-900/50 p-2 rounded">
                                    <div className="flex justify-between text-[10px] mb-1">
                                        <span className="font-bold text-white">{spec.name}</span>
                                        <span className="text-slate-400">n={spec.total}</span>
                                    </div>
                                    <div className="flex flex-wrap gap-1">
                                        {spec.top5.map((p, j) => (
                                            <span key={j} className="text-[9px] px-1 py-0.5 bg-slate-700 text-slate-300 rounded">
                                                {p.name.split(' ')[0]} ({p.count})
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    {/* MDR Rates */}
                    <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                        <h4 className="text-pink-300 font-bold mb-2 text-xs">MDR Surveillance Pairs</h4>
                        <div className="grid grid-cols-2 gap-2">
                            {mdrStats && Object.entries(mdrStats).map(([key, val], i) => (
                                <div key={i} className="text-center bg-slate-900/50 p-2 rounded">
                                    <div className="text-[9px] text-slate-400 truncate">{key}</div>
                                    <div className="text-lg font-bold text-white my-0.5">{val.mdr_rate}%</div>
                                    <div className="text-[8px] text-pink-400 bg-pink-900/20 px-1 rounded inline-block">
                                        {val.type}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- ORIGINAL CHART COMPONENTS (SAVED) ---
        const AmrChartWidget = ({ config, data, onAnalyze }) => {
            const hasData = data && data.length > 0;
            const lastPoint = hasData ? data[data.length - 1] : null;
            const isLowN = lastPoint && lastPoint.n < 30;
            let trendIcon = <i data-lucide="minus" className="w-4 h-4 text-slate-500"></i>;
            let trendText = "Stable";
            if (data.length >= 2) {
                const diff = data[data.length - 1].resistance - data[data.length - 2].resistance;
                if (diff > 5) { trendIcon = <i data-lucide="trending-up" className="w-4 h-4 text-red-400"></i>; trendText = "Worsening"; }
                else if (diff < -5) { trendIcon = <i data-lucide="trending-down" className="w-4 h-4 text-emerald-400"></i>; trendText = "Improving"; }
            }
            return (
                <div className="glass-panel rounded-2xl p-5 flex flex-col h-[350px] relative overflow-hidden group transition-all hover:border-slate-500/30">
                    <div className="flex justify-between items-start mb-4 z-10">
                        <div className="flex items-center gap-3">
                            <div className="p-2 rounded-lg bg-slate-800/50 border border-slate-700">
                                <GermIcon color={config.color} className="w-8 h-8" />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-100 leading-tight">{config.title}</h3>
                                <p className="text-xs text-slate-400 flex items-center gap-1">
                                    {config.subtitle} 
                                    {lastPoint && lastPoint.drugUsed && <span className="text-[9px] bg-slate-700 px-1 rounded text-slate-300">({lastPoint.drugUsed})</span>}
                                </p>
                            </div>
                        </div>
                        <div className="flex flex-col items-end">
                             {hasData ? (
                                <>
                                    <div className="flex items-center gap-3">
                                        <div className="text-3xl font-bold neon-text leading-none" style={{color: config.color}}>
                                            {lastPoint.resistance}% <span className="text-xs font-normal text-slate-500">R</span>
                                        </div>
                                        <button onClick={() => onAnalyze(config, data)} className="pineapple-btn bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/30 px-2 py-1 rounded-full text-yellow-300 flex items-center gap-1.5 transition-all shadow-lg">
                                            <i data-lucide="sparkles" className="w-3 h-3"></i> <span className="text-[10px] font-medium whitespace-nowrap">AI</span>
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-2 mt-2">
                                        {isLowN && <span className="flex items-center gap-1 text-[10px] text-orange-300 bg-orange-900/30 px-1.5 py-0.5 rounded border border-orange-500/30"><i data-lucide="alert-triangle" className="w-3 h-3"></i> Low n ({lastPoint.n})</span>}
                                        <span className="flex items-center gap-1 text-[10px] text-slate-400 bg-slate-800/50 px-1.5 py-0.5 rounded">{trendIcon} {trendText}</span>
                                    </div>
                                </>
                             ) : <span className="text-xs text-slate-500 mt-2">No Data</span>}
                        </div>
                    </div>
                    <div className="flex-grow w-full relative z-10">
                        {hasData ? (
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="year" stroke="#94a3b8" fontSize={10} tickLine={false} axisLine={false} dy={10} />
                                    <YAxis yAxisId="left" stroke="#94a3b8" fontSize={10} tickLine={false} axisLine={false} domain={[0, 100]} />
                                    <YAxis yAxisId="right" orientation="right" stroke="#ffffff" fontSize={10} tickLine={false} axisLine={false} domain={['auto', 'auto']} />
                                    <Tooltip contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: config.color, color: '#fff', borderRadius: '8px' }} itemStyle={{ color: config.color }} labelStyle={{ color: '#cbd5e1', marginBottom: '4px' }} />
                                    <Legend verticalAlign="top" height={36} iconSize={8} wrapperStyle={{ fontSize: '10px' }}/>
                                    <ReferenceLine yAxisId="left" y={50} stroke="#ef4444" strokeDasharray="3 3" opacity={0.3} label={{ value: '50% R', fill: '#ef4444', fontSize: 9, opacity: 0.5 }} />
                                    <Line yAxisId="left" type="monotone" dataKey="resistance" name="% Resistance" stroke={config.color} strokeWidth={3} dot={{ fill: '#0f172a', stroke: config.color, strokeWidth: 2, r: 4 }} activeDot={{ r: 6, fill: '#fff', stroke: config.color }} />
                                    <Line yAxisId="right" type="monotone" dataKey="ddd" name="DDD Use" stroke="#ffffff" strokeWidth={2} dot={false} strokeDasharray="4 4" opacity={0.8} />
                                </ComposedChart>
                            </ResponsiveContainer>
                        ) : <div className="absolute inset-0 flex items-center justify-center text-slate-500 text-xs">No Data</div>}
                    </div>
                </div>
            );
        };

        const TotalDddChart = ({ data, drugKeys }) => {
            const hasData = data && data.length > 0;
            const colors = ['#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#60a5fa', '#f87171', '#c084fc', '#818cf8', '#2dd4bf', '#fb923c', '#a3e635', '#22d3ee'];
            return (
                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-blue-500/50 relative overflow-hidden">
                    <h3 className="text-white font-bold mb-4 flex items-center gap-2 text-lg"><i data-lucide="bar-chart" className="w-5 h-5 text-blue-400 icon-glow"></i> Total Antibiotic Consumption</h3>
                    <div className="h-96 relative z-10">
                        {hasData ? (
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={data} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} />
                                    <YAxis stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} label={{ value: 'DDD/100 bed-days', angle: -90, position: 'insideLeft', fill: '#94a3b8', fontSize: 10 }} />
                                    <Tooltip contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: '#60a5fa', color: '#fff', borderRadius: '8px' }} />
                                    <Legend wrapperStyle={{ fontSize: '10px', paddingTop: '10px' }} iconType="circle" />
                                    {drugKeys.map((drug, index) => <Line key={drug} type="monotone" dataKey={drug} name={drug} stroke={colors[index % colors.length]} strokeWidth={1.5} dot={false} activeDot={{r: 4}} opacity={0.7} />)}
                                    <Line type="monotone" dataKey="Total" name="TOTAL Usage" stroke="#ffffff" strokeWidth={4} dot={{r:4, fill:'#fff'}} activeDot={{r:6}} shadow="0 0 10px white" />
                                </ComposedChart>
                            </ResponsiveContainer>
                        ) : <div className="flex items-center justify-center h-full text-slate-500 text-sm">No Antibiotic Usage Data</div>}
                    </div>
                </div>
            );
        };

        const AnalyzeModal = ({ isOpen, onClose, data, config }) => {
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);
            useEffect(() => { if (isOpen && data) analyzeData(); }, [isOpen]);
            const analyzeData = async () => {
                setLoading(true); setAnalysis(null);
                try {
                    const res = await fetch(GAS_API_URL, {
                        method: 'POST', body: JSON.stringify({ action: 'analyze_trend', organism: config.organism, drug: config.drugs[0], trendData: data })
                    });
                    const json = await res.json();
                    setAnalysis(json.answer || json.message);
                } catch (e) { setAnalysis("Connection Error"); } finally { setLoading(false); }
            };
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="glass-panel w-full max-w-lg rounded-2xl p-6 bg-slate-900/90" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4"><h3 className="text-white font-bold">AI Analysis</h3><button onClick={onClose}><i data-lucide="x" className="w-6 h-6 text-slate-400"></i></button></div>
                        {loading ? <div className="text-center text-indigo-400 animate-pulse">Analyzing...</div> : <div className="prose prose-invert prose-sm" dangerouslySetInnerHTML={{__html: analysis}}></div>}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [loading, setLoading] = useState(true);
            
            // Old AMR Data State
            const [rawData, setRawData] = useState([]);
            const [dddRawData, setDddRawData] = useState([]);
            const [quarterlyChartData, setQuarterlyChartData] = useState({ data: [], keys: [] });
            const [headers, setHeaders] = useState([]);
            
            // New Dashboard Data State
            const [dashboardData, setDashboardData] = useState({ bedData: {}, mdrData: {}, hhData: null });
            
            // Filters
            const [selectedSpecimen, setSelectedSpecimen] = useState('All');
            const [selectedTime, setSelectedTime] = useState('All');
            const [specimenList, setSpecimenList] = useState([]);
            const [timeList, setTimeList] = useState([]);

            // Modals
            const [modalOpen, setModalOpen] = useState(false);
            const [modalConfig, setModalConfig] = useState(null);
            const [modalData, setModalData] = useState(null);
            const [bedModalOpen, setBedModalOpen] = useState(false);
            const [bedModalData, setBedModalData] = useState(null);
            const [bedLoading, setBedLoading] = useState(false);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); initData(); }, []);
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [dashboardData, rawData]);

            const initData = async () => {
                try {
                    // 1. Fetch Legacy Data (GET)
                    const amrRes = await fetch(`${GAS_API_URL}?action=api_data`);
                    const amrJson = await amrRes.json();
                    if(amrJson.status === 'success') {
                        setRawData(amrJson.amr.data);
                        setHeaders(amrJson.amr.headers);
                        setDddRawData(amrJson.ddd);
                        const specs = [...new Set(amrJson.amr.data.map(r => r['Specimen']).filter(Boolean))].sort();
                        const times = [...new Set(amrJson.amr.data.map(r => r['ปีที่ตรวจ']).filter(Boolean))].sort().reverse();
                        setSpecimenList(specs);
                        setTimeList(times);
                        const qResult = processQuarterlyDdd(amrJson.ddd);
                        setQuarterlyChartData({ data: qResult.data, keys: qResult.drugKeys });
                    }

                    // 2. Fetch New Dashboard Data (POST)
                    const dashRes = await fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'get_dashboard_data' })
                    });
                    const dashJson = await dashRes.json();
                    if(dashJson.status === 'success') {
                        setDashboardData(dashJson);
                    }
                } catch(e) { console.error(e); } finally { setLoading(false); }
            };

            const processQuarterlyDdd = (dddData) => {
                const monthlyPatientDays = {};
                dddData.forEach(r => { if(r.month && r.total_patient_days > 0) monthlyPatientDays[r.month] = r.total_patient_days; });
                const quarterlyPatientDays = {}; 
                Object.keys(monthlyPatientDays).forEach(mStr => {
                    const [m, y] = mStr.split('/');
                    if(m && y) {
                        const q = Math.ceil(parseInt(m)/3);
                        quarterlyPatientDays[`Q${q}-${y}`] = (quarterlyPatientDays[`Q${q}-${y}`] || 0) + monthlyPatientDays[mStr];
                    }
                });
                const quarterlyDrugDDD = {}; 
                dddData.forEach(r => {
                    if(!r.month || !r.drug_name) return;
                    const [m, y] = r.month.split('/');
                    if(!m || !y) return;
                    const qKey = `Q${Math.ceil(parseInt(m)/3)}-${y}`;
                    if(!quarterlyDrugDDD[qKey]) quarterlyDrugDDD[qKey] = { Total: 0 };
                    if(r.standard_ddd_mg > 0 && r.qty_ipd > 0) {
                        const units = (r.qty_ipd * r.strength_mg) / r.standard_ddd_mg;
                        const drugName = r.drug_name.replace(/\*|\[.*?\]/g, '').trim(); 
                        quarterlyDrugDDD[qKey][drugName] = (quarterlyDrugDDD[qKey][drugName] || 0) + units;
                        quarterlyDrugDDD[qKey].Total += units;
                    }
                });
                const finalChartData = Object.keys(quarterlyPatientDays).map(qKey => {
                    const pDays = quarterlyPatientDays[qKey];
                    if(pDays === 0) return null;
                    const dataObj = { name: qKey };
                    const drugs = quarterlyDrugDDD[qKey] || { Total: 0 };
                    Object.keys(drugs).forEach(drug => {
                        const val = parseFloat(((drugs[drug] * 100) / pDays).toFixed(2));
                        if (val > 0) dataObj[drug] = val;
                    });
                    return dataObj;
                }).filter(x => x).sort((a, b) => {
                    const [qA, yA] = a.name.split('-'); const [qB, yB] = b.name.split('-');
                    if (yA !== yB) return yA - yB; return qA.localeCompare(qB);
                });
                const allDrugs = new Set();
                finalChartData.forEach(d => Object.keys(d).forEach(k => { if(k !== 'name' && k !== 'Total') allDrugs.add(k); }));
                return { data: finalChartData, drugKeys: Array.from(allDrugs).sort() };
            };

            const getProcessedData = (kpiConfig) => {
                const chartData = [];
                let timePoints = [...new Set(rawData.map(r => r['ปีที่ตรวจ']).filter(Boolean))].sort();
                if (selectedTime !== 'All') timePoints = timePoints.filter(t => t === selectedTime);
                timePoints.forEach(time => {
                    let totalS = 0, totalN = 0, drugUsed = "";
                    let sKey, tKey;
                    for (const drug of kpiConfig.drugs) {
                        sKey = headers.find(h => h.includes(drug) && (h.includes('(ไว)') || h.includes('(S)')));
                        tKey = headers.find(h => h.includes(drug) && (h.includes('(ทั้งหมด)') || h.includes('(Total)')));
                        if (sKey && tKey) { drugUsed = drug; break; }
                    }
                    if (sKey && tKey) {
                        const relevantRows = rawData.filter(row => row['ปีที่ตรวจ'] === time && (selectedSpecimen === 'All' || row['Specimen'] === selectedSpecimen));
                        relevantRows.forEach(row => {
                            const rawOrgName = row['ชื่อเชื้อ'];
                            if (!rawOrgName) return;
                            const orgGroup = ORGANISM_GROUPS.find(g => g.base === kpiConfig.organism);
                            if (orgGroup && orgGroup.keywords.some(kw => rawOrgName.toLowerCase().includes(kw))) {
                                const parseVal = (v) => {
                                    if(!v) return 0;
                                    const str = String(v).replace(/,/g, '').trim();
                                    if(['R','S','I','-','No growth'].includes(str)) return 0;
                                    return parseFloat(str) || 0;
                                };
                                totalS += parseVal(row[sKey]);
                                totalN += parseVal(row[tKey]);
                            }
                        });
                    }
                    // DDD Calculation (Simplified logic for brevity)
                    let dddVal = 0;
                    if (kpiConfig.dddIcode) {
                         const relevantDdd = dddRawData.filter(d => {
                            let dYearStr = '';
                            if (typeof d.month === 'string' && d.month.includes('/')) dYearStr = d.month.split('/')[1];
                            else if (d.month instanceof Date) dYearStr = d.month.getFullYear().toString();
                            else dYearStr = String(d.month).slice(-4); 
                            const dYear = parseInt(dYearStr); const tYear = parseInt(time);
                            return String(d.icode).trim() === String(kpiConfig.dddIcode).trim() && (dYear === tYear || Math.abs(dYear - tYear) === 543);
                        });
                        let totalUnits = 0, totalPDays = 0;
                        relevantDdd.forEach(d => {
                            if(d.standard_ddd_mg > 0) totalUnits += ((d.qty_ipd * d.strength_mg) / d.standard_ddd_mg) * 100;
                            totalPDays += d.total_patient_days;
                        });
                        if (totalPDays > 0) dddVal = parseFloat((totalUnits / totalPDays).toFixed(2));
                    }
                    if (totalN > 0 || dddVal > 0) {
                        const pctR = totalN > 0 ? (100 - ((totalS / totalN) * 100)) : null;
                        chartData.push({ year: time, resistance: pctR !== null ? parseFloat(pctR.toFixed(1)) : null, n: totalN, drugUsed, ddd: dddVal });
                    }
                });
                return chartData;
            };

            const handleAnalyze = (config, data) => { setModalConfig(config); setModalData(data); setModalOpen(true); };
            const handleBedClick = async (bed, ward) => {
                setBedModalOpen(true); setBedLoading(true); setBedModalData({ title: `${ward} - Bed ${bed}` });
                try {
                    const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_bed_history', bed, ward }) });
                    const json = await res.json();
                    setBedModalData(prev => ({ ...prev, history: json.history }));
                } catch(e) { console.error(e); } finally { setBedLoading(false); }
            };

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center"><div className="loader"></div></div>;

            return (
                <div className="min-h-screen pb-10 relative">
                    {/* Header */}
                     <header className="glass-panel sticky top-0 z-50 border-b-0 backdrop-blur-xl bg-slate-900/80">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                                    <span className="text-white font-bold text-xl">IC</span>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">SW-1 Smart Dashboard</h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-widest">Infection Control Unit</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-xs text-indigo-300 font-mono">{new Date().toLocaleDateString('th-TH')}</div>
                                <div className="text-[10px] text-emerald-500 flex items-center justify-end gap-1">
                                    <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div> Live
                                </div>
                            </div>
                        </div>
                    </header>

                    <AlertTicker alerts={dashboardData.bedData?.alerts} />

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-8 relative z-10">
                        
                        {/* Zone 1: Real-time Operations (NEW: HH & Beds) */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            <div className="lg:col-span-4">
                                <HandHygieneWidget data={dashboardData.hhData} />
                            </div>
                            <div className="lg:col-span-8 h-full min-h-[300px]">
                                <BedGrid bedData={dashboardData.bedData} onBedClick={handleBedClick} />
                            </div>
                        </div>

                         {/* Zone 2: Executive Summary (NEW: MDR) */}
                         <MdrStatsWidget 
                            summary={dashboardData.mdrData?.specimenSummary} 
                            mdrStats={dashboardData.mdrData?.mdrStats}
                        />

                        {/* Zone 3: AMR Charts (ORIGINAL) */}
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            <div className="lg:col-span-1 space-y-4">
                                <div className="glass-panel p-5 rounded-2xl border-l-4 border-indigo-500">
                                    <h3 className="text-white font-semibold mb-4 flex items-center gap-2"><i data-lucide="filter" className="w-4 h-4 text-indigo-400"></i> Filters</h3>
                                    <div className="mb-4">
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Specimen</label>
                                        <div className="relative">
                                            <select value={selectedSpecimen} onChange={(e) => setSelectedSpecimen(e.target.value)} className="w-full bg-slate-900 text-white border border-slate-700 rounded-lg py-2 pl-3 pr-8 appearance-none text-sm"><option value="All">All Specimens</option>{specimenList.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Time Period</label>
                                        <div className="relative">
                                            <select value={selectedTime} onChange={(e) => setSelectedTime(e.target.value)} className="w-full bg-slate-900 text-white border border-slate-700 rounded-lg py-2 pl-3 pr-8 appearance-none text-sm"><option value="All">All History</option>{timeList.map(t => <option key={t} value={t}>{t}</option>)}</select>
                                        </div>
                                    </div>
                                </div>
                                <div className="glass-panel p-4 rounded-xl flex items-center justify-between border-t-2 border-t-blue-500/30">
                                    <div><p className="text-slate-400 text-xs uppercase tracking-wider">Total Isolates</p><h4 className="text-2xl font-bold mt-1 text-white">{rawData.length}</h4></div>
                                    <i data-lucide="database" className="w-6 h-6 text-blue-400 opacity-50"></i>
                                </div>
                            </div>
                            <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                                {KPI_CONFIG.map(config => (
                                    <AmrChartWidget key={config.id} config={config} data={getProcessedData(config)} onAnalyze={handleAnalyze} />
                                ))}
                            </div>
                        </div>

                        {/* Zone 4: Total DDD (ORIGINAL) */}
                        <div className="grid grid-cols-1 gap-6">
                            <TotalDddChart data={quarterlyChartData.data} drugKeys={quarterlyChartData.keys} />
                        </div>

                    </main>

                    {/* Modals */}
                    <AnalyzeModal isOpen={modalOpen} onClose={() => setModalOpen(false)} config={modalConfig} data={modalData} />
                    <BedModal isOpen={bedModalOpen} onClose={() => setBedModalOpen(false)} loading={bedLoading} data={bedModalData} />
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
