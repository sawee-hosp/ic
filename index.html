<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงทะเบียนสมาชิก SW-1</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" type="image/png">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Google Sans', 'Sarabun', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            font-size: 16px;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 150%;
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
            mix-blend-mode: luminosity;
        }

        .glass-panel { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .glass-input { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: white; 
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 0.25rem;
        }
        .glass-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        
        .btn-primary { 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            color: white; 
            font-weight: bold; 
            padding: 1rem; 
            border-radius: 0.75rem; 
            width: 100%; 
            box-shadow: 0 4px 15px -1px rgba(99, 102, 241, 0.5); 
            transition: all 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary { 
            background: rgba(30, 41, 59, 0.6); 
            color: #94a3b8; 
            font-weight: bold; 
            padding: 1rem; 
            border-radius: 0.75rem; 
            width: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .btn-secondary:active { transform: scale(0.98); background: rgba(30, 41, 59, 0.8); }

        /* Preloader Animation */
        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .animate-logo { animation: pulse-logo 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const LIFF_ID = "2008690634-Mr6OanUA"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzG8WjNpWdC-JwFFIrRRJ2w7_sHdKx3D3ZIykPqwFuaWmvrPpOOJCv7CVYAGOY7tk60/exec";

        const Preloader = () => (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0f172a]">
                <img src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" className="w-32 h-32 animate-logo mb-6 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]" />
                <div className="flex items-center gap-2">
                    <div className="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce delay-75"></div>
                    <div className="w-2 h-2 bg-indigo-300 rounded-full animate-bounce delay-150"></div>
                </div>
                <p className="mt-4 text-slate-400 text-sm tracking-wider">กำลังโหลดข้อมูลสมาชิก...</p>
            </div>
        );

        const App = () => {
            const [loading, setLoading] = useState(true);
            const [isRegistered, setIsRegistered] = useState(false);
            const [profile, setProfile] = useState(null);
            const [formData, setFormData] = useState({
                userId: '', DisplayName: '', pictureProfile: '',
                Title: 'นาย', Name: '', Dept: '', Job: '', Gender: 'ชาย', Age: '', HN: ''
            });

            useEffect(() => {
                const init = async () => {
                    // Min load time for smooth transition
                    const minLoad = new Promise(resolve => setTimeout(resolve, 1500));
                    
                    try {
                        if (window.liff) {
                            await window.liff.init({ liffId: LIFF_ID });
                            if (!window.liff.isLoggedIn()) {
                                window.liff.login({ redirectUri: window.location.href });
                                return;
                            }
                            const p = await window.liff.getProfile();
                            setProfile(p);
                            
                            // Check Registration
                            const res = await fetch(GAS_URL, {
                                method: "POST",
                                body: JSON.stringify({ action: 'checkRegistration', userId: p.userId })
                            }).then(r => r.json());

                            if (res.isRegistered) {
                                setIsRegistered(true);
                                setFormData(res.data);
                            } else {
                                setIsRegistered(false);
                                setFormData(prev => ({
                                    ...prev,
                                    userId: p.userId,
                                    DisplayName: p.displayName,
                                    pictureProfile: p.pictureUrl
                                }));
                            }
                        }
                    } catch (e) {
                        console.error(e);
                        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ LIFF");
                    }
                    
                    await minLoad;
                    setLoading(false);
                };
                init();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: 'saveRegistration', payload: formData })
                    }).then(r => r.json());
                    
                    alert("บันทึกข้อมูลเรียบร้อย");
                    window.location.href = "https://sawee-hosp.github.io/ic/health.html";
                } catch (err) {
                    alert("บันทึกไม่สำเร็จ: " + err);
                    setLoading(false);
                }
            };

            if (loading) return <Preloader />;

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-10 p-6">
                     <div className="text-center mb-8 pt-4">
                        <div className="relative w-28 h-28 mx-auto mb-4 group">
                            <div className="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
                            <div className="relative w-full h-full rounded-full overflow-hidden border-2 border-indigo-500/30 shadow-2xl bg-[#1e293b]">
                                {profile?.pictureUrl ? 
                                    <img src={profile.pictureUrl} className="w-full h-full object-cover"/> : 
                                    <div className="w-full h-full flex items-center justify-center text-slate-500">IMG</div>
                                }
                            </div>
                        </div>
                        <h1 className="text-2xl font-bold text-white mb-1">{isRegistered ? 'ข้อมูลสมาชิก' : 'ลงทะเบียนสมาชิกใหม่'}</h1>
                        <p className="text-slate-400 text-sm">SW-1 Smart Hospital</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="glass-panel p-6 rounded-2xl space-y-4">
                            {isRegistered && (
                                <div className="bg-indigo-900/30 p-4 rounded-xl border border-indigo-500/30 mb-6 text-center">
                                    <div className="text-xl font-bold text-indigo-300">{formData.Title}{formData.Name}</div>
                                    <div className="text-sm text-indigo-400 mt-1">{formData.Job} • {formData.Dept}</div>
                                </div>
                            )}

                            {!isRegistered && (
                                <>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div className="col-span-1">
                                            <label className="text-xs font-bold text-indigo-300 uppercase mb-1 block">คำนำหน้า</label>
                                            <select className="glass-input" value={formData.Title} onChange={e => setFormData({...formData, Title: e.target.value})}>
                                                <option className="text-black">นาย</option>
                                                <option className="text-black">นาง</option>
                                                <option className="text-black">นางสาว</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="text-xs font-bold text-indigo-300 uppercase mb-1 block">ชื่อ-สกุล</label>
                                            <input required type="text" className="glass-input" value={formData.Name} onChange={e => setFormData({...formData, Name: e.target.value})} placeholder="สมชาย ใจดี" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-indigo-300 uppercase mb-1 block">เพศ</label>
                                            <select className="glass-input" value={formData.Gender} onChange={e => setFormData({...formData, Gender: e.target.value})}>
                                                <option className="text-black">ชาย</option>
                                                <option className="text-black">หญิง</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-indigo-300 uppercase mb-1 block">อายุ</label>
                                            <input required type="number" className="glass-input" value={formData.Age} onChange={e => setFormData({...formData, Age: e.target.value})} />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-indigo-300 uppercase mb-1 block">หน่วยงาน (Dept)</label>
                                        <input required type="text" className="glass-input" value={formData.Dept} onChange={e => setFormData({...formData, Dept: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-indigo-300 uppercase mb-1 block">ตำแหน่ง (Job)</label>
                                        <input required type="text" className="glass-input" value={formData.Job} onChange={e => setFormData({...formData, Job: e.target.value})} />
                                    </div>
                                </>
                            )}

                            <div>
                                <label className="text-xs font-bold text-slate-400 uppercase mb-1 flex items-center gap-2">
                                    หมายเลข HN <span className="text-[10px] font-normal text-red-400 bg-red-900/20 px-1.5 py-0.5 rounded border border-red-500/30">แก้ไขได้</span>
                                </label>
                                <input required type="text" className="glass-input text-center font-bold text-xl tracking-widest text-emerald-400 border-emerald-500/30 bg-emerald-900/10 focus:border-emerald-500" value={formData.HN} onChange={e => setFormData({...formData, HN: e.target.value})} />
                            </div>
                        </div>

                        <div className="pt-4 space-y-3">
                            <button type="submit" className="btn-primary shadow-[0_0_20px_rgba(99,102,241,0.4)]">
                                {isRegistered ? 'ยืนยันข้อมูลล่าสุด' : 'ลงทะเบียนเข้าใช้งาน'}
                            </button>
                            
                            {isRegistered && (
                                <button type="button" onClick={() => window.location.href = "https://sawee-hosp.github.io/ic/health.html"} className="btn-secondary text-indigo-300 border-indigo-500/30 hover:bg-indigo-900/20">
                                    ดูประวัติสุขภาพ
                                </button>
                            )}
                            
                            <button type="button" onClick={() => window.history.back()} className="w-full py-3 text-sm text-slate-500 hover:text-white transition-colors">
                                ย้อนกลับ
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
