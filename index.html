<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC SW-1 (สวีวรรณ)</title>
    
    <link rel="icon" href="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-size: 14px; }
        
        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 150% 150%;
            animation: aurora 15s ease infinite;
        }
        .bg-overlay::after {
            content: ""; position: absolute; inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.4;
        }
        @keyframes aurora { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-input { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 100%; padding: 0.4rem 0.6rem; border-radius: 0.375rem; transition: all 0.2s; font-size: 0.9rem; height: 38px; }
        .glass-input:focus { outline: none; border-color: #818cf8; background: rgba(15, 23, 42, 0.8); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .glass-input:read-only { opacity: 0.7; cursor: default; }

        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; font-weight: 600; padding: 0.6rem; border-radius: 0.5rem; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }

        .btn-secondary { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; font-weight: 500; padding: 0.6rem; border-radius: 0.5rem; width: 100%; border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .badge { padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-left: 4px; white-space: nowrap; height: 20px; display: inline-flex; align-items: center; letter-spacing: 0.5px; }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-btn { position: relative; padding: 0.6rem 1.2rem; color: #94a3b8; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: white; font-weight: 600; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #6366f1; border-radius: 3px 3px 0 0; box-shadow: 0 -2px 10px rgba(99, 102, 241, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const LIFF_ID = "2008690634-Mr6OanUA"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzG8WjNpWdC-JwFFIrRRJ2w7_sHdKx3D3ZIykPqwFuaWmvrPpOOJCv7CVYAGOY7tk60/exec";
        const LOGO_URL = "https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png";

        // --- Network PCU List ---
        const PCU_OPTIONS = [
            "รพ.สต.เขาค่าย", "รพ.สต.เขาทะลุ", "รพ.สต.ครน", "รพ.สต.ด่านสวี",
            "รพ.สต.ท่าหิน", "รพ.สต.ทุ่งระยะ", "รพ.สต.นาสัก", "รพ.สต.บ้านแก่งกระทั่ง",
            "รพ.สต.บ้านคลองน้อย", "รพ.สต.บ้านควนสามัคคี", "รพ.สต.บ้านดอนทราย", "รพ.สต.บ้านไทยพัฒนา",
            "รพ.สต.บ้านน้ำฉา", "รพ.สต.ปากแพรก", "รพ.สต.วิสัยใต้", "รพ.สต.สวี", "สสอ.สวี"
        ];

        // --- Utils ---
        const callGAS = async (action, payload = {}) => {
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action, ...payload })
                });
                return await res.json();
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        };

        const Icon = ({ name, className, size=24 }) => {
            const ref = useRef(null);
            useEffect(() => {
                if(ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className || '';
                    ref.current.appendChild(i);
                    lucide.createIcons({ root: ref.current, attrs: { width: size, height: size } });
                }
            }, [name, className, size]);
            return <span ref={ref} className="inline-flex items-center justify-center"></span>;
        };

        const Loading = ({ text }) => (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0f172a]/95 backdrop-blur-md">
                <img src={LOGO_URL} className="w-20 h-20 mb-4 animate-pulse" />
                <div className="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                <p className="text-indigo-200 text-xs tracking-wider">{text}</p>
            </div>
        );

        // --- Main App ---
        const App = () => {
            const [page, setPage] = useState('loading'); 
            const [user, setUser] = useState(null);
            const [codebook, setCodebook] = useState({});

            useEffect(() => {
                const init = async () => {
                    const [cbRes] = await Promise.allSettled([callGAS('getCodebook')]);
                    setCodebook(cbRes.status === 'fulfilled' ? cbRes.value : {});
                    
                    try {
                        await liff.init({ liffId: LIFF_ID });
                        if (liff.isLoggedIn()) {
                            const p = await liff.getProfile();
                            handleLoginProcess({ userId: p.userId }, p);
                        } else {
                            setPage('login');
                        }
                    } catch (e) {
                        setPage('login');
                    }
                };
                init();
            }, []);

            const handleLoginProcess = async (criteria, lineProfile = null) => {
                setPage('loading');
                try {
                    const res = await callGAS('loginUser', { criteria });
                    if (res.found) {
                        let userData = res.data;
                        if (lineProfile) {
                            userData = { ...userData, pictureProfile: lineProfile.pictureUrl };
                        }
                        setUser(userData);
                        setPage('form'); 
                    } else if (lineProfile) {
                        setUser({ 
                            userId: lineProfile.userId, DisplayName: lineProfile.displayName, pictureProfile: lineProfile.pictureUrl,
                            Title: 'นาย', Gender: 'ชาย', Right: 'SW Staff',
                            loginname: '', HN: '', cid: '', Name: '', Age: '', dob: '', nickname: '', phone: '', email: ''
                        });
                        setPage('form');
                    } else {
                        alert('ไม่พบข้อมูลในระบบ หรือข้อมูลยืนยันตัวตนไม่ถูกต้อง');
                        setPage('login');
                    }
                } catch (e) {
                    alert('เชื่อมต่อไม่ได้ กรุณาลองใหม่');
                    setPage('login');
                }
            };

            const handleUpdateUser = async (formData) => {
                setPage('loading');
                try {
                    const res = await callGAS('saveRegistration', { payload: formData, isEdit: true });
                    if (res.success) {
                        setUser(formData);
                        setPage('mainMenu');
                    } else {
                        alert('บันทึกไม่สำเร็จ: ' + res.error);
                        setPage('form');
                    }
                } catch (e) {
                    alert('Network Error');
                    setPage('form');
                }
            };

            if (page === 'loading') return <Loading text="Loading..." />;
            if (page === 'login') return <LoginPage onLogin={c => handleLoginProcess(c)} onLiff={() => liff.login()} />;
            if (page === 'form') return <DataForm user={user} codebook={codebook} onSubmit={handleUpdateUser} onSkip={() => setPage('mainMenu')} />;
            if (page === 'mainMenu') return <MainMenu user={user} onSelect={setPage} />;
            if (page === 'healthBook') return <HealthBook user={user} codebook={codebook} onBack={() => setPage('mainMenu')} />;
            
            return null;
        };

        // --- 1. Login Page ---
        const LoginPage = ({ onLogin, onLiff }) => {
            const [c, setC] = useState({ loginname: '', HN: '', cid: '' });
            
            const isValid = useMemo(() => {
                let count = 0;
                if(c.loginname.trim()) count++;
                if(c.HN.trim()) count++;
                if(c.cid.trim()) count++;
                // Login conditions: 2 fields OR just CID (13 digits)
                return (count >= 2) || (c.cid.trim().length === 13);
            }, [c]);

            const attemptLogin = () => {
                if(!isValid) return alert("กรุณากรอกข้อมูลตามเงื่อนไข");
                // Clean CID before sending (remove dashes/spaces if user typed them)
                const cleanCriteria = { ...c, cid: c.cid.replace(/[^0-9]/g, '') };
                onLogin(cleanCriteria);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 fade-in relative overflow-hidden">
                    <div className="w-full max-w-sm text-center z-10">
                        <div className="mb-6 relative inline-block">
                            <div className="absolute inset-0 bg-indigo-500 blur-[40px] opacity-20 rounded-full"></div>
                            <img src={LOGO_URL} className="w-28 h-28 mx-auto relative z-10 drop-shadow-2xl" />
                        </div>
                        <h1 className="text-3xl font-bold text-white mb-1 tracking-tight">IC SW-1 <span style={{color:'#94a3b8'}} className="font-normal text-xl">(สวีวรรณ)</span></h1>
                        <h2 className="text-lg text-indigo-300 font-medium mb-2 tracking-wide">Digital Health Book</h2>
                        <p className="text-[11px] text-slate-400 mb-8 font-light leading-relaxed opacity-80">สมุดบันทึกสุขภาพบุคลากร<br/>งานป้องกันและควบคุมการติดเชื้อในโรงพยาบาลสวี</p>

                        <div className="glass-panel p-6 rounded-2xl space-y-4 text-left border-t border-white/10">
                            <label className="text-xs text-indigo-200 block text-center font-medium bg-indigo-500/10 py-2 rounded border border-indigo-500/20">กรุณากรอกข้อมูลยืนยันตัวตนอย่างน้อย 2 ช่องด้านล่าง</label>
                            <div className="space-y-2">
                                <input className="glass-input text-center" placeholder="HosXP Login Name" value={c.loginname} onChange={e=>setC({...c, loginname:e.target.value})} />
                                <input className="glass-input text-center" placeholder="รหัส HN" value={c.HN} onChange={e=>setC({...c, HN:e.target.value})} />
                                <input className="glass-input text-center" placeholder="เลขบัตรประชาชน (CID)" maxLength="13" value={c.cid} onChange={e=>setC({...c, cid:e.target.value})} />
                            </div>
                            <button onClick={attemptLogin} disabled={!isValid} className={`btn-primary mt-2 shadow-lg shadow-indigo-500/30 w-full transition-all ${!isValid ? 'opacity-50 cursor-not-allowed grayscale' : ''}`}>เข้าสู่ระบบ</button>
                        </div>

                        <div className="mt-8 pt-6 border-t border-slate-700/50">
                            <button onClick={onLiff} className="w-full py-3 rounded-xl bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-green-500/20">
                                เข้าสู่ระบบด้วย LINE
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 2. Update Profile ---
        const DataForm = ({ user, codebook, onSubmit, onSkip }) => {
            const [data, setData] = useState({});
            const [orgType, setOrgType] = useState('hospital'); 

            useEffect(() => { 
                if(user) {
                    const u = user; 
                    const cleanPhone = (val) => val ? String(val).replace(/^'/, '') : '';
                    const mapped = {
                        loginname: u.loginname || u.LoginName || '',
                        HN: u.HN || u.hn || '',
                        cid: u.cid || u.CID || '',
                        Title: u.Title || u.title || 'นาย',
                        Name: u.Name || u.name || '',
                        nickname: u.nickname || u.NickName || '',
                        Gender: u.Gender || u.gender || u.sex || 'ชาย',
                        dob: u.dob || u.birthdate || '',
                        Age: u.Age || u.age || '',
                        Dept: u.Dept || u.dept || u.department || '',
                        Job: u.Job || u.job || '',
                        Right: u.Right || u.right || 'SW Staff',
                        phone: cleanPhone(u.phone || u.Tel),
                        email: u.email || u.Email || '',
                        pictureProfile: u.pictureProfile || u.pictureprofile || ''
                    };
                    
                    if (!mapped.Age && mapped.dob) {
                        const d = new Date(mapped.dob);
                        if(!isNaN(d.getTime())) {
                            mapped.Age = new Date().getFullYear() - d.getFullYear();
                        }
                    }

                    if (PCU_OPTIONS.includes(mapped.Dept)) setOrgType('network');
                    else setOrgType('hospital');
                    
                    setData(mapped); 
                }
            }, [user]);

            const h = (f, v) => setData(p => ({...p, [f]: v}));
            const handleDob = (v) => {
                h('dob', v);
                if(v) {
                    const age = new Date(Date.now() - new Date(v).getTime()).getUTCFullYear() - 1970;
                    h('Age', age > 0 ? age : 0);
                }
            };

            const deptOptions = orgType === 'hospital' 
                ? (codebook['department'] || [])
                : PCU_OPTIONS.map(name => ({ code: name, label: name }));

            return (
                <div className="min-h-screen p-4 pb-10 fade-in max-w-lg mx-auto flex flex-col">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icon name="user-cog" className="text-indigo-400" /> อัปเดตประวัติส่วนตัว</h2>
                        <button onClick={onSkip} className="text-xs text-slate-400 border border-slate-600 px-3 py-1.5 rounded-full hover:bg-slate-800 transition-colors">ข้ามไปก่อน &rarr;</button>
                    </div>

                    <div className="glass-panel p-6 rounded-2xl space-y-4 flex-grow relative">
                        <div className="flex justify-center mb-6">
                            <div className="relative">
                                <img src={data.pictureProfile || "https://cdn-icons-png.flaticon.com/512/847/847969.png"} className="w-24 h-24 rounded-full border-4 border-indigo-500/30 shadow-2xl object-cover" />
                                <div className="absolute bottom-0 right-0 bg-slate-800 p-1.5 rounded-full border border-slate-600"><Icon name="camera" className="text-slate-300" size={16} /></div>
                            </div>
                        </div>
                        
                        <div className="p-4 bg-indigo-900/20 rounded-xl border border-indigo-500/20 space-y-3">
                            <h3 className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider flex items-center gap-1"><Icon name="shield" size={12} /> ข้อมูลยืนยันตัวตน</h3>
                            <div className="grid grid-cols-1 gap-2">
                                <Field label="Login Name" val={data.loginname} onChange={v=>h('loginname',v)} />
                                <div className="grid grid-cols-2 gap-2">
                                    <Field label="HN" val={data.HN} onChange={v=>h('HN',v)} />
                                    <Field label="CID (เลขบัตร ปชช.)" val={data.cid} onChange={v=>h('cid',v)} />
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3 pt-2">
                            <div className="grid grid-cols-12 gap-2">
                                <div className="col-span-4"><label className="text-[10px] text-slate-400 block mb-1">คำนำหน้า</label><select className="glass-input" value={data.Title} onChange={e=>h('Title',e.target.value)}><option>นาย</option><option>นาง</option><option>นางสาว</option></select></div>
                                <div className="col-span-8"><Field label="ชื่อ-สกุล" val={data.Name} onChange={v=>h('Name',v)} /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <Field label="ชื่อเล่น" val={data.nickname} onChange={v=>h('nickname',v)} />
                                <div><label className="text-[10px] text-slate-400 block mb-1">เพศ</label><select className="glass-input" value={data.Gender} onChange={e=>h('Gender',e.target.value)}><option>ชาย</option><option>หญิง</option></select></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-[10px] text-slate-400 block mb-1">วันเกิด</label><input type="date" className="glass-input text-center" value={data.dob ? data.dob.split('T')[0] : ''} onChange={e=>handleDob(e.target.value)} /></div>
                                <Field label="อายุ" val={data.Age} onChange={v=>h('Age',v)} readonly />
                            </div>
                            
                            <div className="pt-2 border-t border-slate-700/50">
                                <label className="text-[10px] text-indigo-300 font-bold block mb-2">สังกัดหน่วยงาน</label>
                                <div className="flex bg-slate-800 rounded p-1 mb-2">
                                    <button onClick={() => setOrgType('hospital')} className={`flex-1 text-xs py-1.5 rounded transition-all ${orgType === 'hospital' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'}`}>รพ.สวี</button>
                                    <button onClick={() => setOrgType('network')} className={`flex-1 text-xs py-1.5 rounded transition-all ${orgType === 'network' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'}`}>เครือข่าย รพ.สต.</button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] text-slate-400 block mb-1">
                                            {orgType === 'hospital' ? 'แผนก/ฝ่าย' : 'รพ.สต.'}
                                        </label>
                                        <Select val={data.Dept} options={deptOptions} onChange={v=>h('Dept',v)} />
                                    </div>
                                    <div><label className="text-[10px] text-slate-400 block mb-1">ตำแหน่ง</label><Select val={data.Job} options={codebook['job']} onChange={v=>h('Job',v)} /></div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2 pt-2">
                                <div><label className="text-[10px] text-slate-400 block mb-1">สิทธิ์การใช้งาน</label><select className="glass-input" value={data.Right} onChange={e=>h('Right',e.target.value)}><option>SW Staff</option><option>ICN</option><option>ICWN</option></select></div>
                                <Field label="เบอร์โทรศัพท์" val={data.phone} onChange={v=>h('phone',v)} />
                            </div>
                            <Field label="อีเมล" val={data.email} onChange={v=>h('email',v)} />
                        </div>
                    </div>
                    <button onClick={() => onSubmit(data)} className="btn-primary mt-6 py-3.5 shadow-xl shadow-indigo-500/20 text-base">บันทึกข้อมูลและไปต่อ</button>
                </div>
            );
        };

        // --- 3. Main Menu (Updated Icons) ---
        const MainMenu = ({ user, onSelect }) => (
            <div className="p-5 fade-in min-h-screen max-w-lg mx-auto">
                <div className="flex justify-between items-center mb-8">
                    <div className="flex items-center gap-3.5">
                        <img src={user.pictureProfile || "https://cdn-icons-png.flaticon.com/512/847/847969.png"} className="w-12 h-12 rounded-full border-2 border-slate-500 shadow-md object-cover" />
                        <div><h3 className="font-bold text-white text-base">{user.Name || 'User'}</h3><p className="text-xs text-slate-400">{user.Dept || '-'}</p></div>
                    </div>
                    <button onClick={() => onSelect('form')} className="w-10 h-10 flex items-center justify-center bg-slate-800/80 rounded-full hover:bg-slate-700 border border-slate-700 transition-colors"><Icon name="settings" size={20} className="text-slate-300" /></button>
                </div>
                
                <div className="bg-gradient-to-br from-indigo-900 to-slate-900 rounded-3xl p-6 mb-8 border border-indigo-500/20 text-center relative overflow-hidden shadow-2xl">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/20 blur-[50px] rounded-full"></div>
                    <h1 className="text-xl font-bold text-white mb-1 relative z-10">IC SW-1 Digital Health</h1>
                    <p className="text-xs text-indigo-300 relative z-10">ระบบสารสนเทศสุขภาพบุคลากร รพ.สวี</p>
                </div>

                <div className="grid grid-cols-2 gap-4">
                    <MenuBtn icon="activity" title="ผลตรวจสุขภาพ" color="text-blue-400" bg="bg-blue-500/10" onClick={() => onSelect('healthBook')} />
                    <MenuBtn icon="syringe" title="จองวัคซีน" color="text-green-400" bg="bg-green-500/10" onClick={() => alert('Coming Soon')} />
                    <MenuBtn icon="thermometer" title="การลาป่วย" color="text-red-400" bg="bg-red-500/10" onClick={() => alert('Coming Soon')} />
                    <MenuBtn icon="bandage" title="อุบัติเหตุเข็มตำ" color="text-red-500" bg="bg-red-500/10" onClick={() => alert('Coming Soon')} />
                    <MenuBtn icon="biohazard" title="สัมผัสเชื้อ" color="text-orange-400" bg="bg-orange-500/10" onClick={() => alert('Coming Soon')} />
                    <MenuBtn icon="graduation-cap" title="อบรม IC" color="text-purple-400" bg="bg-purple-500/10" onClick={() => alert('Coming Soon')} />
                </div>
            </div>
        );

        const MenuBtn = ({ icon, title, color, bg, onClick }) => (
            <button onClick={onClick} className="glass-panel p-5 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-slate-800/60 active:scale-95 transition-all h-36 border border-white/5 shadow-lg">
                <div className={`p-4 rounded-full ${bg} shadow-inner`}>
                    <Icon name={icon} size={40} className={color} />
                </div>
                <span className="text-sm font-medium text-slate-200 text-center leading-tight">{title}</span>
            </button>
        );

        const HealthBook = ({ user, codebook, onBack }) => {
            const [years, setYears] = useState([]);
            const [selYear, setSelYear] = useState(new Date().getFullYear());
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(false);
            const [vaccine, setVaccine] = useState(null);
            const [modal, setModal] = useState(null);
            const [isNewYear, setIsNewYear] = useState(false);

            useEffect(() => {
                const load = async () => {
                    try {
                        const y = await callGAS('getAvailableYears', { hn: user.HN });
                        const all = [...new Set([new Date().getFullYear(), ...(Array.isArray(y)?y:[])])].sort((a,b)=>b-a);
                        setYears(all); setSelYear(all[0]);
                    } catch { setYears([new Date().getFullYear()]); }
                };
                load();
            }, []);

            useEffect(() => {
                const loadData = async () => {
                    setLoading(true);
                    const def = { 
                        hn: user.HN, year: selYear, full_name: user.Name, sex: user.Gender, age: user.Age, 
                        visit_date: '', weight_kg:'', height_cm:'', waist_cm:'', 
                        pulse:'', bp_systolic:'', bp_diastolic:'', hct:'', hgb:'', fbs:'', chol:'', trig:'', hdl:'', ldl:'', 
                        bun:'', cr:'', sgot:'', sgpt:'', alk_phos:'', uric:'', rbc_ua:'', wbc_ua:'', 
                        has_chronic:'', family_history_flag:'', cxr_flag:'', smoking:'', alcohol:'', helmet:'', belt:''
                    };
                    try {
                        const h = await callGAS('getHealthData', { hn: user.HN, year: selYear });
                        if (h) {
                            if(h.timestamp || h.visit_date) {
                                let d = new Date(h.visit_date || h.timestamp);
                                if(!isNaN(d.getTime())) h.visit_date = d.toISOString().split('T')[0];
                            }
                            setData(h);
                            setIsNewYear(false);
                        } else {
                            setData(def);
                            setIsNewYear(true);
                        }
                        
                        const v = await callGAS('getVaccineStatus', { hn: user.HN, year: selYear });
                        setVaccine(v);
                    } catch { setData(def); setIsNewYear(true); }
                    setLoading(false);
                };
                loadData();
            }, [selYear]);

            const bmi = useMemo(() => (data.weight_kg && data.height_cm) ? (data.weight_kg / Math.pow(data.height_cm/100, 2)).toFixed(2) : '', [data]);
            const cvRisk = useMemo(() => {
                let s = (data.age*0.1) + (data.bp_systolic*0.01) + (data.chol*0.005) + (data.smoking==='2'?1:0) + (data.sex==='ชาย'?1:0);
                return s > 10 ? 10 : s.toFixed(1);
            }, [data]);
            
            const getFlags = (d) => {
                return {
                    bmi: getFlag('bmi', bmi),
                    bp: getFlag('bp', d.bp_systolic, d.bp_diastolic),
                    waist: getFlag('waist', d.waist_cm, d.sex),
                    pulse: getFlag('pulse', d.pulse),
                    fbs: getFlag('fbs', d.fbs),
                    chol: getFlag('chol', d.chol),
                    trig: getFlag('trig', d.trig),
                    hdl: getFlag('hdl', d.hdl, d.sex),
                    ldl: getFlag('ldl', d.ldl),
                    bun: getFlag('bun', d.bun),
                    cr: getFlag('cr', d.cr),
                    uric: getFlag('uric', d.uric),
                    sgot: getFlag('liver', d.sgot),
                    sgpt: getFlag('liver', d.sgpt),
                    alk: getFlag('liver', d.alk_phos), 
                    hct: getFlag('hct', d.hct, d.sex),
                    hgb: getFlag('hgb', d.hgb, d.sex),
                    rbc: getFlag('urine', d.rbc_ua),
                    wbc: getFlag('urine', d.wbc_ua)
                };
            };
            const flags = getFlags(data);

            const handleChange = (f, v) => setData(p => ({...p, [f]: v}));
            const handleSave = async () => {
                setLoading(true);
                try {
                    await callGAS('saveHealthData', { payload: { ...data, bmi, cvrisk_score: cvRisk } });
                    alert('บันทึกสำเร็จ');
                    setIsNewYear(false);
                } catch { alert('บันทึกผิดพลาด'); }
                setLoading(false);
            };

            const openChart = (field, title, val) => setModal({ open: true, field, title, value: val });
            const isVaccineValid = useMemo(() => {
                if (!vaccine?.found || !vaccine?.date) return false;
                const vacDate = String(vaccine.date);
                return vacDate.includes(String(selYear));
            }, [vaccine, selYear]);

            return (
                <div className="pb-24 fade-in max-w-lg mx-auto min-h-screen relative">
                    <div className="bg-[#0f172a]/80 backdrop-blur-xl p-4 sticky top-0 z-30 border-b border-white/5 flex items-center justify-between shadow-lg">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack}><Icon name="arrow-left" className="text-slate-300 hover:text-white transition" /></button>
                            <img src={user.pictureProfile || "https://cdn-icons-png.flaticon.com/512/847/847969.png"} className="w-9 h-9 rounded-full border border-indigo-500/50" />
                            <div><h2 className="font-bold text-white text-sm">{user.Name}</h2><p className="text-[10px] text-slate-400">สมุดสุขภาพประจำปี</p></div>
                        </div>
                        <button onClick={handleSave} className="text-xs bg-indigo-600 px-4 py-1.5 rounded-full text-white font-bold shadow-lg hover:bg-indigo-500 transition">บันทึก</button>
                    </div>

                    <div className="bg-[#0f172a] px-4 pt-3 pb-0 border-b border-slate-800 sticky top-[68px] z-20 overflow-x-auto no-scrollbar flex shadow-md">
                        {years.map(y => <div key={y} onClick={() => setSelYear(y)} className={`tab-btn cursor-pointer ${selYear===y ? 'active' : ''}`}>{y}</div>)}
                    </div>

                    <div className="p-4 space-y-5">
                        {loading && <div className="text-center text-xs text-slate-500 animate-pulse">กำลังดึงข้อมูลสุขภาพ...</div>}

                        {/* Missing Data Warning */}
                        {!loading && isNewYear && selYear === new Date().getFullYear() && (
                            <div className="bg-amber-500/10 border-l-4 border-amber-500 p-4 rounded-r shadow-lg animate-bounce-slow">
                                <div className="flex items-start">
                                    <div className="flex-shrink-0"><Icon name="alert-circle" className="h-5 w-5 text-amber-400" /></div>
                                    <div className="ml-3"><p className="text-sm text-amber-200">ยังไม่มีข้อมูลปีปัจจุบัน</p><p className="text-xs text-amber-400/80 mt-1">กรุณาระบุวันที่รับการตรวจสุขภาพประจำปี และกรอกข้อมูล card ที่เหลือ ก่อนกดส่ง</p></div>
                                </div>
                            </div>
                        )}

                        <Card title="1. สัญญาณชีพ & ร่างกาย">
                            <div className="mb-3">
                                <label className="text-[10px] text-slate-400 block mb-1">วันที่ตรวจสุขภาพ</label>
                                <input type="date" className="glass-input w-full text-center" value={data.visit_date} onChange={e=>handleChange('visit_date',e.target.value)} />
                            </div>
                            <div className="grid grid-cols-3 gap-2 mb-3">
                                <Field label="น้ำหนัก (kg)" val={data.weight_kg} onChange={v=>handleChange('weight_kg',v)} onChart={()=>openChart('weight_kg','น้ำหนัก', data.weight_kg)} />
                                <Field label="ส่วนสูง (cm)" val={data.height_cm} onChange={v=>handleChange('height_cm',v)} />
                                <Field label="อายุ (ปี)" val={data.age} onChange={v=>handleChange('age',v)} onChart={()=>openChart('age','อายุ', data.age)} />
                            </div>
                            <div className="flex justify-between items-center bg-slate-800/50 p-2.5 rounded-lg mb-3 border border-slate-700/50">
                                <span className="text-xs text-slate-400">BMI: <span className="text-white font-bold ml-1 text-sm">{bmi || '-'}</span></span>
                                {flags.bmi && <span className={`badge ${flags.bmi.bg}`}>{flags.bmi.label}</span>}
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <Field label="รอบเอว (cm)" val={data.waist_cm} onChange={v=>handleChange('waist_cm',v)} flag={flags.waist} onChart={()=>openChart('waist_cm','รอบเอว', data.waist_cm)} />
                                <Field label="ชีพจร (bpm)" val={data.pulse} onChange={v=>handleChange('pulse',v)} flag={flags.pulse} onChart={()=>openChart('pulse','ชีพจร', data.pulse)} />
                            </div>
                            <div className="mt-3 bg-slate-800/30 p-2 rounded-lg border border-white/5">
                                <label className="text-[10px] text-slate-400 block mb-1">ความดันโลหิต (SBP/DBP)</label>
                                <div className="flex gap-2 items-center">
                                    <input className="glass-input text-center px-1" placeholder="" value={data.bp_systolic} onChange={e=>handleChange('bp_systolic',e.target.value)} />
                                    <span className="text-slate-500">/</span>
                                    <input className="glass-input text-center px-1" placeholder="" value={data.bp_diastolic} onChange={e=>handleChange('bp_diastolic',e.target.value)} />
                                    <button onClick={()=>openChart('bp_systolic','ความดันโลหิต', data.bp_systolic)} className="p-2 text-indigo-400 bg-slate-800 rounded hover:bg-slate-700"><Icon name="bar-chart-2" size={16} /></button>
                                </div>
                                {flags.bp && <div className={`text-right mt-1.5 inline-block float-right badge ${flags.bp.bg}`}>{flags.bp.label}</div>}
                                <div className="clear-both"></div>
                            </div>
                        </Card>

                        <Card title="2. ผลเลือด & เคมีคลินิก">
                            <div className="space-y-4">
                                <div className="bg-slate-800/40 p-2 rounded-lg"><span className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider block mb-2">CBC</span>
                                    <div className="grid grid-cols-2 gap-3">
                                        <Field label="Hct (%)" val={data.hct} onChange={v=>handleChange('hct',v)} flag={flags.hct} onChart={()=>openChart('hct','Hct', data.hct)} />
                                        <Field label="Hgb (g/dL)" val={data.hgb} onChange={v=>handleChange('hgb',v)} flag={flags.hgb} onChart={()=>openChart('hgb','Hgb', data.hgb)} />
                                    </div>
                                </div>
                                <div className="bg-slate-800/40 p-2 rounded-lg"><span className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider block mb-2">Lipid & Sugar</span>
                                    <div className="grid grid-cols-2 gap-3">
                                        <Field label="FBS" val={data.fbs} onChange={v=>handleChange('fbs',v)} flag={flags.fbs} onChart={()=>openChart('fbs','ระดับน้ำตาล', data.fbs)} />
                                        <Field label="Cholesterol" val={data.chol} onChange={v=>handleChange('chol',v)} flag={flags.chol} onChart={()=>openChart('chol','Cholesterol', data.chol)} />
                                        <Field label="Triglyceride" val={data.trig} onChange={v=>handleChange('trig',v)} flag={flags.trig} onChart={()=>openChart('trig','Triglyceride', data.trig)} />
                                        <Field label="HDL" val={data.hdl} onChange={v=>handleChange('hdl',v)} flag={flags.hdl} onChart={()=>openChart('hdl','HDL', data.hdl)} />
                                        <div className="col-span-2"><Field label="LDL" val={data.ldl} onChange={v=>handleChange('ldl',v)} flag={flags.ldl} onChart={()=>openChart('ldl','LDL', data.ldl)} /></div>
                                    </div>
                                </div>
                                <div className="bg-slate-800/40 p-2 rounded-lg"><span className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider block mb-2">Kidney & Liver</span>
                                    <div className="grid grid-cols-2 gap-3">
                                        <Field label="BUN" val={data.bun} onChange={v=>handleChange('bun',v)} flag={flags.bun} onChart={()=>openChart('bun','BUN', data.bun)} />
                                        <Field label="Creatinine" val={data.cr} onChange={v=>handleChange('cr',v)} flag={flags.cr} onChart={()=>openChart('cr','Creatinine', data.cr)} />
                                        <Field label="SGOT" val={data.sgot} onChange={v=>handleChange('sgot',v)} flag={flags.sgot} onChart={()=>openChart('sgot','SGOT', data.sgot)} />
                                        <Field label="SGPT" val={data.sgpt} onChange={v=>handleChange('sgpt',v)} flag={flags.sgpt} onChart={()=>openChart('sgpt','SGPT', data.sgpt)} />
                                        <Field label="Alk Phos" val={data.alk_phos} onChange={v=>handleChange('alk_phos',v)} />
                                        <Field label="Uric Acid" val={data.uric} onChange={v=>handleChange('uric',v)} flag={flags.uric} onChart={()=>openChart('uric','Uric Acid', data.uric)} />
                                    </div>
                                </div>
                            </div>
                        </Card>

                        <Card title="3. การตรวจปัสสาวะ (Urine)">
                            <div className="grid grid-cols-2 gap-3">
                                <Field label="RBC" val={data.rbc_ua} onChange={v=>handleChange('rbc_ua',v)} flag={flags.rbc} />
                                <Field label="WBC" val={data.wbc_ua} onChange={v=>handleChange('wbc_ua',v)} flag={flags.wbc} />
                            </div>
                            <div className="mt-3 bg-slate-800/30 p-2 rounded border border-white/5">
                                <label className="text-[10px] text-slate-400 block mb-1">ผลปัสสาวะภาพรวม</label>
                                <div className="flex gap-2"><RadioBtn name="urine_flag" val={data.urine_flag} setVal={v=>handleChange('urine_flag',v)} opts={[{v:1,l:'ปกติ'},{v:2,l:'ผิดปกติ'}]} /></div>
                                {data.urine_flag==2 && <input className="glass-input mt-2 text-xs" placeholder="ระบุความผิดปกติ" value={data.urine_detail} onChange={e=>handleChange('urine_detail',e.target.value)} />}
                            </div>
                        </Card>

                        <Card title="4. ประวัติ & การคัดกรอง">
                            <FlagInput label="โรคประจำตัว" name="has_chronic" val={data.has_chronic} detail={data.chronic_detail} onChange={handleChange} opts={[{v:1,l:'มี'},{v:2,l:'ไม่มี'}]} />
                            <FlagInput label="ประวัติครอบครัว" name="family_history_flag" val={data.family_history_flag} detail={data.family_history_detail} onChange={handleChange} opts={[{v:1,l:'มี'},{v:2,l:'ไม่มี'}]} />
                            <FlagInput label="X-Ray ปอด (CXR)" name="cxr_flag" val={data.cxr_flag} detail={data.cxr_detail} onChange={handleChange} opts={[{v:1,l:'ปกติ'},{v:2,l:'ผิดปกติ'}]} />
                        </Card>

                        <Card title="5. พฤติกรรมสุขภาพ">
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="text-[10px] text-slate-400 block mb-1">ออกกำลังกาย</label><Select val={data.exercise} options={[{code:1,label:'น้อย'},{code:3,label:'ปานกลาง'},{code:5,label:'หนัก'}]} onChange={v=>handleChange('exercise',v)} /></div>
                                <div><label className="text-[10px] text-slate-400 block mb-1">สูบบุหรี่</label><Select val={data.smoking} options={codebook['smoking']} onChange={v=>handleChange('smoking',v)} /></div>
                                <div><label className="text-[10px] text-slate-400 block mb-1">แอลกอฮอล์</label><Select val={data.alcohol} options={codebook['alcohol']} onChange={v=>handleChange('alcohol',v)} /></div>
                                <div><label className="text-[10px] text-slate-400 block mb-1">หมวกกันน็อก</label><Select val={data.helmet} options={[{code:1,label:'สวม'},{code:2,label:'ไม่สวม'}]} onChange={v=>handleChange('helmet',v)} /></div>
                                <div><label className="text-[10px] text-slate-400 block mb-1">เข็มขัดนิรภัย</label><Select val={data.belt} options={[{code:1,label:'คาด'},{code:2,label:'ไม่คาด'}]} onChange={v=>handleChange('belt',v)} /></div>
                            </div>
                        </Card>

                        <Card title="6. วัคซีน & ภูมิคุ้มกัน">
                            <div className="p-3 bg-slate-800/50 rounded-lg border border-slate-700 space-y-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs text-slate-300">ไข้หวัดใหญ่ {selYear}</span>
                                    {isVaccineValid ? <span className="badge bg-green">ได้รับแล้ว</span> : <span className="badge bg-red">ยังไม่ได้รับ</span>}
                                </div>
                                <div className="flex justify-between items-center"><span className="text-xs text-slate-300">HBs Ag</span><RadioBtn name="hbs_flag" val={data.hbs_flag} setVal={v=>handleChange('hbs_flag',v)} opts={[{v:1,l:'Neg'},{v:2,l:'Pos'}]} /></div>
                            </div>
                        </Card>

                        <Card title="7. สรุปผลแพทย์ & ความเสี่ยง">
                            <div className="grid grid-cols-2 gap-2 mb-3">
                                <div className="bg-slate-800 p-3 rounded-lg text-center border border-slate-700 shadow-inner"><div className="text-[9px] text-slate-400 uppercase tracking-widest mb-1">CV Risk (10ปี)</div><div className="text-xl font-bold text-white">{cvRisk}%</div></div>
                                <div className="bg-slate-800 p-3 rounded-lg text-center border border-slate-700 shadow-inner"><div className="text-[9px] text-slate-400 uppercase tracking-widest mb-1">Calorie/Day</div><div className="text-xl font-bold text-white">~{(data.weight_kg*22*30).toFixed(0)}</div></div>
                            </div>
                            <div className="space-y-2">
                                <label className="text-[10px] text-slate-400">ความเห็นแพทย์</label>
                                <textarea className="glass-input h-24 text-sm" value={data.doctor_summary} onChange={e=>handleChange('doctor_summary',e.target.value)}></textarea>
                                <Select label="แพทย์ผู้ตรวจ" val={data.doctor_name} options={codebook['doctor_name']} onChange={v=>handleChange('doctor_name',v)} />
                            </div>
                        </Card>
                    </div>

                    {modal?.open && <ChartModal hn={user.HN} field={modal.field} title={modal.title} value={modal.value} year={selYear} onClose={()=>setModal(null)} />}
                </div>
            );
        };

        // --- Helper UI Components ---
        // Change type to text for flexibility
        const Field = ({ label, val, onChange, flag, onChart, readonly }) => (
            <div>
                <div className="flex justify-between items-end mb-1">
                    <label className="text-[10px] text-slate-400">{label}</label>
                    {onChart && <button onClick={onChart} className="text-[10px] text-indigo-400 hover:text-white transition flex items-center gap-0.5"><Icon name="bar-chart-2" size={14} /> เทียบ</button>}
                </div>
                <div className="relative">
                    <input type="text" className="glass-input pr-8" value={val||''} onChange={e=>onChange(e.target.value)} readOnly={readonly} />
                    {flag && <span className={`absolute right-1.5 top-2.5 w-2.5 h-2.5 rounded-full ${flag.dot} ring-2 ring-slate-800`}></span>}
                </div>
            </div>
        );

        const Card = ({ title, children }) => (
            <div className="glass-panel p-5 rounded-2xl">
                <h3 className="text-indigo-300 font-bold text-[11px] uppercase tracking-wider mb-4 border-b border-slate-700/50 pb-2">{title}</h3>
                {children}
            </div>
        );

        const Select = ({ label, val, options, onChange }) => {
            const found = options?.find(o => o.code == val);
            return (
                <div>
                    {label && <label className="text-[10px] text-slate-400 block mb-1">{label}</label>}
                    <select className="glass-input text-xs" value={val||''} onChange={e => onChange(e.target.value)}>
                        <option value="">- เลือก -</option>
                        {options?.map((o,i)=><option key={i} value={o.code}>{o.label}</option>)}
                        {val && !found && <option value={val}>{val}</option>}
                    </select>
                </div>
            );
        };

        const RadioBtn = ({ name, val, setVal, opts }) => (
            <div className="flex bg-slate-800 rounded p-0.5 w-full">
                {opts.map(o => (
                    <button key={o.v} onClick={()=>setVal(o.v)} 
                        className={`flex-1 text-[10px] py-1 px-2 rounded transition-all ${val==o.v ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                        {o.l}
                    </button>
                ))}
            </div>
        );

        const FlagInput = ({ label, name, val, detail, onChange, opts }) => (
            <div className="mb-3 border-b border-slate-700/50 pb-3 last:border-0 last:pb-0">
                <div className="flex justify-between items-center mb-2">
                    <label className="text-[10px] text-slate-400 w-1/3">{label}</label>
                    <div className="w-2/3"><RadioBtn name={name} val={val} setVal={v=>onChange(name,v)} opts={opts} /></div>
                </div>
                {(val==1 || val==2) && (name.includes('chronic') || name.includes('detail') || name.includes('flag')) && (val==1 || (name.includes('cxr') && val==2)) &&
                    <input className="glass-input text-xs mt-1" placeholder="ระบุรายละเอียด..." value={detail} onChange={e=>onChange(name.replace('flag','detail').replace('has_','').replace('_flag','_detail'), e.target.value)} />
                }
            </div>
        );

        // --- Chart Modal & Logic (Frequency Line) ---
        const ChartModal = ({ hn, field, title, value, year, onClose }) => {
            const canvasRef = useRef(null);
            const [mode, setMode] = useState('self');
            const [loading, setLoading] = useState(true);
            const [stats, setStats] = useState(null);

            useEffect(() => {
                const draw = async () => {
                    setLoading(true);
                    try {
                        let config = {};
                        if (mode === 'self') {
                            setStats(null);
                            const res = await callGAS('getSelfTrend', { hn, field });
                            config = { 
                                type: 'line', 
                                data: { labels: res.map(d=>d.year), datasets: [{ label: 'แนวโน้ม', data: res.map(d=>d.value), borderColor: '#6366f1', tension: 0.4, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }] } 
                            };
                        } else {
                            const res = await callGAS('getDistribution', { field, year, hn });
                            const vals = res.values || [];
                            const userVal = parseFloat(value) || res.userVal || 0;
                            
                            // Stats
                            const n = vals.length;
                            const sortedVals = [...vals].sort((a,b) => a - b);
                            const rank = sortedVals.findIndex(v => v >= userVal) + 1 || n;
                            setStats({ n, rank });

                            // Frequency Line Chart (Linear Scale)
                            const bins = 10;
                            // Ensure min/max covers userVal and adds buffer
                            const min = Math.min(...vals, userVal);
                            const max = Math.max(...vals, userVal);
                            // Add 10% buffer
                            const buffer = (max - min) * 0.1 || 1;
                            const rangeMin = Math.floor(min - buffer);
                            const rangeMax = Math.ceil(max + buffer);
                            
                            const step = (rangeMax - rangeMin) / bins;
                            
                            const curveData = [];
                            
                            for(let i=0; i<bins; i++) {
                                const start = rangeMin + (i*step);
                                const end = start + step;
                                const mid = start + (step/2);
                                // Count values in bin
                                const count = vals.filter(v => v >= start && v < end).length;
                                curveData.push({ x: mid, y: count });
                            }
                            
                            // Close the area at the bottom
                            if(curveData.length > 0) {
                                curveData.unshift({ x: rangeMin, y: 0 });
                                curveData.push({ x: rangeMax, y: 0 });
                            }

                            config = { 
                                type: 'line', 
                                data: { 
                                    datasets: [
                                        { 
                                            label: 'กลุ่ม', 
                                            data: curveData, 
                                            borderColor: '#6366f1', 
                                            backgroundColor: 'rgba(99, 102, 241, 0.2)', 
                                            fill: true,
                                            tension: 0.4,
                                            pointRadius: 0
                                        },
                                        { 
                                            type: 'scatter',
                                            label: 'คุณ', 
                                            data: [{x: userVal, y: 0}], 
                                            backgroundColor: '#f43f5e', 
                                            pointRadius: 8, 
                                            borderColor: 'white', 
                                            borderWidth: 2,
                                            order: 0
                                        }
                                    ] 
                                },
                                options: { 
                                    scales: { 
                                        x: { 
                                            type: 'linear', 
                                            grid:{color:'#334155'}, 
                                            ticks:{color:'#94a3b8'},
                                            min: rangeMin,
                                            max: rangeMax
                                        }, 
                                        y: { display:false, beginAtZero: true } 
                                    },
                                    plugins: { legend: { display: false } }
                                }
                            };
                        }
                        
                        if (canvasRef.current) {
                            const chart = Chart.getChart(canvasRef.current);
                            if (chart) chart.destroy();
                            new Chart(canvasRef.current, { ...config, options: { ...config.options, responsive: true, maintainAspectRatio: false } });
                        }
                    } catch(e) {}
                    setLoading(false);
                };
                draw();
            }, [mode]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in zoom-in" onClick={onClose}>
                    <div className="bg-[#1e293b] w-full max-w-sm rounded-2xl p-5 border border-slate-700 relative shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-3 right-3 text-slate-400 hover:text-white"><Icon name="x" size={20} /></button>
                        <h3 className="text-white font-bold mb-1 flex items-center gap-2"><Icon name="bar-chart-2" className="text-indigo-400" size={20} /> วิเคราะห์: {title}</h3>
                        <p className="text-xs text-slate-400 mb-4 ml-7">ค่าของคุณ: <span className="text-white font-bold">{value || '-'}</span></p>
                        
                        <div className="flex bg-slate-900 rounded p-1 mb-4">
                            <button onClick={()=>setMode('self')} className={`flex-1 text-xs py-2 rounded ${mode==='self'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบตัวเอง</button>
                            <button onClick={()=>setMode('others')} className={`flex-1 text-xs py-2 rounded ${mode==='others'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบกลุ่ม</button>
                        </div>
                        <div className="h-56 relative">{loading && <div className="absolute inset-0 flex items-center justify-center text-xs text-slate-500">สร้างกราฟ...</div>}<canvas ref={canvasRef}></canvas></div>
                        {mode === 'others' && (
                            <div className="mt-3 text-center">
                                <p className="text-[10px] text-slate-500">* จุดสีแดงคือตำแหน่งของคุณในกลุ่ม</p>
                                {stats && <p className="text-xs text-slate-300 mt-1">จำนวนข้อมูล (n) = <span className="font-bold text-white">{stats.n}</span> | ลำดับที่ <span className="font-bold text-white">{stats.rank}</span> (จากน้อยไปมาก)</p>}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const getFlag = (t, v, s) => {
            const n = parseFloat(v); if(!n) return null;
            const dot = (c) => c === 'bg-green' ? 'bg-emerald-500' : c === 'bg-yellow' ? 'bg-amber-500' : 'bg-rose-500';
            let res = null;
            if(t=='bmi') res = n<18.5?{bg:'bg-yellow',label:'ผอม'}:n<23?{bg:'bg-green',label:'ปกติ'}:n<25?{bg:'bg-yellow',label:'ท้วม'}:{bg:'bg-red',label:'อ้วน'};
            if(t=='bp') res = n<120?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='waist') { let lim=s=='ชาย'?90:80; res = n<lim?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'เกิน'}; }
            if(t=='pulse') res = (n>=60 && n<=100)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='fbs') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<126?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t=='chol') res = n<200?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='trig') res = n<150?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='hdl') res = n>=40?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ต่ำ'};
            if(t=='ldl') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<130?{bg:'bg-yellow',label:'สูง'}:{bg:'bg-red',label:'สูงมาก'};
            if(t=='bun') res = n<=20?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='cr') res = n<=1.2?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='uric') res = n<=7?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='liver') res = n<=40?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='hct') res = (n>=36 && n<=50)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='hgb') res = (n>=12 && n<=17)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='urine') res = n<=5?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            
            if(res) return { ...res, dot: dot(res.bg) };
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
