<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC SW-1 (สวีวรรณ)</title>
    
    <link rel="icon" href="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-size: 14px; }
        
        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 150% 150%;
            animation: aurora 15s ease infinite;
        }
        .bg-overlay::after {
            content: ""; position: absolute; inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.4;
        }
        @keyframes aurora { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-input { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 100%; padding: 0.4rem 0.6rem; border-radius: 0.375rem; transition: all 0.2s; font-size: 0.9rem; height: 38px; }
        .glass-input:focus { outline: none; border-color: #818cf8; background: rgba(15, 23, 42, 0.8); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .glass-input:read-only { opacity: 0.7; cursor: default; }

        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; font-weight: 600; padding: 0.6rem; border-radius: 0.5rem; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }

        .btn-secondary { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; font-weight: 500; padding: 0.6rem; border-radius: 0.5rem; width: 100%; border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .badge { padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-left: 4px; white-space: nowrap; height: 20px; display: inline-flex; align-items: center; letter-spacing: 0.5px; }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-btn { position: relative; padding: 0.6rem 1.2rem; color: #94a3b8; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: white; font-weight: 600; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #6366f1; border-radius: 3px 3px 0 0; box-shadow: 0 -2px 10px rgba(99, 102, 241, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const LIFF_ID = "2008690634-Mr6OanUA"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzG8WjNpWdC-JwFFIrRRJ2w7_sHdKx3D3ZIykPqwFuaWmvrPpOOJCv7CVYAGOY7tk60/exec";
        const LOGO_URL = "https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png";

        const PCU_OPTIONS = [
            "รพ.สต.เขาค่าย", "รพ.สต.เขาทะลุ", "รพ.สต.ครน", "รพ.สต.ด่านสวี",
            "รพ.สต.ท่าหิน", "รพ.สต.ทุ่งระยะ", "รพ.สต.นาสัก", "รพ.สต.บ้านแก่งกระทั่ง",
            "รพ.สต.บ้านคลองน้อย", "รพ.สต.บ้านควนสามัคคี", "รพ.สต.บ้านดอนทราย", "รพ.สต.บ้านไทยพัฒนา",
            "รพ.สต.บ้านน้ำฉา", "รพ.สต.ปากแพรก", "รพ.สต.วิสัยใต้", "รพ.สต.สวี", "สสอ.สวี"
        ];

        // --- 1. GLOBAL UTILS & HELPERS ---
        const callGAS = async (action, payload = {}) => {
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action, ...payload })
                });
                return await res.json();
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        };

        const Icon = ({ name, className, size=24 }) => {
            const ref = useRef(null);
            useEffect(() => {
                if(ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className || '';
                    ref.current.appendChild(i);
                    lucide.createIcons({ root: ref.current, attrs: { width: size, height: size } });
                }
            }, [name, className, size]);
            return <span ref={ref} className="inline-flex items-center justify-center"></span>;
        };

        const Loading = ({ text }) => (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0f172a]/95 backdrop-blur-md">
                <img src={LOGO_URL} className="w-20 h-20 mb-4 animate-pulse" />
                <div className="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                <p className="text-indigo-200 text-xs tracking-wider">{text}</p>
            </div>
        );

        const getFlag = (t, v, s) => {
            const n = parseFloat(v); if(!n) return null;
            const dot = (c) => c === 'bg-green' ? 'bg-emerald-500' : c === 'bg-yellow' ? 'bg-amber-500' : 'bg-rose-500';
            let res = null;
            if(t=='bmi') res = n<18.5?{bg:'bg-yellow',label:'ผอม'}:n<23?{bg:'bg-green',label:'ปกติ'}:n<25?{bg:'bg-yellow',label:'ท้วม'}:{bg:'bg-red',label:'อ้วน'};
            if(t=='bp') res = n<120?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='waist') { let lim=s=='ชาย'?90:80; res = n<lim?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'เกิน'}; }
            if(t=='pulse') res = (n>=60 && n<=100)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='fbs') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<126?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t=='chol') res = n<200?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='trig') res = n<150?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='hdl') res = n>=40?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ต่ำ'};
            if(t=='ldl') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<130?{bg:'bg-yellow',label:'สูง'}:{bg:'bg-red',label:'สูงมาก'};
            if(t=='bun') res = n<=20?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='cr') res = n<=1.2?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='uric') res = n<=7?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='liver') res = n<=40?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='hct') res = (n>=36 && n<=50)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='hgb') res = (n>=12 && n<=17)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='urine') res = n<=5?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(res) return { ...res, dot: dot(res.bg) };
            return null;
        };

        // --- 2. UI COMPONENTS (ATOMS) ---
        const Field = ({ label, val, onChange, flag, onChart, readonly }) => (
            <div>
                <div className="flex justify-between items-end mb-1">
                    <label className="text-[10px] text-slate-400">{label}</label>
                    {onChart && <button onClick={onChart} className="text-[10px] text-indigo-400 hover:text-white transition flex items-center gap-0.5"><Icon name="bar-chart-2" size={14} /> เทียบ</button>}
                </div>
                <div className="relative">
                    <input type="text" className="glass-input pr-8" value={val||''} onChange={e=>onChange(e.target.value)} readOnly={readonly} />
                    {flag && <span className={`absolute right-1.5 top-2.5 w-2.5 h-2.5 rounded-full ${flag.dot} ring-2 ring-slate-800`}></span>}
                </div>
            </div>
        );

        const Card = ({ title, children }) => (
            <div className="glass-panel p-5 rounded-2xl">
                <h3 className="text-indigo-300 font-bold text-[11px] uppercase tracking-wider mb-4 border-b border-slate-700/50 pb-2">{title}</h3>
                {children}
            </div>
        );

        const Select = ({ label, val, options, onChange }) => {
            const found = options?.find(o => o.code == val);
            return (
                <div>
                    {label && <label className="text-[10px] text-slate-400 block mb-1">{label}</label>}
                    <select className="glass-input text-xs" value={val||''} onChange={e => onChange(e.target.value)}>
                        <option value="">- เลือก -</option>
                        {options?.map((o,i)=><option key={i} value={o.code}>{o.label}</option>)}
                        {val && !found && <option value={val}>{val}</option>}
                    </select>
                </div>
            );
        };

        const RadioBtn = ({ name, val, setVal, opts }) => (
            <div className="flex bg-slate-800 rounded p-0.5 w-full">
                {opts.map(o => (
                    <button key={o.v} onClick={()=>setVal(o.v)} 
                        className={`flex-1 text-[10px] py-1 px-2 rounded transition-all ${val==o.v ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                        {o.l}
                    </button>
                ))}
            </div>
        );

        const FlagInput = ({ label, name, val, detail, onChange, opts }) => (
            <div className="mb-3 border-b border-slate-700/50 pb-3 last:border-0 last:pb-0">
                <div className="flex justify-between items-center mb-2">
                    <label className="text-[10px] text-slate-400 w-1/3">{label}</label>
                    <div className="w-2/3"><RadioBtn name={name} val={val} setVal={v=>onChange(name,v)} opts={opts} /></div>
                </div>
                {(val==1 || val==2) && (name.includes('chronic') || name.includes('detail') || name.includes('flag')) && (val==1 || (name.includes('cxr') && val==2)) &&
                    <input className="glass-input text-xs mt-1" placeholder="ระบุรายละเอียด..." value={detail} onChange={e=>onChange(name.replace('flag','detail').replace('has_','').replace('_flag','_detail'), e.target.value)} />
                }
            </div>
        );

        const MenuBtn = ({ icon, title, color, bg, onClick }) => (
            <button onClick={onClick} className="glass-panel p-5 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-slate-800/60 active:scale-95 transition-all h-36 border border-white/5 shadow-lg">
                <div className={`p-4 rounded-full ${bg} shadow-inner`}><Icon name={icon} size={40} className={color} /></div>
                <span className="text-sm font-medium text-slate-200 text-center leading-tight">{title}</span>
            </button>
        );

        const ChartModal = ({ hn, field, title, value, year, onClose }) => {
            const canvasRef = useRef(null);
            const [mode, setMode] = useState('self');
            const [loading, setLoading] = useState(true);
            const [stats, setStats] = useState(null);

            useEffect(() => {
                const draw = async () => {
                    setLoading(true);
                    try {
                        let config = {};
                        if (mode === 'self') {
                            setStats(null);
                            const res = await callGAS('getSelfTrend', { hn, field });
                            config = { 
                                type: 'line', 
                                data: { labels: res.map(d=>d.year), datasets: [{ label: 'แนวโน้ม', data: res.map(d=>d.value), borderColor: '#6366f1', tension: 0.4, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }] } 
                            };
                        } else {
                            const res = await callGAS('getDistribution', { field, year, hn });
                            const vals = res.values || [];
                            const userVal = parseFloat(value) || res.userVal || 0;
                            
                            // Stats
                            const n = vals.length;
                            const sortedVals = [...vals].sort((a,b) => a - b);
                            const rank = sortedVals.findIndex(v => v >= userVal) + 1 || n;
                            setStats({ n, rank });

                            // Frequency Line Chart (Linear Scale)
                            const bins = 10;
                            const min = Math.min(...vals, userVal);
                            const max = Math.max(...vals, userVal);
                            const buffer = (max - min) * 0.1 || 1;
                            const rangeMin = Math.floor(min - buffer);
                            const rangeMax = Math.ceil(max + buffer);
                            
                            const step = (rangeMax - rangeMin) / bins;
                            
                            const curveData = [];
                            
                            for(let i=0; i<bins; i++) {
                                const start = rangeMin + (i*step);
                                const end = start + step;
                                const mid = start + (step/2);
                                // Count values in bin
                                const count = vals.filter(v => v >= start && v < end).length;
                                curveData.push({ x: mid, y: count });
                            }
                            
                            // Close the area at the bottom
                            if(curveData.length > 0) {
                                curveData.unshift({ x: rangeMin, y: 0 });
                                curveData.push({ x: rangeMax, y: 0 });
                            }

                            config = { 
                                type: 'line', 
                                data: { 
                                    datasets: [
                                        { 
                                            label: 'กลุ่ม', 
                                            data: curveData, 
                                            borderColor: '#6366f1', 
                                            backgroundColor: 'rgba(99, 102, 241, 0.2)', 
                                            fill: true,
                                            tension: 0.4,
                                            pointRadius: 0
                                        },
                                        { 
                                            type: 'scatter',
                                            label: 'คุณ', 
                                            data: [{x: userVal, y: 0}], 
                                            backgroundColor: '#f43f5e', 
                                            pointRadius: 8, 
                                            borderColor: 'white', 
                                            borderWidth: 2,
                                            order: 0
                                        }
                                    ] 
                                },
                                options: { 
                                    scales: { 
                                        x: { 
                                            type: 'linear', 
                                            grid:{color:'#334155'}, 
                                            ticks:{color:'#94a3b8'},
                                            min: rangeMin,
                                            max: rangeMax
                                        }, 
                                        y: { display:false, beginAtZero: true } 
                                    },
                                    plugins: { legend: { display: false } }
                                }
                            };
                        }
                        
                        if (canvasRef.current) {
                            const chart = Chart.getChart(canvasRef.current);
                            if (chart) chart.destroy();
                            new Chart(canvasRef.current, { ...config, options: { ...config.options, responsive: true, maintainAspectRatio: false } });
                        }
                    } catch(e) {}
                    setLoading(false);
                };
                draw();
            }, [mode]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in zoom-in" onClick={onClose}>
                    <div className="bg-[#1e293b] w-full max-w-sm rounded-2xl p-5 border border-slate-700 relative shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-3 right-3 text-slate-400 hover:text-white"><Icon name="x" size={20} /></button>
                        <h3 className="text-white font-bold mb-1 flex items-center gap-2"><Icon name="bar-chart-2" className="text-indigo-400" size={20} /> วิเคราะห์: {title}</h3>
                        <p className="text-xs text-slate-400 mb-4 ml-7">ค่าของคุณ: <span className="text-white font-bold">{value || '-'}</span></p>
                        
                        <div className="flex bg-slate-900 rounded p-1 mb-4">
                            <button onClick={()=>setMode('self')} className={`flex-1 text-xs py-2 rounded ${mode==='self'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบตัวเอง</button>
                            <button onClick={()=>setMode('others')} className={`flex-1 text-xs py-2 rounded ${mode==='others'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบกลุ่ม</button>
                        </div>
                        <div className="h-56 relative">{loading && <div className="absolute inset-0 flex items-center justify-center text-xs text-slate-500">สร้างกราฟ...</div>}<canvas ref={canvasRef}></canvas></div>
                        {mode === 'others' && (
                            <div className="mt-3 text-center">
                                <p className="text-[10px] text-slate-500">* จุดสีแดงคือตำแหน่งของคุณในกลุ่ม</p>
                                {stats && <p className="text-xs text-slate-300 mt-1">จำนวนข้อมูล (n) = <span className="font-bold text-white">{stats.n}</span> | ลำดับที่ <span className="font-bold text-white">{stats.rank}</span> (จากน้อยไปมาก)</p>}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 3. PAGE COMPONENTS ---

        const LoginPage = ({ onLogin, onLiff, onRegister }) => {
            const [c, setC] = useState({ loginname: '', HN: '', cid: '' });
            const isValid = useMemo(() => {
                let count = 0;
                if(c.loginname.trim()) count++; if(c.HN.trim()) count++; if(c.cid.trim()) count++;
                return (count >= 2) || (c.cid.trim().length === 13);
            }, [c]);

            const attemptLogin = () => {
                if(!isValid) return alert("กรุณากรอกข้อมูลตามเงื่อนไข");
                const cleanCriteria = { ...c, cid: c.cid.replace(/[^0-9]/g, '') };
                onLogin(cleanCriteria);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 fade-in relative overflow-hidden">
                    <div className="w-full max-w-sm text-center z-10">
                        <div className="mb-6 relative inline-block">
                            <div className="absolute inset-0 bg-indigo-500 blur-[40px] opacity-20 rounded-full"></div>
                            <img src={LOGO_URL} className="w-28 h-28 mx-auto relative z-10 drop-shadow-2xl" />
                        </div>
                        <h1 className="text-3xl font-bold text-white mb-1 tracking-tight">IC SW-1 <span style={{color:'#94a3b8'}} className="font-normal text-xl">(สวีวรรณ)</span></h1>
                        <h2 className="text-lg text-indigo-300 font-medium mb-2 tracking-wide">Digital Health Book</h2>
                        <p className="text-[11px] text-slate-400 mb-8 font-light leading-relaxed opacity-80">สมุดบันทึกสุขภาพบุคลากร<br/>งานป้องกันและควบคุมการติดเชื้อในโรงพยาบาลสวี</p>

                        <div className="glass-panel p-6 rounded-2xl space-y-4 text-left border-t border-white/10">
                            <label className="text-xs text-indigo-200 block text-center font-medium bg-indigo-500/10 py-2 rounded border border-indigo-500/20">กรุณากรอกข้อมูลยืนยันตัวตนอย่างน้อย 2 ช่องด้านล่าง</label>
                            <div className="space-y-2">
                                <input className="glass-input text-center" placeholder="HosXP Login Name" value={c.loginname} onChange={e=>setC({...c, loginname:e.target.value})} />
                                <input className="glass-input text-center" placeholder="รหัส HN" value={c.HN} onChange={e=>setC({...c, HN:e.target.value})} />
                                <input className="glass-input text-center" placeholder="เลขบัตรประชาชน (CID)" maxLength="13" value={c.cid} onChange={e=>setC({...c, cid:e.target.value})} />
                            </div>
                            <button onClick={attemptLogin} disabled={!isValid} className={`btn-primary mt-2 shadow-lg shadow-indigo-500/30 w-full transition-all ${!isValid ? 'opacity-50 cursor-not-allowed grayscale' : ''}`}>เข้าสู่ระบบ</button>
                        </div>
                        <div className="mt-8 space-y-3 pt-6 border-t border-slate-700/50">
                            <button onClick={onLiff} className="w-full py-3 rounded-xl bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-green-500/20">เข้าสู่ระบบด้วย LINE</button>

        const HealthBook = ({ user, codebook, onBack }) => {

            const [isNewYear, setIsNewYear] = useState(false);

            useEffect(() => {

                    try {

                    try {

                            setData(h);

                            setData(def);
                            setIsNewYear(true);
                        }
                        
                        const v = await callGAS('getVaccineStatus', { hn: user.HN, year: selYear });
                        setVaccine(v);
                        if (v.found) setData(prev => ({...prev, influenza: 1}));
                    } catch { setData(def); setIsNewYear(true); }
                    setLoading(false);
                };
                loadData();
            }, [selYear]);

            const handleSyncHIS = async () => {
                alert("ส่วนที่เป็นตัวเลขท่านไม่ต้องกรอกเอง เมื่อดึงข้อมูลเสร็จเราจะแจ้งให้ท่านทราบภายหลัง กรุณาประเมินผลส่วนที่เหลือให้ครบถ้วน");
                setIsHisWait(true);
                setSynced(true);
            };

            const bmi = useMemo(() => (data.weight_kg && data.height_cm) ? (data.weight_kg / Math.pow(data.height_cm/100, 2)).toFixed(2) : '', [data]);
            const cvRisk = useMemo(() => {
                let s = (data.age*0.1) + (data.bp_systolic*0.01) + (data.chol*0.005) + (data.smoking==='2'?1:0) + (data.sex==='ชาย'?1:0);
                return s > 10 ? 10 : s.toFixed(1);
            }, [data]);
            
            const getFlags = (d) => {
                const f = {
                    bmi: getFlag('bmi', bmi),
                    bp: getFlag('bp', d.bp_systolic, d.bp_diastolic),
                    waist: getFlag('waist', d.waist_cm, d.sex),
                    pulse: getFlag('pulse', d.pulse),
                    fbs: getFlag('fbs', d.fbs),
                    chol: getFlag('chol', d.chol),
                    trig: getFlag('trig', d.trig),
                    hdl: getFlag('hdl', d.hdl, d.sex),
                    ldl: getFlag('ldl', d.ldl),
                    bun: getFlag('bun', d.bun),
                    cr: getFlag('cr', d.cr),
                    uric: getFlag('uric', d.uric),
                    sgot: getFlag('liver', d.sgot),
                    sgpt: getFlag('liver', d.sgpt),
                    alk: getFlag('liver', d.alk_phos), 
                    hct: getFlag('hct', d.hct, d.sex),
                    hgb: getFlag('hgb', d.hgb, d.sex),
                    rbc: getFlag('urine', d.rbc_ua),
                    wbc: getFlag('urine', d.wbc_ua)
                };
                return f;
            };
            const flags = getFlags(data);

            const handleChange = (f, v) => setData(p => ({...p, [f]: v}));
            const handleSave = async () => {
                setLoading(true);
                const calculateFlagCodes = (data) => {
                    const codes = {};
                    const getC = (t, v, s) => {
                        const res = getFlag(t, v, s);
                        if (!res) return '';
                        if (res.bg.includes('green')) return 1;
                        if (res.bg.includes('yellow')) return 2;
                        return 3;
                    };
                    codes.bmi_flag = getC('bmi', (data.weight_kg && data.height_cm) ? (data.weight_kg / Math.pow(data.height_cm/100, 2)).toFixed(2) : '');
                    codes.bp_flag = getC('bp', data.bp_systolic); 
                    if(data.fbs) codes.fbs_flag = getC('fbs', data.fbs);
                    if(data.chol) codes.chol_flag = getC('chol', data.chol);
                    return codes;
                };

                const flagCodes = calculateFlagCodes(data);
                const payload = { ...data, ...flagCodes, bmi, cvrisk_score: cvRisk };
                
                try {
                    await callGAS('saveHealthData', { payload });
                    alert('บันทึกสำเร็จ');
                    setIsNewYear(false); setSynced(true); setIsHisWait(false);
                } catch { alert('บันทึกผิดพลาด'); }
                setLoading(false);
            };

            const openChart = (field, title, val) => setModal({ open: true, field, title, value: val });
            const isVaccineValid = useMemo(() => vaccine?.found && String(vaccine.date).includes(String(selYear)), [vaccine, selYear]);

            return (
                <div className="pb-24 fade-in max-w-lg mx-auto min-h-screen relative">
                    <div className="bg-[#0f172a]/80 backdrop-blur-xl p-4 sticky top-0 z-30 border-b border-white/5 flex items-center justify-between shadow-lg">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack}><Icon name="arrow-left" className="text-slate-300 hover:text-white transition" /></button>
                            <img src={user.pictureProfile || "https://cdn-icons-png.flaticon.com/512/847/847969.png"} className="w-9 h-9 rounded-full border border-indigo-500/50" />
                            <div><h2 className="font-bold text-white text-sm">{user.Name}</h2><p className="text-[10px] text-slate-400">สมุดสุขภาพประจำปี</p></div>
                        </div>
                        <button onClick={handleSave} className="text-xs bg-indigo-600 px-4 py-1.5 rounded-full text-white font-bold shadow-lg hover:bg-indigo-500 transition">บันทึก</button>
                    </div>

                    <div className="bg-[#0f172a] px-4 pt-3 pb-0 border-b border-slate-800 sticky top-[68px] z-20 overflow-x-auto no-scrollbar flex shadow-md">
                        {years.map(y => <div key={y} onClick={() => setSelYear(y)} className={`tab-btn cursor-pointer ${selYear===y ? 'active' : ''}`}>{y}</div>)}
                    </div>

                    <div className="p-4 space-y-5">
                        {loading && <div className="text-center text-xs text-slate-500 animate-pulse">กำลังดึงข้อมูลสุขภาพ...</div>}
                        
                        <div className="mb-2"><label className="text-[10px] text-slate-400 block mb-1">วันที่ตรวจสุขภาพ</label><input type="date" className="glass-input w-full text-center" value={data.visit_date} onChange={e=>handleChange('visit_date',e.target.value)} /></div>

                        {/* Choice Panel */}
                        {isNewYear && !synced && (
                            <div className="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center space-y-4 border border-indigo-500/30">
                                <div className="w-16 h-16 bg-indigo-500/10 rounded-full flex items-center justify-center mb-2"><Icon name="database" className="text-indigo-400 w-8 h-8" /></div>
                                <div className="text-center"><h3 className="text-white font-bold text-lg">เชื่อมต่อข้อมูล HIS</h3><p className="text-slate-400 text-xs mt-1">ดึงผลตรวจร่างกายและผลเลือดจากโรงพยาบาล</p></div>
                                <div className="flex gap-3 w-full">
                                    <button onClick={handleSyncHIS} className="btn-primary flex-1 py-3 shadow-xl shadow-indigo-500/20"><Icon name="download-cloud" className="w-4 h-4 mr-2" /> ดึงข้อมูล</button>
                                    <button onClick={() => setSynced(true)} className="btn-secondary flex-1 py-3">กรอกเอง</button>
                                </div>
                            </div>
                        )}

                        {/* HIS Wait Banner */}
                        {isHisWait && (
                            <div className="bg-blue-900/30 border-l-4 border-blue-500 p-4 rounded-r flex items-center animate-pulse">
                                <Icon name="loader" className="w-5 h-5 text-blue-400 mr-3 animate-spin" />
                                <div><p className="text-sm text-blue-200 font-bold">กำลังรอข้อมูลจาก HIS...</p><p className="text-xs text-blue-400/80">ระบบจะแจ้งเตือนเมื่อข้อมูลมาถึง (กรุณากรอกส่วนล่างรอ)</p></div>
                            </div>
                        )}

                        {/* Numeric Cards (1-4) - Hidden if waiting for HIS */}
                        {(!isHisWait && synced) && (
                            <>
                                <Card title="1. สัญญาณชีพ & ร่างกาย">
                                    <div className="grid grid-cols-3 gap-2 mb-3">
                                        <Field label="น้ำหนัก (kg)" val={data.weight_kg} onChange={v=>handleChange('weight_kg',v)} onChart={()=>openChart('weight_kg','น้ำหนัก', data.weight_kg)} />
                                        <Field label="ส่วนสูง (cm)" val={data.height_cm} onChange={v=>handleChange('height_cm',v)} />
                                        <Field label="อายุ (ปี)" val={data.age} onChange={v=>handleChange('age',v)} onChart={()=>openChart('age','อายุ', data.age)} />
                                    </div>
                                    <div className="flex justify-between items-center bg-slate-800/50 p-2.5 rounded-lg mb-3 border border-slate-700/50"><span className="text-xs text-slate-400">BMI: <span className="text-white font-bold ml-1 text-sm">{bmi || '-'}</span></span>{flags.bmi && <span className={`badge ${flags.bmi.bg}`}>{flags.bmi.label}</span>}</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <Field label="รอบเอว (cm)" val={data.waist_cm} onChange={v=>handleChange('waist_cm',v)} flag={flags.waist} onChart={()=>openChart('waist_cm','รอบเอว', data.waist_cm)} />
                                        <Field label="ชีพจร (bpm)" val={data.pulse} onChange={v=>handleChange('pulse',v)} flag={flags.pulse} onChart={()=>openChart('pulse','ชีพจร', data.pulse)} />
                                    </div>
                                    <div className="mt-3 bg-slate-800/30 p-2 rounded-lg border border-white/5">
                                        <label className="text-[10px] text-slate-400 block mb-1">ความดันโลหิต (SBP/DBP)</label>
                                        <div className="flex gap-2 items-center">
                                            <input className="glass-input text-center px-1" placeholder="" value={data.bp_systolic} onChange={e=>handleChange('bp_systolic',e.target.value)} />
                                            <span className="text-slate-500">/</span>
                                            <input className="glass-input text-center px-1" placeholder="" value={data.bp_diastolic} onChange={e=>handleChange('bp_diastolic',e.target.value)} />
                                            <button onClick={()=>openChart('bp_systolic','ความดันโลหิต', data.bp_systolic)} className="p-2 text-indigo-400 bg-slate-800 rounded hover:bg-slate-700"><Icon name="bar-chart-2" size={16} /></button>
                                        </div>
                                        {flags.bp && <div className={`text-right mt-1.5 inline-block float-right badge ${flags.bp.bg}`}>{flags.bp.label}</div>}
                                        <div className="clear-both"></div>
                                    </div>
                                </Card>

                                <Card title="2. ผลเลือด & เคมีคลินิก">
                                    <div className="space-y-4">
                                        <div className="bg-slate-800/40 p-2 rounded-lg"><span className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider block mb-2">CBC</span>
                                            <div className="grid grid-cols-2 gap-3"><Field label="Hct (%)" val={data.hct} onChange={v=>handleChange('hct',v)} flag={flags.hct} onChart={()=>openChart('hct','Hct', data.hct)} /><Field label="Hgb (g/dL)" val={data.hgb} onChange={v=>handleChange('hgb',v)} flag={flags.hgb} onChart={()=>openChart('hgb','Hgb', data.hgb)} /></div>
                                        </div>
                                        <div className="bg-slate-800/40 p-2 rounded-lg"><span className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider block mb-2">Lipid & Sugar</span>
                                            <div className="grid grid-cols-2 gap-3">
                                                <Field label="FBS" val={data.fbs} onChange={v=>handleChange('fbs',v)} flag={flags.fbs} onChart={()=>openChart('fbs','ระดับน้ำตาล', data.fbs)} />
                                                <Field label="Cholesterol" val={data.chol} onChange={v=>handleChange('chol',v)} flag={flags.chol} onChart={()=>openChart('chol','Cholesterol', data.chol)} />
                                                <Field label="Triglyceride" val={data.trig} onChange={v=>handleChange('trig',v)} flag={flags.trig} onChart={()=>openChart('trig','Triglyceride', data.trig)} />
                                                <Field label="HDL" val={data.hdl} onChange={v=>handleChange('hdl',v)} flag={flags.hdl} onChart={()=>openChart('hdl','HDL', data.hdl)} />
                                                <div className="col-span-2"><Field label="LDL" val={data.ldl} onChange={v=>handleChange('ldl',v)} flag={flags.ldl} onChart={()=>openChart('ldl','LDL', data.ldl)} /></div>
                                            </div>
                                        </div>
                                        <div className="bg-slate-800/40 p-2 rounded-lg"><span className="text-[10px] text-indigo-300 font-bold uppercase tracking-wider block mb-2">Kidney & Liver</span>
                                            <div className="grid grid-cols-2 gap-3"><Field label="BUN" val={data.bun} onChange={v=>handleChange('bun',v)} flag={flags.bun} onChart={()=>openChart('bun','BUN', data.bun)} /><Field label="Creatinine" val={data.cr} onChange={v=>handleChange('cr',v)} flag={flags.cr} onChart={()=>openChart('cr','Creatinine', data.cr)} /><Field label="SGOT" val={data.sgot} onChange={v=>handleChange('sgot',v)} flag={flags.sgot} onChart={()=>openChart('sgot','SGOT', data.sgot)} /><Field label="SGPT" val={data.sgpt} onChange={v=>handleChange('sgpt',v)} flag={flags.sgpt} onChart={()=>openChart('sgpt','SGPT', data.sgpt)} /><Field label="Alk Phos" val={data.alk_phos} onChange={v=>handleChange('alk_phos',v)} /><Field label="Uric Acid" val={data.uric} onChange={v=>handleChange('uric',v)} flag={flags.uric} onChart={()=>openChart('uric','Uric Acid', data.uric)} /></div>
                                        </div>
                                    </div>
                                </Card>

                                <Card title="3. การตรวจปัสสาวะ (Urine)">
                                    <div className="grid grid-cols-2 gap-3"><Field label="RBC" val={data.rbc_ua} onChange={v=>handleChange('rbc_ua',v)} flag={flags.rbc} /><Field label="WBC" val={data.wbc_ua} onChange={v=>handleChange('wbc_ua',v)} flag={flags.wbc} /></div>
                                    <div className="mt-3 bg-slate-800/30 p-2 rounded border border-white/5"><label className="text-[10px] text-slate-400 block mb-1">ผลปัสสาวะภาพรวม</label><div className="flex gap-2"><RadioBtn name="urine_flag" val={data.urine_flag} setVal={v=>handleChange('urine_flag',v)} opts={[{v:1,l:'ปกติ'},{v:2,l:'ผิดปกติ'}]} /></div>{data.urine_flag==2 && <input className="glass-input mt-2 text-xs" placeholder="ระบุความผิดปกติ" value={data.urine_detail} onChange={e=>handleChange('urine_detail',e.target.value)} />}</div>
                                </Card>

                                <Card title="4. ประวัติ & การคัดกรอง">
                                    <FlagInput label="โรคประจำตัว" name="has_chronic" val={data.has_chronic} detail={data.chronic_detail} onChange={handleChange} opts={[{v:1,l:'มี'},{v:2,l:'ไม่มี'}]} />
                                    <FlagInput label="ประวัติครอบครัว" name="family_history_flag" val={data.family_history_flag} detail={data.family_history_detail} onChange={handleChange} opts={[{v:1,l:'มี'},{v:2,l:'ไม่มี'}]} />
                                    <FlagInput label="X-Ray ปอด (CXR)" name="cxr_flag" val={data.cxr_flag} detail={data.cxr_detail} onChange={handleChange} opts={[{v:1,l:'ปกติ'},{v:2,l:'ผิดปกติ'}]} />
                                </Card>
                            </>
                        )}

                        {/* Always visible cards */}
                        {synced && (
                            <>
                                <Card title="5. พฤติกรรมสุขภาพ">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-[10px] text-slate-400 block mb-1">ออกกำลังกาย</label><Select val={data.exercise} options={[{code:1,label:'น้อย'},{code:3,label:'ปานกลาง'},{code:5,label:'หนัก'}]} onChange={v=>handleChange('exercise',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">สูบบุหรี่</label><Select val={data.smoking} options={codebook['smoking']} onChange={v=>handleChange('smoking',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">แอลกอฮอล์</label><Select val={data.alcohol} options={codebook['alcohol']} onChange={v=>handleChange('alcohol',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">หมวกกันน็อก</label><Select val={data.helmet} options={[{code:1,label:'สวม'},{code:2,label:'ไม่สวม'}]} onChange={v=>handleChange('helmet',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">เข็มขัดนิรภัย</label><Select val={data.belt} options={[{code:1,label:'คาด'},{code:2,label:'ไม่คาด'}]} onChange={v=>handleChange('belt',v)} /></div>
                                    </div>
                                </Card>

                                <Card title="6. วัคซีน & ภูมิคุ้มกัน">
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div><label className="text-[10px] text-slate-400 block mb-1">HBV (ไวรัสตับอักเสบบี)</label><Select val={data.hbv} options={[{code:1,label:'ได้รับแล้ว'},{code:2,label:'ยังไม่ได้รับ'}]} onChange={v=>handleChange('hbv',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">MMR (หัด-คางทูม)</label><Select val={data.mmr} options={[{code:1,label:'ได้รับแล้ว'},{code:2,label:'ยังไม่ได้รับ'}]} onChange={v=>handleChange('mmr',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">COVID-19</label><Select val={data.covid} options={[{code:1,label:'ได้รับแล้ว'},{code:2,label:'ยังไม่ได้รับ'}]} onChange={v=>handleChange('covid',v)} /></div>
                                        <div><label className="text-[10px] text-slate-400 block mb-1">ไข้หวัดใหญ่ {selYear}</label><select className="glass-input text-xs" value={data.influenza} onChange={e=>handleChange('influenza',e.target.value)}><option value="">- สถานะ -</option><option value="1">ได้รับแล้ว</option><option value="2">ยังไม่ได้รับ</option></select></div>
                                    </div>
                                    {data.influenza == 1 && (
                                        <div className="p-3 bg-green-900/20 border border-green-500/30 rounded-lg mb-3">
                                            <h4 className="text-xs font-bold text-green-400 flex items-center gap-1"><Icon name="check-circle" size={14} /> ข้อมูลวัคซีนไข้หวัดใหญ่</h4>
                                            <div className="grid grid-cols-2 gap-2 mt-2 text-xs text-slate-300">
                                                <div><span className="block text-[9px] text-slate-500">วันที่รับ</span>{vaccine?.date || '-'}</div>
                                                <div><span className="block text-[9px] text-slate-500">Lot Number</span>{vaccine?.lot || '-'}</div>
                                            </div>
                                        </div>
                                    )}
                                    <div className="flex justify-between items-center p-2 bg-slate-800 rounded"><span className="text-xs text-slate-300">HBs Ag (ผลเลือด)</span><RadioBtn name="hbs_flag" val={data.hbs_flag} setVal={v=>handleChange('hbs_flag',v)} opts={[{v:1,l:'Neg'},{v:2,l:'Pos'}]} /></div>
                                </Card>

                                <Card title="7. สรุปผลแพทย์ & ความเสี่ยง">
                                    <div className="grid grid-cols-2 gap-2 mb-3">
                                        <div className="bg-slate-800 p-3 rounded-lg text-center border border-slate-700 shadow-inner"><div className="text-[9px] text-slate-400 uppercase tracking-widest mb-1">CV Risk (10ปี)</div><div className="text-xl font-bold text-white">{cvRisk}%</div></div>
                                        <div className="bg-slate-800 p-3 rounded-lg text-center border border-slate-700 shadow-inner"><div className="text-[9px] text-slate-400 uppercase tracking-widest mb-1">Calorie/Day</div><div className="text-xl font-bold text-white">~{(data.weight_kg*22*30).toFixed(0)}</div></div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] text-slate-400">ความเห็นแพทย์</label>
                                        <textarea className="glass-input h-24 text-sm" value={data.doctor_summary} onChange={e=>handleChange('doctor_summary',e.target.value)}></textarea>
                                        <div className="space-y-1">
                                            <label className="text-[10px] text-slate-400">แพทย์ผู้ตรวจ</label>
                                            <input className="glass-input h-9 text-sm" value={data.doctor_name} onChange={e=>handleChange('doctor_name',e.target.value)} />
                                        </div>
                                    </div>
                                </Card>
                            </>
                        )}
                    </div>

                    {modal?.open && <ChartModal hn={user.HN} field={modal.field} title={modal.title} value={modal.value} year={selYear} onClose={()=>setModal(null)} />}
                </div>
            );
        };

        const SickLeave = ({ user, onBack }) => {
            const [step, setStep] = useState('form');
            const [stats, setStats] = useState({ totalDays: 0, history: [] });
            const [formData, setFormData] = useState({
                onset_date: '', leave_start: '', leave_end: '', temperature: '',
                symptoms: [], diagnosis: '', doctor_visit: 'home',
                travel_history: '', contact_history: ''
            });
            const [advice, setAdvice] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const res = await callGAS('getSickLeaveStats', { hn: user.HN });
                        setStats(res);
                    } catch(e) {}
                };
                fetchStats();
            }, []);

            const totalRequestDays = useMemo(() => {
                if(!formData.leave_start || !formData.leave_end) return 0;
                const start = new Date(formData.leave_start);
                const end = new Date(formData.leave_end);
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
                return diffDays > 0 ? diffDays : 0;
            }, [formData.leave_start, formData.leave_end]);

            const h = (f,v) => setFormData(p => ({...p, [f]: v}));
            const toggleSymptom = (sym) => {
                setFormData(p => {
                    const exists = p.symptoms.includes(sym);
                    const newSym = exists ? p.symptoms.filter(s => s !== sym) : [...p.symptoms, sym];
                    return { ...p, symptoms: newSym };
                });
            };

            const handleSubmit = async () => {
                // Validation Alerts
                if(!formData.onset_date) return alert('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "วันที่เริ่มมีอาการ"');
                if(!formData.leave_start) return alert('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "วันที่เริ่มลา"');
                if(!formData.leave_end) return alert('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "วันที่สิ้นสุดการลา"');
                if(!formData.temperature) return alert('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "อุณหภูมิร่างกาย"');

                setLoading(true);
                let adv = [];
                if(formData.temperature >= 38) adv.push("มีไข้สูง ควรหยุดงานจนกว่าไข้จะลดลงอย่างน้อย 24 ชม.");
                if(formData.symptoms.includes('ถ่ายเหลว') || formData.symptoms.includes('อาเจียน')) adv.push("อาการระบบทางเดินอาหาร: ควรหยุดงานจนกว่าจะไม่มีอาการ โดยเฉพาะผู้สัมผัสอาหาร");
                if(formData.symptoms.includes('ผื่น/ตุ่มน้ำ')) adv.push("สงสัยโรคติดต่อทางผิวหนัง (สุกใส/งูสวัด) ควรพบแพทย์เพื่อวินิจฉัยและหยุดงานจนกว่าแผลแห้ง");
                if(formData.symptoms.includes('ไอ/เจ็บคอ') || formData.symptoms.includes('หอบเหนื่อย')) adv.push("อาการทางเดินหายใจ: สวมหน้ากากอนามัย และแยกตัวสังเกตอาการ");

                const payload = {
                    ...formData,
                    symptoms: formData.symptoms.join(', '),
                    total_days: totalRequestDays,
                    staff_name: user.Name, staff_hn: user.HN, staff_dept: user.Dept, staff_job: user.Job
                };

                try {
                    const res = await callGAS('saveSickLeave', { payload }); // FIX: Wrapped in payload
                    if(res.success) {
                        setAdvice(adv);
                        setStep('success');
                    } else {
                        alert('บันทึกไม่สำเร็จ: ' + res.error);
                    }
                } catch(e) { alert('การเชื่อมต่อขัดข้อง (Network Error) กรุณาลองใหม่'); }
                setLoading(false);
            };

            return (
                <div className="pb-24 fade-in max-w-lg mx-auto min-h-screen relative bg-[#0f172a]">
                    <div className="bg-[#0f172a]/90 backdrop-blur-xl p-4 sticky top-0 z-30 border-b border-white/5 flex items-center justify-between shadow-lg">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack}><Icon name="arrow-left" className="text-slate-300 hover:text-white transition" /></button>
                            <div><h2 className="font-bold text-white text-sm">แจ้งลาป่วย</h2><p className="text-[10px] text-slate-400">Sick Leave & Monitoring</p></div>
                        </div>
                        <div className="bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                            <span className="text-[10px] text-slate-400">ปีนี้ลาแล้ว</span>
                            <span className="text-sm font-bold text-white ml-2">{stats.totalDays} <span className="text-[10px] font-normal">วัน</span></span>
                        </div>
                    </div>

                    <div className="p-4 space-y-4">

                            <div><h2 className="font-bold text-white text-sm">SW-me (อุบัติเหตุ)</h2><p className="text-[10px] text-slate-400">รายงานการสัมผัสเชื้อและสารคัดหลั่ง</p></div>
                        </div>
                        {step === 'menu' && <button onClick={() => setStep('sos')} className="text-xs bg-red-600 px-3 py-1.5 rounded-full text-white font-bold shadow-lg animate-pulse">SOS ฉุกเฉิน</button>}
                    </div>

                    <div className="p-4 space-y-4">
                        {loading && <div className="text-center text-xs text-orange-400 animate-pulse bg-orange-900/20 p-2 rounded">กำลังบันทึกข้อมูล...</div>}

                        {step === 'menu' && !loading && (
                            <div className="space-y-6">
                                <div className="bg-indigo-900/30 border border-indigo-500/30 p-4 rounded-xl flex items-start gap-3"><Icon name="shield-check" className="text-indigo-400 w-8 h-8 flex-shrink-0" /><div><h3 className="text-indigo-200 text-sm font-bold">Privacy Policy</h3><p className="text-[11px] text-slate-400 leading-relaxed mt-1">ข้อมูลของท่านจะถูกเก็บเป็นความลับตามมาตรฐาน HA และ PDPA เข้าถึงได้เฉพาะทีม ICN และแพทย์อาชีวเวชกรรมเท่านั้น</p></div></div>
                                <div className="grid grid-cols-1 gap-4">
                                    <button onClick={() => setStep('form')} className="glass-panel p-6 rounded-2xl flex items-center justify-between hover:bg-slate-800/50 transition group"><div className="flex items-center gap-4"><div className="p-3 bg-orange-500/20 rounded-full text-orange-400 group-hover:bg-orange-500 group-hover:text-white transition"><Icon name="file-plus" size={28} /></div><div className="text-left"><h3 className="text-white font-bold">แจ้งเหตุใหม่</h3><p className="text-xs text-slate-400">Needle Stick / Splash / Others</p></div></div><Icon name="chevron-right" className="text-slate-500" /></button>
                                    <button onClick={() => setStep('sos')} className="glass-panel p-6 rounded-2xl flex items-center justify-between hover:bg-red-900/20 transition group border-red-500/30"><div className="flex items-center gap-4"><div className="p-3 bg-red-500/20 rounded-full text-red-400 group-hover:bg-red-500 group-hover:text-white transition"><Icon name="siren" size={28} /></div><div className="text-left"><h3 className="text-red-200 font-bold">ฉุกเฉิน: ต้องทำอย่างไร?</h3><p className="text-xs text-red-400/70">แนวทางปฐมพยาบาลเบื้องต้น</p></div></div><Icon name="chevron-right" className="text-red-500/50" /></button>
                                </div>
                                <div className="mt-8"><h3 className="text-slate-400 text-xs font-bold uppercase mb-4 text-center">-- ขั้นตอนการดูแล (Flowchart) --</h3><div className="relative pl-8 border-l-2 border-slate-700 space-y-8">
                                    <div className="relative"><div className="absolute -left-[9px] top-0 w-4 h-4 bg-slate-800 border-2 border-green-500 rounded-full"></div><p className="text-sm text-green-400 font-bold">1. ปฐมพยาบาลทันที</p><p className="text-[10px] text-slate-500">ล้างน้ำ/สบู่ ห้ามบีบแผล</p></div>
                                    <div className="relative"><div className="absolute -left-[9px] top-0 w-4 h-4 bg-slate-800 border-2 border-blue-500 rounded-full"></div><p className="text-sm text-blue-400 font-bold">2. รายงาน & ประเมินความเสี่ยง</p><p className="text-[10px] text-slate-500">แจ้ง ICN / เจาะเลือด Source & Staff</p></div>
                                    <div className="relative"><div className="absolute -left-[9px] top-0 w-4 h-4 bg-slate-800 border-2 border-yellow-500 rounded-full"></div><p className="text-sm text-yellow-400 font-bold">3. รับยาป้องกัน (PEP)</p><p className="text-[10px] text-slate-500">ถ้าจำเป็น (ภายใน 72 ชม.)</p></div>
                                    <div className="relative"><div className="absolute -left-[9px] top-0 w-4 h-4 bg-slate-800 border-2 border-purple-500 rounded-full"></div><p className="text-sm text-purple-400 font-bold">4. ติดตามผล (Follow-up)</p><p className="text-[10px] text-slate-500">1M, 3M, 6M ผ่านระบบแจ้งเตือน</p></div>
                                </div></div>
                                <div className="glass-panel p-5 rounded-xl border border-indigo-500/20 mt-6"><h3 className="text-white font-bold text-sm mb-3 flex items-center gap-2"><Icon name="pill" className="text-indigo-400" /> สูตรยาต้านไวรัส (oPEP)</h3><div className="space-y-3"><div className="bg-indigo-900/30 p-3 rounded-lg border-l-2 border-indigo-500"><span className="text-[10px] text-indigo-300 font-bold uppercase">สูตรแนะนำ (Preferred)</span><p className="text-xs text-white mt-1">TDF/FTC (Tenofovir 300 + Emtricitabine 200) + DTG (Dolutegravir 50)</p><p className="text-[10px] text-slate-400 mt-1">* กินวันละ 1 ครั้ง นาน 28 วัน</p></div><div className="bg-slate-800/50 p-3 rounded-lg border-l-2 border-slate-600"><span className="text-[10px] text-slate-400 font-bold uppercase">สูตรทางเลือก (Alternative)</span><p className="text-[11px] text-slate-300 mt-1">ใช้ RPV, ATV/r หรือ DRV/r แทน DTG กรณีมีข้อจำกัด</p><p className="text-[11px] text-slate-300 mt-1">ไตบกพร่อง (CrCl &lt; 50): ใช้ AZT แทน TDF</p></div></div></div>
                                <div className="glass-panel p-5 rounded-xl border border-white/5 mt-4"><h3 className="text-white font-bold text-sm mb-4 flex items-center gap-2"><Icon name="calendar-clock" /> Timeline การติดตามผล</h3><div className="space-y-4 border-l-2 border-slate-700 ml-2 pl-6 relative"><div className="relative"><div className="absolute -left-[31px] top-0 w-4 h-4 rounded-full bg-red-500 border-2 border-[#0f172a] shadow"></div><p className="text-xs text-red-400 font-bold">Day 0 (วันนี้)</p><p className="text-[11px] text-slate-300">Baseline Lab (HIV, HBV, HCV, CBC, Liver, Cr)</p></div><div className="relative"><div className="absolute -left-[31px] top-0 w-4 h-4 rounded-full bg-slate-600 border-2 border-[#0f172a]"></div><p className="text-xs text-slate-400 font-bold">1 Month</p><p className="text-[11px] text-slate-500">Anti-HIV, CBC, Liver Function</p></div><div className="relative"><div className="absolute -left-[31px] top-0 w-4 h-4 rounded-full bg-slate-600 border-2 border-[#0f172a]"></div><p className="text-xs text-slate-400 font-bold">3 Months</p><p className="text-[11px] text-slate-500">Anti-HIV, Anti-HCV</p></div><div className="relative"><div className="absolute -left-[31px] top-0 w-4 h-4 rounded-full bg-slate-600 border-2 border-[#0f172a]"></div><p className="text-xs text-slate-400 font-bold">6 Months</p><p className="text-[11px] text-slate-500">Anti-HIV (ปิดเคส)</p></div></div></div>
                            </div>
                        )}
                        {step === 'sos' && (
                            <div className="space-y-6 fade-in">
                                <div className="bg-red-600 rounded-2xl p-6 text-center shadow-lg shadow-red-900/50"><Icon name="alert-triangle" size={48} className="text-white mx-auto mb-2" /><h2 className="text-2xl font-bold text-white">ตั้งสติ! อย่าตกใจ</h2><p className="text-red-100 text-sm">ปฏิบัติตามคำแนะนำด้านล่างทันที</p></div>
                                <div className="space-y-4">
                                    <div className="glass-panel p-5 rounded-xl border-l-4 border-orange-500"><h3 className="text-orange-300 font-bold text-lg mb-2 flex items-center gap-2"><Icon name="droplet" /> กรณีเข็มตำ/ของมีคม</h3><ul className="text-slate-300 text-sm space-y-2 list-disc pl-5"><li>ล้างด้วยน้ำสะอาดและสบู่ทันที</li><li><b className="text-red-400 bg-red-900/20 px-1 rounded">ห้าม! บีบเค้นบาดแผล</b></li><li>เช็ดด้วย Alcohol 70% หรือ Betadine</li></ul></div>
                                    <div className="glass-panel p-5 rounded-xl border-l-4 border-blue-500"><h3 className="text-blue-300 font-bold text-lg mb-2 flex items-center gap-2"><Icon name="eye" /> กรณีเข้าตา/เยื่อบุ</h3><ul className="text-slate-300 text-sm space-y-2 list-disc pl-5"><li>ล้างด้วยน้ำสะอาดหรือ Normal Saline ปริมาณมาก</li><li>ล้างให้นานอย่างน้อย 15 นาที</li><li><b className="text-red-400 bg-red-900/20 px-1 rounded">ห้าม! ขยี้ตา</b></li></ul></div>
                                </div>
                                <button onClick={() => setStep('form')} className="btn-primary w-full py-4 text-lg">รับทราบ และดำเนินการแจ้งเหตุ</button>
                            </div>
                        )}
                        {step === 'form' && !loading && (
                            <div className="space-y-5 fade-in">
                                <div className="flex bg-slate-800 p-1 rounded-lg"><button onClick={()=>setReportType('Self')} className={`flex-1 py-2 rounded-md text-xs font-bold transition-all ${reportType==='Self'?'bg-indigo-600 text-white shadow':'text-slate-400 hover:text-white'}`}>Self Report</button><button onClick={()=>setReportType('ICN')} className={`flex-1 py-2 rounded-md text-xs font-bold transition-all ${reportType==='ICN'?'bg-indigo-600 text-white shadow':'text-slate-400 hover:text-white'}`}>ICN Report</button></div>
                                
                                <div className="glass-panel p-4 rounded-xl border border-white/5">
                                    <h3 className="text-indigo-300 font-bold text-xs uppercase mb-3 flex items-center gap-2"><Icon name="user" size={14} /> ข้อมูลผู้บาดเจ็บ</h3>
                                    {reportType === 'Self' ? (
                                        <div className="flex items-center gap-3 p-2 bg-slate-800/50 rounded"><img src={user.pictureProfile || LOGO_URL} className="w-10 h-10 rounded-full" /><div><p className="text-white font-bold text-sm">{user.Name}</p><p className="text-slate-400 text-xs">{user.Dept} (Tel: {user.phone})</p></div></div>
                                    ) : (
                                        <div className="space-y-3">
                                            <div><label className="text-[10px] text-slate-400 block mb-1">HN เจ้าหน้าที่</label><input className="glass-input text-sm w-full" value={formData.staff_hn} onChange={e=>h('staff_hn',e.target.value)} /></div>
                                            <div className="border-t border-slate-700/50 pt-2">
                                                <div className="flex bg-slate-800 rounded p-1 mb-2"><button onClick={() => setOrgType('hospital')} className={`flex-1 text-[10px] py-1 rounded ${orgType === 'hospital' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>รพ.สวี</button><button onClick={() => setOrgType('network')} className={`flex-1 text-[10px] py-1 rounded ${orgType === 'network' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>รพ.สต.</button></div>
                                                <label className="text-[10px] text-slate-400 block mb-1">หน่วยงาน</label>
                                                <Select val={formData.staff_dept} options={deptOptions} onChange={v=>h('staff_dept',v)} />
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-panel p-4 rounded-xl border border-white/5"><h3 className="text-orange-300 font-bold text-xs uppercase mb-3 flex items-center gap-2"><Icon name="alert-circle" size={14} /> รายละเอียดอุบัติการณ์</h3><div className="space-y-3"><div><label className="text-[10px] text-slate-400 block mb-1">วัน-เวลาที่เกิดเหตุ <span className="text-red-500">*</span></label><input type="datetime-local" className="glass-input text-sm w-full" onChange={e=>h('incident_datetime',e.target.value)} />{formData.incident_datetime && (<p className={`text-[10px] mt-1 text-right ${elapsed <= 72 ? 'text-green-400' : 'text-red-400'}`}>ผ่านไปแล้ว {elapsed} ชม. {elapsed <= 72 ? '(อยู่ใน Golden Period)' : '(เกิน 72 ชม.)'}</p>)}</div><div><label className="text-[10px] text-slate-400 block mb-1">สถานที่ (Location) <span className="text-red-500">*</span></label><input className="glass-input text-sm" placeholder="เช่น หอผู้ป่วยอายุรกรรมชาย" onChange={e=>h('location',e.target.value)} /></div><div className="grid grid-cols-2 gap-2"><div><label className="text-[10px] text-slate-400 block mb-1">ประเภท <span className="text-red-500">*</span></label><select className="glass-input text-sm" onChange={e=>h('injury_type',e.target.value)}><option value="">-- เลือก --</option><option value="Needle Stick">เข็มตำ</option><option value="Sharp Injury">ของมีคมบาด</option><option value="Splash">สารคัดหลั่งกระเด็น</option><option value="Other">อื่นๆ</option></select></div><div><label className="text-[10px] text-slate-400 block mb-1">ความเร่งด่วน</label><select className="glass-input text-sm" value={formData.urgency} onChange={e=>h('urgency',e.target.value)}><option value="High">High (เสี่ยงสูง)</option><option value="Medium">Medium</option><option value="Low">Low</option></select></div></div></div></div>
                                <div className="glass-panel p-4 rounded-xl border border-white/5 bg-slate-900/50"><h3 className="text-red-300 font-bold text-xs uppercase mb-3 flex items-center gap-2"><Icon name="lock" size={14} /> ข้อมูลแหล่งสัมผัส (Confidential)</h3><div className="grid grid-cols-2 gap-2"><div><label className="text-[10px] text-slate-400 block mb-1">HN ผู้ป่วย (Source)</label><input className="glass-input text-sm" placeholder="ระบุ HN" onChange={e=>h('source_hn',e.target.value)} /></div><div><label className="text-[10px] text-slate-400 block mb-1">สถานะเลือด</label><select className="glass-input text-sm" onChange={e=>h('source_risk',e.target.value)}><option value="Unknown">ไม่ทราบ/รอผล</option><option value="HIV">HIV Positive</option><option value="HBV">Hepatitis B</option><option value="HCV">Hepatitis C</option><option value="Negative">Negative (ผลลบ)</option></select></div></div><p className="text-[10px] text-slate-500 mt-2">* ข้อมูลนี้จะถูกเก็บเป็นความลับ เข้าถึงได้เฉพาะ ICN</p></div>
                                <button onClick={handleSubmit} className="btn-primary w-full py-4 text-base shadow-lg shadow-indigo-500/30">ยืนยันการแจ้งเหตุ</button>
                            </div>
                        )}

                        {step === 'success' && (
                            <div className="flex flex-col items-center justify-center min-h-[60vh] space-y-6 fade-in text-center">
                                <div className="w-20 h-20 rounded-full bg-green-500/20 flex items-center justify-center border-2 border-green-500 text-green-500"><Icon name="check" size={40} /></div>
                                <div><h2 className="text-2xl font-bold text-white">แจ้งเหตุสำเร็จ</h2><p className="text-slate-400 mt-1">Ticket ID: <span className="text-indigo-400 font-mono font-bold">{ticketId}</span></p></div>
                                <div className="bg-slate-800 p-4 rounded-xl w-full max-w-xs text-left space-y-3 border border-slate-700">
                                    <h3 className="text-white font-bold text-sm border-b border-slate-700 pb-2">สิ่งที่ต้องทำต่อ (Next Steps)</h3>
                                    <div className="flex items-start gap-3"><div className="bg-indigo-500/20 p-1.5 rounded text-indigo-400 mt-0.5"><Icon name="test-tube" size={16} /></div><div><p className="text-sm text-slate-200 font-bold">เจาะเลือด Baseline</p><p className="text-xs text-slate-500">ภายในวันนี้ (Day 0) ที่ห้อง Lab</p></div></div>
                                    <div className="flex items-start gap-3"><div className="bg-pink-500/20 p-1.5 rounded text-pink-400 mt-0.5"><Icon name="user-plus" size={16} /></div><div><p className="text-sm text-slate-200 font-bold">พบแพทย์</p><p className="text-xs text-slate-500">เพื่อประเมินความเสี่ยงและรับยา PEP</p></div></div>
                                </div>
                                <p className="text-xs text-slate-500">ระบบจะส่งการแจ้งเตือนติดตามผล (Follow-up) <br/>เมื่อครบกำหนด 1, 3 และ 6 เดือน ทาง LINE</p>
                                <button onClick={() => setStep('menu')} className="btn-secondary w-full max-w-xs">กลับหน้าหลัก</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        // --- End Needle Injury ---

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('login'); // login, menu, form, healthBook, vaccine, sick, exposure, needle
            const [codebook, setCodebook] = useState({});
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // 1. Load Codebook
                const init = async () => {
                    try {
                        const cb = await callGAS('getCodebook');
                        setCodebook(cb || {});
                    } catch(e) { console.error("Codebook Error", e); }

                    // 2. Check Local Storage
                    const saved = localStorage.getItem('ic_sw_user');
                    if(saved) {
                        setUser(JSON.parse(saved));
                        setPage('form'); // Changed to form instead of menu as requested
                    }

                    // 3. Init LIFF (Optional based on requirements, but good to have)
                    try {
                        // Check if running in LINE
                        if (LIFF_ID) {
                            await liff.init({ liffId: LIFF_ID });
                            if (liff.isLoggedIn()) {
                                const profile = await liff.getProfile();
                                // We can auto-login here if we want, but better to let user click button
                            }
                        }
                    } catch(e) {
                        console.warn("LIFF Init Error:", e);
                    }
                };
                init();
            }, []);

            const handleLogin = async (criteria) => {
                setLoading(true);
                try {
                    const res = await callGAS('loginUser', { criteria });
                    if (res.found) {
                        setUser(res.data);
                        localStorage.setItem('ic_sw_user', JSON.stringify(res.data));
                        setPage('form'); // Changed from 'menu' to 'form' as requested
                    } else {
                        alert('ไม่พบข้อมูลในระบบ หรือข้อมูลไม่ถูกต้อง');
                    }
                } catch(e) { alert('Connection Error'); }
                setLoading(false);
            };

            const handleLiffLogin = async () => {
                if(!LIFF_ID) return alert("System Error: LIFF ID missing");
                try {
                    if(!liff.isInClient() && !liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        // Get profile and check against GAS
                        const profile = await liff.getProfile();
                        // Special logic: Login with userId, and if successful, check/update picture
                        setLoading(true);
                        const res = await callGAS('loginUser', { criteria: { userId: profile.userId } });
                        
                        if (res.found) {
                            let currentUser = res.data;
                            // Check if picture needs update
                            if (currentUser.pictureProfile !== profile.pictureUrl) {
                                // Update picture in background
                                const newPayload = { ...currentUser, pictureProfile: profile.pictureUrl, userId: profile.userId };
                                await callGAS('saveRegistration', { payload: newPayload, isEdit: true });
                                currentUser = newPayload; // Use new data locally
                            }
                            setUser(currentUser);
                            localStorage.setItem('ic_sw_user', JSON.stringify(currentUser));
                            setPage('form');
                        } else {
                            // User not found -> Register flow with pre-filled LIFF data
                            alert('ไม่พบผู้ใช้งาน กรุณาลงทะเบียนหรือเชื่อมต่อบัญชี');
                            // Could pre-fill form here but logic is complex, stick to manual login first
                        }
                        setLoading(false);
                    }
                } catch (e) {
                    alert("LIFF Login Error: " + e.message);
                    setLoading(false);
                }
            };

            const handleUpdateProfile = async (formData) => {
                setLoading(true);
                try {
                    // Determine if it's a new registration or edit based on context
                    const isEdit = !!user; 
                    const payload = { ...formData, userId: user?.userId }; // Keep LINE UserID if exists
                    
                    const res = await callGAS('saveRegistration', { payload, isEdit });
                    if (res.success) {
                        // Update local user state
                        const newUser = { ...formData, userId: res.userId || user?.userId };
                        setUser(newUser);
                        localStorage.setItem('ic_sw_user', JSON.stringify(newUser));
                        setPage('menu');
                        alert('บันทึกข้อมูลเรียบร้อย');
                    } else {
                        alert('Error: ' + res.error);
                    }
                } catch(e) { alert('Save Error'); }
                setLoading(false);
            };

            // Navigation
            if (loading) return <Loading text="กำลังโหลด..." />;

            if (!user && page === 'login') {
                return <LoginPage onLogin={handleLogin} onLiff={handleLiffLogin} onRegister={() => { setUser({}); setPage('form'); }} />;
            }

            if (page === 'form') {
                return <DataForm user={user} codebook={codebook} onSubmit={handleUpdateProfile} onSkip={() => setPage('menu')} />;
            }

            if (page === 'menu') {
                return <MainMenu user={user} onSelect={setPage} />;
            }

            // Sub-pages
            if (page === 'vaccineBooking') return <VaccineBooking user={user} onBack={() => setPage('menu')} />;
            if (page === 'healthBook') return <HealthBook user={user} codebook={codebook} onBack={() => setPage('menu')} />;
            if (page === 'sickLeave') return <SickLeave user={user} onBack={() => setPage('menu')} />;
            if (page === 'needleInjury') return <NeedleInjury user={user} onBack={() => setPage('menu')} />;
            if (page === 'exposure') return <ExposureTracking user={user} onBack={() => setPage('menu')} />;

            return <div className="text-white text-center mt-10">404 Not Found <br/><button onClick={()=>setPage('menu')}>Go Home</button></div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
