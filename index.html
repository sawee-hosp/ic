                        <button onClick={fetchDashboard} className="p-2 hover:bg-slate-800 rounded-full transition-colors" title="โหลดข้อมูลใหม่">
                            <Icon name="refresh-cw" className={`text-slate-300 ${loading ? 'animate-spin' : ''}`} size={18} />
                        </button>
                    </div>

                    <div className="p-4 space-y-6">
                        <div className="flex gap-2">
                            {years.map(y => (
                                <button key={y} onClick={()=>setYear(y)} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${year===y?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400'}`}>ปี {y}</button>
                            ))}
                        </div>

                        {stats && stats.hospCount && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="glass-panel p-5 rounded-2xl text-center border-b-4 border-indigo-500">
                                    <p className="text-slate-400 text-xs uppercase tracking-wider mb-1">ยอดจัดสรรทั้งหมด</p>
                                    <div className="text-3xl font-bold text-white">{stats.total} โดส</div>
                                </div>
                                <div className="glass-panel p-5 rounded-2xl text-center border-b-4 border-green-500">
                                    <p className="text-slate-400 text-xs uppercase tracking-wider mb-1">วัคซีนคงเหลือ</p>
                                    <div className="text-3xl font-bold text-green-400">{stats.remaining} โดส</div>
                                </div>
                                <div className="glass-panel p-5 rounded-2xl text-center border-b-4 border-blue-500">
                                    <p className="text-slate-400 text-xs uppercase tracking-wider mb-1">จองแล้ว (รพ.สวี / เครือข่าย)</p>
                                    <div className="text-2xl font-bold text-white">
                                        {stats.total - stats.remaining} โดส
                                        <span className="text-xs text-slate-400 block mt-1">({stats.hospCount['รพ.สวี'] || 0} / {stats.hospCount['เครือข่าย'] || 0})</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="glass-panel p-5 rounded-2xl space-y-4">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <h3 className="text-indigo-300 font-bold text-xs uppercase tracking-wider">รายชื่อผู้จองวัคซีนทั้งหมด</h3>
                                <div className="relative w-full md:w-64">
                                    <input 
                                        type="text" 
                                        className="glass-input pl-10" 
                                        placeholder="ค้นหาชื่อ, HN, คิว, หน่วยงาน..." 
                                        value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)}
                                    />
                                    <span className="absolute left-3 top-2.5 text-slate-400">
                                        <Icon name="search" size={16} />
                                    </span>
                                </div>
                            </div>

                            {loading ? (
                                <div className="text-center py-10 text-xs text-slate-500">กำลังโหลดข้อมูล...</div>
                            ) : filteredBookings.length === 0 ? (
                                <div className="text-center py-10 text-xs text-slate-500">ไม่พบข้อมูลการจองในปีนี้</div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr className="border-b border-slate-700 text-slate-400">
                                                <th className="py-2 px-3">คิวที่ (Serial)</th>
                                                <th className="py-2 px-3">HN</th>
                                                <th className="py-2 px-3">ชื่อ-สกุล</th>
                                                <th className="py-2 px-3">หน่วยงาน</th>
                                                <th className="py-2 px-3">วันเวลาจอง</th>
                                                <th className="py-2 px-3">Lot No.</th>
                                                <th className="py-2 px-3">Exp. Date</th>
                                                <th className="py-2 px-3 text-center">สถานะ</th>
                                                <th className="py-2 px-3">ผู้จอง (LINE ID)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredBookings.map((b, i) => (
                                                <tr key={i} className="border-b border-slate-800 hover:bg-slate-800/30 transition-colors">
                                                    <td className="py-3 px-3 font-mono font-bold text-indigo-400">{b.no}</td>
                                                    <td className="py-3 px-3 font-mono text-slate-300">{b.hn || '-'}</td>
                                                    <td className="py-3 px-3 font-bold text-white">{b.name}</td>
                                                    <td className="py-3 px-3 text-slate-300">{b.hospital || '-'}</td>
                                                    <td className="py-3 px-3 text-slate-400">{b.date}</td>
                                                    <td className="py-3 px-3 text-slate-300 font-mono">{b.lot || '-'}</td>
                                                    <td className="py-3 px-3 text-slate-400 font-mono">{b.expired || '-'}</td>
                                                    <td className="py-3 px-3 text-center">
                                                        <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-bold ${b.status === 'Received' ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30'}`}>
                                                            {b.status}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-3 text-slate-500 font-mono" title={b.userId}>{b.userId ? String(b.userId).substring(0, 8) + '...' : '-'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const VaccineLeftPage = ({ onBack }) => {
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(false);
            const currentYear = new Date().getFullYear();

            const fetchStats = async () => {
                setLoading(true);
                try {
                    const res = await callGAS('getVaccineDashboard', { hn: '', year: currentYear, userId: '' });
                    setStats(res);
                } catch (e) {
                    console.error("Fetch Stats Error:", e);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchStats();
            }, []);

            return (
                <div className="pb-24 fade-in max-w-lg mx-auto min-h-screen relative bg-[#0f172a] text-slate-100 p-4">
                    <div className="flex items-center gap-3 mb-6 border-b border-white/5 pb-4">
                        <button onClick={onBack} className="p-2 hover:bg-slate-800 rounded-full transition-colors">
                            <Icon name="arrow-left" className="text-slate-300" />
                        </button>
                        <div>
                            <h2 className="font-bold text-white text-sm">ยอดวัคซีนคงเหลือ</h2>
                            <p className="text-[10px] text-slate-400">Flu Vaccine Left & Instructions</p>
                        </div>
                    </div>

                    <div className="space-y-6">
                        {loading ? (
                            <div className="glass-panel p-6 rounded-2xl text-center animate-pulse">
                                <p className="text-slate-400 text-xs">กำลังคำนวณยอดคงเหลือ...</p>
                            </div>
                        ) : stats && stats.hospCount ? (
                            <div className="glass-panel p-6 rounded-2xl text-center border-t-4 border-indigo-500">
                                <p className="text-slate-400 text-xs uppercase tracking-wider mb-2">จำนวนวัคซีนคงเหลืออัปเดตเรียลไทม์</p>
                                <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] font-mono mb-2">
                                    {stats.remaining} <span className="text-base font-normal text-slate-500">/ {stats.total} โดส</span>
                                </div>
                                <p className="text-[11px] text-indigo-300 mt-2 bg-indigo-950/40 p-2 rounded-lg border border-indigo-500/20 font-medium inline-block">
                                    ช่วงเวลาบริการ: ตั้งแต่ 1 มิ.ย. 2569 - จนกว่าวัคซีนจะหมด
                                </p>
                            </div>
                        ) : stats && stats.error ? (
                            <div className="glass-panel p-6 rounded-2xl text-center border-t-4 border-red-500">
                                <p className="text-red-400 text-xs">{stats.error}</p>
                            </div>
                        ) : null}

                        <div className="space-y-4">
                            <h3 className="text-teal-400 font-bold text-sm uppercase tracking-wider flex items-center gap-2 border-b border-white/5 pb-2">
                                <Icon name="info" size={18} /> ขั้นตอนการรับบริการฉีดวัคซีน
                            </h3>

                            <div className="glass-panel p-5 rounded-2xl space-y-4 border-l-4 border-indigo-500">
                                <h4 className="text-white font-bold text-xs uppercase tracking-wider flex items-center gap-2">
                                    <Icon name="hospital" className="text-indigo-400" size={16} /> 
                                    4-Stop Services (สำหรับการฉีดที่ รพ.)
                                </h4>
                                <div className="space-y-3 text-xs text-slate-300 relative pl-4 border-l border-white/10 ml-2">
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">1. เปิด Visit</p><p className="text-[11px] text-slate-400">แจ้งความประสงค์ว่า "ฉีดวัคซีนไข้หวัดใหญ่ 2026"</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">2. ลงทะเบียนที่ห้องยา</p><p className="text-[11px] text-slate-400">ลงทะเบียนรับวัคซีนให้ตรงกับ Lot ที่ระบบกำหนด (โปรดเตรียมโทรศัพท์เพื่อสแกนลงทะเบียน)</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">3. เข้ารับการฉีดวัคซีน</p><p className="text-[11px] text-slate-400">นำวัคซีนไปฉีดตามจุดบริการที่ต้องการ</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">4. ปิดสิทธิ์การรักษา</p><p className="text-[11px] text-slate-400">ปิดสิทธิ์ที่ห้องการเงิน (หมายเหตุ: ขั้นตอนที่ 3-4 สามารถสลับกันได้ตามสะดวก)</p></div>
                                </div>
                            </div>

                            <div className="glass-panel p-5 rounded-2xl space-y-4 border-l-4 border-teal-500">
                                <h4 className="text-white font-bold text-xs uppercase tracking-wider flex items-center gap-2">
                                    <Icon name="pill" className="text-teal-400" size={16} /> 
                                    1-Stop Service at ห้องยา (สำหรับการนำกลับไปฉีดเอง)
                                </h4>
                                <div className="space-y-3 text-xs text-slate-300 relative pl-4 border-l border-teal-500/30 ml-2">
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-teal-500 rounded-full"></span><p className="font-bold text-white">1. ลงทะเบียนและรับยา</p><p className="text-[11px] text-slate-400">ลงทะเบียนที่ห้องยาให้ตรงกับ Lot (โปรดเตรียมโทรศัพท์เพื่อสแกนลงทะเบียน) และแจ้งห้องยาว่าจะนำไปฉีดพร้อมคีย์วัคซีนด้วยตัวเอง</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-teal-500 rounded-full"></span><p className="font-bold text-white">2. คีย์บันทึกระบบวัคซีน</p><p className="text-[11px] text-slate-400">คีย์ระบบวัคซีนด้วยตนเอง โดยตรวจสอบความถูกต้องของ Lot., Serial No., Exp. ตามสติกเกอร์ยา</p></div>
                                </div>
                            </div>
                        </div>

                        <div className="overflow-hidden rounded-2xl border border-white/10 shadow-2xl mt-8">
                            <img src="https://sawee-hosp.github.io/ic/2026.png" alt="วัคซีนไข้หวัดใหญ่ 2026" className="w-full h-auto object-cover" />
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. MAIN APP ROUTER COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('login'); // login, menu, form, healthBook, vaccine, sick, exposure, needle, adminDashboard, vaccineLeft
            const [codebook, setCodebook] = useState({});
            const [pendingProfile, setPendingProfile] = useState(null);
            const [notification, setNotification] = useState(null); 

            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            const showToast = (message, type = 'error') => {
                setNotification({ message, type });
            };

            const closeToast = () => {
                setNotification(null);
            };

            useEffect(() => {
                const init = async () => {
                    try {
                        const cb = await callGAS('getCodebook');
                        setCodebook(cb || {});
                    } catch(e) { console.error("Codebook Error", e); }

                    if (mode === 'admin') {
                        setPage('adminDashboard');
                        return;
                    }

                    if (mode === 'vaccine_left') {
                        setPage('vaccineLeft');
                        return;
                    }

                    const saved = localStorage.getItem('ic_sw_user');
                    if(saved) {
                        const userData = JSON.parse(saved);
                        setUser(userData);
                        if (mode === 'vaccine') setPage('vaccineBooking');
                        else setPage('menu'); 
                    }

                    try {
                        if (typeof liff !== 'undefined' && LIFF_ID && LIFF_ID.trim().length > 0 && LIFF_ID !== "YOUR_LIFF_ID") {
                            await liff.init({ liffId: LIFF_ID });
                            if (liff.isLoggedIn() && !saved) {
                                // Optional auto-login if LINE is available
                            }
                        }
                    } catch(e) {
                        console.warn("LIFF Init Error:", e);
                    }
                };
                init();
            }, []);

            const handleLogin = async (criteria) => {
                try {
                    const res = await callGAS('loginUser', { criteria });
                    if (res.found) {
                        setUser(res.data);
                        localStorage.setItem('ic_sw_user', JSON.stringify(res.data));
                        if (mode === 'vaccine') setPage('vaccineBooking');
                        else setPage('menu'); 
                    } else {
                        showToast('ไม่พบข้อมูลในระบบ หรือข้อมูลไม่ถูกต้อง', 'error');
                    }
                } catch(e) { showToast('Connection Error', 'error'); }
            };

            const handleLiffLogin = async () => {
                if(!LIFF_ID || LIFF_ID.trim() === '') return showToast("System Error: LIFF ID missing", 'error');
                try {
                    if(!liff.isInClient() && !liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        const profile = await liff.getProfile();
                        const res = await callGAS('loginUser', { criteria: { userId: profile.userId } });
                        if (res.found) {
                            let currentUser = res.data;
                            if (currentUser.pictureProfile !== profile.pictureUrl) {
                                const newPayload = { ...currentUser, pictureProfile: profile.pictureUrl, userId: profile.userId };
                                await callGAS('saveRegistration', { payload: newPayload, isEdit: true });
                                currentUser = newPayload;
                            }
                            setUser(currentUser);
                            localStorage.setItem('ic_sw_user', JSON.stringify(currentUser));
                            if (mode === 'vaccine') setPage('vaccineBooking');
                            else setPage('menu');
                        } else {
                            setPendingProfile(profile);
                            setPage('register');
                        }
                    }
                } catch (e) {
                    showToast("LIFF Login Error: " + e.message, 'error');
                }
            };

            const handleRegister = async (formData) => {
                try {
                    const res = await callGAS('saveRegistration', { payload: formData });
                    if(res.success) {
                        setUser(res.data);
                        localStorage.setItem('ic_sw_user', JSON.stringify(res.data));
                        if (mode === 'vaccine') setPage('vaccineBooking');
                        else setPage('menu');
                    } else showToast("ลงทะเบียนล้มเหลว: " + res.error, 'error');
                } catch(e) { showToast('Connection Error', 'error'); }
            }

            const handleLogout = () => {
                if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                    liff.logout();
                }
                localStorage.removeItem('ic_sw_user');
                setUser(null);
                setPendingProfile(null);
                setPage('login');
            };

            const handleUpdateProfile = async (formData) => {
                try {
                    const isEdit = !!user; 
                    const payload = { ...formData, userId: user?.userId };
                    const res = await callGAS('saveRegistration', { payload, isEdit });
                    if (res.success) {
                        const newUser = { ...formData, userId: res.userId || user?.userId };
                        setUser(newUser);
                        localStorage.setItem('ic_sw_user', JSON.stringify(newUser));
                        setPage('menu');
                        showToast('บันทึกข้อมูลเรียบร้อย', 'success');
                    } else {
                        showToast('Error: ' + res.error, 'error');
                    }
                } catch(e) { showToast('Save Error', 'error'); }
            };

            if (page === 'adminDashboard') {
                return (
                    <React.Fragment>
                        <AdminVaccineView codebook={codebook} onBack={() => { window.location.href = window.location.pathname; }} />
                    </React.Fragment>
                );
            }

            if (page === 'vaccineLeft') {
                return (
                    <React.Fragment>
                        <VaccineLeftPage onBack={() => { window.location.href = window.location.pathname; }} />
                    </React.Fragment>
                );
            }

            return (
                <React.Fragment>
                    <Toast notification={notification} onClose={closeToast} />
                    
                    {!user && page === 'login' && <LoginPage onLogin={handleLogin} onLiff={handleLiffLogin} />}
                    {!user && page === 'register' && <RegistrationPage pendingProfile={pendingProfile} codebook={codebook} onSubmit={handleRegister} onCancel={handleLogout} />}
                    {user && page === 'form' && <DataForm user={user} codebook={codebook} onSubmit={handleUpdateProfile} onSkip={() => setPage('menu')} />}
                    {user && page === 'menu' && <MainMenu user={user} onSelect={setPage} onLogout={handleLogout} />}
                    {user && page === 'vaccineBooking' && <VaccineBooking user={user} onBack={() => setPage('menu')} onLogout={handleLogout} codebook={codebook} showToast={showToast} />}
                    {user && page === 'healthBook' && <HealthBook user={user} codebook={codebook} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && page === 'sickLeave' && <SickLeave user={user} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && page === 'needleInjury' && <NeedleInjury user={user} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && page === 'exposure' && <ExposureTracking user={user} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && !['login', 'register', 'form', 'menu', 'vaccineBooking', 'healthBook', 'sickLeave', 'needleInjury', 'exposure'].includes(page) && (
                        <div className="text-white text-center mt-10">404 Not Found <br/><button onClick={()=>setPage('menu')}>Go Home</button></div>
                    )}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
