<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC SW-1 (สวีวรรณ)</title>
    
    <link rel="icon" href="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-size: 14px; }
        
        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 150% 150%;
            animation: aurora 15s ease infinite;
        }
        .bg-overlay::after {
            content: ""; position: absolute; inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.4;
        }
        @keyframes aurora { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-input { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 100%; padding: 0.4rem 0.6rem; border-radius: 0.375rem; transition: all 0.2s; font-size: 0.9rem; height: 38px; }
        .glass-input:focus { outline: none; border-color: #818cf8; background: rgba(15, 23, 42, 0.8); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .glass-input:read-only, .glass-input:disabled { opacity: 0.6; cursor: not-allowed; background: rgba(15, 23, 42, 0.3); }

        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; font-weight: 600; padding: 0.6rem; border-radius: 0.5rem; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }

        .btn-secondary { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; font-weight: 500; padding: 0.6rem; border-radius: 0.5rem; width: 100%; border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .badge { padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-left: 4px; white-space: nowrap; height: 20px; display: inline-flex; align-items: center; letter-spacing: 0.5px; }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-btn { position: relative; padding: 0.6rem 1.2rem; color: #94a3b8; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: white; font-weight: 600; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #6366f1; border-radius: 3px 3px 0 0; box-shadow: 0 -2px 10px rgba(99, 102, 241, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const LIFF_ID = "2008690634-Mr6OanUA"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzG8WjNpWdC-JwFFIrRRJ2w7_sHdKx3D3ZIykPqwFuaWmvrPpOOJCv7CVYAGOY7tk60/exec";
        const LOGO_URL = "https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png";

        const PCU_OPTIONS = [
            "รพ.สต.เขาค่าย", "รพ.สต.เขาทะลุ", "รพ.สต.ครน", "รพ.สต.ด่านสวี",
            "รพ.สต.ท่าหิน", "รพ.สต.ทุ่งระยะ", "รพ.สต.นาสัก", "รพ.สต.บ้านแก่งกระทั่ง",
            "รพ.สต.บ้านคลองน้อย", "รพ.สต.บ้านควนสามัคคี", "รพ.สต.บ้านดอนทราย", "รพ.สต.บ้านไทยพัฒนา",
            "รพ.สต.บ้านน้ำฉา", "รพ.สต.ปากแพรก", "รพ.สต.วิสัยใต้", "รพ.สต.สวี", "สสอ.สวี"
        ];

        const CHRONIC_DISEASES = [
            "ความดันโลหิตสูง", "เบาหวาน", "ไขมันในเลือดสูง", "โรคหัวใจ", 
            "โรคไต", "โรคหอบหืด/ถุงลมโป่งพอง", "โรคไทรอยด์", "โรคเก๊าท์", 
            "โรคภูมิแพ้", "โรคไมเกรน"
        ];

        // ==============================================================
        // --- 1. CORE UTILS & HELPERS ---
        // ==============================================================
        const callGAS = async (action, payload = {}) => {
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    body: JSON.stringify({ action, ...payload })
                });
                return await res.json();
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        };

        const Icon = ({ name, className, size=24 }) => {
            const ref = useRef(null);
            useEffect(() => {
                if(ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className || '';
                    ref.current.appendChild(i);
                    lucide.createIcons({ root: ref.current, attrs: { width: size, height: size } });
                }
            }, [name, className, size]);
            return <span ref={ref} className="inline-flex items-center justify-center"></span>;
        };

        const Loading = ({ text }) => (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0f172a]/95 backdrop-blur-md">
                <img src={LOGO_URL} className="w-20 h-20 mb-4 animate-pulse" />
                <div className="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                <p className="text-indigo-200 text-xs tracking-wider">{text}</p>
            </div>
        );

        const getFlag = (t, v, s) => {
            const n = parseFloat(v); if(isNaN(n)) return null;
            const dot = (c) => c === 'bg-green' ? 'bg-emerald-500' : c === 'bg-yellow' ? 'bg-amber-500' : 'bg-rose-500';
            let res = null;
            if(t=='bmi') res = n<18.5?{bg:'bg-yellow',label:'ผอม'}:n<23?{bg:'bg-green',label:'ปกติ'}:n<25?{bg:'bg-yellow',label:'ท้วม'}:{bg:'bg-red',label:'อ้วน'};
            if(t=='bp') res = n<120?{bg:'bg-green',label:'ปกติ'}:n<140?{bg:'bg-yellow',label:'กลุ่มเสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t=='waist') { let lim=(s=='ชาย'||s=='1')?90:80; res = n<lim?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'เกิน'}; }
            if(t=='pulse') res = (n>=60 && n<=100)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t=='fbs') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<126?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t=='chol') res = n<200?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='trig') res = n<150?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='hdl') res = n>=((s=='ชาย'||s=='1')?40:50)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'เสี่ยง'};
            if(t=='ldl') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<160?{bg:'bg-yellow',label:'สูง'}:{bg:'bg-red',label:'สูงมาก'};
            if(t=='bun') res = n<=20?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='cr') res = n<=1.44?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='uric') res = n<=8.2?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='sgot') res = n<35?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='sgpt') res = n<45?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='alk') res = n<=147?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t=='hct') { let isM=(s=='ชาย'||s=='1'); res = (n>=(isM?38:36) && n<=(isM?50:45))?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'}; }
            if(t=='hgb') { let isM=(s=='ชาย'||s=='1'); res = (n>=(isM?13.2:11.6) && n<=(isM?16.6:15.0))?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'}; }
            if(t=='urine') { let str = String(v).toLowerCase(); res = (str==='0'||str.includes('not')||str.includes('none')||str==='-')?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'}; }
            if(res) return { ...res, dot: dot(res.bg) };
            return null;
        };

        // ==============================================================
        // --- 2. ATOMIC SUB-COMPONENTS ---
        // ==============================================================
        const Toast = ({ notification, onClose }) => {
            useEffect(() => {
                if (notification) {
                    const timer = setTimeout(() => onClose(), 4000);
                    return () => clearTimeout(timer);
                }
            }, [notification, onClose]);

            if (!notification) return null;

            return (
                <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 animate-bounce">
                    <div className={`px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 border text-xs font-semibold ${
                        notification.type === 'success' ? 'bg-emerald-950 border-emerald-500/30 text-emerald-400' : 
                        notification.type === 'info' ? 'bg-blue-950 border-blue-500/30 text-blue-400' :
                        'bg-rose-950 border-rose-500/30 text-rose-400'
                    }`}>
                        <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-circle'} size={16} />
                        <span>{notification.message}</span>
                    </div>
                </div>
            );
        };

        const Field = ({ label, val, onChange, flag, onChart, readonly }) => (
            <div>
                <div className="flex justify-between items-end mb-1">
                    <label className="text-[10px] text-slate-400">{label}</label>
                    {onChart && !readonly && <button onClick={onChart} className="text-[10px] text-indigo-400 hover:text-white transition flex items-center gap-0.5"><Icon name="bar-chart-2" size={14} /> เทียบ</button>}
                </div>
                <div className="relative">
                    <input type="text" className="glass-input pr-8" value={val||''} onChange={e=>onChange(e.target.value)} disabled={readonly} />
                    {flag && <span className={`absolute right-1.5 top-2.5 w-2.5 h-2.5 rounded-full ${flag.dot} ring-2 ring-slate-800`}></span>}
                </div>
            </div>
        );

        const Card = ({ title, children }) => (
            <div className="glass-panel p-5 rounded-2xl">
                <h3 className="text-indigo-300 font-bold text-[11px] uppercase tracking-wider mb-4 border-b border-slate-700/50 pb-2">{title}</h3>
                {children}
            </div>
        );

        const Select = ({ label, val, options, onChange, disabled }) => {
            const found = options?.find(o => o.code == val);
            return (
                <div>
                    {label && <label className="text-[10px] text-slate-400 block mb-1">{label}</label>}
                    <select className="glass-input text-xs" value={val||''} onChange={e => onChange(e.target.value)} disabled={disabled}>
                        <option value="">- เลือก -</option>
                        {options?.map((o,i)=><option key={i} value={o.code}>{o.label}</option>)}
                        {val && !found && <option value={val}>{val}</option>}
                    </select>
                </div>
            );
        };

        const RadioBtn = ({ name, val, setVal, opts, disabled }) => (
            <div className="flex bg-slate-800 rounded p-0.5 w-full">
                {opts.map(o => (
                    <button key={o.v} type="button" onClick={()=> !disabled && setVal(o.v)} 
                        className={`flex-1 text-[10px] py-1 px-2 rounded transition-all ${val==o.v ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>
                        {o.l}
                    </button>
                ))}
            </div>
        );

        const FlagInput = ({ label, name, val, detail, onChange, opts, disabled }) => {
            const hasDetail = (val==1 || val==2) && (name.includes('chronic') || name.includes('detail') || name.includes('flag')) && (val==1 || (name.includes('cxr') && val==2) || (name.includes('cbc') && val==2) || (name.includes('chemistry') && val==2));
            const detailName = name.replace('flag','detail').replace('has_','').replace('_flag','_detail');
            return (
                <div className="mb-3 border-b border-slate-700/50 pb-3 last:border-0 last:pb-0">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-[10px] text-slate-400 w-1/3">{label}</label>
                        <div className="w-2/3"><RadioBtn name={name} val={val} setVal={v=>onChange(name,v)} opts={opts} disabled={disabled} /></div>
                    </div>
                    {hasDetail && name !== 'has_chronic' && (
                        <input className="glass-input text-xs mt-1" placeholder="ระบุรายละเอียด..." value={detail||''} onChange={e=>onChange(detailName, e.target.value)} disabled={disabled} />
                    )}
                </div>
            );
        };

        const MenuBtn = ({ icon, title, color, bg, onClick }) => (
            <button onClick={onClick} className="glass-panel p-5 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-slate-800/60 active:scale-95 transition-all h-36 border border-white/5 shadow-lg">
                <div className={`p-4 rounded-full ${bg} shadow-inner`}><Icon name={icon} size={40} className={color} /></div>
                <span className="text-sm font-medium text-slate-200 text-center leading-tight">{title}</span>
            </button>
        );

        const ChartModal = ({ hn, field, title, value, year, onClose }) => {
            const canvasRef = useRef(null);
            const [mode, setMode] = useState('self');
            const [loading, setLoading] = useState(true);
            const [stats, setStats] = useState(null);

            useEffect(() => {
                const draw = async () => {
                    setLoading(true);
                    try {
                        let config = {};
                        if (mode === 'self') {
                            setStats(null);
                            const res = await callGAS('getSelfTrend', { hn, field });
                            config = { 
                                type: 'line', 
                                data: { labels: res.map(d=>d.year), datasets: [{ label: 'แนวโน้ม', data: res.map(d=>d.value), borderColor: '#6366f1', tension: 0.4, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }] } 
                            };
                        } else {
                            const res = await callGAS('getDistribution', { field, year, hn });
                            const vals = res.values || [];
                            const userVal = parseFloat(value) || res.userVal || 0;
                            
                            const n = vals.length;
                            const sortedVals = [...vals].sort((a,b) => a - b);
                            const rank = sortedVals.findIndex(v => v >= userVal) + 1 || n;
                            setStats({ n, rank });

                            const bins = 10;
                            const min = Math.min(...vals, userVal);
                            const max = Math.max(...vals, userVal);
                            const buffer = (max - min) * 0.1 || 1;
                            const rangeMin = Math.floor(min - buffer);
                            const rangeMax = Math.ceil(max + buffer);
                            const step = (rangeMax - rangeMin) / bins;
                            const curveData = [];
                            
                            for(let i=0; i<bins; i++) {
                                const start = rangeMin + (i*step);
                                const end = start + step;
                                const mid = start + (step/2);
                                const count = vals.filter(v => v >= start && v < end).length;
                                curveData.push({ x: mid, y: count });
                            }
                            
                            if(curveData.length > 0) {
                                curveData.unshift({ x: rangeMin, y: 0 });
                                curveData.push({ x: rangeMax, y: 0 });
                            }

                            config = { 
                                type: 'line', 
                                data: { 
                                    datasets: [
                                        { label: 'กลุ่ม', data: curveData, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.2)', fill: true, tension: 0.4, pointRadius: 0 },
                                        { type: 'scatter', label: 'คุณ', data: [{x: userVal, y: 0}], backgroundColor: '#f43f5e', pointRadius: 8, borderColor: 'white', borderWidth: 2, order: 0 }
                                    ] 
                                },
                                options: { 
                                    scales: { x: { type: 'linear', grid:{color:'#334155'}, ticks:{color:'#94a3b8'}, min: rangeMin, max: rangeMax }, y: { display:false, beginAtZero: true } },
                                    plugins: { legend: { display: false } }
                                }
                            };
                        }
                        
                        if (canvasRef.current) {
                            const chart = Chart.getChart(canvasRef.current);
                            if (chart) chart.destroy();
                            new Chart(canvasRef.current, { ...config, options: { ...config.options, responsive: true, maintainAspectRatio: false } });
                        }
                    } catch(e) {}
                    setLoading(false);
                };
                draw();
            }, [mode]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in zoom-in" onClick={onClose}>
                    <div className="bg-[#1e293b] w-full max-w-sm rounded-2xl p-5 border border-slate-700 relative shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-3 right-3 text-slate-400 hover:text-white"><Icon name="x" size={20} /></button>
                        <h3 className="text-white font-bold mb-1 flex items-center gap-2"><Icon name="bar-chart-2" className="text-indigo-400" size={20} /> วิเคราะห์: {title}</h3>
                        <p className="text-xs text-slate-400 mb-4 ml-7">ค่าของคุณ: <span className="text-white font-bold">{value || '-'}</span></p>
                        
                        <div className="flex bg-slate-900 rounded p-1 mb-4">
                            <button onClick={()=>setMode('self')} className={`flex-1 text-xs py-2 rounded ${mode==='self'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบตัวเอง</button>
                            <button onClick={()=>setMode('others')} className={`flex-1 text-xs py-2 rounded ${mode==='others'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบกลุ่ม</button>
                        </div>
                        <div className="h-56 relative">{loading && <div className="absolute inset-0 flex items-center justify-center text-xs text-slate-500">สร้างกราฟ...</div>}<canvas ref={canvasRef}></canvas></div>
                        {mode === 'others' && (
                            <div className="mt-3 text-center">
                                <p className="text-[10px] text-slate-500">* จุดสีแดงคือตำแหน่งของค่าที่บันทึกในกลุ่มบุคลากร</p>
                                {stats && <p className="text-xs text-slate-300 mt-1">จำนวนข้อมูล (n) = <span className="font-bold text-white">{stats.n}</span> | ลำดับที่ <span className="font-bold text-white">{stats.rank}</span> (จากน้อยไปมาก)</p>}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==============================================================
        // --- 3. PAGE VIEW COMPONENTS (PAGES) ---
        // ==============================================================
        const LoginPage = ({ onLogin, onLiff, isLiffLoading }) => {
            const [c, setC] = useState({ loginname: '', HN: '', cid: '' });
            const isValid = useMemo(() => {
                let count = 0;
                if(c.loginname.trim()) count++; if(c.HN.trim()) count++; if(c.cid.trim()) count++;
                return (count >= 2) || (c.cid.trim().length === 13);
            }, [c]);

            const attemptLogin = () => {
                if(!isValid) return alert("กรุณากรอกข้อมูลตามเงื่อนไข");
                const cleanCriteria = { ...c, cid: c.cid.replace(/[^0-9]/g, '') };
                onLogin(cleanCriteria);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 fade-in relative overflow-hidden">
                    <div className="w-full max-w-sm text-center z-10">
                        <div className="mb-6 relative inline-block">
                            <div className="absolute inset-0 bg-indigo-500 blur-[40px] opacity-20 rounded-full"></div>

                        </button>
                        <div>
                            <h2 className="font-bold text-white text-sm">ยอดวัคซีนคงเหลือ</h2>
                            <p className="text-[10px] text-slate-400">Flu Vaccine Left & Instructions</p>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <div className="space-y-4">
                            <h3 className="text-teal-400 font-bold text-sm uppercase tracking-wider flex items-center gap-2 border-b border-white/5 pb-2">
                                <Icon name="info" size={18} /> ขั้นตอนการรับบริการฉีดวัคซีน
                            </h3>

                            <div className="glass-panel p-5 rounded-2xl space-y-4 border-l-4 border-indigo-500">
                                <h4 className="text-white font-bold text-xs uppercase tracking-wider flex items-center gap-2">
                                    <Icon name="hospital" className="text-indigo-400" size={16} /> 
                                    4-Stop Services (สำหรับการฉีดที่ รพ.)
                                </h4>
                                <div className="space-y-3 text-xs text-slate-300 relative pl-4 border-l border-white/10 ml-2">
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">1. เปิด Visit</p><p className="text-[11px] text-slate-400">แจ้งความประสงค์ว่า "ฉีดวัคซีนไข้หวัดใหญ่ 2026"</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">2. ลงทะเบียนที่ห้องยา</p><p className="text-[11px] text-slate-400">ลงทะเบียนรับวัคซีนให้ตรงกับ Lot ที่ระบบกำหนด (โปรดเตรียมโทรศัพท์เพื่อสแกนลงทะเบียน)</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">3. เข้ารับการฉีดวัคซีน</p><p className="text-[11px] text-slate-400">นำวัคซีนไปฉีดตามจุดบริการที่ต้องการ</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-indigo-500 rounded-full"></span><p className="font-bold text-white">4. ปิดสิทธิ์การรักษา</p><p className="text-[11px] text-slate-400">ปิดสิทธิ์ที่ห้องการเงิน (หมายเหตุ: ขั้นตอนที่ 3-4 สามารถสลับกันได้ตามสะดวก)</p></div>
                                </div>
                            </div>

                            <div className="glass-panel p-5 rounded-2xl space-y-4 border-l-4 border-teal-500">
                                <h4 className="text-white font-bold text-xs uppercase tracking-wider flex items-center gap-2">
                                    <Icon name="pill" className="text-teal-400" size={16} /> 
                                    1-Stop Service at ห้องยา (สำหรับการนำกลับไปฉีดเอง)
                                </h4>
                                <div className="space-y-3 text-xs text-slate-300 relative pl-4 border-l border-teal-500/30 ml-2">
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-teal-500 rounded-full"></span><p className="font-bold text-white">1. ลงทะเบียนและรับยา</p><p className="text-[11px] text-slate-400">ลงทะเบียนที่ห้องยาให้ตรงกับ Lot (โปรดเตรียมโทรศัพท์เพื่อสแกนลงทะเบียน) และแจ้งห้องยาว่าจะนำไปฉีดพร้อมคีย์วัคซีนด้วยตัวเอง</p></div>
                                    <div className="relative"><span className="absolute -left-[21px] w-3 h-3 bg-teal-500 rounded-full"></span><p className="font-bold text-white">2. คีย์บันทึกระบบวัคซีน</p><p className="text-[11px] text-slate-400">คีย์ระบบวัคซีนด้วยตนเอง โดยตรวจสอบความถูกต้องของ Lot., Serial No., Exp. ตามสติกเกอร์ยา</p></div>
                                </div>
                            </div>
                        </div>

                        {loading ? (
                            <div className="glass-panel p-6 rounded-2xl text-center animate-pulse mt-6">
                                <p className="text-slate-400 text-xs">กำลังคำนวณยอดคงเหลือ...</p>
                            </div>
                        ) : stats && !stats.error ? (
                            <div className="glass-panel p-6 rounded-2xl text-center border-t-4 border-indigo-500 mt-6">
                                <p className="text-slate-400 text-xs uppercase tracking-wider mb-2">จำนวนวัคซีนคงเหลืออัปเดตเรียลไทม์</p>
                                <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] font-mono mb-2">
                                    {stats.remaining} <span className="text-base font-normal text-slate-500">/ {stats.total} โดส</span>
                                </div>
                                <p className="text-[11px] text-indigo-300 mt-2 bg-indigo-950/40 p-2 rounded-lg border border-indigo-500/20 font-medium inline-block">
                                    ช่วงเวลาบริการ: ตั้งแต่ 1 มิ.ย. 2569 - จนกว่าวัคซีนจะหมด
                                </p>
                            </div>
                        ) : stats && stats.error ? (
                            <div className="glass-panel p-6 rounded-2xl text-center border-t-4 border-red-500 mt-6">
                                <p className="text-red-400 text-xs">{stats.error}</p>
                            </div>
                        ) : null}

                        <div className="overflow-hidden rounded-2xl border border-white/10 shadow-2xl mt-8">
                            <img src="https://sawee-hosp.github.io/ic/2026.png" alt="วัคซีนไข้หวัดใหญ่ 2026" className="w-full h-auto object-cover" />
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. MAIN APP ROUTER COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('login'); 
            const [codebook, setCodebook] = useState({});
            const [pendingProfile, setPendingProfile] = useState(null);
            const [notification, setNotification] = useState(null); 
            const [isInitializing, setIsInitializing] = useState(true);

            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            const showToast = (message, type = 'error') => {
                setNotification({ message, type });
            };

            const closeToast = () => {
                setNotification(null);
            };

            useEffect(() => {
                const init = async () => {
                    try {
                        try {
                            const cb = await callGAS('getCodebook');
                            setCodebook(cb || {});
                        } catch(e) {}

                        if (mode === 'admin') {
                            setPage('adminDashboard');
                            return;
                        }

                        if (mode === 'vaccine_left') {
                            setPage('vaccineLeft');
                            return;
                        }

                        let autoLoggedInUser = null;

                        // 1. Try LIFF Auto-Login
                        try {
                            if (typeof liff !== 'undefined' && LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID") {
                                await liff.init({ liffId: LIFF_ID });
                                if (liff.isLoggedIn()) {
                                    const profile = await liff.getProfile();
                                    const res = await callGAS('loginUser', { criteria: { userId: profile.userId } });
                                    if (res.found) {
                                        let currentUser = res.data;
                                        if (currentUser.pictureProfile !== profile.pictureUrl) {
                                            const newPayload = { ...currentUser, pictureProfile: profile.pictureUrl, userId: profile.userId };
                                            await callGAS('saveRegistration', { payload: newPayload, isEdit: true });
                                            currentUser = newPayload;
                                        }
                                        autoLoggedInUser = currentUser;
                                    } else {
                                        setPendingProfile(profile);
                                        setPage('register');
                                        return; 
                                    }
                                }
                            }
                        } catch(e) {
                            // Silently ignore LIFF init errors
                        }

                        // 2. Try LocalStorage Fallback if LIFF failed or not logged in
                        if (!autoLoggedInUser) {
                            const saved = localStorage.getItem('ic_sw_user');
                            if (saved) {
                                try {
                                    autoLoggedInUser = JSON.parse(saved);
                                } catch (e) {}
                            }
                        }

                        // 3. Set State & Route
                        if (autoLoggedInUser) {
                            setUser(autoLoggedInUser);
                            localStorage.setItem('ic_sw_user', JSON.stringify(autoLoggedInUser));
                            
                            if (mode === 'vaccine') setPage('vaccineBooking');
                            else setPage('form'); // วิ่งเข้าหน้าแบบฟอร์มเพื่อรีวิวประวัติ
                        } else {
                            if (typeof liff !== 'undefined' && liff.isInClient() && !liff.isLoggedIn()) {
                                liff.login();
                            } else {
                                setPage('login');
                            }
                        }
                    } finally {
                        setIsInitializing(false);
                    }
                };
                init();
            }, []);

            const handleLogin = async (criteria) => {
                setIsInitializing(true);
                try {
                    const res = await callGAS('loginUser', { criteria });
                    if (res.found) {
                        setUser(res.data);
                        localStorage.setItem('ic_sw_user', JSON.stringify(res.data));
                        if (mode === 'vaccine') setPage('vaccineBooking');
                        else setPage('menu'); 
                    } else {
                        showToast('ไม่พบข้อมูลในระบบ หรือข้อมูลไม่ถูกต้อง', 'error');
                    }
                } catch(e) { showToast('Connection Error', 'error'); }
                setIsInitializing(false);
            };

            const handleLiffLogin = async (auto = false) => {
                if(!LIFF_ID || LIFF_ID.trim() === '' || LIFF_ID === "YOUR_LIFF_ID") return;
                setIsInitializing(true);
                try {
                    if (!liff.id) {
                        await liff.init({ liffId: LIFF_ID });
                    }
                    if(!liff.isInClient() && !liff.isLoggedIn()) {
                        if (!auto) liff.login();
                    } else if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        const res = await callGAS('loginUser', { criteria: { userId: profile.userId } });
                        if (res.found) {
                            let currentUser = res.data;
                            if (currentUser.pictureProfile !== profile.pictureUrl) {
                                const newPayload = { ...currentUser, pictureProfile: profile.pictureUrl, userId: profile.userId };
                                await callGAS('saveRegistration', { payload: newPayload, isEdit: true });
                                currentUser = newPayload;
                            }
                            setUser(currentUser);
                            localStorage.setItem('ic_sw_user', JSON.stringify(currentUser));
                            if (mode === 'vaccine') setPage('vaccineBooking');
                            else setPage('menu');
                        } else {
                            setPendingProfile(profile);
                            setPage('register');
                        }
                    }
                } catch (e) {
                    if(!auto) showToast("LINE Login Error", 'error');
                }
                setIsInitializing(false);
            };

            const handleRegister = async (formData) => {
                setIsInitializing(true);
                try {
                    const res = await callGAS('saveRegistration', { payload: formData });
                    if(res.success) {
                        const updatedUser = { ...formData, userId: res.userId };
                        setUser(updatedUser);
                        localStorage.setItem('ic_sw_user', JSON.stringify(updatedUser));
                        if (mode === 'vaccine') setPage('vaccineBooking');
                        else setPage('menu');
                    } else showToast("ลงทะเบียนล้มเหลว: " + res.error, 'error');
                } catch(e) { showToast('Connection Error', 'error'); }
                setIsInitializing(false);
            }

            const handleLogout = () => {
                if (typeof liff !== 'undefined' && liff.id && liff.isLoggedIn()) {
                    liff.logout();
                }
                localStorage.removeItem('ic_sw_user');
                setUser(null);
                setPendingProfile(null);
                setPage('login');
            };

            const handleUpdateProfile = async (formData) => {
                setIsInitializing(true);
                try {
                    const isEdit = !!user; 
                    const payload = { ...formData, userId: user?.userId || user?.userid };
                    const res = await callGAS('saveRegistration', { payload, isEdit });
                    if (res.success) {
                        const newUser = { ...formData, userId: res.userId || user?.userId || user?.userid };
                        setUser(newUser);
                        localStorage.setItem('ic_sw_user', JSON.stringify(newUser));
                        setPage('menu');
                        showToast('บันทึกข้อมูลเรียบร้อย', 'success');
                    } else {
                        showToast('Error: ' + res.error, 'error');
                    }
                } catch(e) { showToast('Save Error', 'error'); }
                setIsInitializing(false);
            };

            if (isInitializing) return <Loading text="กำลังโหลดและตรวจสอบสิทธิ์เข้าใช้งาน..." />;

            if (page === 'adminDashboard') return <AdminVaccineView codebook={codebook} onBack={() => { window.location.href = window.location.pathname; }} />;
            if (page === 'vaccineLeft') return <VaccineLeftPage onBack={() => { window.location.href = window.location.pathname; }} />;

            return (
                <React.Fragment>
                    <Toast notification={notification} onClose={closeToast} />
                    
                    {!user && page === 'login' && <LoginPage onLogin={handleLogin} onLiff={() => handleLiffLogin(false)} isLiffLoading={isInitializing} />}
                    {!user && page === 'register' && <RegistrationPage pendingProfile={pendingProfile} codebook={codebook} onSubmit={handleRegister} onCancel={handleLogout} showToast={showToast} isQuickReg={mode === 'vaccine'} />}
                    
                    {user && page === 'form' && <DataForm user={user} codebook={codebook} onSubmit={handleUpdateProfile} onSkip={() => setPage('menu')} />}
                    {user && page === 'menu' && <MainMenu user={user} onSelect={setPage} onLogout={handleLogout} />}
                    {user && page === 'vaccineBooking' && <VaccineBooking user={user} onBack={() => setPage('menu')} onLogout={handleLogout} codebook={codebook} showToast={showToast} />}
                    {user && page === 'healthBook' && <HealthBook user={user} codebook={codebook} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && page === 'sickLeave' && <SickLeave user={user} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && page === 'needleInjury' && <NeedleInjury user={user} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && page === 'exposure' && <ExposureTracking user={user} onBack={() => setPage('menu')} showToast={showToast} />}
                    {user && !['login', 'register', 'form', 'menu', 'vaccineBooking', 'healthBook', 'sickLeave', 'needleInjury', 'exposure'].includes(page) && (
                        <div className="text-white text-center mt-10">404 Not Found <br/><button onClick={()=>setPage('menu')} className="mt-4 px-4 py-2 bg-indigo-600 rounded">Go Home</button></div>
                    )}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
