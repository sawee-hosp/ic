<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC SW-1 (สวีวรรณ)</title>
    
    <link rel="icon" href="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-size: 14px; }
        .bg-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%); background-size: 150% 150%; animation: aurora 15s ease infinite; }
        .bg-overlay::after { content: ""; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E"); opacity: 0.4; }
        @keyframes aurora { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-input { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 100%; padding: 0.4rem 0.6rem; border-radius: 0.375rem; transition: all 0.2s; font-size: 0.9rem; height: 38px; }
        .glass-input:focus { outline: none; border-color: #818cf8; background: rgba(15, 23, 42, 0.8); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .glass-input:read-only, .glass-input:disabled { opacity: 0.6; cursor: not-allowed; background: rgba(15, 23, 42, 0.3); }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; font-weight: 600; padding: 0.6rem; border-radius: 0.5rem; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }
        .btn-secondary { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; font-weight: 500; padding: 0.6rem; border-radius: 0.5rem; width: 100%; border: 1px solid rgba(255, 255, 255, 0.05); }
        .badge { padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-left: 4px; white-space: nowrap; height: 20px; display: inline-flex; align-items: center; letter-spacing: 0.5px; }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-btn { position: relative; padding: 0.6rem 1.2rem; color: #94a3b8; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { color: white; font-weight: 600; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #6366f1; border-radius: 3px 3px 0 0; box-shadow: 0 -2px 10px rgba(99, 102, 241, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="root"></div>

    <!-- 
      ========================================================================
      IMPORTANT: CONSOLIDATED ALL RE-ORDERED HELPERS, VARIABLES AND SUB-COMPONENTS 
      UNDER A SINGLE SCRIPT TAG TO PERMANENTLY BANISH REFERENCEERRORS!
      ========================================================================
    -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const LIFF_ID = "2008690634-Mr6OanUA"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx16YPdL2SVeLCn-dz_jm9nDWI1gNPYkXw_2MSsy283ycBJUxS917kDoBNjQ7m8ZFUHlw/exec";
        const LOGO_URL = "https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png";

        const PCU_OPTIONS = [
            "รพ.สต.เขาค่าย", "รพ.สต.เขาทะลุ", "รพ.สต.ครน", "รพ.สต.ด่านสวี",
            "รพ.สต.ท่าหิน", "รพ.สต.ทุ่งระยะ", "รพ.สต.นาสัก", "รพ.สต.บ้านแก่งกระทั่ง",
            "รพ.สต.บ้านคลองน้อย", "รพ.สต.บ้านควนสามัคคี", "รพ.สต.บ้านดอนทราย", "รพ.สต.บ้านไทยพัฒนา",
            "รพ.สต.บ้านน้ำฉา", "รพ.สต.ปากแพรก", "รพ.สต.วิสัยใต้", "รพ.สต.สวี", "สสอ.สวี"
        ];

        const CHRONIC_DISEASES = ["ความดันโลหิตสูง", "เบาหวาน", "ไขมันในเลือดสูง", "โรคหัวใจ", "โรคไต", "โรคหอบหืด/ถุงลมโป่งพอง", "โรคไทรอยด์", "โรคเก๊าท์", "โรคภูมิแพ้", "โรคไมเกรน"];

        // --- 1. CORE HELPER FUNCTIONS ---
        const callGAS = async (action, payload = {}) => {
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    body: JSON.stringify({ action, ...payload })
                });
                return await res.json();
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        };

        const Icon = ({ name, className, size=24 }) => {
            const ref = useRef(null);
            useEffect(() => {
                if(ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className || '';
                    ref.current.appendChild(i);
                    lucide.createIcons({ root: ref.current, attrs: { width: size, height: size } });
                }
            }, [name, className, size]);
            return <span ref={ref} className="inline-flex items-center justify-center"></span>;
        };

        const getFlag = (t, v, s) => {
            const n = parseFloat(v); if(isNaN(n)) return null;
            const dot = (c) => c === 'bg-green' ? 'bg-emerald-500' : c === 'bg-yellow' ? 'bg-amber-500' : 'bg-rose-500';
            let res = null;
            if(t==='bmi') res = n<18.5?{bg:'bg-yellow',label:'ผอม'}:n<23?{bg:'bg-green',label:'ปกติ'}:n<25?{bg:'bg-yellow',label:'ท้วม'}:n<30?{bg:'bg-red',label:'อ้วนระดับ 1'}:{bg:'bg-red',label:'อ้วนระดับ 2'};
            if(t==='bp') res = n<120?{bg:'bg-green',label:'ปกติ'}:n<140?{bg:'bg-yellow',label:'กลุ่มเสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t==='waist') { let lim=(s==='ชาย'||s==='1')?90:80; res = n<lim?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'เกิน'}; }
            if(t==='pulse') res = (n>=60 && n<=100)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t==='fbs') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<126?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t==='chol') res = n<200?{bg:'bg-green',label:'ปกติ'}:n<240?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t==='trig') res = n<150?{bg:'bg-green',label:'ปกติ'}:n<200?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t==='hdl') { let minVal=(s==='ชาย'||s==='1')?40:50; res = n>=minVal?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'เสี่ยง'}; }
            if(t==='ldl') res = n<100?{bg:'bg-green',label:'ปกติ'}:n<160?{bg:'bg-yellow',label:'เสี่ยง'}:{bg:'bg-red',label:'สูง'};
            if(t==='bun') res = (n>=4 && n<=20)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'};
            if(t==='cr') res = (n>=0.65 && n<=1.44)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t==='uric') res = (n>=2.3 && n<=8.2)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t==='sgot') res = n<35?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t==='sgpt') res = n<45?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t==='alk') res = (n>=44 && n<=147)?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'สูง'};
            if(t==='hct') { let isM=(s==='ชาย'||s==='1'); res = (n>=(isM?38:36) && n<=(isM?50:45))?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'}; }
            if(t==='hgb') { let isM=(s==='ชาย'||s==='1'); res = (n>=(isM?13.2:11.6) && n<=(isM?16.6:15.0))?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'}; }
            if(t==='urine') { let str = String(v).toLowerCase(); res = (str==='0'||str.includes('not')||str.includes('none')||str==='-')?{bg:'bg-green',label:'ปกติ'}:{bg:'bg-red',label:'ผิดปกติ'}; }
            if(res) return { ...res, dot: dot(res.bg) };
            return null;
        };

        // --- 2. ATOMIC UTILITY COMPONENTS ---
        const Toast = ({ notification, onClose }) => {
            useEffect(() => {
                if (notification) {
                    const timer = setTimeout(() => onClose(), 4000);
                    return () => clearTimeout(timer);
                }
            }, [notification, onClose]);

            if (!notification) return null;

            return (
                <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 animate-bounce">
                    <div className={`px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 border text-xs font-semibold ${
                        notification.type === 'success' ? 'bg-emerald-950 border-emerald-500/30 text-emerald-400' : 
                        notification.type === 'info' ? 'bg-blue-950 border-blue-500/30 text-blue-400' :
                        'bg-rose-950 border-rose-500/30 text-rose-400'
                    }`}>
                        <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-circle'} size={16} />
                        <span>{notification.message}</span>
                    </div>
                </div>
            );
        };

        const Field = ({ label, val, onChange, flag, onChart, readonly }) => (
            <div>
                <div className="flex justify-between items-end mb-1">
                    <label className="text-[10px] text-slate-400">{label}</label>
                    {onChart && !readonly && <button onClick={onChart} className="text-[10px] text-indigo-400 hover:text-white transition flex items-center gap-0.5"><Icon name="bar-chart-2" size={14} /> เทียบ</button>}
                </div>
                <div className="relative">
                    <input type="text" className="glass-input pr-8" value={val||''} onChange={e=>onChange(e.target.value)} disabled={readonly} />
                    {flag && <span className={`absolute right-1.5 top-2.5 w-2.5 h-2.5 rounded-full ${flag.dot} ring-2 ring-slate-800`}></span>}
                </div>
            </div>
        );

        const Card = ({ title, children }) => (
            <div className="glass-panel p-5 rounded-2xl">
                <h3 className="text-indigo-300 font-bold text-[11px] uppercase tracking-wider mb-4 border-b border-slate-700/50 pb-2">{title}</h3>
                {children}
            </div>
        );

        const Select = ({ label, val, options, onChange, disabled }) => {
            const found = options?.find(o => o.code == val);
            return (
                <div>
                    {label && <label className="text-[10px] text-slate-400 block mb-1">{label}</label>}
                    <select className="glass-input text-xs" value={val||''} onChange={e => onChange(e.target.value)} disabled={disabled}>
                        <option value="">- เลือก -</option>
                        {options?.map((o,i)=><option key={i} value={o.code}>{o.label}</option>)}
                        {val && !found && <option value={val}>{val}</option>}
                    </select>
                </div>
            );
        };

        const RadioBtn = ({ name, val, setVal, opts, disabled }) => (
            <div className="flex bg-slate-800 rounded p-0.5 w-full">
                {opts.map(o => (
                    <button key={o.v} type="button" onClick={()=> !disabled && setVal(o.v)} 
                        className={`flex-1 text-[10px] py-1 px-2 rounded transition-all ${val==o.v ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>
                        {o.l}
                    </button>
                ))}
            </div>
        );

        const FlagInput = ({ label, name, val, detail, onChange, opts, disabled }) => {
            const hasDetail = (val==1 || val==2) && (name.includes('chronic') || name.includes('detail') || name.includes('flag')) && (val==1 || (name.includes('cxr') && val==2) || (name.includes('cbc') && val==2) || (name.includes('chemistry') && val==2));
            const detailName = name.replace('flag','detail').replace('has_','').replace('_flag','_detail');
            return (
                <div className="mb-3 border-b border-slate-700/50 pb-3 last:border-0 last:pb-0">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-[10px] text-slate-400 w-1/3">{label}</label>
                        <div className="w-2/3"><RadioBtn name={name} val={val} setVal={v=>onChange(name,v)} opts={opts} disabled={disabled} /></div>
                    </div>
                    {hasDetail && name !== 'has_chronic' && (
                        <input className="glass-input text-xs mt-1" placeholder="ระบุรายละเอียด..." value={detail||''} onChange={e=>onChange(detailName, e.target.value)} disabled={disabled} />
                    )}
                </div>
            );
        };

        const MenuBtn = ({ icon, title, color, bg, onClick }) => (
            <button onClick={onClick} className="glass-panel p-5 rounded-2xl flex flex-col items-center justify-center gap-3 hover:bg-slate-800/60 active:scale-95 transition-all h-36 border border-white/5 shadow-lg">
                <div className={`p-4 rounded-full ${bg} shadow-inner`}><Icon name={icon} size={40} className={color} /></div>
                <span className="text-sm font-medium text-slate-200 text-center leading-tight">{title}</span>
            </button>
        );

        const ChartModal = ({ hn, field, title, value, year, onClose }) => {
            const canvasRef = useRef(null);
            const [mode, setMode] = useState('self');
            const [loading, setLoading] = useState(true);
            const [stats, setStats] = useState(null);

            useEffect(() => {
                const draw = async () => {
                    setLoading(true);
                    try {
                        let config = {};
                        if (mode === 'self') {
                            setStats(null);
                            const res = await callGAS('getSelfTrend', { hn, field });
                            config = { 
                                type: 'line', 
                                data: { labels: res.map(d=>d.year), datasets: [{ label: 'แนวโน้ม', data: res.map(d=>d.value), borderColor: '#6366f1', tension: 0.4, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }] } 
                            };
                        } else {
                            const res = await callGAS('getDistribution', { field, year, hn });
                            const vals = res.values || [];
                            const userVal = parseFloat(value) || res.userVal || 0;
                            
                            const n = vals.length;
                            const sortedVals = [...vals].sort((a,b) => a - b);
                            const rank = sortedVals.findIndex(v => v >= userVal) + 1 || n;
                            setStats({ n, rank });

                            const bins = 10;
                            const min = Math.min(...vals, userVal);
                            const max = Math.max(...vals, userVal);
                            const buffer = (max - min) * 0.1 || 1;
                            const rangeMin = Math.floor(min - buffer);
                            const rangeMax = Math.ceil(max + buffer);
                            const step = (rangeMax - rangeMin) / bins;
                            const curveData = [];
                            
                            for(let i=0; i<bins; i++) {
                                const start = rangeMin + (i*step);
                                const end = start + step;
                                const mid = start + (step/2);
                                const count = vals.filter(v => v >= start && v < end).length;
                                curveData.push({ x: mid, y: count });
                            }
                            
                            if(curveData.length > 0) {
                                curveData.unshift({ x: rangeMin, y: 0 });
                                curveData.push({ x: rangeMax, y: 0 });
                            }

                            config = { 
                                type: 'line', 
                                data: { 
                                    datasets: [
                                        { label: 'กลุ่ม', data: curveData, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.2)', fill: true, tension: 0.4, pointRadius: 0 },
                                        { type: 'scatter', label: 'คุณ', data: [{x: userVal, y: 0}], backgroundColor: '#f43f5e', pointRadius: 8, borderColor: 'white', borderWidth: 2, order: 0 }
                                    ] 
                                },
                                options: { 
                                    scales: { x: { type: 'linear', grid:{color:'#334155'}, ticks:{color:'#94a3b8'}, min: rangeMin, max: rangeMax }, y: { display:false, beginAtZero: true } },
                                    plugins: { legend: { display: false } }
                                }
                            };
                        }
                        
                        if (canvasRef.current) {
                            const chart = Chart.getChart(canvasRef.current);
                            if (chart) chart.destroy();
                            new Chart(canvasRef.current, { ...config, options: { ...config.options, responsive: true, maintainAspectRatio: false } });
                        }
                    } catch(e) {}
                    setLoading(false);
                };
                draw();
            }, [mode]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in fade-in zoom-in" onClick={onClose}>
                    <div className="bg-[#1e293b] w-full max-w-sm rounded-2xl p-5 border border-slate-700 relative shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-3 right-3 text-slate-400 hover:text-white"><Icon name="x" size={20} /></button>
                        <h3 className="text-white font-bold mb-1 flex items-center gap-2"><Icon name="bar-chart-2" className="text-indigo-400" size={20} /> วิเคราะห์: {title}</h3>
                        <p className="text-xs text-slate-400 mb-4 ml-7">ค่าของคุณ: <span className="text-white font-bold">{value || '-'}</span></p>
                        
                        <div className="flex bg-slate-900 rounded p-1 mb-4">
                            <button onClick={()=>setMode('self')} className={`flex-1 text-xs py-2 rounded ${mode==='self'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบตัวเอง</button>
                            <button onClick={()=>setMode('others')} className={`flex-1 text-xs py-2 rounded ${mode==='others'?'bg-indigo-600 text-white shadow':'text-slate-400'}`}>เทียบกลุ่ม</button>
                        </div>
                        <div className="h-56 relative">{loading && <div className="absolute inset-0 flex items-center justify-center text-xs text-slate-500">สร้างกราฟ...</div>}<canvas ref={canvasRef}></canvas></div>
                        {mode === 'others' && (
                            <div className="mt-3 text-center">
                                <p className="text-[10px] text-slate-500">* จุดสีแดงคือตำแหน่งของค่าที่บันทึกในกลุ่มบุคลากร</p>
                                {stats && <p className="text-xs text-slate-300 mt-1">จำนวนข้อมูล (n) = <span className="font-bold text-white">{stats.n}</span> | ลำดับที่ <span className="font-bold text-white">{stats.rank}</span> (จากน้อยไปมาก)</p>}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==========================================
        // --- 3. THE PAGE LEVEL CONTROLLER SCREEN VIEWS ---
        // ==========================================

        const LoginPage = ({ onLogin, onLiff }) => {
            const [c, setC] = useState({ loginname: '', HN: '', cid: '' });
            const isValid = useMemo(() => {
                let count = 0;
                if(c.loginname.trim()) count++; if(c.HN.trim()) count++; if(c.cid.trim()) count++;
                return (count >= 2) || (c.cid.trim().length === 13);
            }, [c]);

            const attemptLogin = () => {
                if(!isValid) return alert("กรุณากรอกข้อมูลตามเงื่อนไข");
                const cleanCriteria = { ...c, cid: c.cid.replace(/[^0-9]/g, '') };
                onLogin(cleanCriteria);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 fade-in relative overflow-hidden">
                    <div className="w-full max-w-sm text-center z-10">
                        <div className="mb-6 relative inline-block">
                            <div className="absolute inset-0 bg-indigo-500 blur-[40px] opacity-20 rounded-full"></div>
                            <img src={LOGO_URL} className="w-28 h-28 mx-auto relative z-10 drop-shadow-2xl" />
                        </div>

        const VaccineBooking = ({ user, onBack, onLogout, codebook, showToast }) => {
            const [year, setYear] = useState(new Date().getFullYear());
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(false);
            const [myBookings, setMyBookings] = useState([]);
            
            const [showOtherForm, setShowOtherForm] = useState(false);
            const [otherData, setOtherData] = useState({ hn: '', name: '', dept: '', orgType: 'hospital' });

            useEffect(() => {
                fetchDashboard();

            const fetchDashboard = async () => {
                setLoading(true);
                try {
                    const res = await callGAS('getVaccineDashboard', { hn: user.HN, year, userId: user.userId || user.userid });
                    setStats(res);
                    setMyBookings(res.myBookings || []);
                } catch(e) { console.error(e); }
                setLoading(false);
                setShowOtherForm(false);
            };

            const handleBookSelf = async () => {
                setLoading(true);
                const isNetwork = user.Dept.includes('รพ.สต') || user.Dept.includes('สสอ');
                const hospitalName = isNetwork ? user.Dept : 'รพ.สวี';

                const payload = {
                    year,
                    name: user.Name,
                    hn: user.Dept.includes('รพ.สต') || user.Dept.includes('สสอ') ? user.cid : user.HN,
                    hospital: hospitalName,
                    userId: user.userId || user.userid
                };
                try {
                    const res = await callGAS('bookVaccine', { payload });
                    if(res.success) {
                        showToast('ลงทะเบียนจองวัคซีนสำหรับตัวเองสำเร็จ!', 'success');
                        fetchDashboard(); 
                    } else {
                        showToast(res.error, 'error');
                    }
                } catch(e) { showToast('Network Error', 'error'); }
            };

            const handleBookOther = async () => {
                if (!otherData.name) return showToast('กรุณาระบุชื่อผู้รับวัคซีน', 'error');
                if (!otherData.dept) return showToast('กรุณาระบุหน่วยงาน', 'error');
                
                if (otherData.orgType === 'hospital' && !otherData.hn) {
                    return showToast('⚠️ กรุณาระบุรหัส HN สำหรับผู้รับวัคซีนสังกัด รพ.สวี', 'error');

                setLoading(true);
                const hospitalName = otherData.orgType === 'hospital' ? 'รพ.สวี' : otherData.dept;

                const payload = {
                    year,
                    name: otherData.name,
                    hn: otherData.hn || '',
                    hospital: hospitalName,
                    userId: user.userId || user.userid
                };
                try {
                    const res = await callGAS('bookVaccine', { payload });
                    if(res.success) {
                        showToast('ลงทะเบียนจองวัคซีนให้คนอื่นสำเร็จ!', 'success');
                        setOtherData({ hn: '', name: '', dept: '', orgType: 'hospital' });
                        fetchDashboard(); 
                    } else {
                        showToast(res.error, 'error');
                    }
                } catch(e) { showToast('Network Error', 'error'); }
            };

            const handleConfirm = async (bookingNo) => {
                 setLoading(true);
                 try {
                     const res = await callGAS('confirmVaccineReceived', { payload: { no: bookingNo, year } });
                     if(res.success) {
                         showToast('ยืนยันมารับวัคซีนเรียบร้อย!', 'success');
                         fetchDashboard();
                     } else {
                         showToast('ไม่สามารถอัปเดตสถานะได้', 'error');
                     }
                 } catch(e) { showToast('Network Error', 'error'); }
                 setLoading(false);
             };

            const years = [2025, 2026, 2027].filter(y => y <= new Date().getFullYear() + 1);
            const currentYear = new Date().getFullYear();
            const isPastYear = year < currentYear;
            
            const hasMyOwnBooking = myBookings.some(b => b.hn === user.HN || b.name === user.Name);
            const deptOptions = otherData.orgType === 'hospital' ? (codebook['department'] || []) : PCU_OPTIONS.map(name => ({ code: name, label: name }));

                        <div className="flex items-center gap-3">
                            <button onClick={onBack}><Icon name="arrow-left" className="text-slate-300 hover:text-white" /></button>
                            <div><h2 className="font-bold text-white text-sm">จองวัคซีนไข้หวัดใหญ่</h2></div>
                        </div>
                        <button onClick={onLogout} className="text-[10px] text-red-300 flex items-center gap-1 bg-red-900/20 px-3 py-1.5 rounded-full border border-red-500/30 hover:bg-red-800/40 transition-colors">
                            <Icon name="log-out" size={14} /> ออกจากระบบ
                        </button>
                    </div>
                    
                    <div className="p-4 space-y-6">
                         <div className="flex gap-2">
                            {years.map(y => (
                                <button key={y} onClick={()=>setYear(y)} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${year===y?'bg-green-600 text-white':'bg-slate-800 text-slate-400'}`}>ปี {y}</button>
                            ))}
                         </div>

                         {loading && <div className="text-center text-xs text-slate-500 animate-pulse">กำลังโหลดข้อมูล...</div>}

                         {!loading && stats && (
                             <>
                                <div className="glass-panel p-6 rounded-2xl text-center border-t-4 border-green-500">
                                    <p className="text-slate-400 text-xs uppercase tracking-wider mb-2">วัคซีนคงเหลือ (ปี {year})</p>
                                    <div className="text-5xl font-bold text-white mb-2">{stats.remaining} <span className="text-base font-normal text-slate-500">/ {stats.total}</span></div>
                                    <div className="mt-6">
                                        <div className="flex justify-between text-[10px] text-slate-400 mb-1">
                                            {/* FIXED: Added Optional Chaining safeguards to avoid Cannot read properties of undefined (reading 'รพ.สวี') */}
                                            <span>รพ.สวี ({stats?.hospCount?.['รพ.สวี'] || 0})</span>
                                            <span>เครือข่าย ({stats?.hospCount?.['เครือข่าย'] || 0})</span>
                                        </div>
                                        <div className="h-2 bg-slate-700 rounded-full overflow-hidden flex">
                                            <div className="h-full bg-blue-500" style={{width: `${((stats?.hospCount?.['รพ.สวี'] || 0)/(stats.total-stats.remaining || 1))*100 || 0}%`}}></div>
                                            <div className="h-full bg-orange-500" style={{width: `${((stats?.hospCount?.['เครือข่าย'] || 0)/(stats.total-stats.remaining || 1))*100 || 0}%`}}></div>
                                        </div>
                                    </div>
                                </div>

                                {!hasMyOwnBooking && stats.remaining > 0 && !isPastYear && (
                                    <button onClick={handleBookSelf} className="btn-primary w-full py-4 text-base shadow-lg shadow-indigo-500/30">
                                        ลงทะเบียนจองวัคซีน (สำหรับตนเอง)
                                    </button>
                                )}

                                {myBookings.length > 0 && (
                                    <div className="space-y-4">
                                        <h3 className="text-slate-400 text-xs font-bold uppercase border-b border-slate-700 pb-2">รายการจองของคุณและสิทธิ์ที่ดูแล</h3>
                                        {myBookings.map((b, idx) => (
                                            <div key={idx} className={`p-4 rounded-xl shadow-lg relative overflow-hidden transition-all duration-500 border ${b.status === 'Received' ? 'bg-gradient-to-br from-green-900/40 to-slate-900 border-green-500/30' : 'bg-gradient-to-br from-indigo-900/40 to-slate-900 border-indigo-500/50'}`}>
                                                <div className="flex justify-between items-start mb-2">
                                                    <div>
                                                        <h3 className="text-white font-bold text-base">{b.name}</h3>
                                                        <p className="text-slate-400 text-[10px]">ผู้รับบริการ: {b.hospital}</p>
                                                    </div>
                                                    <span className={`text-[10px] px-2 py-1 rounded ${b.status === 'Received' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}`}>{b.status}</span>
                                                </div>

                                                {/* Premium Serial Card */}
                                                <div className="my-3 p-4 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-500 border border-white/20 relative overflow-hidden shadow-2xl text-center">
                                                    <div className="absolute top-2 right-2 text-white/10 opacity-30">
                                                        <Icon name="vial" size={64} />
                                                    </div>

                                                    <div className="text-[11px] text-white/80 uppercase tracking-widest font-bold">Serial No.</div>
                                                    <div className="text-6xl font-black text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.7)] font-mono my-2 select-none tracking-widest">
                                                        {b.no}
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-white/20 text-[11px] text-white/90">
                                                        <div className="text-left bg-black/30 p-2 rounded-lg backdrop-blur-sm">
                                                            <span className="block text-[9px] text-white/60 uppercase tracking-wider font-bold">Lot No.</span>
                                                            <span className="font-extrabold font-mono text-emerald-300 text-xs">{b.lot || '-'}</span>
                                                        </div>
                                                        <div className="text-left bg-black/30 p-2 rounded-lg backdrop-blur-sm">
                                                            <span className="block text-[9px] text-white/60 uppercase tracking-wider font-bold">Exp. Date</span>
                                                            <span className="font-extrabold font-mono text-emerald-300 text-xs">{b.expired || '-'}</span>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="mt-2 flex items-center justify-center gap-1.5 text-xs text-white/90">
                                                        <Icon name="vial" size={14} className="text-emerald-300" />
                                                        <span className="font-medium tracking-wide">สแกนรับวัคซีนตาม Lot นี้</span>
                                                    </div>
                                                </div>
                                                
                                                {b.status !== 'Received' && (
                                                    <div className="mt-3 pt-3 border-t border-white/10">
                                                        <button onClick={() => handleConfirm(b.no)} className="w-full py-2 bg-green-600/80 hover:bg-green-500 text-white text-xs rounded-lg transition-transform active:scale-95 border border-green-400/50">
                                                            ยืนยันมารับวัคซีนแล้ว
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {!isPastYear && stats.remaining > 0 && (
                                    <div className="mt-6 pt-6 border-t border-slate-700/50">
                                        {!showOtherForm ? (
                                            <button onClick={() => setShowOtherForm(true)} className="btn-secondary w-full py-3 flex justify-center items-center gap-2">
                                                <Icon name="users" size={16} /> จองวัคซีนให้บุคคลอื่น
                                            </button>
                                        ) : (
                                            <div className="glass-panel p-5 rounded-2xl space-y-4 fade-in border-t-2 border-orange-500/50">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h3 className="text-orange-300 font-bold text-sm">ระบุข้อมูลผู้รับวัคซีน</h3>
                                                    <button onClick={() => setShowOtherForm(false)} className="text-slate-500 hover:text-white"><Icon name="x" size={18} /></button>
                                                </div>
                                                <div className="space-y-3">
                                                    <Field label="ชื่อ-สกุล *" val={otherData.name} onChange={v=>setOtherData({...otherData, name:v})} />
                                                    <Field label="HN (บังคับเฉพาะ รพ.สวี)" val={otherData.hn} onChange={v=>setOtherData({...otherData, hn:v})} />
                                                    
                                                    <div>
                                                        <div className="flex bg-slate-800 rounded p-1 mb-2">
                                                            <button onClick={() => setOtherData({...otherData, orgType: 'hospital'})} className={`flex-1 text-[10px] py-1.5 rounded ${otherData.orgType === 'hospital' ? 'bg-orange-500 text-white' : 'text-slate-400'}`}>รพ.สวี</button>
                                                            <button onClick={() => setOtherData({...otherData, orgType: 'network'})} className={`flex-1 text-[10px] py-1.5 rounded ${otherData.orgType === 'network' ? 'bg-orange-500 text-white' : 'text-slate-400'}`}>เครือข่าย/รพ.สต.</button>
                                                        </div>
                                                        <Select label="หน่วยงาน *" val={otherData.dept} options={deptOptions} onChange={v=>setOtherData({...otherData, dept:v})} />
                                                    </div>
                                                </div>
                                                <button onClick={handleBookOther} className="btn-primary w-full py-3 bg-orange-600 hover:bg-orange-500 text-white text-sm font-bold rounded-xl shadow-lg mt-2">ยืนยันการจองคิว</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                             </>
                         )}
                    </div>
                </div>
            );
        };

        const HealthBook = ({ user, codebook, onBack, showToast }) => {
            const [years, setYears] = useState([]);
            const [selYear, setSelYear] = useState(new Date().getFullYear());
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(false);
            const [vaccine, setVaccine] = useState(null);
            const [modal, setModal] = useState(null);
            const [isNewYear, setIsNewYear] = useState(false);

            useEffect(() => {
                const load = async () => {
                    try {
                        const y = await callGAS('getAvailableYears', { hn: user.HN });
                        const all = [...new Set([new Date().getFullYear(), ...(Array.isArray(y)?y.map(Number):[])])].sort((a,b)=>b-a);
                        setYears(all); setSelYear(all[0]);
                    } catch { setYears([new Date().getFullYear()]); }
                };
                load();
            }, [user.HN]);

            useEffect(() => {
                const loadData = async () => {
                    setLoading(true);
                    const def = { hn: user.HN, year: selYear, full_name: user.Name, sex: user.Gender, age: user.Age, visit_date: '', weight_kg:'', height_cm:'', waist_cm:'', pulse:'', bp_systolic:'', bp_diastolic:'', hct:'', hgb:'', fbs:'', chol:'', trig:'', hdl:'', ldl:'', bun:'', cr:'', sgot:'', sgpt:'', alk_phos:'', uric:'', rbc_ua:'', wbc_ua:'', has_chronic:'', chronic_detail:'', family_history_flag:'', family_history_detail:'', cxr_flag:'', cxr_detail:'', smoking:'', alcohol:'', helmet:'', belt:'', influenza: '', hbv: '', mmr: '', covid: '', urine_flag:'', urine_detail:'', cbc_flag:'', cbc_detail:'', chemistry_flag:'', chemistry_detail:'', risk:'', treatment: '1', chronic_array: [], chronic_other: '' };
                    try {
                        const h = await callGAS('getHealthData', { hn: user.HN, year: selYear });
                        if (h && (h.timestamp || h.visit_date)) {
                            if(h.timestamp || h.visit_date) {
                                let d = new Date(h.visit_date || h.timestamp);
                                if(!isNaN(d.getTime())) h.visit_date = d.toISOString().split('T')[0];
                            }
                            
                            // Map chronic_detail to Multiple Array and Other String
                            let chronicArr = [];
                            let chronicOther = '';
                            if (h.has_chronic == 1 && h.chronic_detail) {
                                const parts = h.chronic_detail.split(',').map(s => s.trim()).filter(s => s);
                                parts.forEach(p => {
                                    if (CHRONIC_DISEASES.includes(p)) {
                                        chronicArr.push(p);
                                    } else {
                                        chronicOther = chronicOther ? chronicOther + ', ' + p : p;
                                    }
                                });
                            }
                            h.chronic_array = chronicArr;
                            h.chronic_other = chronicOther;

                            if(!h.treatment) h.treatment = '1';
                            setData(h);
                            setIsNewYear(false);
                        } else {
                            setData(def);
                            setIsNewYear(true);
                        }
                        
                        const v = await callGAS('getVaccineStatus', { hn: user.HN, year: selYear });
                        setVaccine(v);
                        if (v.found) setData(prev => ({...prev, influenza: 1}));
                    } catch { setData(def); setIsNewYear(true); }
                    setLoading(false);
                };
                loadData();
            }, [selYear, user.HN, user.Name, user.Gender, user.Age]);

            const isCurrentYear = selYear === new Date().getFullYear();
            const noDataPastYear = !isCurrentYear && isNewYear;
            const isReadOnly = !isCurrentYear && !isNewYear;

            const bmi = useMemo(() => (data.weight_kg && data.height_cm) ? (data.weight_kg / Math.pow(data.height_cm/100, 2)).toFixed(2) : '', [data]);
            
            // Calculate CV Risk Approximation
            const cvRisk = useMemo(() => {
                if (!data.age) return 0;
                
                let base = 0;
                const age = parseFloat(data.age);
                const sbp = parseFloat(data.bp_systolic) || 120;
                const fbs = parseFloat(data.fbs) || 90;
                const chol = parseFloat(data.chol);
                
                // Age factor
                if (age > 35) base += (age - 35) * 0.4;
                // Sex factor (Men > Risk)
                if (data.sex == '1' || data.sex === 'ชาย') base += 3;
                // BP factor
                if (sbp >= 140 && sbp < 160) base += 4;
                if (sbp >= 160) base += 8;
                // Smoking
                if (data.smoking == '2') base += 7;
                // DM (FBS > 130)
                if (fbs > 130) base += 8;
                
                // Lipid or Obesity factor
                if (chol) {
                    if (chol > 200 && chol <= 239) base += 3;
                    if (chol >= 240) base += 6;
                } else if (data.waist_cm && data.height_cm) {
                    const waistRatio = parseFloat(data.waist_cm) / parseFloat(data.height_cm);
                    if (waistRatio > 0.5) base += 4; 
                }
                
                return Math.max(1, Math.min(base, 50)).toFixed(1); 
            }, [data.age, data.bp_systolic, data.fbs, data.chol, data.smoking, data.sex, data.waist_cm, data.height_cm]);
            
            const getFlags = (d) => {
                const f = {
                    bmi: getFlag('bmi', bmi),
                    bp: getFlag('bp', d.bp_systolic, d.bp_diastolic),
                    waist: getFlag('waist', d.waist_cm, d.sex),
                    pulse: getFlag('pulse', d.pulse),
                    fbs: getFlag('fbs', d.fbs),
                    chol: getFlag('chol', d.chol),
                    trig: getFlag('trig', d.trig),
                    hdl: getFlag('hdl', d.hdl, d.sex),
                    ldl: getFlag('ldl', d.ldl),
                    bun: getFlag('bun', d.bun),
                    cr: getFlag('cr', d.cr),
                    uric: getFlag('uric', d.uric),
                    sgot: getFlag('sgot', d.sgot),
                    sgpt: getFlag('sgpt', d.sgpt),
                    alk: getFlag('alk', d.alk_phos), 
                    hct: getFlag('hct', d.hct, d.sex),
                    hgb: getFlag('hgb', d.hgb, d.sex),
                    rbc: getFlag('urine', d.rbc_ua),
                    wbc: getFlag('urine', d.wbc_ua)
                };
                return f;
            };
            const flags = getFlags(data);

            const riskyItems = useMemo(() => {
                const labels = {bmi:'BMI', bp:'ความดันโลหิต', waist:'รอบเอว', pulse:'ชีพจร', fbs:'FBS', chol:'Cholesterol', trig:'Triglyceride', hdl:'HDL', ldl:'LDL', bun:'BUN', cr:'Cr', sgot:'SGOT', sgpt:'SGPT', alk:'Alk Phos', uric:'Uric', hct:'Hct', hgb:'Hgb', rbc:'RBC(Urine)', wbc:'WBC(Urine)'};
                return Object.entries(flags)
                    .filter(([k, v]) => v && (v.bg === 'bg-red' || v.bg === 'bg-yellow'))
                    .map(([k, v]) => labels[k] || k)
                    .join(', ');
            }, [flags]);

            const handleChange = (f, v) => setData(p => ({...p, [f]: v}));
            
            const handleSave = async () => {
                if(isReadOnly || noDataPastYear) return;
                setLoading(true);

                // --- CALCULATION LOGIC BASED ON CODEBOOK ---
                const v = (val) => parseFloat(val);
                const has = (val) => val !== undefined && val !== null && val !== '';
                const codes = {};

                if (has(data.age)) codes.age_flag = v(data.age) < 35 ? 1 : (v(data.age) <= 60 ? 2 : 3);
                if (has(data.weight_kg) && has(data.height_cm)) {
                    const bmiVal = v(data.weight_kg) / Math.pow(v(data.height_cm)/100, 2);
                    codes.bmi_flag = bmiVal < 18.5 ? 1 : (bmiVal < 23 ? 2 : (bmiVal < 25 ? 3 : (bmiVal < 30 ? 4 : 5)));
                }
                if (has(data.waist_cm)) {
                    const limit = (data.sex === 'ชาย' || data.sex == 1) ? 90 : 80;
                    codes.waist_cm_flag = v(data.waist_cm) < limit ? 1 : 2;
                }
                if (has(data.pulse)) {
                    const p = v(data.pulse);
                    codes.pulse_flag = p < 60 ? 1 : (p <= 100 ? 2 : 3);
                }
                if (has(data.bp_systolic) || has(data.bp_diastolic)) {
                    const sbp = v(data.bp_systolic) || 0;
                    const dbp = v(data.bp_diastolic) || 0;
                    if (sbp >= 140 || dbp >= 90) codes.bp_flag = 3;
                    else if ((sbp >= 120 && sbp <= 139) || (dbp >= 80 && dbp <= 89)) codes.bp_flag = 2;
                    else codes.bp_flag = 1;
                }
                if (has(data.hct)) {
                    const h = v(data.hct);
                    const isMale = (data.sex === 'ชาย' || data.sex == 1);
                    codes.hct_flag = h < (isMale ? 38 : 36) ? 1 : (h > (isMale ? 50 : 45) ? 3 : 2);
                }
                if (has(data.hgb)) {
                    const h = v(data.hgb);
                    const isMale = (data.sex === 'ชาย' || data.sex == 1);
                    codes.hgb_flag = h < (isMale ? 13.2 : 11.6) ? 1 : (h > (isMale ? 16.6 : 15.0) ? 3 : 2);
                }

                if (has(data.fbs)) codes.fbs_flag = v(data.fbs) < 100 ? 1 : (v(data.fbs) <= 125 ? 2 : 3);
                if (has(data.chol)) codes.chol_flag = v(data.chol) < 200 ? 1 : (v(data.chol) <= 239 ? 2 : 3);
                if (has(data.trig)) codes.trig_flag = v(data.trig) < 150 ? 1 : (v(data.trig) <= 199 ? 2 : 3);
                if (has(data.hdl)) {
                    const limit = (data.sex === 'ชาย' || data.sex == 1) ? 40 : 50;
                    codes.hdl_flag = v(data.hdl) >= limit ? 1 : 2;
                }
                if (has(data.ldl)) codes.ldl_flag = v(data.ldl) < 100 ? 1 : (v(data.ldl) <= 159 ? 2 : 3);
                if (has(data.bun)) codes.bun_flag = v(data.bun) > 20 ? 2 : 1;
                if (has(data.cr)) codes.cr_flag = v(data.cr) > 1.44 ? 2 : 1;
                if (has(data.sgot)) codes.sgot_flag = v(data.sgot) >= 35 ? 2 : 1;
                if (has(data.sgpt)) codes.sgpt_flag = v(data.sgpt) >= 45 ? 2 : 1;
                if (has(data.alk_phos)) codes.alk_phos_flag = v(data.alk_phos) > 147 ? 2 : 1;
                if (has(data.uric)) codes.uric_flag = v(data.uric) > 8.2 ? 2 : 1;

                const checkUrine = (val) => {
                    if (!val) return '';
                    const str = String(val).toLowerCase();
                    if (str === '0' || str.includes('not') || str.includes('none') || str === '-') return 1;
                    return 2;
                };
                if (has(data.rbc_ua)) codes.rbc_ua_flag = checkUrine(data.rbc_ua);
                if (has(data.wbc_ua)) codes.wbc_ua_flag = checkUrine(data.wbc_ua);

                const cv = parseFloat(cvRisk);
                let calculatedRiskCode = 9;
                if (!isNaN(cv) && cv > 0) {
                    if (cv < 10) calculatedRiskCode = 1;
                    else if (cv < 20) calculatedRiskCode = 2;
                    else if (cv < 30) calculatedRiskCode = 3;
                    else if (cv < 40) calculatedRiskCode = 4;
                    else calculatedRiskCode = 5;
                }

                let combinedChronic = [];
                if (data.chronic_array && data.chronic_array.length > 0) combinedChronic.push(...data.chronic_array);
                if (data.chronic_other && data.chronic_other.trim()) combinedChronic.push(data.chronic_other.trim());

                const additionalFields = {
                    chronic_detail: data.has_chronic == 1 ? combinedChronic.join(', ') : '',
                    urine_detail: data.urine_flag == 2 ? data.urine_detail || '' : '',
                    cbc_flag: data.cbc_flag || '',
                    cbc_detail: data.cbc_flag == 2 ? data.cbc_detail || '' : '',
                    chemistry_flag: data.chemistry_flag || '',
                    chemistry_detail: data.chemistry_flag == 2 ? data.chemistry_detail || '' : '',
                    risk: data.risk || '', 
                    cvrisk_score_flag: calculatedRiskCode,
                    treatment: data.treatment || '1',
                    visit_date: data.visit_date || ''
                };

                const payload = { ...data, ...codes, ...additionalFields, bmi, cvrisk_score: cvRisk };
                
                try {
                    await callGAS('saveHealthData', { payload });
                    showToast('บันทึกสำเร็จ', 'success');
                    setIsNewYear(false);
                } catch { showToast('บันทึกผิดพลาด', 'error'); }
                setLoading(false);
            };

            const openChart = (field, title, val) => setModal({ open: true, field, title, value: val });
            const alcoholOpts = [{code:1,label:'ไม่ดื่ม'},{code:2,label:'นานๆครั้ง'},{code:3,label:'ดื่มเป็นประจำ'},{code:9,label:'ไม่มีข้อมูล'}];
            const helmetOpts = [{code:1,label:'ไม่สวม'},{code:2,label:'สวมบางครั้ง'},{code:3,label:'สวมทุกครั้ง'},{code:9,label:'ไม่มีข้อมูล'}];
            const beltOpts = [{code:1,label:'ไม่คาด'},{code:2,label:'คาดบางครั้ง'},{code:3,label:'คาดทุกครั้ง'},{code:9,label:'ไม่มีข้อมูล'}];

            return (
                <div className="pb-24 fade-in max-w-lg mx-auto min-h-screen relative text-slate-100">
                    <div className="bg-[#0f172a]/80 backdrop-blur-xl p-4 sticky top-0 z-30 border-b border-white/5 flex items-center justify-between shadow-lg">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack}><Icon name="arrow-left" className="text-slate-300 hover:text-white transition" /></button>
                            <img src={user.pictureProfile || "https://cdn-icons-png.flaticon.com/512/847/847969.png"} className="w-9 h-9 rounded-full border border-indigo-500/50" />
                            <div><h2 className="font-bold text-white text-sm">{user.Name}</h2><p className="text-[10px] text-slate-400">สมุดสุขภาพประจำปี</p></div>
                        </div>
                        {!isReadOnly && !noDataPastYear && (
                            <button onClick={handleSave} className="text-xs bg-indigo-600 px-4 py-1.5 rounded-full text-white font-bold shadow-lg hover:bg-indigo-500 transition">บันทึก</button>
                        )}
                    </div>

                    <div className="bg-[#0f172a] px-4 pt-3 pb-0 border-b border-slate-800 sticky top-[68px] z-20 overflow-x-auto no-scrollbar flex shadow-md">
                        {years.map(y => <div key={y} onClick={() => setSelYear(y)} className={`tab-btn cursor-pointer ${selYear===y ? 'active' : ''}`}>{y}</div>)}
                    </div>

                    <div className="p-4 space-y-5">
                        <div className="text-[10px] text-indigo-300 bg-indigo-900/30 border border-indigo-500/20 p-2 rounded-lg flex items-center gap-2">
                            <Icon name="info" size={14} className="text-indigo-400 flex-shrink-0" />

        const SickLeave = ({ user, onBack, showToast }) => {
            const [step, setStep] = useState('form');
            const [stats, setStats] = useState({ totalDays: 0, history: [] });
            const [formData, setFormData] = useState({
                onset_date: '', leave_start: '', leave_end: '', temperature: '',
                symptoms: [], diagnosis: '', doctor_visit: 'home',
                travel_history: '', contact_history: ''
            });
            const [advice, setAdvice] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const res = await callGAS('getSickLeaveStats', { hn: user.HN });
                        setStats(res);
                    } catch(e) {}
                };
                fetchStats();
            }, [user.HN]);

            const totalRequestDays = useMemo(() => {
                if(!formData.leave_start || !formData.leave_end) return 0;
                const start = new Date(formData.leave_start);
                const end = new Date(formData.leave_end);
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
                return diffDays > 0 ? diffDays : 0;
            }, [formData.leave_start, formData.leave_end]);

            const h = (f,v) => setFormData(p => ({...p, [f]: v}));
            const toggleSymptom = (sym) => {
                setFormData(p => {
                    const exists = p.symptoms.includes(sym);
                    const newSym = exists ? p.symptoms.filter(s => s !== sym) : [...p.symptoms, sym];
                    return { ...p, symptoms: newSym };
                });
            };

            const handleSubmit = async () => {
                if(!formData.onset_date) return showToast('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "วันที่เริ่มมีอาการ"', 'error');
                if(!formData.leave_start) return showToast('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "วันที่เริ่มลา"', 'error');
                if(!formData.leave_end) return showToast('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "วันที่สิ้นสุดการลา"', 'error');
                if(!formData.temperature) return showToast('⚠️ ข้อมูลไม่ครบ: กรุณาระบุ "อุณหภูมิร่างกาย"', 'error');

                setLoading(true);
                let adv = [];
                if(parseFloat(formData.temperature) >= 38) adv.push("มีไข้สูง ควรหยุดงานจนกว่าไข้จะลดลงอย่างน้อย 24 ชม.");
                if(formData.symptoms.includes('ถ่ายเหลว') || formData.symptoms.includes('อาเจียน')) adv.push("อาการระบบทางเดินอาหาร: ควรหยุดงานจนกว่าจะไม่มีอาการ โดยเฉพาะผู้สัมผัสอาหาร");
                if(formData.symptoms.includes('ผื่น/ตุ่มน้ำ')) adv.push("สงสัยโรคติดต่อทางผิวหนัง (สุกใส/งูสวัด) ควรพบแพทย์เพื่อวินิจฉัยและหยุดงานจนกว่าแผลแห้ง");
                if(formData.symptoms.includes('ไอ/เจ็บคอ') || formData.symptoms.includes('หอบเหนื่อย')) adv.push("อาการทางเดินหายใจ: สวมหน้ากากอนามัย และแยกตัวสังเกตอาการ");

                const payload = {
                    ...formData,
                    symptoms: formData.symptoms.join(', '),
                    total_days: totalRequestDays,
                    staff_name: user.Name, staff_hn: user.HN, staff_dept: user.Dept, staff_job: user.Job
                };

                try {
                    const res = await callGAS('saveSickLeave', { payload });
