<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard สรุปผลตรวจสุขภาพ (Admin)</title>
    
    <link rel="icon" href="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" type="image/png">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; font-size: 14px; }
        .bg-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%); background-size: 150% 150%; animation: aurora 15s ease infinite; }
        @keyframes aurora { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); color: white; width: 100%; padding: 0.4rem 0.6rem; border-radius: 0.375rem; font-size: 0.85rem; height: 36px; }
        .glass-input:focus { outline: none; border-color: #6366f1; background: rgba(15, 23, 42, 0.9); }
        .btn-secondary { background: rgba(51, 65, 85, 0.6); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 0.5rem; transition: all 0.2s; }
        .btn-secondary:hover { background: rgba(71, 85, 105, 0.8); color: white; }
        .chart-container { position: relative; width: 100%; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; width: 90%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s; }
        .modal-overlay.show .modal-content { transform: scale(1); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .loading-spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="spinner" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#0f172a]/95 backdrop-blur-md hidden"><div class="loading-spinner mb-4"></div><p class="text-indigo-200 text-xs tracking-wider animate-pulse">กำลังประมวลผลข้อมูล...</p></div>

    <div class="container mx-auto p-4 max-w-7xl">
        <div class="glass-panel p-4 rounded-2xl mb-6 flex flex-col lg:flex-row items-center justify-between gap-4 sticky top-4 z-20">
            <div class="flex items-center gap-3"><div class="bg-indigo-500/20 p-2 rounded-xl"><img src="https://i.ibb.co/prMfmbsW/3x3cm-removebg-preview.png" class="w-10 h-10 object-contain drop-shadow" /></div><div><h1 class="text-lg font-bold text-white leading-tight">Dashboard สุขภาพ</h1><p class="text-[11px] text-slate-400">รพ.สวี (Admin View)</p></div></div>
            <div class="flex flex-wrap gap-2 w-full lg:w-auto justify-end"><select id="yearSelect" class="glass-input w-24 text-center"></select><select id="metricSelect" class="glass-input w-48"></select><select id="sexSelect" class="glass-input w-28"></select><select id="ageGroupSelect" class="glass-input w-28"></select><select id="deptSelect" class="glass-input flex-1 lg:w-48"></select></div>
        </div>

        <div id="healthView" class="animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"><div class="glass-panel p-6 rounded-2xl md:col-span-3 flex flex-col items-center justify-center border-t-4 border-indigo-500 bg-indigo-900/10"><h2 class="text-3xl font-bold text-white mb-1"><span id="overallPercent">0</span>%</h2><p id="summaryText" class="text-sm text-indigo-200">กำลังโหลดข้อมูล...</p><div class="w-full bg-slate-700/50 h-2 rounded-full mt-4 max-w-md overflow-hidden"><div id="progressBar" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 w-0 transition-all duration-1000"></div></div></div></div>
            
            <!-- Stacked Bar Chart for Departments -->
            <div class="glass-panel p-4 rounded-2xl">
                <h3 class="text-white font-bold text-sm mb-4 flex items-center gap-2"><i data-lucide="bar-chart-2" class="text-indigo-400"></i> สรุปรายแผนก (เรียงตามจำนวนคน)</h3>
                <div class="relative w-full" style="height: 600px;">
                    <canvas id="deptStackedChart"></canvas>
                </div>
                <p class="text-center text-xs text-slate-400 mt-2">* คลิกที่แท่งกราฟเพื่อดูรายชื่อบุคลากร</p>
            </div>
        </div>

        <div id="chartView" class="hidden animate-in fade-in zoom-in duration-300">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 glass-panel p-5 rounded-2xl flex flex-col">
                    <div class="flex justify-between items-center mb-4"><h3 class="text-white font-bold flex items-center gap-2"><i data-lucide="bar-chart-2" class="text-indigo-400"></i> สถิติการตรวจ</h3><button id="saveChartBtn" class="text-xs btn-secondary flex items-center gap-1"><i data-lucide="download" size="14"></i> Save</button></div>
                    <div class="chart-container flex-grow relative" style="height: 400px;" id="histContainer"><canvas id="histChart"></canvas></div><div id="flagContainer" class="chart-container flex-grow relative hidden" style="height: 400px;"><canvas id="flagChart"></canvas></div>
                </div>
                <div class="space-y-4">
                    <div class="glass-panel p-5 rounded-2xl"><h3 class="text-slate-300 font-bold text-xs uppercase mb-3 border-b border-slate-700 pb-2">ข้อมูลทางสถิติ</h3><div id="statsCards" class="grid grid-cols-2 gap-3"></div></div>
                    <div class="glass-panel p-5 rounded-2xl max-h-[500px] overflow-y-auto custom-scroll"><h3 class="text-slate-300 font-bold text-xs uppercase mb-3 border-b border-slate-700 pb-2">รายละเอียด (Legend)</h3><ul id="flagLegend" class="space-y-2"></ul></div>
                </div>
            </div>
        </div>
    </div>

    <div id="deptModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-slate-800/50 rounded-t-xl"><h5 class="text-white font-bold flex items-center gap-2"><i data-lucide="users" class="text-indigo-400"></i> <span id="modalTitle">รายชื่อ</span></h5><button onclick="closeModal()" class="text-slate-400 hover:text-white transition"><i data-lucide="x"></i></button></div>
            <div class="p-0 flex-grow overflow-hidden flex flex-col md:flex-row h-full">
                <div class="flex-1 border-b md:border-b-0 md:border-r border-white/10 flex flex-col h-1/2 md:h-full"><div class="p-3 bg-green-500/10 text-green-400 text-xs font-bold uppercase sticky top-0 backdrop-blur-sm border-b border-white/5">✅ ตรวจแล้ว (<span id="countReported">0</span>)</div><div class="overflow-y-auto custom-scroll p-2 space-y-1" id="reportedList"></div></div>
                <div class="flex-1 flex flex-col h-1/2 md:h-full"><div class="p-3 bg-red-500/10 text-red-400 text-xs font-bold uppercase sticky top-0 backdrop-blur-sm border-b border-white/5">❌ ยังไม่ตรวจ (<span id="countNotReported">0</span>)</div><div class="overflow-y-auto custom-scroll p-2 space-y-1" id="notReportedList"></div></div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxoAiCFIoDT3kgaY5k2BmVeUMN5kR_9w0WToW79sw6-ko4kYgUzo45n_PJ1c6QKDnCgsw/exec";
        lucide.createIcons();
        Chart.defaults.color = '#94a3b8'; Chart.defaults.borderColor = '#334155'; Chart.register(ChartDataLabels);
        
        const spinner = document.getElementById('spinner');
        const showSpinner = () => spinner.classList.remove('hidden');
        const hideSpinner = () => spinner.classList.add('hidden');
        const modal = document.getElementById('deptModal');
        const closeModal = () => { modal.classList.remove('show'); setTimeout(() => modal.style.display = 'none', 300); };
        const openModal = () => { modal.style.display = 'flex'; requestAnimationFrame(() => modal.classList.add('show')); };

        let yearSel, sexSel, deptSel, ageSel, metricSel;
        let chartHist = null, chartFlag = null, deptChart = null;
        let globalDeptData = []; // Store data for modal

        const pieMetrics = ['has_chronic','hbs_flag','exercise','smoking','alcohol','helmet','belt','family_history_flag','urine_flag','cbc_flag','chemistry_flag','cxr_flag','risk','treatment','doctor_name','rbc_ua_flag','wbc_ua_flag','hbv','mmr','influenza','covid'];

        const callGAS = async (action, payload = {}) => {
            try {
                const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action, ...payload }) });
                return await res.json();
            } catch (error) { console.error("API Error:", error); throw error; }
        };

        window.addEventListener('DOMContentLoaded', initFilters);

        function initFilters(){
            yearSel = document.getElementById('yearSelect');
            sexSel = document.getElementById('sexSelect');
            deptSel = document.getElementById('deptSelect');
            metricSel = document.getElementById('metricSelect');
            ageSel = document.getElementById('ageGroupSelect');

            const cur = new Date().getFullYear();
            for(let y=2019; y<=cur; y++) yearSel.add(new Option(y,y));
            yearSel.value = cur;

            ageSel.innerHTML = ''; 
            [{l:'ทุกช่วงอายุ',v:''}, {l:'20–30',v:'20-30'}, {l:'31–40',v:'31-40'}, {l:'41–50',v:'41-50'}, {l:'51–60',v:'51-60'}, {l:'60+',v:'60+'}].forEach(o => ageSel.add(new Option(o.l, o.v)));

            const numerics = ['age','weight_kg','height_cm','bmi','waist_cm','pulse','bp_systolic','bp_diastolic','hct','hgb','fbs','chol','trig','hdl','ldl','bun','cr','sgot','sgpt','alk_phos','uric','cvrisk_score'];
            metricSel.innerHTML = '<option value="healthCheck">-- ภาพรวมการตรวจสุขภาพ --</option>';
            metricSel.innerHTML += `<optgroup label="ข้อมูลตัวเลข">` + numerics.map(m=>`<option value="${m}">${m.toUpperCase()}</option>`).join('') + `<option value="bp">Blood Pressure (SYS/DIA)</option></optgroup>`;
            metricSel.innerHTML += `<optgroup label="ข้อมูลกลุ่ม/ความเสี่ยง">` + pieMetrics.map(m=>`<option value="${m}">${m.replace('_flag','').toUpperCase()}</option>`).join('') + `</optgroup>`;

            showSpinner();
            callGAS('getFilterOptions').then(opt => {
                hideSpinner();
                if (!opt || !opt.sexes || !opt.depts) { alert("ไม่สามารถโหลดข้อมูลตัวเลือกได้"); return; }
                sexSel.innerHTML = ''; opt.sexes.forEach(s => sexSel.add(new Option(s.label, s.code))); sexSel.options[0].text = 'ทุกเพศ';
                deptSel.innerHTML = ''; opt.depts.forEach(d => deptSel.add(new Option(d.label, d.code))); deptSel.options[0].text = 'ทุกแผนก';
                [yearSel, sexSel, deptSel, ageSel, metricSel].forEach(el => el.onchange = renderView);
                renderView();
            }).catch(e => { hideSpinner(); alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); });
        }

        function renderView(){
            const metric = metricSel.value;
            if (metric === 'healthCheck') {
                document.getElementById('healthView').classList.remove('hidden');
                document.getElementById('chartView').classList.add('hidden');
                loadDashboard();
            } else {
                document.getElementById('healthView').classList.add('hidden');
                document.getElementById('chartView').classList.remove('hidden');
                loadStats(metric);
            }
        }

        function loadDashboard() {
            const year = yearSel.value;
            showSpinner();
            callGAS('getDashboardData', {year}).then(data => {
                hideSpinner();
                if (!data || !data.summary) return;
                
                document.getElementById('overallPercent').innerText = data.overallPercent;
                document.getElementById('summaryText').innerHTML = `ตรวจแล้ว <span class="text-green-400 font-bold">${data.summary.reported}</span> จาก <span class="text-white">${data.summary.total}</span> คน`;
                document.getElementById('progressBar').style.width = `${data.summary.percent}%`;

                // Sort by Total Count Descending
                globalDeptData = [...data.perDept].sort((a, b) => b.total - a.total);
                
                const labels = globalDeptData.map(d => d.dept);
                const reportedData = globalDeptData.map(d => d.reported);
                const notReportedData = globalDeptData.map(d => d.notReported);

                const ctx = document.getElementById('deptStackedChart').getContext('2d');
                if (deptChart) deptChart.destroy();

                deptChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'ตรวจแล้ว',
                                data: reportedData,
                                backgroundColor: '#10b981', // Green
                                barPercentage: 0.8,
                                categoryPercentage: 0.9
                            },
                            {
                                label: 'ยังไม่ตรวจ',
                                data: notReportedData,
                                backgroundColor: '#f43f5e', // Red
                                barPercentage: 0.8,
                                categoryPercentage: 0.9
                            }
                        ]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { stacked: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                            y: { stacked: true, grid: { display: false }, ticks: { color: '#e2e8f0', font: { size: 11 }, autoSkip: false } }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { color: '#cbd5e1' } },
                            datalabels: {
                                color: '#fff',
                                font: { weight: 'bold', size: 10 },
                                formatter: (val) => val > 0 ? val : ''
                            }
                        },
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                const index = elements[0].index;
                                const dept = globalDeptData[index];
                                showListModal(dept.dept, dept.reportedList, dept.notReportedList);
                            }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            });
        }

        function showListModal(title, rep, notRep) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('countReported').innerText = rep.length;
            document.getElementById('countNotReported').innerText = notRep.length;
            const renderList = (list, elId, iconClass, textClass) => {
                const el = document.getElementById(elId);
                el.innerHTML = '';
                if (list.length === 0) el.innerHTML = '<div class="text-slate-500 text-xs italic text-center py-4">ไม่มีรายชื่อ</div>';
                else list.forEach(n => { el.innerHTML += `<div class="flex items-center gap-2 p-2 rounded hover:bg-white/5 transition"><div class="${iconClass} w-1.5 h-1.5 rounded-full shrink-0"></div><span class="${textClass} text-xs truncate">${n}</span></div>`; });
            };
            renderList(rep, 'reportedList', 'bg-emerald-500', 'text-emerald-200');
            renderList(notRep, 'notReportedList', 'bg-rose-500', 'text-rose-200');
            openModal();
        }

        function loadStats(metric) {
            const year = yearSel.value, sex = sexSel.value, dept = deptSel.value, ageG = ageSel.value;
            const histEl = document.getElementById('histContainer'), flagEl = document.getElementById('flagContainer'), statsEl = document.getElementById('statsCards'), legendEl = document.getElementById('flagLegend');
            showSpinner();
            callGAS('getStatsData', {year, sex, dept, ageGroup: ageG, metric}).then(res => {
                hideSpinner();
                if (!res) return;

                if (metric === 'bp') {
                    histEl.classList.remove('hidden'); flagEl.classList.add('hidden');
                    const bins = 10, allVals = [...(res.valuesSys||[]), ...(res.valuesDia||[])];
                    const min = Math.min(...allVals) || 80, max = Math.max(...allVals) || 160, step = (max - min) / bins;
                    const labels = [], dSys = Array(bins).fill(0), dDia = Array(bins).fill(0);
                    for(let i=0; i<bins; i++) labels.push(`${(min + i*step).toFixed(0)}-${(min + (i+1)*step).toFixed(0)}`);
                    if(res.valuesSys) res.valuesSys.forEach(v => dSys[Math.min(bins-1, Math.floor((v-min)/step))]++);
                    if(res.valuesDia) res.valuesDia.forEach(v => dDia[Math.min(bins-1, Math.floor((v-min)/step))]++);
                    
                    if (chartHist) chartHist.destroy();
                    chartHist = new Chart(document.getElementById('histChart'), { type: 'bar', data: { labels, datasets: [{ label: 'Systolic', data: dSys, backgroundColor: 'rgba(244, 63, 94, 0.6)' }, { label: 'Diastolic', data: dDia, backgroundColor: 'rgba(99, 102, 241, 0.6)' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: {display:false} }, y: { grid: {color: '#334155'} } } } });
                    
                    legendEl.innerHTML = ''; // BP flags legend
                    if(res.classificationCounts) Object.entries(res.classificationCounts).forEach(([k,v]) => { legendEl.innerHTML += `<li class="flex justify-between text-xs py-1 border-b border-white/5"><span class="text-slate-300">${k}</span><span class="badge bg-slate-700 text-white">${v}</span></li>`; });
                    return;
                }

                if (pieMetrics.includes(metric)) {
                    histEl.classList.add('hidden'); flagEl.classList.remove('hidden');
                    const counts = res.classificationCounts || {};
                    const labels = Object.keys(counts), data = Object.values(counts);
                    const colors = labels.map((_, i) => `hsl(${210 + (i * 40)}, 70%, 60%)`);
                    
                    if (chartFlag) chartFlag.destroy();
                    chartFlag = new Chart(document.getElementById('flagChart'), { type: 'pie', data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#1e293b', borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { color: '#fff', formatter: (v, ctx) => (v*100/ctx.dataset.data.reduce((a,b)=>a+b,0)).toFixed(0)+'%' } } }, plugins: [ChartDataLabels] });
                    
                    legendEl.innerHTML = '';
                    labels.forEach((l, i) => { legendEl.innerHTML += `<li class="flex justify-between items-center text-xs py-1.5 border-b border-white/5"><div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:${colors[i]}"></div><span class="text-slate-300">${l}</span></div><span class="badge bg-slate-700 text-white">${data[i]}</span></li>`; });
                } else {
                    histEl.classList.remove('hidden'); flagEl.classList.add('hidden');
                    const bins = 10, min = res.stats?.min || 0, max = res.stats?.max || 100, step = (max - min) / bins || 1;
                    const counts = new Array(bins).fill(0), labels = [];
                    for(let i=0; i<bins; i++) labels.push((min + i*step).toFixed(0));
                    if(res.values) res.values.forEach(v => { const idx = Math.min(bins-1, Math.floor((v - min)/step)); counts[idx]++; });
                    
                    if (chartHist) chartHist.destroy();
                    chartHist = new Chart(document.getElementById('histChart'), { type: 'line', data: { labels, datasets: [{ label: 'คน', data: counts, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.2)', borderColor: '#6366f1', tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: {display:false} }, y: { grid: {color: '#334155'} } } } });

                    legendEl.innerHTML = '';
                    if (res.classificationCounts) {
                        Object.entries(res.classificationCounts).forEach(([k,v]) => {
                            legendEl.innerHTML += `<li class="flex justify-between text-xs py-1.5 border-b border-white/5"><span class="text-slate-300">${k}</span><span class="badge bg-slate-700 text-white">${v}</span></li>`;
                        });
                    }
                }
            });
        }
    </script>
</body>
</html>
