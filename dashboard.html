<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW-1 Smart IC Dashboard</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Theme: Deep Space Purple/Slate (Same as AMR) */
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.2);
        }
        
        .neon-text { text-shadow: 0 0 10px currentColor; }
        
        /* Neon Icon Effect */
        .icon-glow { filter: drop-shadow(0 0 8px currentColor); }
        
        /* Ticker Animation */
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-wrap {
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            animation: ticker 40s linear infinite;
        }
        .ticker-wrap:hover .ticker-content { animation-play-state: paused; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* Ward Map Grid */
        .bed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            LineChart, Line, BarChart, Bar, AreaChart, Area, PieChart, Pie, Cell,
            XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, ComposedChart
        } = window.Recharts;

        // --- MOCK DATA ---
        const CRITICAL_ALERTS = [
            { hn: '6700123', loc: 'ICU Med', germ: 'A. baumannii (XDR)', time: '10:30' },
            { hn: '6704599', loc: 'Surg Male', germ: 'K. pneumoniae (CRE)', time: '11:15' },
            { hn: '6708821', loc: 'ICU Surg', germ: 'C. auris', time: '12:45' },
            { hn: '6701102', loc: 'Med Female', germ: 'MRSA', time: '13:20' }
        ];

        const WARD_BEDS = Array.from({ length: 24 }, (_, i) => {
            const statusRoll = Math.random();
            let status = 'normal'; // Green
            if (statusRoll > 0.9) status = 'infected'; // Red
            else if (statusRoll > 0.75) status = 'risk'; // Yellow
            return { id: i + 1, status };
        });

        const MDR_TREND_DATA = [
            { name: 'Aug', S: 40, MDR: 20, XDR: 5 },
            { name: 'Sep', S: 35, MDR: 25, XDR: 8 },
            { name: 'Oct', S: 45, MDR: 15, XDR: 4 },
            { name: 'Nov', S: 30, MDR: 28, XDR: 10 },
            { name: 'Dec', S: 25, MDR: 30, XDR: 12 },
            { name: 'Jan', S: 38, MDR: 22, XDR: 6 },
        ];

        const EPI_CURVE_DATA = [
            { week: 'W1', Pneumonia: 4, UTI: 2, SSI: 1 },
            { week: 'W2', Pneumonia: 5, UTI: 3, SSI: 0 },
            { week: 'W3', Pneumonia: 8, UTI: 2, SSI: 1 },
            { week: 'W4', Pneumonia: 6, UTI: 4, SSI: 2 },
            { week: 'W5', Pneumonia: 3, UTI: 2, SSI: 1 },
        ];

        const HAND_HYGIENE_DATA = [
            { name: 'Compliant', value: 78 },
            { name: 'Missed', value: 22 },
        ];

        const ANTIBIOTIC_DATA = [
            { name: 'Meropenem', DDD: 45, Target: 40 },
            { name: 'Imipenem', DDD: 30, Target: 35 },
            { name: 'Vancomycin', DDD: 25, Target: 20 },
            { name: 'Colistin', DDD: 10, Target: 5 },
        ];

        const AI_PREDICTION_DATA = [
            { month: 'Nov', actual: 12, predicted: 11 },
            { month: 'Dec', actual: 15, predicted: 14 },
            { month: 'Jan', actual: 10, predicted: 12 },
            { month: 'Feb', predicted: 18 }, // Future
            { month: 'Mar', predicted: 22 }, // Future
        ];

        const HEATMAP_DATA = [
            { drug: 'Imipenem', ab: 20, ec: 98, kp: 85, pa: 70 },
            { drug: 'Meropenem', ab: 22, ec: 99, kp: 88, pa: 72 },
            { drug: 'Amikacin', ab: 45, ec: 95, kp: 90, pa: 85 },
            { drug: 'Ceftriaxone', ab: 5, ec: 40, kp: 60, pa: 0 },
        ];

        // --- COMPONENTS ---

        const AlertTicker = () => (
            <div className="w-full bg-red-950/40 border-y border-red-500/20 text-red-100 py-2 relative overflow-hidden flex items-center backdrop-blur-sm z-20">
                <div className="bg-red-600 text-white text-xs font-bold px-3 py-1 ml-4 rounded z-10 shadow-[0_0_10px_rgba(220,38,38,0.5)] absolute left-0 flex items-center gap-1">
                    <i data-lucide="siren" className="w-3 h-3 animate-pulse"></i> CRITICAL
                </div>
                <div className="ticker-wrap w-full">
                    <div className="ticker-content pl-24 text-sm font-light flex items-center">
                        {CRITICAL_ALERTS.map((alert, idx) => (
                            <span key={idx} className="mr-12 inline-flex items-center gap-2">
                                <span className="bg-red-500/10 px-2 py-0.5 rounded border border-red-500/30 text-xs font-mono text-red-300">{alert.time}</span>
                                <span className="font-semibold text-red-200">{alert.loc}</span> 
                                <span className="text-slate-400">|</span>
                                <span>HN {alert.hn}</span>
                                <i data-lucide="arrow-right" className="w-3 h-3 text-red-500"></i>
                                <b className="text-red-100 underline decoration-red-500/50 decoration-dotted">{alert.germ}</b>
                            </span>
                        ))}
                    </div>
                </div>
            </div>
        );

        const NumberCard = ({ title, value, unit, trend, trendVal, color, glowColor }) => (
            <div className="glass-panel p-5 rounded-2xl flex flex-col justify-between h-36 relative overflow-hidden group hover:border-white/20 transition-all">
                <div className="z-10">
                    <p className="text-slate-400 text-xs uppercase tracking-wider font-medium">{title}</p>
                    <div className="flex items-baseline gap-2 mt-3">
                        <span className={`text-5xl font-bold ${color} neon-text`} style={{color: glowColor}}>{value}</span>
                        <span className="text-sm text-slate-500 font-medium">{unit}</span>
                    </div>
                </div>
                <div className="z-10 flex items-center gap-1 text-xs mt-2 bg-slate-900/30 w-fit px-2 py-1 rounded-lg border border-white/5">
                    {trend === 'up' ? <i data-lucide="trending-up" className="text-red-400 w-3 h-3"></i> : <i data-lucide="trending-down" className="text-emerald-400 w-3 h-3"></i>}
                    <span className={trend === 'up' ? 'text-red-400' : 'text-emerald-400'}>{trendVal} from yesterday</span>
                </div>
                {/* Glow Effect */}
                <div className="absolute -right-6 -bottom-6 w-24 h-24 rounded-full opacity-20 blur-2xl transition-all group-hover:opacity-30" style={{backgroundColor: glowColor}}></div>
            </div>
        );

        const WardMap = () => (
            <div className="glass-panel p-5 rounded-2xl h-full border-t-2 border-t-purple-500/50">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        <i data-lucide="layout-grid" className="w-5 h-5 text-purple-400 icon-glow"></i> ICU Medical (Digital Map)
                    </h3>
                    <span className="text-[10px] text-red-300 animate-pulse flex items-center gap-1 bg-red-900/20 px-2 py-1 rounded border border-red-500/20">
                        <div className="w-2 h-2 bg-red-500 rounded-full shadow-[0_0_5px_red]"></div> 3 Active
                    </span>
                </div>
                <div className="bed-grid">
                    {WARD_BEDS.map(bed => {
                        let color = "bg-emerald-500/10 border-emerald-500/30 text-emerald-500 hover:bg-emerald-500/20";
                        if (bed.status === 'infected') color = "bg-red-500/20 border-red-500/60 text-red-400 shadow-[0_0_8px_rgba(239,68,68,0.2)] animate-pulse";
                        if (bed.status === 'risk') color = "bg-yellow-500/10 border-yellow-500/30 text-yellow-500 hover:bg-yellow-500/20";
                        return (
                            <div key={bed.id} className={`h-10 rounded-lg border flex items-center justify-center text-xs font-bold cursor-pointer transition-all ${color}`} title={`Bed ${bed.id}: ${bed.status}`}>
                                {bed.id}
                            </div>
                        )
                    })}
                </div>
                <div className="flex gap-4 mt-4 text-[10px] text-slate-400 justify-end font-medium">
                    <span className="flex items-center gap-1.5"><div className="w-2 h-2 bg-emerald-500 rounded-full"></div> Normal</span>
                    <span className="flex items-center gap-1.5"><div className="w-2 h-2 bg-yellow-500 rounded-full"></div> Risk</span>
                    <span className="flex items-center gap-1.5"><div className="w-2 h-2 bg-red-500 rounded-full shadow-[0_0_5px_red]"></div> Infection</span>
                </div>
            </div>
        );

        const GaugeChart = ({ value, label, target }) => {
            const radius = 35;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - ((value / 20) * circumference); 
            const isGood = value <= target;
            const color = isGood ? '#34d399' : '#ef4444';
            
            return (
                <div className="flex flex-col items-center relative group">
                    <div className="relative w-28 h-28 flex items-center justify-center">
                        <svg className="w-full h-full transform -rotate-90 drop-shadow-lg">
                            <circle cx="56" cy="56" r={radius} stroke="#1e293b" strokeWidth="8" fill="transparent" />
                            <circle cx="56" cy="56" r={radius} stroke={color} strokeWidth="8" fill="transparent" strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" className="transition-all duration-1000" style={{filter: `drop-shadow(0 0 4px ${color})`}} />
                        </svg>
                        <div className="absolute flex flex-col items-center">
                            <span className="text-2xl font-bold text-white">{value}</span>
                            <span className="text-[9px] text-slate-400">/1k days</span>
                        </div>
                    </div>
                    <span className="text-sm font-medium text-slate-300 mt-[-5px] group-hover:text-white transition-colors">{label}</span>
                    <span className="text-[10px] text-slate-500 mt-1 bg-slate-800/50 px-2 py-0.5 rounded-full border border-slate-700">Target: &lt;{target}</span>
                </div>
            );
        };

        const AntibiogramHeatmap = () => (
            <div className="overflow-x-auto">
                <table className="w-full text-xs text-center border-separate border-spacing-y-1">
                    <thead>
                        <tr className="text-slate-400">
                            <th className="py-2 text-left pl-2 font-light">Drug \ Bug</th>
                            <th className="text-pink-400 font-medium">A.bau</th>
                            <th className="text-purple-400 font-medium">E.coli</th>
                            <th className="text-indigo-400 font-medium">K.pneu</th>
                            <th className="text-emerald-400 font-medium">P.aeru</th>
                        </tr>
                    </thead>
                    <tbody>
                        {HEATMAP_DATA.map((row, i) => (
                            <tr key={i} className="hover:bg-white/5 transition-colors">
                                <td className="py-2 text-left pl-2 font-medium text-slate-300 border-b border-slate-800/50">{row.drug}</td>
                                {[row.ab, row.ec, row.kp, row.pa].map((val, idx) => {
                                    let bg = val > 70 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (val > 40 ? 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20');
                                    return <td key={idx} className={`py-1.5 px-1 rounded border ${bg} font-medium`}>{val}%</td>
                                })}
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        );

        const App = () => {
            useEffect(() => {
                if(window.lucide) window.lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen pb-10 relative">
                    {/* Fixed Background Logo */}
                    <div className="fixed inset-0 z-[-1] flex items-center justify-center overflow-hidden bg-[#0f172a]">
                         <img 
                            src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" 
                            className="w-full h-full object-cover opacity-10 pointer-events-none"
                            alt="Background"
                         />
                    </div>

                    {/* Header */}
                    <header className="glass-panel sticky top-0 z-50 border-b-0 backdrop-blur-xl bg-slate-900/80 relative">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="relative">
                                    <img src="https://i.ibb.co/2Y3GCPpC/Gemini-Generated-Image-eka4oweka4oweka4-1-removebg-preview.png" className="h-10 w-auto drop-shadow-[0_0_10px_rgba(99,102,241,0.6)]" />
                                    <div className="absolute inset-0 bg-indigo-500/20 blur-xl rounded-full"></div>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300" style={{textShadow: '0 0 20px rgba(167,139,250,0.3)'}}>SW-1 Smart IC</h1>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-[0.2em]">Hospital Infection Control</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden md:block">
                                    <div className="text-xs text-indigo-300 font-mono">{new Date().toLocaleDateString('th-TH', { dateStyle: 'long' })}</div>
                                    <div className="text-[10px] text-slate-500 flex items-center justify-end gap-1">
                                        <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div> System Online
                                    </div>
                                </div>
                                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-[0_0_15px_rgba(99,102,241,0.4)] border border-white/10">S</div>
                            </div>
                        </div>
                    </header>

                    {/* Zone 1: Action & Alerts */}
                    <AlertTicker />

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-6 relative z-10">
                        
                        {/* Real-time Zone */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            <div className="lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                                <NumberCard title="Active HAI Cases" value="12" unit="Cases" trend="up" trendVal="+2" color="text-red-400" glowColor="#f87171" />
                                <NumberCard title="VAP Cases" value="5" unit="Cases" trend="down" trendVal="-1" color="text-yellow-400" glowColor="#facc15" />
                                <NumberCard title="Isolations" value="8" unit="Rooms" trend="up" trendVal="+1" color="text-orange-400" glowColor="#fb923c" />
                            </div>
                            <div className="lg:col-span-4 h-full">
                                <WardMap />
                            </div>
                        </div>

                        {/* Zone 2: Surveillance (Trends) */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="glass-panel p-6 rounded-2xl lg:col-span-2 border-t-2 border-t-purple-500/50">
                                <h3 className="text-white font-bold mb-6 flex items-center gap-2 text-lg">
                                    <i data-lucide="bar-chart-2" className="w-5 h-5 text-purple-400 icon-glow"></i> Sentinel Organism Trend (MDR)
                                </h3>
                                <div className="h-72">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={MDR_TREND_DATA} barGap={4}>
                                            <defs>
                                                <linearGradient id="colorS" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#34d399" stopOpacity={0.9}/>
                                                    <stop offset="95%" stopColor="#059669" stopOpacity={0.7}/>
                                                </linearGradient>
                                                <linearGradient id="colorMDR" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#fbbf24" stopOpacity={0.9}/>
                                                    <stop offset="95%" stopColor="#d97706" stopOpacity={0.7}/>
                                                </linearGradient>
                                                <linearGradient id="colorXDR" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#ef4444" stopOpacity={0.9}/>
                                                    <stop offset="95%" stopColor="#b91c1c" stopOpacity={0.7}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} opacity={0.5} />
                                            <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} dy={10} />
                                            <YAxis stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} />
                                            <Tooltip 
                                                contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.9)', borderColor: '#475569', color: '#fff', borderRadius: '8px', backdropFilter: 'blur(4px)' }} 
                                                cursor={{fill: 'rgba(255,255,255,0.05)'}}
                                            />
                                            <Legend iconType="circle" wrapperStyle={{ paddingTop: '10px' }} />
                                            <Bar dataKey="S" stackId="a" fill="url(#colorS)" name="Susceptible" radius={[0,0,4,4]} />
                                            <Bar dataKey="MDR" stackId="a" fill="url(#colorMDR)" name="MDR" />
                                            <Bar dataKey="XDR" stackId="a" fill="url(#colorXDR)" name="XDR" radius={[4,4,0,0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                            
                            <div className="space-y-6">
                                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-indigo-500/50">
                                    <h3 className="text-white font-bold mb-4 flex items-center gap-2">
                                        <i data-lucide="activity" className="w-5 h-5 text-indigo-400 icon-glow"></i> Epidemic Curve
                                    </h3>
                                    <div className="h-32">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={EPI_CURVE_DATA}>
                                                <defs>
                                                    <linearGradient id="colorPneu" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#818cf8" stopOpacity={0.8}/>
                                                        <stop offset="95%" stopColor="#818cf8" stopOpacity={0}/>
                                                    </linearGradient>
                                                    <linearGradient id="colorUTI" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#f472b6" stopOpacity={0.8}/>
                                                        <stop offset="95%" stopColor="#f472b6" stopOpacity={0}/>
                                                    </linearGradient>
                                                </defs>
                                                <XAxis dataKey="week" hide />
                                                <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#fff', fontSize: '10px' }} />
                                                <Area type="monotone" dataKey="Pneumonia" stroke="#818cf8" strokeWidth={2} fillOpacity={1} fill="url(#colorPneu)" />
                                                <Area type="monotone" dataKey="UTI" stroke="#f472b6" strokeWidth={2} fillOpacity={1} fill="url(#colorUTI)" />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                                <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-emerald-500/50">
                                    <h3 className="text-white font-bold mb-3 flex items-center gap-2">
                                        <i data-lucide="table" className="w-5 h-5 text-emerald-400 icon-glow"></i> Antibiogram Heatmap
                                    </h3>
                                    <AntibiogramHeatmap />
                                </div>
                            </div>
                        </div>

                        {/* Zone 3 & 4: Quality & AI */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {/* HAI Rates */}
                            <div className="glass-panel p-5 rounded-2xl text-center border-t-2 border-t-slate-500/50">
                                <h3 className="text-white font-bold mb-4 text-sm flex items-center justify-center gap-2">
                                    <i data-lucide="gauge" className="w-4 h-4 text-slate-400 icon-glow"></i> HAI Rates vs Target
                                </h3>
                                <div className="flex justify-around">
                                    <GaugeChart value={6.5} label="VAP Rate" target={5} />
                                    <GaugeChart value={2.1} label="CAUTI Rate" target={3} />
                                </div>
                            </div>

                            {/* Hand Hygiene */}
                            <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-pink-500/50">
                                <h3 className="text-white font-bold mb-2 text-sm flex justify-between items-center">
                                    <div className="flex gap-2 items-center"><i data-lucide="hand" className="w-4 h-4 text-pink-400 icon-glow"></i> Hand Hygiene</div>
                                    <span className="text-emerald-400 font-mono text-lg neon-text">78%</span>
                                </h3>
                                <div className="h-40">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <defs>
                                                <linearGradient id="gradCompliant" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="0%" stopColor="#34d399" />
                                                    <stop offset="100%" stopColor="#059669" />
                                                </linearGradient>
                                                <linearGradient id="gradMissed" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="0%" stopColor="#f87171" />
                                                    <stop offset="100%" stopColor="#b91c1c" />
                                                </linearGradient>
                                            </defs>
                                            <Pie data={HAND_HYGIENE_DATA} cx="50%" cy="50%" innerRadius={45} outerRadius={65} paddingAngle={5} dataKey="value" stroke="none">
                                                {HAND_HYGIENE_DATA.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={entry.name === 'Compliant' ? 'url(#gradCompliant)' : 'url(#gradMissed)'} />
                                                ))}
                                            </Pie>
                                            <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#fff' }} />
                                            <Legend verticalAlign="bottom" height={36} iconType="circle" wrapperStyle={{ fontSize: '10px' }}/>
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* Antibiotic Use */}
                            <div className="glass-panel p-5 rounded-2xl border-t-2 border-t-indigo-500/50">
                                <h3 className="text-white font-bold mb-2 text-sm flex items-center gap-2">
                                    <i data-lucide="pill" className="w-4 h-4 text-indigo-400 icon-glow"></i> Antibiotic (DDD)
                                </h3>
                                <div className="h-40">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={ANTIBIOTIC_DATA} layout="vertical">
                                            <defs>
                                                <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="0">
                                                    <stop offset="0%" stopColor="#8b5cf6" />
                                                    <stop offset="100%" stopColor="#6d28d9" />
                                                </linearGradient>
                                                <linearGradient id="gradRed" x1="0" y1="0" x2="1" y2="0">
                                                    <stop offset="0%" stopColor="#ef4444" />
                                                    <stop offset="100%" stopColor="#b91c1c" />
                                                </linearGradient>
                                            </defs>
                                            <XAxis type="number" hide />
                                            <YAxis dataKey="name" type="category" width={70} tick={{fontSize: 10, fill: '#94a3b8'}} axisLine={false} tickLine={false} />
                                            <Tooltip cursor={{fill: 'rgba(255,255,255,0.05)'}} contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#fff', fontSize: '10px' }} />
                                            <Bar dataKey="DDD" radius={[0, 4, 4, 0]} barSize={12}>
                                                {
                                                    ANTIBIOTIC_DATA.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.DDD > entry.Target ? 'url(#gradRed)' : 'url(#gradPurple)'} />
                                                    ))
                                                }
                                            </Bar>
                                            <ReferenceLine x={40} stroke="#64748b" strokeDasharray="3 3" label={{ value: 'Target', fill: '#64748b', fontSize: 9 }} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* AI Prediction */}
                            <div className="glass-panel p-5 rounded-2xl border border-purple-500/30 relative overflow-hidden bg-gradient-to-br from-purple-900/20 to-slate-900/50">
                                <div className="absolute -top-6 -right-6 p-4 opacity-10"><i data-lucide="brain-circuit" className="w-32 h-32 text-purple-400"></i></div>
                                <h3 className="text-purple-300 font-bold mb-2 text-sm z-10 relative flex items-center gap-2">
                                    <i data-lucide="sparkles" className="w-4 h-4 text-yellow-300 icon-glow"></i> AI Outbreak Risk
                                </h3>
                                <div className="h-40 relative z-10">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <ComposedChart data={AI_PREDICTION_DATA}>
                                            <defs>
                                                <linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#a855f7" stopOpacity={0.3}/>
                                                    <stop offset="95%" stopColor="#a855f7" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} opacity={0.5} />
                                            <XAxis dataKey="month" stroke="#64748b" fontSize={10} tickLine={false} axisLine={false} />
                                            <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#a855f7', color: '#fff', borderRadius: '8px' }} />
                                            <Area type="monotone" dataKey="predicted" stroke="#a855f7" strokeWidth={2} fill="url(#gradArea)" strokeDasharray="5 5" name="Forecast" />
                                            <Line type="monotone" dataKey="actual" stroke="#22d3ee" strokeWidth={2} dot={{r:3, fill: '#22d3ee'}} name="Actual" />
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="mt-1 flex items-center gap-2 text-[10px] text-purple-100 bg-purple-600/20 p-2 rounded border border-purple-500/30 backdrop-blur-sm">
                                    <i data-lucide="zap" className="w-3 h-3 text-yellow-300 icon-glow"></i>
                                    <span>Rising trend detected in ICU.</span>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
