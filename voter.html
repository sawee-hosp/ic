<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โหวตบุคคลดีเด่นแห่งปี - รพ.สวี</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        .heart-beat { animation: heartbeat 1.5s infinite; }
        .float-animation { animation: float 3s ease-in-out infinite; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartbeat {
            0% { transform: scale(1); } 14% { transform: scale(1.1); } 28% { transform: scale(1); }
            42% { transform: scale(1.1); } 70% { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .suggestion-list::-webkit-scrollbar { width: 4px; }
        .suggestion-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-blue-50/50">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // ใช้ URL เดิมที่คุณระบุ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAlIL1gekP4kNJmvcpq5wWfMSzQBSG805exfEL6ccZ_vID6A7nfR4Eeyfv-GLOAjRu/exec"; 
        
        const LIFF_ID = "2008690634-qeZq6pVP";
        const DEADLINE = new Date("2026-02-05T16:00:00+07:00").getTime(); // 5 ก.พ. 2026 16.00 น.

        const { useState, useEffect, useMemo } = React;
        
        // ชุดสีสำหรับ Icon คน (สุ่ม)
        const colors = [
            "bg-red-100 text-red-700 border-red-200",
            "bg-orange-100 text-orange-700 border-orange-200",
            "bg-amber-100 text-amber-700 border-amber-200",
            "bg-green-100 text-green-700 border-green-200",
            "bg-emerald-100 text-emerald-700 border-emerald-200",
            "bg-teal-100 text-teal-700 border-teal-200",
            "bg-cyan-100 text-cyan-700 border-cyan-200",
            "bg-sky-100 text-sky-700 border-sky-200",
            "bg-blue-100 text-blue-700 border-blue-200",
            "bg-indigo-100 text-indigo-700 border-indigo-200",
            "bg-violet-100 text-violet-700 border-violet-200",
            "bg-purple-100 text-purple-700 border-purple-200",
            "bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200",
            "bg-pink-100 text-pink-700 border-pink-200",
            "bg-rose-100 text-rose-700 border-rose-200"
        ];

        // Icons
        const Heart = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const Search = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const Lock = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const User = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const Clock = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

        // ==========================================
        // COMPONENTS
        // ==========================================

        const Countdown = () => {
            const [timeLeft, setTimeLeft] = useState("");

            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = DEADLINE - now;

                    if (distance < 0) {
                        clearInterval(interval);
                        setTimeLeft("หมดเวลาโหวตแล้ว");
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    
                    setTimeLeft(`เหลือเวลา ${days} วัน ${hours} ชม. ${minutes} นาที`);
                }, 1000);

                return () => clearInterval(interval);
            }, []);

            return (
                <div className="bg-red-50 text-red-600 text-sm py-2 px-4 rounded-full inline-flex items-center gap-2 mb-4 animate-in shadow-sm border border-red-100">
                    <Clock className="w-4 h-4" />
                    <span className="font-bold">{timeLeft}</span>
                </div>
            );
        };

        const LandingPage = ({ onStart, onAdminClick }) => (
            <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-blue-100 to-white p-6 text-center relative overflow-hidden">
                <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-blue-50 z-10">
                    <div className="bg-blue-600 p-8 text-white relative">
                        <div className="relative z-10">
                            <Heart className="w-20 h-20 mx-auto mb-4 text-pink-400 drop-shadow-lg heart-beat" />
                            <h1 className="text-2xl font-bold tracking-wide">โหวตบุคคลดีเด่นแห่งปี</h1>
                            <p className="text-sm text-blue-100 mt-1">รพ.สวี (Sawi Hospital)</p>
                        </div>
                    </div>
                    
                    <div className="p-8 space-y-4">
                        <Countdown />
                        
                        <div className="text-blue-800 font-semibold text-lg italic">
                            "เพราะรอยยิ้มและกำลังใจ...เริ่มต้นที่พวกเราเอง" 🏥✨
                        </div>
                        
                        <p className="text-gray-600 text-sm leading-relaxed">
                            ภายใต้หน้ากากอนามัย และชุดฟอร์มที่เหนื่อยล้า... <br/>
                            ใครคือคนที่ทำให้คุณรู้สึก <span className="text-blue-600 font-bold">มีพลัง?</span>
                        </p>
                        
                        <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <p className="text-blue-800 font-medium mb-2 text-sm">ขอเชิญชาว รพ.สวี ร่วมโหวต</p>
                            <p className="text-xl font-bold text-blue-600">"บุคคลสร้างแรงบันดาลใจแห่งปี 2025"</p>
                        </div>

                        <button 
                            onClick={onStart}
                            className="w-full font-bold py-4 px-6 rounded-full shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 text-lg bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white shadow-blue-200 mt-4"
                        >
                            <span>เริ่มโหวต</span> <Heart className="w-5 h-5 text-pink-300" />
                        </button>
                    </div>
                </div>
                
                <div onClick={onAdminClick} className="fixed bottom-0 left-0 w-16 h-16 z-50 cursor-pointer opacity-0 hover:opacity-100 flex items-center justify-center">
                    <Lock className="w-4 h-4 text-gray-400" />
                </div>
            </div>
        );

        const IdentifyPage = ({ candidates, onConfirm, loading }) => {
            const [inputName, setInputName] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [showError, setShowError] = useState(false);

            // FIX: กรองเฉพาะค่าที่เป็น String จริงๆ เพื่อป้องกัน undefined/null
            const names = useMemo(() => {
                if (!Array.isArray(candidates)) return [];
                return candidates
                    .map(c => c.name)
                    .filter(name => typeof name === 'string' && name.trim().length > 0);
            }, [candidates]);

            const handleInputChange = (e) => {
                const value = e.target.value;
                setInputName(value);
                setShowError(false);
                
                // FIX: เพิ่มการเช็ค value และ names ก่อน filter
                if (value.length > 0 && names.length > 0) {
                    setSuggestions(names.filter(n => n && n.includes(value)));
                } else {
                    setSuggestions([]);
                }
            };

            const handleManualSearch = () => {
                if (!names.includes(inputName)) setShowError(true);
            };

            const isValidName = names.includes(inputName);

            return (
                <div className="flex flex-col items-center min-h-screen bg-blue-50 p-6 pt-20">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 pb-12">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Search className="w-8 h-8 text-blue-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800">คุณชื่ออะไรครับ?</h2>
                            <p className="text-sm text-gray-500 mt-2">พิมพ์ชื่อของคุณเพื่อยืนยันตัวตน</p>
                        </div>
                        
                        {loading ? (
                            <div className="text-center text-blue-500 animate-pulse">กำลังโหลดรายชื่อ...</div>
                        ) : (
                            <div className="relative mb-6">
                                <div className="relative">
                                    <input
                                        type="text"
                                        className={`block w-full pl-4 pr-12 py-4 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-blue-500 text-lg outline-none ${isValidName ? 'border-green-500 bg-green-50' : 'border-gray-200'}`}
                                        placeholder="พิมพ์ชื่อ..."
                                        value={inputName}
                                        onChange={handleInputChange}
                                        onKeyDown={(e) => e.key === 'Enter' && handleManualSearch()}
                                    />
                                    <button onClick={handleManualSearch} className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-blue-100 text-blue-600 rounded-lg">
                                        <Search className="w-5 h-5" />
                                    </button>
                                </div>

                                {suggestions.length > 0 && (
                                    <ul className="suggestion-list absolute z-20 w-full bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto mt-2 top-full">
                                        {suggestions.map((name, index) => (
                                            <li key={index} onClick={() => { setInputName(name); setSuggestions([]); setShowError(false); }} className="px-5 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 text-gray-700 text-left">
                                                {name}
                                            </li>
                                        ))}
                                    </ul>
                                )}

                                {showError && !isValidName && (
                                    <div className="mt-3 p-3 bg-red-50 text-red-600 text-sm rounded-lg text-center border border-red-200 animate-in">
                                        ⚠️ ไม่พบรายชื่อนี้ในระบบ
                                    </div>
                                )}
                            </div>
                        )}

                        <button
                            onClick={() => onConfirm(inputName)}
                            disabled={!isValidName}
                            className={`w-full font-bold py-4 px-6 rounded-xl transition shadow-lg ${isValidName ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-200' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                        >
                            ยืนยันตัวตน
                        </button>
                    </div>
                </div>
            );
        };

        const VotingPage = ({ currentUser, candidates, onVote }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);

            // กรองตัวเองออก และกรองตามคำค้นหา (ชื่อ, ตำแหน่ง, แผนก)
            const filteredCandidates = useMemo(() => {
                let list = candidates.filter(c => c.name !== currentUser);
                if (searchTerm) {
                    const lower = searchTerm.toLowerCase();
                    list = list.filter(c => 
                        (c.name && c.name.toLowerCase().includes(lower)) ||
                        (c.job && c.job.toLowerCase().includes(lower)) ||
                        (c.dept && c.dept.toLowerCase().includes(lower))
                    );
                }
                return list;
            }, [candidates, currentUser, searchTerm]);

            // สุ่มสีให้แต่ละคน (ใช้ useMemo เพื่อไม่ให้สีเปลี่ยนตอนพิมพ์ค้นหา)
            const candidateColors = useMemo(() => {
                const map = {};
                candidates.forEach(c => {
                    map[c.name] = colors[Math.floor(Math.random() * colors.length)];
                });
                return map;
            }, [candidates]);

            const handleVote = async () => {
                if (!selectedCandidate) return;
                setIsSubmitting(true);
                await onVote(selectedCandidate.name);
                setIsSubmitting(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    <header className="bg-white/80 backdrop-blur-md p-4 sticky top-0 z-30 border-b border-gray-200 shadow-sm">
                        <div className="max-w-md mx-auto">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <p className="text-xs text-gray-400">ผู้โหวต</p>
                                    <p className="font-bold text-gray-800 truncate max-w-[150px]">{currentUser}</p>
                                </div>
                                <div className="text-right">
                                    <div className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">
                                        1 สิทธิ์
                                    </div>
                                </div>
                            </div>
                            
                            <div className="relative">
                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" />
                                <input 
                                    type="text"
                                    placeholder="ค้นหาชื่อ, ตำแหน่ง, แผนก..."
                                    className="w-full bg-gray-100 border-none rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 transition-all"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 p-4 max-w-md mx-auto w-full pb-32">
                        <div className="space-y-6 mt-2">
                            {filteredCandidates.length === 0 ? (
                                <div className="text-center text-gray-400 py-10">ไม่พบรายชื่อที่ค้นหา</div>
                            ) : (
                                filteredCandidates.map((c, index) => {
                                    // สลับซ้ายขวา (Odd/Even)
                                    const isRight = index % 2 !== 0;
                                    const colorClass = candidateColors[c.name] || colors[0];

                                    return (
                                        <div 
                                            key={index}
                                            onClick={() => setSelectedCandidate(c)}
                                            className={`flex items-center gap-4 cursor-pointer group ${isRight ? 'flex-row-reverse text-right' : 'flex-row text-left'}`}
                                        >
                                            {/* Icon Bubble */}
                                            <div className={`relative w-20 h-20 rounded-full flex-shrink-0 flex items-center justify-center shadow-lg border-4 border-white transition-transform duration-300 group-hover:scale-110 float-animation ${colorClass}`}>
                                                <User className="w-10 h-10" />
                                                {selectedCandidate?.name === c.name && (
                                                    <div className="absolute inset-0 bg-black/20 rounded-full flex items-center justify-center">
                                                        <Heart className="w-8 h-8 text-white fill-current animate-bounce" />
                                                    </div>
                                                )}
                                            </div>

                                            {/* Text Info */}
                                            <div className="flex-1 min-w-0">
                                                <h3 className={`font-bold text-gray-800 text-lg leading-tight group-hover:text-blue-600 transition-colors ${selectedCandidate?.name === c.name ? 'text-blue-600' : ''}`}>
                                                    {c.name}
                                                </h3>
                                                <p className="text-xs text-gray-500 mt-1 truncate">{c.job}</p>
                                                <span className="inline-block mt-1 text-[10px] bg-white border border-gray-200 px-2 py-0.5 rounded text-gray-400">
                                                    {c.dept}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </main>

                    {/* Confirmation Modal */}
                    {selectedCandidate && (
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur shadow-[0_-5px_30px_rgba(0,0,0,0.1)] z-40 animate-in border-t border-gray-100">
                            <div className="max-w-md mx-auto text-center">
                                <p className="text-gray-500 text-sm mb-2">ยืนยันการเลือก</p>
                                <h3 className="text-xl font-bold text-blue-700 mb-4">{selectedCandidate.name}</h3>
                                <button
                                    onClick={handleVote}
                                    disabled={isSubmitting}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 active:scale-95 transition disabled:opacity-50 flex items-center justify-center gap-2"
                                >
                                    {isSubmitting ? 'กำลังบันทึก...' : 'โหวตคนนี้แหละ!'} <Heart className="w-5 h-5 fill-current" />
                                </button>
                                <button 
                                    onClick={() => setSelectedCandidate(null)}
                                    className="mt-3 text-gray-400 text-sm underline hover:text-gray-600"
                                >
                                    เปลี่ยนใจ
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ThankYouPage = () => (
            <div className="flex flex-col items-center justify-center min-h-screen bg-blue-50 p-6 text-center">
                <div className="bg-white p-10 rounded-3xl shadow-xl max-w-sm w-full relative overflow-hidden">
                    <div className="w-24 h-24 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <Heart className="w-12 h-12 text-pink-500 fill-current heart-beat" />
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">บันทึกคะแนนเรียบร้อย!</h2>
                    <p className="text-gray-500 mb-6">ขอบคุณที่เป็นพลังใจให้เพื่อนร่วมงานครับ</p>
                    <button onClick={() => window.location.reload()} className="text-blue-500 text-sm underline">กลับหน้าหลัก</button>
                </div>
            </div>
        );

        // ... AdminLogin, ResultsPage can remain similar but omitted for brevity if unchanged ...
        // Re-adding simplified versions for completeness
        const AdminLogin = ({ onLogin, onCancel }) => {
            const [pass, setPass] = useState('');
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                    <div className="bg-white p-6 rounded-2xl w-80">
                        <h3 className="font-bold mb-4">ผู้ดูแลระบบ</h3>
                        <input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="รหัสผ่าน" />
                        <div className="flex justify-end gap-2"><button onClick={onCancel}>ยกเลิก</button><button onClick={()=>onLogin(pass)} className="bg-blue-600 text-white px-4 py-2 rounded">เข้าสู่ระบบ</button></div>
                    </div>
                </div>
            );
        };

        const ResultsPage = ({ votes }) => {
            const [top, setTop] = useState([]);
            useEffect(() => {
                const c = {}; votes.forEach(v => c[v.votedFor] = (c[v.votedFor]||0)+1);
                setTop(Object.entries(c).map(([n,v])=>({name:n,count:v})).sort((a,b)=>b.count-a.count).slice(0,10));
            }, [votes]);
            return (
                <div className="min-h-screen bg-slate-900 text-white p-6">
                    <h1 className="text-2xl font-bold text-yellow-400 mb-6 text-center">🏆 10 อันดับสูงสุด</h1>
                    <div className="max-w-md mx-auto space-y-3">
                        {top.map((t,i) => (
                            <div key={i} className="flex justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <div className="flex gap-3"><span className="font-bold text-slate-500">#{i+1}</span> <span>{t.name}</span></div>
                                <span className="font-bold text-yellow-500">{t.count} ❤️</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('landing');
            const [currentUser, setCurrentUser] = useState(null);
            const [candidates, setCandidates] = useState([]);
            const [loading, setLoading] = useState(true);
            const [votes, setVotes] = useState([]);

            useEffect(() => {
                fetch(GOOGLE_SCRIPT_URL + "?action=getData")
                    .then(res => res.json())
                    .then(json => {
                        if (json.status === 'success') setCandidates(json.data);
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));
            }, []);

            const handleStart = () => {
                const now = new Date().getTime();
                if (now > DEADLINE) return alert("หมดเวลาโหวตแล้วครับ");
                setView('identify');
            };

            const handleVote = async (votedForName) => {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'vote',
                            voter: currentUser,
                            votedFor: votedForName,
                            lineUserId: 'Browser_User' // Replace with LIFF logic if needed
                        })
                    });
                    const json = await res.json();
                    if (json.status === 'success') setView('done');
                    else alert(json.message);
                } catch(e) { alert("Error saving vote"); }
            };

            const fetchResults = async () => {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getResults&password=38311");
                const json = await res.json();
                if (json.status === 'success') { setVotes(json.data); setView('results'); }
            };

            if (view === 'results') return <ResultsPage votes={votes} />;

            return (
                <div>
                    {view === 'landing' && <LandingPage onStart={handleStart} onAdminClick={() => setView('admin_login')} />}
                    {view === 'identify' && <IdentifyPage candidates={candidates} loading={loading} onConfirm={(name) => { setCurrentUser(name); setView('voting'); }} />}
                    {view === 'voting' && <VotingPage currentUser={currentUser} candidates={candidates} onVote={handleVote} />}
                    {view === 'done' && <ThankYouPage />}
                    {view === 'admin_login' && <AdminLogin onLogin={(p) => p==='38311' ? fetchResults() : alert('ผิด')} onCancel={() => setView('landing')} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
