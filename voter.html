<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โหวตบุคคลดีเด่นแห่งปี - รพ.สวี</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        .heart-beat { animation: heartbeat 1.5s infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
        /* Custom Scrollbar for suggestions */
        .suggestion-list::-webkit-scrollbar { width: 6px; }
        .suggestion-list::-webkit-scrollbar-track { background: #f1f1f1; }
        .suggestion-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .suggestion-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-blue-50">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 1. ตั้งค่า Config (Configuration)
        // ==========================================

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAlIL1gekP4kNJmvcpq5wWfMSzQBSG805exfEL6ccZ_vID6A7nfR4Eeyfv-GLOAjRu/exec"; 
        const LIFF_ID = "2008690634-qeZq6pVP";

        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 2. Icons
        // ==========================================
        const Heart = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const User = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const CheckCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const Award = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        const Search = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const Lock = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const Info = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;

        // ==========================================
        // 3. Components
        // ==========================================

        const LandingPage = ({ onStart, onAdminClick, isLiffReady, liffError }) => (
            <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-blue-100 to-white p-6 text-center relative">
                <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-blue-50">
                    <div className="bg-blue-600 p-8 text-white relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full bg-white opacity-10 rounded-full transform scale-150 translate-y-10"></div>
                        <div className="relative z-10">
                            <Heart className="w-20 h-20 mx-auto mb-4 text-pink-400 drop-shadow-lg heart-beat" />
                            <h1 className="text-2xl font-bold tracking-wide">โหวตบุคคลดีเด่นแห่งปี</h1>
                            <p className="text-sm text-blue-100 mt-1">รพ.สวี (Sawi Hospital)</p>
                        </div>
                    </div>
                    
                    <div className="p-8 space-y-6">
                        <div className="text-blue-800 font-semibold text-lg italic">
                            "เพราะรอยยิ้มและกำลังใจ...เริ่มต้นที่พวกเราเอง" 🏥✨
                        </div>
                        
                        <p className="text-gray-600 text-sm leading-relaxed">
                            ภายใต้หน้ากากอนามัย และชุดฟอร์มที่เหนื่อยล้า... <br/>
                            ใครคือคนที่ทำให้คุณรู้สึก <span className="text-blue-600 font-bold">มีพลัง?</span><br/>
                            ใครคือคนที่หยิบยื่นน้ำใจให้เพื่อนร่วมงานและคนไข้เสมอมา?
                        </p>
                        
                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 shadow-inner">
                            <p className="text-blue-800 font-medium mb-2 text-sm">ขอเชิญชาว รพ.สวี ร่วมโหวต</p>
                            <p className="text-xl font-bold text-blue-600">"บุคคลสร้างแรงบันดาลใจแห่งปี 2025"</p>
                        </div>

                        <div className="text-left text-xs text-gray-500 bg-gray-50 p-4 rounded-xl space-y-1 border border-gray-100">
                            <p className="text-blue-600 font-bold mb-1">📌 เงื่อนไข:</p>
                            <ul className="list-disc pl-4 space-y-1">
                                <li>1 คน Log In ผ่าน Line โหวตได้ 1 คน (ห้ามโหวตตัวเอง)</li>
                                <li>ลุ้นรางวัลสุ่ม 10 รางวัล</li>
                                <li>โหวตได้: 08.00-16.00 น. วันที่ 5 ม.ค. 2569</li>
                                <li>ข้อมูลการโหวตเป็นความลับตาม PDPA</li>
                            </ul>
                        </div>

                        {liffError && (
                            <div className="text-red-500 text-xs bg-red-50 p-2 rounded border border-red-200">
                                LIFF Error: {liffError} (กรุณาเปิดใน LINE)
                            </div>
                        )}

                        <button 
                            onClick={onStart}
                            disabled={!isLiffReady}
                            className={`w-full font-bold py-4 px-6 rounded-full shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 text-lg
                                ${isLiffReady ? 'bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white shadow-blue-200' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}
                            `}
                        >
                            {isLiffReady ? (
                                <><span>เริ่มโหวต</span> <Heart className="w-5 h-5 text-pink-300 fill-current" /></>
                            ) : (
                                <span>กำลังเชื่อมต่อ LINE...</span>
                            )}
                        </button>
                    </div>
                </div>
                
                <div onClick={onAdminClick} className="fixed bottom-0 left-0 w-12 h-12 z-50 cursor-pointer opacity-0 hover:opacity-100 flex items-center justify-center">
                    <Lock className="w-4 h-4 text-gray-400" />
                </div>
            </div>
        );

        const IdentifyPage = ({ names, onConfirm, loading }) => {
            const [inputName, setInputName] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [hasSearched, setHasSearched] = useState(false);

            const handleSearch = (e) => {
                const value = e.target.value;
                setInputName(value);
                setHasSearched(value.length > 0);

                if (value.length > 0 && names.length > 0) {
                    // กรองชื่อที่มีคำที่พิมพ์ (substring match)
                    const filtered = names.filter(name => name.includes(value));
                    setSuggestions(filtered);
                } else {
                    setSuggestions([]);
                }
            };

            const selectName = (name) => {
                setInputName(name);
                setSuggestions([]); // ปิด suggestion เมื่อเลือกแล้ว
                setHasSearched(false); // รีเซ็ตสถานะการค้นหาเพื่อซ่อนคำเตือน (เพราะเลือกแล้ว)
            };

            // เช็คว่าชื่อที่พิมพ์ตรงกับฐานข้อมูลเป๊ะๆ หรือยัง (ใช้สำหรับ Enable ปุ่ม)
            const isValidName = names.includes(inputName);

            return (
                <div className="flex flex-col items-center min-h-screen bg-blue-50 p-6 pt-20">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 pb-12">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Search className="w-8 h-8 text-blue-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800">คุณชื่ออะไรครับ?</h2>
                            
                            <div className="mt-3 bg-green-50 p-3 rounded-xl border border-green-100 inline-block">
                                <p className="text-green-700 text-sm font-medium flex items-start gap-2 text-left">
                                    <Info className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                    <span>เราแค่จะเช็คไม่ให้โหวตซ้ำเฉยๆ<br/>ไม่บอกหรอกว่าคุณแอบโหวตใคร 🤫</span>
                                </p>
                            </div>
                        </div>
                        
                        {loading ? (
                            <div className="text-center text-blue-500 py-4 animate-pulse">กำลังโหลดรายชื่อ...</div>
                        ) : (
                            <div className="relative mb-6">
                                <input
                                    type="text"
                                    className={`block w-full px-4 py-4 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-blue-500 text-lg transition-all outline-none ${isValidName ? 'border-green-500 bg-green-50 ring-green-500' : 'border-gray-200'}`}
                                    placeholder="พิมพ์ชื่อของคุณ..."
                                    value={inputName}
                                    onChange={handleSearch}
                                />
                                {isValidName && <CheckCircle className="absolute right-4 top-4 w-6 h-6 text-green-600 animate-in" />}

                                {/* Suggestion List - แสดงทันทีที่มี suggestion */}
                                {suggestions.length > 0 && (
                                    <ul className="suggestion-list absolute z-20 w-full bg-white border border-gray-200 rounded-lg shadow-2xl max-h-60 overflow-y-auto mt-2 top-full">
                                        {suggestions.map((name, index) => (
                                            <li key={index} onClick={() => selectName(name)} className="px-5 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 text-gray-700 text-left">
                                                {/* ไฮไลท์คำที่ตรงกับ input (Optional) */}
                                                {name}
                                            </li>
                                        ))}
                                    </ul>
                                )}

                                {/* Warning - แสดงเมื่อพิมพ์แล้วแต่ไม่เจอชื่อเลย */}
                                {hasSearched && suggestions.length === 0 && !isValidName && (
                                    <div className="mt-3 p-4 bg-red-50 border border-red-200 rounded-xl animate-in text-center shadow-sm">
                                        <p className="text-red-700 font-bold flex items-center justify-center gap-2 mb-1">
                                            <span className="text-xl">⚠️</span> ไม่พบชื่อนี้ในระบบ
                                        </p>
                                        <p className="text-red-600 text-sm">
                                            ถ้ามั่นใจว่าสะกดถูกแล้ว<br/>โปรดแจ้งผู้จัดงานทันทีครับ
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}

                        <button
                            onClick={() => onConfirm(inputName)}
                            disabled={!isValidName || loading}
                            className={`w-full font-bold py-4 px-6 rounded-xl transition shadow-lg 
                                ${isValidName 
                                    ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-200 cursor-pointer transform hover:scale-[1.02]' 
                                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                        >
                            ยืนยันตัวตน
                        </button>
                    </div>
                </div>
            );
        };

        const VotingPage = ({ currentUser, candidates, onVote }) => {
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const voteableCandidates = useMemo(() => {
                return candidates.filter(name => name !== currentUser);
            }, [candidates, currentUser]);

            const handleConfirmVote = async () => {
                if (!selectedCandidate) return;
                setIsSubmitting(true);
                await onVote(selectedCandidate);
                setIsSubmitting(false);
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    <header className="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-20 rounded-b-2xl">
                        <div className="max-w-md mx-auto flex justify-between items-center px-2">
                            <div>
                                <p className="text-xs text-blue-200">ผู้โหวต</p>
                                <p className="font-bold truncate max-w-[200px] text-lg">{currentUser}</p>
                            </div>
                            <div className="bg-blue-500/50 px-3 py-1 rounded-lg text-right">
                                <p className="text-[10px] text-blue-100">สิทธิ์คงเหลือ</p>
                                <p className="font-bold text-sm">1 สิทธิ์</p>
                            </div>
                        </div>
                    </header>
                    <main className="flex-1 p-4 max-w-md mx-auto w-full pb-24">
                        <h3 className="text-gray-600 font-semibold mb-4 flex items-center gap-2 text-sm uppercase tracking-wider mt-4">
                             เลือกบุคคลต้นแบบ
                        </h3>
                        <div className="grid grid-cols-1 gap-3">
                            {voteableCandidates.map((name, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setSelectedCandidate(name)}
                                    className={`p-4 rounded-xl border transition-all duration-200 relative overflow-hidden group text-left ${
                                        selectedCandidate === name 
                                            ? 'border-blue-500 bg-blue-50 shadow-md ring-1 ring-blue-500' 
                                            : 'border-white bg-white shadow-sm hover:border-blue-200'
                                    }`}
                                >
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center ${selectedCandidate === name ? 'bg-blue-200 text-blue-700' : 'bg-gray-100 text-gray-400'}`}>
                                                <User className="w-5 h-5" />
                                            </div>
                                            <span className={`font-medium ${selectedCandidate === name ? 'text-blue-900' : 'text-gray-700'}`}>
                                                {name}
                                            </span>
                                        </div>
                                        {selectedCandidate === name && <CheckCircle className="w-6 h-6 text-blue-600 animate-in" />}
                                    </div>
                                </button>
                            ))}
                        </div>
                    </main>
                    {selectedCandidate && (
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.1)] z-30 animate-in">
                            <div className="max-w-md mx-auto">
                                <p className="text-center text-gray-600 mb-3 text-sm">
                                    คุณต้องการโหวตให้ <strong className="text-blue-700 text-lg block mt-1">{selectedCandidate}</strong>
                                </p>
                                <button
                                    onClick={handleConfirmVote}
                                    disabled={isSubmitting}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 active:scale-95 transition disabled:opacity-50 flex items-center justify-center gap-2"
                                >
                                    {isSubmitting ? (
                                        <span className="flex items-center gap-2"><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> กำลังบันทึก...</span>
                                    ) : (
                                        <>ยืนยันการโหวต <Heart className="w-4 h-4 fill-current text-blue-300" /></>
                                    )}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ThankYouPage = () => (
            <div className="flex flex-col items-center justify-center min-h-screen bg-blue-50 p-6 text-center">
                <div className="bg-white p-10 rounded-3xl shadow-xl max-w-sm w-full relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-pink-400"></div>
                    <div className="w-24 h-24 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <Heart className="w-12 h-12 text-pink-500 fill-current heart-beat" />
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">บันทึกคะแนนเรียบร้อย!</h2>
                    <p className="text-gray-500 mb-8 leading-relaxed">
                        ขอบคุณที่เป็นส่วนหนึ่งในการส่งต่อ<br/>กำลังใจให้เพื่อนร่วมงานครับ
                    </p>
                    <div className="bg-blue-50 p-4 rounded-xl text-sm text-blue-800 border border-blue-100">
                        อย่าลืมรอลุ้นรางวัลสุ่ม 10 รางวัลนะ!
                    </div>
                    <button onClick={() => window.location.reload()} className="mt-8 text-gray-400 text-sm hover:text-blue-600 underline">
                        กลับหน้าหลัก
                    </button>
                </div>
            </div>
        );

        const AdminLogin = ({ onLogin, onCancel }) => {
            const [pass, setPass] = useState('');
            return (
                <div className="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-50 backdrop-blur-sm animate-in">
                    <div className="bg-white p-6 rounded-2xl w-80 shadow-2xl">
                        <h3 className="text-lg font-bold mb-4 text-gray-800">ผู้ดูแลระบบ</h3>
                        <form onSubmit={(e) => { e.preventDefault(); onLogin(pass); }}>
                            <input
                                type="password"
                                className="w-full border border-gray-300 p-3 rounded-lg mb-4 outline-none focus:border-blue-500"
                                placeholder="รหัสผ่าน"
                                value={pass}
                                onChange={(e) => setPass(e.target.value)}
                                autoFocus
                            />
                            <div className="flex justify-end gap-2">
                                <button type="button" onClick={onCancel} className="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">ยกเลิก</button>
                                <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">เข้าสู่ระบบ</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ResultsPage = ({ votes }) => {
            const [topCandidates, setTopCandidates] = useState([]);
            const [visibleCount, setVisibleCount] = useState(0);

            useEffect(() => {
                const counts = {};
                votes.forEach(v => { counts[v.votedFor] = (counts[v.votedFor] || 0) + 1; });
                const sorted = Object.entries(counts)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 10);
                setTopCandidates(sorted.reverse());
            }, [votes]);

            useEffect(() => {
                if (topCandidates.length > 0 && visibleCount < topCandidates.length) {
                    const timer = setTimeout(() => { setVisibleCount(prev => prev + 1); }, 1500);
                    return () => clearTimeout(timer);
                }
            }, [topCandidates, visibleCount]);

            return (
                <div className="min-h-screen bg-slate-900 text-white p-6 flex flex-col items-center">
                    <h1 className="text-3xl font-bold text-blue-400 mb-8 mt-4 flex items-center gap-3">
                        <Award className="w-8 h-8" /> ผลโหวต 2025
                    </h1>
                    <div className="w-full max-w-2xl space-y-4">
                        {topCandidates.map((candidate, index) => {
                            const rank = topCandidates.length - index;
                            const isVisible = index < visibleCount;
                            const isWinner = rank === 1;
                            if (!isVisible) return null;
                            return (
                                <div key={candidate.name} className={`flex items-center p-4 rounded-xl transition-all duration-700 transform ${
                                    isWinner ? 'bg-gradient-to-r from-yellow-500 to-amber-300 text-black scale-110 shadow-yellow-500/30 shadow-2xl my-8' : 'bg-slate-800 border border-slate-700'
                                } animate-in`}>
                                    <div className={`flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center font-black text-xl mr-4 ${isWinner ? 'bg-white text-yellow-600' : 'bg-slate-700 text-slate-300'}`}>
                                        {rank}
                                    </div>
                                    <div className="flex-1">
                                        <h3 className={`font-bold ${isWinner ? 'text-2xl' : 'text-lg'}`}>{candidate.name}</h3>
                                    </div>
                                    <div className="font-mono font-bold opacity-80 flex items-center gap-1">
                                        {candidate.count} <Heart className={`w-4 h-4 ${isWinner ? 'text-red-600 fill-current' : 'text-slate-500'}`} />
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. Main App Logic
        // ==========================================

        function App() {
            const [view, setView] = useState('landing');
            const [currentUser, setCurrentUser] = useState(null);
            const [votes, setVotes] = useState([]);
            const [candidatesList, setCandidatesList] = useState([]);
            const [loadingNames, setLoadingNames] = useState(true);
            const [isLiffReady, setIsLiffReady] = useState(false);
            const [lineProfile, setLineProfile] = useState(null);
            const [liffError, setLiffError] = useState(null);

            useEffect(() => {
                const fetchCandidates = async () => {
                    if (!GOOGLE_SCRIPT_URL) {
                        setLoadingNames(false); return;
                    }
                    try {
                        const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getNames");
                        const json = await res.json();
                        if (json.status === 'success' && Array.isArray(json.data)) {
                            setCandidatesList(json.data);
                        }
                    } catch (e) {
                        console.error("Fetch error:", e);
                        setCandidatesList(["ไม่สามารถเชื่อมต่อฐานข้อมูลรายชื่อ"]); 
                    } finally {
                        setLoadingNames(false);
                    }
                };
                fetchCandidates();
            }, []);

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: LIFF_ID });
                        setIsLiffReady(true);
                        
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            setLineProfile(profile);
                        }
                    } catch (err) {
                        console.error("LIFF Init Failed", err);
                        setLiffError(err.toString());
                        setIsLiffReady(true); 
                    }
                };
                initLiff();
            }, []);

            const checkVotingTime = () => true; 

            const handleStart = () => {
                if (!checkVotingTime()) {
                    alert("ขณะนี้อยู่นอกเวลาทำการโหวต");
                    return;
                }

                if (liffError) {
                    alert("เกิดข้อผิดพลาดในการโหลด LINE กรุณาลองใหม่");
                }

                if (!liff.isLoggedIn() && !liffError) {
                    liff.login(); 
                    return;
                }
                
                setView('identify');
            };

            const handleConfirmIdentity = async (name) => {
                if (!candidatesList.includes(name)) {
                    alert("ไม่พบรายชื่อในระบบ Voter");
                    return;
                }
                setCurrentUser(name);
                setView('voting');
            };

            const handleVote = async (candidate) => {
                if (!currentUser) return;
                
                try {
                    const payload = {
                        action: 'vote',
                        voter: currentUser,
                        votedFor: candidate,
                        lineUserId: lineProfile ? lineProfile.userId : 'BrowserUser'
                    };

                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();

                    if (result.status === 'success') {
                        setView('done');
                    } else {
                        alert(result.message || "เกิดข้อผิดพลาดในการบันทึก");
                    }
                } catch (error) {
                    console.error("Voting Error:", error);
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ (กรุณาเช็คอินเทอร์เน็ต)");
                }
            };

            const handleAdminLogin = (password) => {
                if (password === "38311") {
                    fetchVotesAndShowResults();
                } else {
                    alert("รหัสผ่านไม่ถูกต้อง");
                }
            };

            const fetchVotesAndShowResults = async () => {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getResults&password=38311");
                    const json = await res.json();
                    
                    if (json.status === 'success') {
                        setVotes(json.data);
                        setView('results');
                    } else {
                        alert("Error: " + json.message);
                    }
                } catch (e) {
                    console.error(e);
                    alert("ไม่สามารถดึงข้อมูลผลลัพธ์ได้");
                }
            };

            if (view === 'results') return <ResultsPage votes={votes} />;

            return (
                <div>
                    {view === 'landing' && <LandingPage onStart={handleStart} onAdminClick={() => setView('admin_login')} isLiffReady={isLiffReady} liffError={liffError} />}
                    {view === 'admin_login' && <AdminLogin onLogin={handleAdminLogin} onCancel={() => setView('landing')} />}
                    {view === 'identify' && <IdentifyPage names={candidatesList} loading={loadingNames} onConfirm={handleConfirmIdentity} />}
                    {view === 'voting' && <VotingPage currentUser={currentUser} candidates={candidatesList} onVote={handleVote} />}
                    {view === 'done' && <ThankYouPage />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
