<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โหวตบุคคลต้นแบบ 2025 - รพ.สวี</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        .heart-beat { animation: heartbeat 1.5s infinite; }
        .float-animation { animation: float 3s ease-in-out infinite; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartbeat {
            0% { transform: scale(1); } 14% { transform: scale(1.1); } 28% { transform: scale(1); }
            42% { transform: scale(1.1); } 70% { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); }
        }

        .bg-pattern-heart {
            background-color: #fff5f7;
            background-image: url("data:image/svg+xml,%3Csvg width='52' height='26' viewBox='0 0 52 26' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffccd5' fill-opacity='0.4'%3E%3Cpath d='M10 10c0-2.21-1.79-4-4-4-3.314 0-6 2.686-6 6 0 2.21 1.79 4 4 4 3.314 0 6-2.686 6-6zm-4-2c-1.105 0-2 .895-2 2s.895 2 2 2 2-.895 2-2-.895-2-2-2zm30 0c0-2.21-1.79-4-4-4-3.314 0-6 2.686-6 6 0 2.21 1.79 4 4 4 3.314 0 6-2.686 6-6zm-4-2c-1.105 0-2 .895-2 2s.895 2 2 2 2-.895 2-2-.895-2-2-2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .marquee-wrapper { display: flex; overflow: hidden; width: 100%; mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); padding: 1rem 0; }
        .marquee-content { display: flex; gap: 1.5rem; animation: scroll 40s linear infinite; padding-left: 1.5rem; }
        .marquee-wrapper:hover .marquee-content { animation-play-state: paused; }
        .marquee-content.reverse { animation: scroll-reverse 40s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        @keyframes scroll-reverse { 0% { transform: translateX(-100%); } 100% { transform: translateX(0); } }
        .suggestion-list::-webkit-scrollbar { width: 4px; }
        .suggestion-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-pattern-heart min-h-screen text-gray-700">
    <div id="root"></div>

    <script type="text/babel">
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAlIL1gekP4kNJmvcpq5wWfMSzQBSG805exfEL6ccZ_vID6A7nfR4Eeyfv-GLOAjRu/exec"; 
        const LIFF_ID = "2008690634-qeZq6pVP";
        // 5 กุมภาพันธ์ 2026 16:00 น.
        const DEADLINE = new Date("2026-02-05T16:00:00+07:00").getTime();

        const { useState, useEffect, useMemo } = React;
        const colors = ["bg-red-200 text-red-700", "bg-orange-200 text-orange-700", "bg-amber-200 text-amber-700", "bg-yellow-200 text-yellow-700", "bg-lime-200 text-lime-700", "bg-green-200 text-green-700", "bg-emerald-200 text-emerald-700", "bg-teal-200 text-teal-700", "bg-cyan-200 text-cyan-700", "bg-sky-200 text-sky-700", "bg-blue-200 text-blue-700", "bg-indigo-200 text-indigo-700", "bg-violet-200 text-violet-700", "bg-purple-200 text-purple-700", "bg-fuchsia-200 text-fuchsia-700", "bg-pink-200 text-pink-700", "bg-rose-200 text-rose-700"];

        // UI Components
        const Heart = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
        const Search = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const Lock = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const User = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const Clock = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

        const Countdown = () => {
            const [timeLeft, setTimeLeft] = useState("");
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = DEADLINE - now;
                    if (distance < 0) { clearInterval(interval); setTimeLeft("หมดเวลาโหวตแล้ว"); return; }
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    setTimeLeft(`เหลือเวลา ${days} วัน ${hours} ชม. ${minutes} นาที`);
                }, 1000);
                return () => clearInterval(interval);
            }, []);
            return <div className="bg-pink-100 text-pink-600 text-sm py-2 px-4 rounded-full inline-flex items-center gap-2 mb-4 animate-in shadow-sm border border-pink-200"><Clock className="w-4 h-4" /> <span className="font-semibold">{timeLeft}</span></div>;
        };

        const LandingPage = ({ onStart, onAdminClick, liffError, userProfile, hasVoted }) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center relative overflow-hidden">
                    <div className="w-full max-w-md bg-white/80 backdrop-blur rounded-3xl shadow-xl overflow-hidden border border-pink-100 z-10 p-8 space-y-4">
                        <Heart className="w-20 h-20 mx-auto text-pink-400 drop-shadow-md heart-beat" />
                        <h1 className="text-2xl font-bold tracking-wide text-gray-800">โหวตบุคคลดีเด่นแห่งปี</h1>
                        <p className="text-sm text-gray-500">รพ.สวี (Sawi Hospital)</p>
                        <Countdown />
                        <div className="text-pink-600 font-medium italic">"เพราะรอยยิ้มและกำลังใจ...เริ่มต้นที่พวกเราเอง" 🏥✨</div>
                        
                        <div className="text-sm text-gray-600 space-y-2 py-2">
                            <p>ภายใต้หน้ากากอนามัย และชุดฟอร์มที่เหนื่อยล้า...<br/>ใครคือคนที่ทำให้คุณรู้สึก <span className="font-bold text-pink-500">มีพลัง?</span></p>
                            <p>ใครคือคนที่หยิบยื่นน้ำใจให้เพื่อนร่วมงานและคนไข้เสมอมา?</p>
                        </div>

                        <div className="bg-white/50 p-4 rounded-xl border border-pink-100 text-xs text-left space-y-1 text-gray-500">
                            <p className="font-bold text-pink-500 mb-2">📌 เงื่อนไข:</p>
                            <ul className="list-disc pl-4 space-y-1">
                                <li>1 คน Log In ผ่าน Line โหวตได้ 1 คน (ห้ามโหวตตัวเอง)</li>
                                <li>ที่ 1 รางวัลได้รับรางวัลขวัญใจมหาชน</li>
                                <li>1 ใน 5 อันดับแรกได้จะได้รับคัดเลือกเป็นบุคคลต้นแบบ รพ.สวี</li>
                                <li>ลุ้นรางวัลสุ่มให้ voter 10 รางวัล</li>
                                <li>โหวตได้: 08.00-16.00 น. วันที่ 5 ก.พ. 2569</li>
                                <li>ข้อมูลการโหวตเป็นความลับตาม PDPA</li>
                            </ul>
                        </div>

                        {liffError && <div className="text-xs text-red-500 bg-red-50 p-2 rounded">{liffError}</div>}

                        <button 
                            onClick={onStart} 
                            className={`w-full font-bold py-4 px-6 rounded-full shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 text-lg mt-4 
                                ${hasVoted ? 'bg-gray-500 hover:bg-gray-600 text-white' : 'bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white shadow-pink-200'}`}
                        >
                            {hasVoted ? (
                                <><span>ดูรายชื่อ (โหวตแล้ว)</span> <Search className="w-5 h-5" /></>
                            ) : (
                                <><span>เริ่มโหวต</span> <Heart className="w-5 h-5 fill-current" /></>
                            )}
                        </button>
                        
                        <p className="text-xs text-gray-400 mt-2">บุคคลต้นแบบ สร้างแรงบันดาลใจแห่งปี 2025</p>
                    </div>
                    <div onClick={onAdminClick} className="fixed bottom-0 left-0 w-16 h-16 z-50 cursor-pointer opacity-0 hover:opacity-100 flex items-center justify-center">
                        <Lock className="w-4 h-4 text-gray-400" />
                    </div>
                </div>
            );
        };

        const IdentifyPage = ({ candidates, onConfirm, loading }) => {
            const [inputName, setInputName] = useState('');
            const [nickname, setNickname] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [showError, setShowError] = useState(false);

            const names = useMemo(() => {
                if (!Array.isArray(candidates)) return [];
                return candidates.map(c => c.name).filter(name => typeof name === 'string' && name.trim().length > 0);
            }, [candidates]);

            const handleInputChange = (e) => {
                const value = e.target.value;
                setInputName(value);
                setShowError(false);
                if (value.length > 0 && names.length > 0) setSuggestions(names.filter(n => n && n.includes(value)));
                else setSuggestions([]);
            };

            const handleManualSearch = () => { if (!names.includes(inputName)) setShowError(true); };
            const isValidName = names.includes(inputName);

            return (
                <div className="flex flex-col items-center min-h-screen p-6 pt-20">
                    <div className="w-full max-w-md bg-white/90 backdrop-blur rounded-2xl shadow-xl p-8 pb-12 border border-pink-100">
                        <div className="text-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">ยืนยันตัวตน</h2>
                            <p className="text-sm text-pink-600 font-medium mt-2 bg-pink-50 p-2 rounded-lg">
                                กรอกชื่อจริงของ <span className="underline">ผู้โหวต (ตัวคุณเอง)</span><br/>
                                ส่วนชื่อคนที่จะโหวต เลือกหน้าถัดไปครับ
                            </p>
                        </div>
                        {loading ? <div className="text-center text-pink-400 animate-pulse">กำลังโหลดรายชื่อ...</div> : (
                            <div className="space-y-4">
                                <div className="relative">
                                    <label className="text-xs text-gray-500 ml-1">ชื่อ-นามสกุล (จริง)</label>
                                    <div className="relative">
                                        <input type="text" className={`block w-full pl-4 pr-12 py-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-pink-400 text-lg outline-none ${isValidName ? 'border-green-500 bg-green-50' : 'border-gray-200'}`} placeholder="พิมพ์ชื่อจริงของคุณ..." value={inputName} onChange={handleInputChange} onKeyDown={(e) => e.key === 'Enter' && handleManualSearch()} />
                                        <button onClick={handleManualSearch} className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-pink-100 text-pink-600 rounded-lg"><Search className="w-5 h-5" /></button>
                                    </div>
                                    {suggestions.length > 0 && (
                                        <ul className="suggestion-list absolute z-20 w-full bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto mt-2 top-full">
                                            {suggestions.map((name, index) => (
                                                <li key={index} onClick={() => { setInputName(name); setSuggestions([]); setShowError(false); }} className="px-5 py-3 hover:bg-pink-50 cursor-pointer border-b border-gray-100 last:border-0 text-gray-700 text-left">{name}</li>
                                            ))}
                                        </ul>
                                    )}
                                </div>

                                <div>
                                    <label className="text-xs text-gray-500 ml-1">ชื่อเล่น (สำหรับค้นหาปีหน้า)</label>
                                    <input type="text" className="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-400 text-lg outline-none" placeholder="ขอทราบชื่อเล่นหน่อยนะ :)" value={nickname} onChange={(e) => setNickname(e.target.value)} />
                                </div>

                                {showError && !isValidName && <div className="p-3 bg-red-50 text-red-600 text-sm rounded-lg text-center border border-red-200 animate-in">⚠️ ไม่พบรายชื่อนี้ในระบบ</div>}
                            </div>
                        )}
                        <button onClick={() => onConfirm(inputName, nickname)} disabled={!isValidName || !nickname} className={`w-full font-bold py-4 px-6 rounded-xl transition shadow-lg mt-6 ${isValidName && nickname ? 'bg-pink-500 hover:bg-pink-600 text-white shadow-pink-200' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>ยืนยันตัวตน</button>
                    </div>
                </div>
            );
        };

        const VotingPage = ({ currentUser, candidates, onVote, hasVoted }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [shuffledCandidates, setShuffledCandidates] = useState([]);

            useEffect(() => {
                if (candidates.length > 0) {
                    const shuffled = [...candidates].sort(() => 0.5 - Math.random());
                    setShuffledCandidates(shuffled);
                }
            }, [candidates]);

            const filteredCandidates = useMemo(() => {
                let list = shuffledCandidates.filter(c => c.name !== currentUser);
                if (searchTerm) {
                    const lower = searchTerm.toLowerCase();
                    list = list.filter(c => (c.name && c.name.toLowerCase().includes(lower)) || (c.job && c.job.toLowerCase().includes(lower)) || (c.dept && c.dept.toLowerCase().includes(lower)));
                }
                return list;
            }, [shuffledCandidates, currentUser, searchTerm]);

            const candidateColors = useMemo(() => {
                const map = {};
                candidates.forEach(c => map[c.name] = colors[Math.floor(Math.random() * colors.length)]);
                return map;
            }, [candidates]);

            const chunkedCandidates = useMemo(() => {
                const chunkSize = 10;
                const chunks = [];
                for (let i = 0; i < filteredCandidates.length; i += chunkSize) {
                    chunks.push(filteredCandidates.slice(i, i + chunkSize));
                }
                return chunks;
            }, [filteredCandidates]);

            const handleVote = async () => {
                if (!selectedCandidate) return;
                setIsSubmitting(true);
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                await onVote(selectedCandidate.name);
                setIsSubmitting(false);
            };

            const renderAvatar = (c) => {
                if (c.photo && c.photo.trim() !== "") {
                    return <img src={c.photo} alt={c.name} className="w-20 h-20 rounded-full object-cover border-4 border-white shadow-lg transition-transform group-hover:scale-110" />;
                }
                return (
                    <div className={`w-20 h-20 rounded-full flex items-center justify-center mb-2 shadow-lg transition-transform group-hover:scale-110 border-4 border-white ${candidateColors[c.name]}`}>
                        <User className="w-10 h-10" />
                    </div>
                );
            };

            const renderListAvatar = (c) => {
                if (c.photo && c.photo.trim() !== "") {
                    return <img src={c.photo} alt={c.name} className="w-14 h-14 rounded-full object-cover shadow-inner" />;
                }
                return (
                    <div className={`w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl shadow-inner ${candidateColors[c.name]}`}>
                        {c.name.charAt(0)}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white/90 backdrop-blur-md p-4 sticky top-0 z-30 border-b border-pink-100 shadow-sm">
                        <div className="max-w-md mx-auto">
                            <div className="flex justify-between items-center mb-4">
                                <div>
                                    <p className="text-xs text-gray-400">ผู้โหวต</p>
                                    <p className="font-bold text-gray-800 truncate max-w-[150px]">{currentUser || (hasVoted ? "ผู้เยี่ยมชม (โหวตแล้ว)" : "Guest")}</p>
                                </div>
                                <div className="text-right"><div className={`px-3 py-1 rounded-full text-xs font-bold ${hasVoted ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700'}`}>{hasVoted ? 'ใช้สิทธิ์แล้ว' : '1 สิทธิ์'}</div></div>
                            </div>
                            <div className="relative">
                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" />
                                <input type="text" placeholder="ค้นหาชื่อ, ตำแหน่ง, แผนก..." className="w-full bg-gray-50 border border-gray-100 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-pink-400 transition-all outline-none" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full pb-32 overflow-hidden pt-6">
                        {searchTerm ? (
                            <div className="max-w-md mx-auto px-4 space-y-4">
                                {filteredCandidates.map((c, index) => (
                                    <div key={index} onClick={() => setSelectedCandidate(c)} className="flex items-center gap-4 cursor-pointer bg-white p-3 rounded-xl shadow-sm border border-pink-50 hover:border-pink-300 transition-all">
                                        {renderListAvatar(c)}
                                        <div className="text-left"><h3 className="font-bold text-gray-800">{c.name}</h3><p className="text-xs text-gray-500">{c.job}</p></div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="space-y-8">
                                {chunkedCandidates.map((chunk, rowIndex) => (
                                    <div key={rowIndex} className="marquee-wrapper">
                                        {[0, 1].map((dup) => (
                                            <div key={dup} className={`marquee-content ${rowIndex % 2 !== 0 ? 'reverse' : ''}`}>
                                                {chunk.map((c, idx) => (
                                                    <div key={c.name + idx} onClick={() => setSelectedCandidate(c)} className="flex flex-col items-center justify-start w-32 cursor-pointer group flex-shrink-0">
                                                        {renderAvatar(c)}
                                                        <div className="text-center px-1"><h3 className="font-bold text-sm text-gray-800 line-clamp-2 leading-tight group-hover:text-pink-600">{c.name}</h3><p className="text-[10px] text-gray-500 mt-1 line-clamp-1">{c.job}</p></div>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {selectedCandidate && (
                        <div className="fixed bottom-0 left-0 right-0 p-6 bg-white/95 backdrop-blur shadow-[0_-5px_30px_rgba(0,0,0,0.1)] z-40 animate-in border-t border-pink-100 rounded-t-3xl">
                            <div className="max-w-md mx-auto text-center">
                                <p className="text-gray-500 text-sm mb-2">ยืนยันการเลือก</p>
                                <h3 className="text-xl font-bold text-pink-600 mb-4">{selectedCandidate.name}</h3>
                                {hasVoted ? (
                                    <button disabled className="w-full bg-gray-400 text-white font-bold py-4 rounded-xl shadow-lg cursor-not-allowed flex items-center justify-center gap-2">
                                        คุณได้โหวตไปแล้ว ไม่สามารถแก้ไขได้ <Lock className="w-5 h-5" />
                                    </button>
                                ) : (
                                    <button onClick={handleVote} disabled={isSubmitting} className="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-pink-200 active:scale-95 transition disabled:opacity-50 flex items-center justify-center gap-2">
                                        {isSubmitting ? 'กำลังบันทึก...' : 'โหวตคนนี้แหละ!'} <Heart className="w-5 h-5 fill-current" />
                                    </button>
                                )}
                                <button onClick={() => setSelectedCandidate(null)} className="mt-4 text-gray-400 text-sm hover:text-gray-600">ปิด</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ThankYouPage = () => (
            <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center relative overflow-hidden">
                <div className="w-full max-w-md bg-white/90 backdrop-blur p-10 rounded-3xl shadow-xl border border-pink-100 z-10">
                    <div className="w-24 h-24 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <Heart className="w-12 h-12 text-pink-500 fill-current heart-beat" />
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">บันทึกคะแนนเรียบร้อย!</h2>
                    <p className="text-gray-500 mb-6">ขอบคุณที่เป็นพลังใจให้เพื่อนร่วมงานครับ</p>
                    <button onClick={() => window.location.reload()} className="text-pink-500 text-sm underline hover:text-pink-700">กลับหน้าหลัก</button>
                </div>
            </div>
        );

        const AdminLogin = ({ onLogin, onCancel }) => {
            const [pass, setPass] = useState('');
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                    <div className="bg-white p-6 rounded-2xl w-80">
                        <h3 className="font-bold mb-4">ผู้ดูแลระบบ</h3>
                        <input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full border p-2 rounded mb-4" placeholder="รหัสผ่าน" />
                        <div className="flex justify-end gap-2"><button onClick={onCancel}>ยกเลิก</button><button onClick={()=>onLogin(pass)} className="bg-blue-600 text-white px-4 py-2 rounded">เข้าสู่ระบบ</button></div>
                    </div>
                </div>
            );
        };

        const ResultsPage = ({ votes }) => {
            const [top, setTop] = useState([]);
            useEffect(() => {
                const c = {}; votes.forEach(v => c[v.votedFor] = (c[v.votedFor]||0)+1);
                setTop(Object.entries(c).map(([n,v])=>({name:n,count:v})).sort((a,b)=>b.count-a.count).slice(0,10));
            }, [votes]);
            return (
                <div className="min-h-screen bg-slate-900 text-white p-6">
                    <h1 className="text-2xl font-bold text-yellow-400 mb-6 text-center">🏆 10 อันดับสูงสุด</h1>
                    <div className="max-w-md mx-auto space-y-3">
                        {top.map((t,i) => (
                            <div key={i} className="flex justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <div className="flex gap-3"><span className="font-bold text-slate-500">#{i+1}</span> <span>{t.name}</span></div>
                                <span className="font-bold text-yellow-500">{t.count} ❤️</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('landing');
            const [currentUser, setCurrentUser] = useState(null);
            const [currentNickname, setCurrentNickname] = useState(null);
            const [candidates, setCandidates] = useState([]);
            const [loading, setLoading] = useState(true);
            const [votes, setVotes] = useState([]);
            const [userProfile, setUserProfile] = useState(null);
            const [liffError, setLiffError] = useState(null);
            const [hasVoted, setHasVoted] = useState(false);

            useEffect(() => {
                fetch(GOOGLE_SCRIPT_URL + "?action=getData")
                    .then(res => res.json())
                    .then(json => {
                        if (json.status === 'success') setCandidates(json.data);
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));
            }, []);

            // LIFF Initialization
            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: LIFF_ID });
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            setUserProfile(profile);
                            
                            // Check if this user has already voted
                            checkVoteStatus(profile.userId);
                        } else {
                            liff.login();
                        }
                    } catch (err) {
                        console.error('LIFF Init Error:', err);
                        setLiffError('LIFF Init Failed: ' + err.toString());
                    }
                };
                initLiff();
            }, []);

            const checkVoteStatus = async (userId) => {
                try {
                    const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=checkUser&userid=${userId}`);
                    const json = await res.json();
                    if (json.status === 'success' && json.voted) {
                        setHasVoted(true);
                        if (json.name) setCurrentUser(json.name);
                        if (json.nickname) setCurrentNickname(json.nickname);
                    }
                } catch (e) {
                    console.error("Check status error", e);
                }
            };

            const handleStart = () => {
                const now = new Date().getTime();
                if (now > DEADLINE) return alert("หมดเวลาโหวตแล้วครับ");
                
                if (!userProfile && !liffError) {
                    // Force login if not logged in
                    liff.login();
                    return;
                }
                
                if (hasVoted) {
                    setView('voting');
                } else {
                    setView('identify');
                }
            };

            const handleVote = async (votedForName) => {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'vote',
                            voter: currentUser,
                            nickname: currentNickname,
                            votedFor: votedForName,
                            userid: userProfile?.userId || 'unknown',
                            displayname: userProfile?.displayName || 'unknown',
                            photo: userProfile?.pictureUrl || ''
                        })
                    });
                    const json = await res.json();
                    if (json.status === 'success') setView('done');
                    else alert(json.message);
                } catch(e) { alert("Error saving vote"); }
            };

            const fetchResults = async () => {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getResults&password=38311");
                const json = await res.json();
                if (json.status === 'success') { setVotes(json.data); setView('results'); }
            };

            if (view === 'results') return <ResultsPage votes={votes} />;

            return (
                <div>
                    {view === 'landing' && <LandingPage onStart={handleStart} onAdminClick={() => setView('admin_login')} liffError={liffError} userProfile={userProfile} hasVoted={hasVoted} />}
                    {view === 'identify' && <IdentifyPage candidates={candidates} loading={loading} onConfirm={(name, nick) => { setCurrentUser(name); setCurrentNickname(nick); setView('voting'); }} />}
                    {view === 'voting' && <VotingPage currentUser={currentUser} candidates={candidates} onVote={handleVote} hasVoted={hasVoted} />}
                    {view === 'done' && <ThankYouPage />}
                    {view === 'admin_login' && <AdminLogin onLogin={(p) => p==='38311' ? fetchResults() : alert('ผิด')} onCancel={() => setView('landing')} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
