<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โหวตบุคคลดีเด่น รพ.สวี</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Theme: Sawi Hospital Warm & Professional */
        body { font-family: 'Sarabun', sans-serif; background: #f0fdf4; color: #1e293b; overflow-x: hidden; }
        
        /* Modern Glass Effect for Light Theme */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        
        .header-bg {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
        }

        .input-glass { 
            background: rgba(255, 255, 255, 0.9); 
            border: 1px solid #e2e8f0; 
            color: #334155; 
        }
        .input-glass:focus { 
            border-color: #10b981; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); 
        }

        .btn-primary { 
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; overflow: hidden;
            color: white;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 16px -4px rgba(5, 150, 105, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(1); }

        .candidate-card { transition: all 0.3s ease; background: white; border: 1px solid #e2e8f0; }
        .candidate-card:hover:not(.disabled) { transform: translateY(-4px); border-color: #10b981; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .candidate-card.selected { border-color: #10b981; background: #ecfdf5; box-shadow: 0 0 0 2px #10b981; }
        .candidate-card.disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        .quote-text { font-family: 'Kanit', sans-serif; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        .floating { animation: float 5s ease-in-out infinite; }

        .loader { border: 3px solid rgba(16, 185, 129, 0.2); border-left-color: #059669; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const LIFF_ID = "YOUR_LIFF_ID_HERE"; 
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQRd_pMI2YCDkCZEJgj0GYkLSSgjK-DWDGleIksljsf13SIToe6MkgpzKnL9lk7TkkWQ/exec';

        // Mock Data: รายชื่อพนักงาน (ผู้มีสิทธิ์โหวต)
        const STAFF_LIST = [
            { id: 'S001', name: 'นายสมชาย ใจดี', job: 'พยาบาลวิชาชีพ', dept: 'IPD' },
            { id: 'S002', name: 'นางสาววิไล รักงาน', job: 'เภสัชกร', dept: 'Pharmacy' },
            { id: 'S003', name: 'นายแพทย์เก่ง รักษา', job: 'แพทย์', dept: 'Medical' },
            { id: 'S004', name: 'นางสาวสวย ใส', job: 'ธุรการ', dept: 'Admin' },
            { id: 'S005', name: 'Dr. Strange', job: 'แพทย์', dept: 'ER' }, // Mock เพื่อทดสอบการห้ามโหวตตัวเอง
        ];

        // Mock Data: ผู้ถูกเสนอชื่อ (Candidates) - ในความเป็นจริงอาจจะมาจาก STAFF_LIST เช่นกัน
        const CANDIDATES = [
            { id: 'C01', name: 'Dr. Strange', img: 'https://cdn.marvel.com/content/1x/drstrange_lob_crd_01.jpg', quote: 'ความเสียสละที่เงียบงัน' },
            { id: 'C02', name: 'Tony Stark', img: 'https://cdn.marvel.com/content/1x/ironman_lob_crd_01_3.jpg', quote: 'ผู้นำแห่งการเปลี่ยนแปลง' },
            { id: 'C03', name: 'Thor Odinson', img: 'https://cdn.marvel.com/content/1x/thor_lob_crd_01.jpg', quote: 'พลังใจของทีมงาน' },
            { id: 'C04', name: 'Steve Rogers', img: 'https://cdn.marvel.com/content/1x/captainamerica_lob_crd_01.jpg', quote: 'ความดีที่ยั่งยืน' },
            { id: 'C05', name: 'Natasha', img: 'https://cdn.marvel.com/content/1x/blackwidow_lob_crd_01.jpg', quote: 'ปิดทองหลังพระ' },
        ];

        const App = () => {
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [page, setPage] = useState('login'); 
            const [hasVoted, setHasVoted] = useState(false);
            const [voterInfo, setVoterInfo] = useState({ id: '', name: '', job: '', dept: '', nickname: '' });
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [submitting, setSubmitting] = useState(false);

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        // Mock Login
                        setTimeout(() => setLoading(false), 1500);
                    } catch (e) {
                        console.error("LIFF Init Failed", e);
                        setLoading(false);
                    }
                };
                if(window.lucide) window.lucide.createIcons();
                initLiff();
            }, []);

            const checkVoteStatus = async (userId) => {
                console.log("Checking vote for", userId);
                // setHasVoted(true); // Uncomment to simulate voted status
            };

            const handleLogin = async () => {
                const mockProfile = { 
                    userId: 'U1234567890abcdef', 
                    displayName: 'Somchai Line', 
                    pictureUrl: 'https://cdn-icons-png.flaticon.com/512/149/149071.png' 
                };
                setProfile(mockProfile);
                await checkVoteStatus(mockProfile.userId);
                setPage('register');
            };

            const handleRegister = () => {
                if (!voterInfo.id || !voterInfo.nickname) {
                    alert("กรุณาเลือกชื่อจริงและระบุชื่อเล่น");
                    return;
                }
                setPage('voting');
            };

            const handleSubmitVote = async () => {
                if (!selectedCandidate) return;
                
                // Double check self-voting
                if (selectedCandidate.name === voterInfo.name) {
                    alert("ไม่สามารถโหวตให้ตัวเองได้ครับ");
                    return;
                }

                setSubmitting(true);
                const payload = {
                    action: 'save_vote',
                    ...voterInfo,
                    vote: selectedCandidate.name,
                    userid: profile.userId,
                    displayname: profile.displayName,
                    photo: profile.pictureUrl,
                    timestamp: new Date().toISOString()
                };

                try {
                    // await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
                    console.log("Submitting Vote:", payload);
                    await new Promise(r => setTimeout(r, 1500)); 
                    setPage('success');
                } catch (e) {
                    alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
                } finally {
                    setSubmitting(false);
                }
            };

            const randomizedCandidates = useMemo(() => {
                return [...CANDIDATES].sort(() => Math.random() - 0.5);
            }, [page]); 

            // --- RENDER PAGES ---

            const renderLogin = () => (
                <div className="flex flex-col items-center justify-center min-h-[70vh] p-4">
                    <div className="max-w-md w-full glass-panel rounded-3xl p-8 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 to-teal-500"></div>
                        
                        <div className="floating mb-6 inline-block">
                            <img src="https://cdn-icons-png.flaticon.com/512/3063/3063822.png" className="w-24 h-24 drop-shadow-xl" alt="Hospital Icon" />
                        </div>
                        
                        <h1 className="text-2xl font-bold text-slate-800 mb-1 quote-text">โหวตบุคคลดีเด่นแห่งปี</h1>
                        <h2 className="text-xl font-semibold text-green-700 mb-4 quote-text">รพ.สวี (Sawi Hospital)</h2>
                        
                        <div className="bg-green-50 p-4 rounded-xl border border-green-100 mb-6 text-sm text-slate-600 italic leading-relaxed">
                            "ภายใต้หน้ากากอนามัย และชุดฟอร์มที่เหนื่อยล้า...<br/>
                            ใครคือคนที่ทำให้คุณรู้สึก <span className="font-bold text-green-600">มีพลัง?</span><br/>
                            ใครคือคนที่หยิบยื่นน้ำใจให้เพื่อนร่วมงานและคนไข้เสมอมา?"
                        </div>

                        <p className="text-slate-700 font-medium mb-6">
                            ขอเชิญชาว รพ.สวี ร่วมโหวต<br/>
                            <span className="text-lg font-bold text-slate-900 bg-amber-100 px-2 rounded">"บุคคลต้นแบบ สร้างแรงบันดาลใจแห่งปี 2025"</span>
                        </p>

                        {/* Rules Section */}
                        <div className="text-left text-xs text-slate-500 bg-slate-50 p-4 rounded-lg mb-6 border border-slate-200">
                            <strong className="block text-slate-700 mb-1">📌 เงื่อนไขและกติกา:</strong>
                            <ul className="list-disc pl-4 space-y-1">
                                <li>1 คน (Log In Line) โหวตได้ 1 ครั้ง</li>
                                <li className="text-red-500 font-bold">ห้ามโหวตให้ตัวเอง</li>
                                <li>อันดับ 1 รับรางวัล "ขวัญใจมหาชน"</li>
                                <li>Top 5 รับคัดเลือกเป็น "บุคคลต้นแบบ รพ.สวี"</li>
                                <li>ลุ้นรางวัลสุ่ม Voter 10 รางวัล!</li>
                                <li>โหวตได้: 08.00-16.00 น. วันที่ 5 ม.ค. 2569</li>
                            </ul>
                        </div>
                        
                        {loading ? (
                            <div className="flex justify-center"><div className="loader"></div></div>
                        ) : (
                            <div className="space-y-4">
                                {hasVoted ? (
                                    <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800">
                                        <div className="font-bold flex items-center justify-center gap-2"><i data-lucide="check-circle" className="w-5 h-5"></i> คุณใช้สิทธิ์โหวตไปแล้ว</div>
                                        <p className="text-sm mt-1">ขอบคุณที่ร่วมเป็นส่วนหนึ่งของการให้กำลังใจครับ</p>
                                    </div>
                                ) : (
                                    <button onClick={handleLogin} className="btn-primary w-full py-3.5 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2 group">
                                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" className="w-6 h-6" />
                                        ลงชื่อเข้าใช้เพื่อโหวต
                                    </button>
                                )}
                            </div>
                        )}
                        
                        <div className="mt-6 pt-4 border-t border-slate-100 text-[10px] text-slate-400">
                            <i data-lucide="shield-check" className="w-3 h-3 inline mr-1"></i>
                            ข้อมูลการโหวตเป็นความลับตาม พ.ร.บ. คุ้มครองข้อมูลส่วนบุคคล (PDPA)
                        </div>
                    </div>
                </div>
            );

            const renderRegister = () => {
                const filteredStaff = STAFF_LIST.filter(s => s.name.includes(searchTerm));

                return (
                    <div className="max-w-md mx-auto w-full pt-6">
                        <div className="text-center mb-6">
                            <img src={profile?.pictureUrl} className="w-20 h-20 rounded-full border-4 border-white shadow-lg mx-auto mb-3" />
                            <h2 className="text-xl font-bold text-slate-800">สวัสดี, {profile?.displayName}</h2>
                            <p className="text-slate-500 text-sm">ระบุตัวตนผู้โหวต (Voter)</p>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">1. ค้นหาชื่อจริงของคุณ</label>
                                <div className="relative">
                                    <i data-lucide="search" className="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="พิมพ์ชื่อเพื่อค้นหา..." 
                                        className="w-full pl-10 pr-4 py-3 rounded-xl input-glass"
                                        value={searchTerm}
                                        onChange={e => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                {searchTerm && !voterInfo.id && (
                                    <div className="mt-2 max-h-40 overflow-y-auto bg-white rounded-xl border border-slate-200 absolute w-full z-20 shadow-xl">
                                        {filteredStaff.length > 0 ? filteredStaff.map(s => (
                                            <div key={s.id} 
                                                onClick={() => {
                                                    setVoterInfo({ ...voterInfo, ...s });
                                                    setSearchTerm('');
                                                }}
                                                className="p-3 hover:bg-green-50 cursor-pointer border-b border-slate-100 text-sm flex justify-between items-center"
                                            >
                                                <div>
                                                    <div className="font-bold text-slate-700">{s.name}</div>
                                                    <div className="text-slate-400 text-xs">{s.job}</div>
                                                </div>
                                                <span className="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">{s.dept}</span>
                                            </div>
                                        )) : <div className="p-3 text-slate-400 text-center">ไม่พบรายชื่อ</div>}
                                    </div>
                                )}
                            </div>

                            {voterInfo.id && (
                                <div className="p-4 bg-green-50 border border-green-200 rounded-xl flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-green-200 rounded-full flex items-center justify-center text-green-700 font-bold text-lg">
                                            {voterInfo.name.charAt(0)}
                                        </div>
                                        <div>
                                            <div className="font-bold text-green-900">{voterInfo.name}</div>
                                            <div className="text-xs text-green-700">{voterInfo.job} | {voterInfo.dept}</div>
                                        </div>
                                    </div>
                                    <button onClick={() => setVoterInfo({ id: '', name: '', job: '', dept: '', nickname: '' })} className="text-xs text-red-500 hover:text-red-700 underline">เปลี่ยน</button>
                                </div>
                            )}

                            <div className={!voterInfo.id ? 'opacity-50 pointer-events-none' : ''}>
                                <label className="block text-sm font-bold text-slate-700 mb-2">2. ชื่อเล่น (Nickname) <span className="text-red-500">*</span></label>
                                <input 
                                    type="text" 
                                    placeholder="เช่น น้องเอ, หมอบี" 
                                    className="w-full px-4 py-3 rounded-xl input-glass"
                                    value={voterInfo.nickname}
                                    onChange={e => setVoterInfo({ ...voterInfo, nickname: e.target.value })}
                                />
                                <p className="text-xs text-slate-400 mt-1">ใช้สำหรับประกาศรางวัลผู้โชคดี (10 รางวัล)</p>
                            </div>

                            <button 
                                onClick={handleRegister} 
                                disabled={!voterInfo.id || !voterInfo.nickname}
                                className="btn-primary w-full py-3 rounded-xl font-bold mt-2 shadow-lg"
                            >
                                ถัดไป: เลือกคนดีในดวงใจ <i data-lucide="arrow-right" className="inline w-4 h-4 ml-1"></i>
                            </button>
                        </div>
                    </div>
                );
            };

            const renderVoting = () => (
                <div className="w-full max-w-5xl mx-auto pt-6 pb-24">
                    <div className="glass-panel p-4 rounded-2xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-20 z-10 border-b-4 border-green-500">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 quote-text">เลือก "บุคคลต้นแบบ" ของคุณ</h2>
                            <p className="text-slate-500 text-sm">1 สิทธิ์ 1 เสียง เพื่อกำลังใจแด่คนทำงาน</p>
                        </div>
                        <div className="text-right flex items-center gap-3 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                            <div className="text-xs text-slate-400">ผู้โหวต</div>
                            <div className="text-sm font-bold text-slate-700">{voterInfo.name} ({voterInfo.nickname})</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                        {randomizedCandidates.map(c => {
                            // Check Self Voting Logic
                            const isSelf = c.name === voterInfo.name;
                            
                            return (
                                <div 
                                    key={c.id} 
                                    onClick={() => !isSelf && setSelectedCandidate(c)}
                                    className={`candidate-card relative rounded-2xl overflow-hidden cursor-pointer group ${selectedCandidate?.id === c.id ? 'selected' : ''} ${isSelf ? 'disabled' : ''}`}
                                >
                                    <div className="aspect-[3/4] bg-slate-100 relative overflow-hidden">
                                        <img src={c.img} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"></div>
                                        
                                        {/* Tag for Self */}
                                        {isSelf && (
                                            <div className="absolute inset-0 bg-slate-900/50 flex items-center justify-center backdrop-blur-sm">
                                                <span className="bg-red-500 text-white text-xs px-3 py-1 rounded-full font-bold shadow-lg">นี่คือตัวคุณ</span>
                                            </div>
                                        )}

                                        <div className="absolute bottom-0 left-0 right-0 p-4 text-white">
                                            <h3 className="font-bold text-lg leading-tight quote-text">{c.name}</h3>
                                            <div className="h-1 w-10 bg-green-400 my-2 rounded-full"></div>
                                            <p className="text-xs text-slate-200 italic opacity-90 font-light">"{c.quote}"</p>
                                        </div>
                                    </div>
                                    
                                    {selectedCandidate?.id === c.id && (
                                        <div className="absolute top-3 right-3 bg-green-500 text-white rounded-full p-1.5 shadow-lg animate-bounce">
                                            <i data-lucide="check" className="w-5 h-5"></i>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Fixed Bottom Bar */}
                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-slate-200 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-50">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex flex-col">
                                <span className="text-xs text-slate-400">คุณกำลังเลือก:</span>
                                {selectedCandidate ? (
                                    <span className="font-bold text-green-700 text-lg animate-pulse">{selectedCandidate.name}</span>
                                ) : (
                                    <span className="text-slate-500 text-sm italic">กรุณาเลือก 1 ท่าน...</span>
                                )}
                            </div>
                            <button 
                                onClick={handleSubmitVote}
                                disabled={!selectedCandidate || submitting}
                                className="btn-primary px-8 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 min-w-[160px] justify-center"
                            >
                                {submitting ? <div className="loader border-white/30 border-l-white w-5 h-5"></div> : <><i data-lucide="send" className="w-5 h-5"></i> ยืนยันการโหวต</>}
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderSuccess = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center p-6 modal-enter">
                    <div className="w-28 h-28 bg-green-100 rounded-full flex items-center justify-center mb-6 animate-bounce">
                        <i data-lucide="heart" className="w-14 h-14 text-green-500 fill-green-500"></i>
                    </div>
                    <h1 className="text-3xl font-bold text-slate-800 mb-2 quote-text">ขอบคุณจากใจ!</h1>
                    <p className="text-slate-500 mb-8 max-w-sm">
                        "รอยยิ้มของคุณ คือกำลังใจของเรา"<br/>
                        ขอบคุณ <span className="font-bold text-green-600">{voterInfo.nickname}</span> ที่ร่วมเป็นส่วนหนึ่งในกิจกรรมดีๆ ของ รพ.สวี ครับ
                    </p>
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-sm text-slate-500 mb-8">
                        อย่าลืมลุ้นรางวัล Voter ผู้โชคดี 10 ท่าน<br/>ประกาศผลเร็วๆ นี้
                    </div>
                    <button onClick={() => window.close()} className="px-8 py-3 rounded-full bg-slate-800 text-white hover:bg-slate-700 font-bold transition-colors">ปิดหน้าต่าง</button>
                </div>
            );

            return (
                <div className="min-h-screen relative">
                    {/* Decorative Background */}
                    <div className="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
                        <div className="absolute top-[-100px] right-[-100px] w-96 h-96 bg-green-200/40 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-[-100px] left-[-100px] w-80 h-80 bg-teal-200/40 rounded-full blur-3xl"></div>
                        <div className="absolute top-1/2 left-1/4 w-32 h-32 bg-yellow-200/30 rounded-full blur-2xl"></div>
                    </div>

                    <header className="header-bg sticky top-0 z-50 shadow-lg">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white/20 backdrop-blur rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-inner">
                                    <i data-lucide="activity" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-white text-lg leading-none quote-text">รพ.สวี</h1>
                                    <p className="text-[10px] text-green-100 opacity-90 font-light tracking-wider">SAWI HOSPITAL VOTING 2025</p>
                                </div>
                            </div>
                            {profile && (
                                <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full border border-white/20">
                                    <img src={profile.pictureUrl} className="w-6 h-6 rounded-full border border-white" />
                                    <span className="text-xs text-white font-medium max-w-[100px] truncate">{profile.displayName}</span>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4">
                        {page === 'login' && renderLogin()}
                        {page === 'register' && renderRegister()}
                        {page === 'voting' && renderVoting()}
                        {page === 'success' && renderSuccess()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
